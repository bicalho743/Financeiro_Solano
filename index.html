<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro — Solano Bicalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --verde:#2F4A3C; --verde-suave:#6E8A78; --ouro:#785E28;
    --marfim:#F5F1E9; --tinta:#26251F; --cinza:#6B685F;
    --linha:#DEDBD3; --linha-clara:#EBE8E1;
    --tijolo:#C0392B; --papel:#FFFFFF;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Jost',Futura,'Century Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  #lc{font-family:var(--sans);color:var(--tinta);background:var(--papel);
      font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 60px}
  #lc h1,#lc h2,#lc h3{margin:0;font-weight:500}
  #lc button{font-family:var(--sans);cursor:pointer}
  #lc :focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){#lc *{transition:none!important;animation:none!important}}

  /* ---- seletor de conta ---- */
  .conta-tabs{display:flex;gap:0;border-bottom:2px solid var(--linha);background:#fff;padding:0 28px}
  .conta-tab{font-family:var(--sans);font-size:13px;letter-spacing:.06em;padding:11px 22px;
             border:none;background:transparent;color:var(--cinza);cursor:pointer;
             border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s}
  .conta-tab:hover{color:var(--tinta)}
  .conta-tab.ativa{color:var(--verde);border-bottom-color:var(--verde);font-weight:500}
  .conta-ativa-badge{font-size:12px;letter-spacing:.1em;color:var(--cinza);
                     padding:10px 0 0;font-weight:500}
  .conta-tab[data-conta=pj].ativa{color:#1E8A5F;border-bottom-color:#1E8A5F}
  .conta-tab[data-conta=cpf],.conta-tab[data-conta=pj]{font-size:15px;font-weight:500;padding:13px 26px}
  .conta-tab[data-conta=cpf].ativa{color:#2E86DE;border-bottom-color:#2E86DE}
  .conta-sep{margin-left:auto;align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);padding-right:4px}
  .conta-tab.banco{font-size:12px;padding:11px 14px}
  .conta-tab.banco.ativa{color:#5B4FCF;border-bottom-color:#5B4FCF}
  .sep-painel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 24px}
  .sep-card{border:1px solid var(--linha);border-radius:4px;padding:12px 14px;border-left:4px solid var(--sc)}
  .sep-card .t{font-size:12px;color:var(--cinza);line-height:1.35;min-height:32px}
  .sep-card .v{font-family:var(--serif);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
  .sep-card .s{font-size:11.5px;color:var(--cinza);margin-top:2px}
  .sep-card.clic{cursor:pointer}.sep-card.clic:hover{background:var(--marfim)}
  @media (max-width:900px){.sep-painel{grid-template-columns:1fr 1fr}}

  /* ---- tela de login ---- */
  #telaLogin{position:fixed;inset:0;background:var(--papel);display:flex;align-items:center;
             justify-content:center;z-index:100;flex-direction:column;gap:0}
  #telaLogin.oculta{display:none}
  .login-card{background:#fff;border:1px solid var(--linha);border-radius:4px;
              padding:52px 48px;max-width:420px;width:90%;text-align:center;
              box-shadow:0 8px 40px rgba(38,37,31,.10)}
  .login-logo{font-family:var(--serif);font-size:42px;font-weight:500;color:var(--tinta);
              letter-spacing:-.01em;line-height:1;margin-bottom:6px}
  .login-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);
             margin-bottom:40px}
  .login-titulo{font-size:15px;color:var(--cinza);margin-bottom:32px;line-height:1.55}
  .btn-google{display:inline-flex;align-items:center;gap:12px;background:#fff;
              border:1px solid var(--linha);border-radius:3px;padding:13px 28px;
              font-family:var(--sans);font-size:14px;font-weight:500;color:var(--tinta);
              cursor:pointer;transition:box-shadow .15s,border-color .15s;width:100%;
              justify-content:center}
  .btn-google:hover{border-color:var(--verde);box-shadow:0 2px 12px rgba(47,74,60,.12)}
  .btn-google svg{flex:none}
  .login-rodape{font-size:11.5px;color:var(--cinza);margin-top:28px;line-height:1.6}

  /* ---- visão geral ---- */
  .bt-dash{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-family:var(--sans);
           font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2E86DE,#1E8A5F);
           border:none;border-radius:8px;padding:14px 26px;cursor:pointer;box-shadow:0 6px 18px rgba(30,138,95,.28);
           transition:transform .12s,box-shadow .12s}
  .bt-dash small{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .bt-dash:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,138,95,.35)}
  .bt-dash.ativo{outline:3px solid #F1C40F;outline-offset:2px}
  .conta-tab[data-conta=dash]{margin-left:auto}
  .conta-tab[data-conta=dash].ativa{color:#C0392B;border-bottom-color:#C0392B}
  .dash-topo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:24px 0 18px}
  .dash-modo{display:inline-flex;border:1px solid var(--linha);border-radius:3px;overflow:hidden}
  .dash-modo button{font-family:var(--sans);font-size:12.5px;border:none;background:#fff;padding:8px 14px;cursor:pointer;color:var(--cinza)}
  .dash-modo button.on{background:var(--verde);color:#fff}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .dash-col{border:1px solid var(--linha);border-radius:4px;padding:20px 22px;border-top:5px solid var(--dc)}
  .dash-col h2{font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dash-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
  .dash-kpi{background:var(--marfim);border-radius:3px;padding:12px 14px}
  .dash-kpi .rot{margin-bottom:2px}
  .dash-kpi .v{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
  .dash-bloco{margin-top:18px}
  .dash-bloco h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin:0 0 8px;
                 display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:2px solid currentColor}
  .dash-lin{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:7px 4px;
            border-bottom:1px solid var(--linha-clara);cursor:pointer;border-radius:3px}
  .dash-lin:hover{background:var(--marfim);box-shadow:inset 3px 0 0 var(--verde)}
  .dash-lin .nm{font-size:13.5px;display:flex;align-items:center}
  .dash-lin .vl{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
  .dash-lin .pc{font-size:11.5px;color:var(--cinza);min-width:38px;text-align:right}
  .dash-lin .br{grid-column:1/-1;height:6px;background:var(--linha-clara);border-radius:3px;overflow:hidden}
  .dash-lin .ic,.cat-info{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11.5px;color:var(--cinza);margin-top:-3px}
  .ic-p{padding:1px 8px;border-radius:9px;background:#EEF3EF;color:var(--verde);font-weight:500}
  .ic-p.acima{background:#FBF2EF;color:#C0392B}
  .ic-p.sem{background:none;color:var(--cinza);opacity:.6;padding:0;font-weight:400}
  .dash-lin .br i{display:block;height:100%;border-radius:3px}
  .dash-vazio{font-size:13px;color:var(--cinza);padding:10px 4px}
  .dash-nota{font-size:12px;color:var(--cinza);margin-top:14px;line-height:1.5}
  .dash-mes{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  .dash-mes th{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--cinza);font-weight:500;
               text-align:right;padding:6px 10px;border-bottom:1px solid var(--verde)}
  .dash-mes th:first-child,.dash-mes td:first-child{text-align:left}
  .dash-mes td{padding:7px 10px;border-bottom:1px solid var(--linha-clara);text-align:right;
               font-family:var(--serif);font-size:16px;font-variant-numeric:tabular-nums}
  .dash-mes td:first-child{font-family:var(--sans);font-size:13px}
  .dash-mes .grp{text-align:center!important;border-bottom:none;padding-bottom:0}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr}.dash-kpis{grid-template-columns:1fr 1fr 1fr}}
  .modal-caixa select{display:block;width:100%;margin-top:6px;font-family:var(--sans);font-size:14px;
      border:1px solid var(--linha);border-radius:2px;padding:9px 11px;background:#fff;color:var(--tinta)}
  .modal-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tipo-seg{display:flex;gap:8px;margin:6px 0 14px}
  .tipo-seg label{flex:1;margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;border:1px solid var(--linha);
      border-radius:3px;padding:9px;text-align:center;cursor:pointer;color:var(--tinta)}
  .tipo-seg input{display:none}
  .tipo-seg input:checked+span{font-weight:600}
  .tipo-seg label:has(input[value=s]:checked){background:#FDEDEB;border-color:#C0392B;color:#C0392B}
  .tipo-seg label:has(input[value=e]:checked){background:#E8F8F0;border-color:#1E8A5F;color:#1E8A5F}

  /* ---- cabeçalho ---- */
  .topo{border-bottom:1px solid var(--linha);padding:26px 28px 20px;
        display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .marca h1{font-family:var(--serif);font-size:34px;letter-spacing:.01em;line-height:1}
  .marca p{margin:6px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cinza)}
  .acoes{display:flex;flex-wrap:wrap;gap:8px}
  .bt{border:1px solid var(--verde);background:var(--verde);color:var(--marfim);
      padding:9px 16px;border-radius:2px;font-size:13px;letter-spacing:.04em;transition:background .15s}
  .bt:hover{background:#25392E}
  .bt.vazado{background:transparent;color:var(--verde);border-color:var(--linha)}
  .bt.vazado:hover{background:var(--marfim);border-color:var(--verde-suave)}
  .bt:disabled{opacity:.45;cursor:not-allowed}

  /* ---- abas de mês, tipo divisória de fichário ---- */
  .abas{display:flex;gap:3px;padding:16px 28px 0;overflow-x:auto;border-bottom:1px solid var(--linha)}
  .aba{border:1px solid var(--linha);border-bottom:none;background:var(--marfim);color:var(--cinza);
       padding:9px 17px 8px;border-radius:3px 3px 0 0;font-size:13px;white-space:nowrap;
       position:relative;top:1px;transition:color .15s}
  .aba:hover{color:var(--verde)}
  .aba[aria-selected="true"]{background:var(--papel);color:var(--verde);border-color:var(--linha);
       border-top:2px solid var(--ouro);font-weight:500;padding-top:8px}

  .corpo{padding:0 28px;max-width:1240px}

  /* ---- faixa de totais ---- */
  .totais{display:grid;grid-template-columns:repeat(4,1fr);gap:0;
          border-bottom:1px solid var(--linha);margin-top:26px}
  .tot{padding:14px 22px 22px;position:relative}
  .tot::before{content:"";position:absolute;top:0;left:0;right:22px;height:4px;border-radius:2px;background:var(--c,var(--linha))}
  .tot+.tot{border-left:1px solid var(--linha-clara)}
  .tot:first-child{padding-left:0}
  .tot:first-child::before{left:0}
  .rot{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);display:block;margin-bottom:6px}
  .num{font-family:var(--serif);font-size:34px;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .num small{font-size:17px;color:var(--cinza);margin-right:2px}
  .pos{color:var(--verde)} .neg{color:var(--tijolo)}
  .sub{font-size:12.5px;color:var(--cinza);margin-top:5px}

  .alerta{display:flex;gap:12px;align-items:flex-start;background:#FBF2EF;
          border-left:3px solid var(--tijolo);padding:13px 16px;margin:22px 0 0;border-radius:0 2px 2px 0;font-size:13.5px}
  .alerta b{font-weight:600;color:var(--tijolo)}

  /* ---- painéis ---- */
  .paineis{display:grid;grid-template-columns:1.15fr .85fr;gap:38px;margin:32px 0 8px}
  .tit-secao{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .tit-secao::before{content:"";width:18px;height:2px;background:var(--ouro);flex:none}
  .tit-secao h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);font-weight:500}

  .cat-linha{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:9px 0;
             border-bottom:1px solid var(--linha-clara);cursor:pointer;border-radius:3px;
             transition:background .12s;margin:0 -8px;padding-left:8px;padding-right:8px}
  .cat-linha:hover{background:var(--marfim)}
  .cat-linha:hover .cat-nome{text-decoration:underline;text-underline-offset:2px}
  .cat-nome{font-size:13.5px}
  .cat-val{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
  .cat-barra{grid-column:1/-1;height:8px;background:var(--linha-clara);border-radius:4px;overflow:hidden}
  .cat-barra i{display:block;height:100%;border-radius:4px}

  .divisao{display:flex;gap:0;border:1px solid var(--linha);border-radius:2px;margin-top:22px;overflow:hidden}
  .divisao div{flex:1;padding:14px 16px}
  .divisao div+div{border-left:1px solid var(--linha-clara)}
  .divisao .num{font-size:24px}

  /* ---- tabela ---- */
  .filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:34px 0 12px}
  .filtros input[type=search],.filtros select{font-family:var(--sans);font-size:13px;color:var(--tinta);
      border:1px solid var(--linha);background:#fff;padding:7px 10px;border-radius:2px}
  .filtros input[type=search]{min-width:210px}
  .conta{margin-left:auto;font-size:12.5px;color:var(--cinza)}

  table{width:100%;border-collapse:collapse}
  thead th{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza);
           font-weight:500;text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--verde)}
  tbody tr{border-bottom:1px solid var(--linha-clara)}
  tbody tr:hover{background:var(--marfim)}
  tbody td{padding:7px 10px;vertical-align:middle;font-size:13.5px}
  td.data{white-space:nowrap;color:var(--cinza);font-variant-numeric:tabular-nums;width:78px}
  td.valor{text-align:right;font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;width:120px}
  .campo{width:100%;border:none;background:transparent;font-family:var(--sans);font-size:13.5px;
         color:var(--tinta);padding:4px 5px;border-radius:2px;border:1px solid transparent}
  .campo:hover{border-color:var(--linha-clara)}
  .campo:focus{background:#fff;border-color:var(--linha);outline:none}
  td.valor .campo{text-align:right;font-family:var(--serif);font-size:17px}
  select.campo{cursor:pointer;-webkit-appearance:none;appearance:none}
  .selo{border:1px solid #E0B84D;background:#FDF6E3;border-radius:11px;padding:3px 11px;
        font-size:11px;letter-spacing:.08em;color:#9C7A0A;white-space:nowrap;font-weight:500}
  .col-drag{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;
            background:transparent;z-index:2;display:flex;align-items:center;justify-content:center}
  .col-drag::after{content:"";width:2px;height:60%;background:var(--linha);border-radius:1px;opacity:0}
  .col-drag:hover::after{opacity:1}
  .col-drag:hover{background:rgba(0,0,0,.04)}
  #tabelaLanc{table-layout:fixed;width:100%;min-width:860px}
  #tabelaLanc th,#tabelaLanc td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tabelaLanc th[data-sort=data],#tabelaLanc td.data{width:64px}
  #tabelaLanc th[data-sort=hist]{width:320px}
  #tabelaLanc th[data-sort=categoria]{width:170px}
  #tabelaLanc th[data-sort=vinculo]{width:104px}
  #tabelaLanc th[data-sort=valor]{width:110px}
  .desc-campo{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .desc-campo:focus{white-space:normal}
  .etiqueta{border:none!important;border-radius:12px;padding:4px 12px;font-size:12.5px;
            letter-spacing:.02em;font-weight:500;width:auto;min-width:150px}
  .etiqueta:focus{outline-offset:1px}
  tbody tr td:first-child{box-shadow:inset 3px 0 0 var(--c)}
  .tag-cartao{font-size:13px;opacity:.7;margin-right:4px;vertical-align:middle}
  .tag-conta{font-size:9.5px;letter-spacing:.08em;padding:2px 5px;border-radius:3px;font-weight:600;margin-right:4px;vertical-align:middle}
  .tag-conta.pf{background:#F0F4FF;color:#4A6C7A}
  .riscar,.voltar{border:1px solid var(--linha);background:#fff;color:var(--cinza);font-size:15px;line-height:1;
                  width:26px;height:26px;border-radius:50%;transition:all .15s}
  .riscar:hover{color:#fff;background:var(--tijolo);border-color:var(--tijolo)}
  .voltar{color:#fff;background:#1E8A5F;border-color:#1E8A5F;font-size:14px}
  .voltar:hover{background:#166B48;border-color:#166B48}
  .sumir{border:none;background:transparent;color:var(--tijolo);font-size:11px;letter-spacing:.06em;
         padding:3px 6px;border-radius:2px;text-decoration:underline;text-underline-offset:2px;font-weight:500}
  .sumir:hover{background:#FDEDEB}
  tr.riscado td:not(.acao){opacity:.4}
  tr.riscado .campo,tr.riscado .selo{text-decoration:line-through;text-decoration-thickness:1px}
  tr.riscado:hover td:not(.acao){opacity:.6}
  .apagar{border:none;background:transparent;color:var(--linha);font-size:17px;line-height:1;padding:3px 6px;border-radius:2px}
  .apagar:hover{color:var(--tijolo);background:#FBF2EF}
  tr.dup td{opacity:.5}

  .vazio{text-align:center;padding:64px 20px;color:var(--cinza)}
  .vazio p{max-width:44ch;margin:10px auto 0;font-size:14px}
  .vazio .num{font-family:var(--serif);font-size:26px;color:var(--verde)}

  /* ---- regras ---- */
  .regras{margin-top:44px;border-top:1px solid var(--linha);padding-top:24px}
  .regra{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha-clara);font-size:13.5px}
  .regra-termo{font-family:var(--sans);background:var(--marfim);padding:3px 8px;border-radius:2px;
               letter-spacing:.03em;min-width:160px;border:1px solid var(--linha-clara);font-size:13px}
  .regra-termo:focus{background:#fff;border-color:var(--linha)}
  .regra-cat{min-width:160px}
  .regra-vinc{font-family:var(--sans);font-size:12px;border:1px solid var(--linha);padding:4px 8px;border-radius:2px}
  .regra .seta{color:var(--ouro)}
  .nova-regra{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .nova-regra input,.nova-regra select{font-family:var(--sans);font-size:13px;border:1px solid var(--linha);
              padding:7px 10px;border-radius:2px;background:#fff}

  .rodape{margin-top:52px;padding-top:18px;border-top:1px solid var(--linha);
          display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--cinza)}
  .aviso{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--verde);color:var(--marfim);
         padding:11px 22px;border-radius:2px;font-size:13.5px;box-shadow:0 6px 22px rgba(38,37,31,.18);
         opacity:0;pointer-events:none;transition:opacity .2s}
  .aviso.on{opacity:1}
  .aviso.erro{background:var(--tijolo)}

  .modal-fundo{position:fixed;inset:0;background:rgba(38,37,31,.42);display:flex;
      align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-fundo[hidden]{display:none!important}
  .modal-caixa{background:#fff;border-radius:4px;max-width:520px;width:100%;

<script>
(function(){
  "use strict";
  const CHAVE = "financeiro-solano:v1";
  const $ = s => document.querySelector(s);

  // ── Supabase ──────────────────────────────────────────────
  const SB_URL  = "https://cxdbrmjrwusgzikfyugf.supabase.co";
  const SB_KEY  = "sb_publishable_f2PhMwV9xY_81eXtXOgnPg_zd2pil-u";
  // corrige retorno do Google com "##access_token" (URL que terminava em "#")
  if(location.hash.startsWith("##")) history.replaceState(null,"",location.pathname+location.hash.slice(1));
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let sbUser = null; // usuário autenticado

  async function sbCarregar(){
    const { data, error } = await sb
      .from("livro_caixa")
      .select("valor")
      .eq("user_id", sbUser.id)
      .eq("chave", CHAVE)
      .maybeSingle();
    if(error) throw error;
    return data ? data.valor : null;
  }

  async function sbSalvar(payload){
    const { error } = await sb
      .from("livro_caixa")
      .upsert({
        user_id: sbUser.id,
        chave: CHAVE,
        valor: payload,
        atualizado_em: new Date().toISOString()
      }, { onConflict: "user_id,chave" });
    if(error) throw error;
  }

  function nomeUsuario(){
    return sbUser?.user_metadata?.full_name
        || sbUser?.user_metadata?.name
        || sbUser?.email?.split("@")[0]
        || "Você";
  }

  function atualizarBarraUsuario(){
    const barra = document.getElementById("barraUsuario");
    const tela  = document.getElementById("telaLogin");
    if(!barra||!tela) return;
    if(sbUser){
      // esconder tela de login, mostrar app
      tela.classList.add("oculta");
      barra.innerHTML =
        '<span style="font-size:13px;color:var(--cinza);display:flex;align-items:center;gap:8px">'+
          (sbUser.user_metadata?.avatar_url
            ? '<img src="'+sbUser.user_metadata.avatar_url+'" style="width:28px;height:28px;border-radius:50%">'
            : '<span style="width:28px;height:28px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">'+nomeUsuario()[0].toUpperCase()+'</span>')
          + '<span>'+nomeUsuario()+'</span>'+
        '</span>'+
        '<button class="bt vazado" id="btLogout" style="font-size:12px;padding:5px 12px">Sair</button>';
      document.getElementById("btLogout").onclick = async()=>{
        await sb.auth.signOut();
        tela.classList.remove("oculta");
        barra.innerHTML="";
      };
    } else {
      // mostrar tela de login
      tela.classList.remove("oculta");
      barra.innerHTML="";
      // ligar botão da tela de login
      const btn=document.getElementById("btnLoginGoogle");
      if(btn) btn.onclick = async()=>{
        btn.disabled=true; btn.textContent="Aguarde…";
        await sb.auth.signInWithOAuth({
          provider:"google",
          options:{ redirectTo: location.origin + location.pathname }
        });
      };
    }
  }

  /* ================= categorias — base: planilha "Orçamento Solano 2026" ================= */
  // Mesmos grupos e itens da aba MÊS CORRENTE; cada item corresponde a um par
  // CATEGORIA + SUBCATEGORIA da aba LANÇAMENTOS (ver MAPA_PLANILHA).
  const GRUPOS = [
    {g:"Receitas", cor:"#1E8A5F", cats:["Salário","13º salário","Rendimentos","Restituição IR","Reembolso e estorno","Outras receitas"]},
    {g:"Financiamento e dívidas", cor:"#7D3C98", cats:["Financiamento casa","Consignado","Consórcio","IOF e taxas","Previdência"]},
    {g:"Moradia", cor:"#5D6D2E", cats:["Luz (Cemig)","Água (Copasa)","Internet","IPTU","TV (Sky)","Celular (TIM)","Assinaturas","Manutenção da casa"]},
    {g:"Serviço doméstico", cor:"#9A6B00", cats:["Doméstica – salário","Doméstica – e-Social","Doméstica – transporte","Doméstica – provisão","Diarista / jardim / extras"]},
    {g:"Alimentação", cor:"#D35400", cats:["Supermercado","Padaria","Açougue","Sacolão / feira","Bar / restaurante","Almoço","Lanche"]},
    {g:"Educação", cor:"#1F6FB2", cats:["Escola","Material / passeios escola"]},
    {g:"Saúde", cor:"#B03A2E", cats:["Unimed","Farmácia","Saúde fora do plano"]},
    {g:"Transporte", cor:"#0B7A83", cats:["Uber / Localiza","Gasolina","IPVA / multas","Seguro auto","Manutenção do carro"]},
    {g:"Lazer e pessoal", cor:"#C2185B", cats:["Clube","Corrida","Passeios","Férias / viagem","Solano – pessoal","Tâmara – pessoal","Meninas","Pet","Vestuário"]},
    {g:"Transferências", cor:"#8D6E63", cats:["Transferências Tâmara"]},
    {g:"Fora dos cálculos", cor:"#95A5A6", cats:["Cartão de crédito","Aplicação e resgate","Transferência entre minhas contas"]},
    {g:"", cor:"#B0AEA6", cats:["Sem categoria"]}
  ];
  const CATEGORIAS = GRUPOS.reduce((a,x)=>a.concat(x.cats),[]);
  const GRUPO_DE = {};
  GRUPOS.forEach(x=>x.cats.forEach(c=>{ GRUPO_DE[c]=x.g; }));
  // <option>s agrupadas por grupo da planilha
  function opcoesCat(atual, vazio){
    let h = vazio!=null ? '<option value="">'+esc(vazio)+'</option>' : "";
    if(atual && !CATEGORIAS.includes(atual)) h += '<option selected>'+esc(atual)+'</option>';
    GRUPOS.forEach(x=>{
      const ops = x.cats.map(c=>'<option'+(c===atual?" selected":"")+'>'+esc(c)+'</option>').join("");
      h += x.g ? '<optgroup label="'+esc(x.g)+'">'+ops+'</optgroup>' : ops;
    });
    return h;
  }

  // cor de cada categoria: tons da cor do grupo
  const tom = (hex,t) => {           // t<0 escurece, t>0 clareia
    const h=hex.replace("#",""); const alvo=t<0?0:255, k=Math.abs(t);
    return "#"+[0,2,4].map(i=>{ const v=parseInt(h.slice(i,i+2),16); return Math.round(v+(alvo-v)*k).toString(16).padStart(2,"0"); }).join("");
  };
  const CORES = {};
  GRUPOS.forEach(x=>x.cats.forEach((c,i)=>{
    const n=x.cats.length; CORES[c] = n<2 ? x.cor : tom(x.cor, -0.18 + 0.5*i/(n-1));
  }));
  const cor = c => CORES[c] || "#8C8579";
  const rgba = (hex,a) => {
    const h=hex.replace("#","");
    return "rgba("+parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16)+","+a+")";
  };
  const ponto = c => '<span class="ponto" style="background:'+cor(c)+'"></span>';

  // Regras iniciais, tiradas do histórico da aba LANÇAMENTOS. A primeira que bater vale,
  // então as mais específicas vêm antes. Novas regras são aprendidas quando você corrige.
  // transferências para a Tâmara: "mercado - transferido Tâmara", "Casa - transferido Tâmara", Pix para a Tâmara
  const ehTransfTamara = (h,v) => /transferid[oa]\s+t[âãa]mara/i.test(h) || (v<0 && /pix\s+transf\s+t[âãa]mara/i.test(h));
  const REGRAS_TRANSF = [["TRANSFERIDO TÂMARA","Transferências Tâmara"],["TRANSFERIDO TAMARA","Transferências Tâmara"],
    ["TRANSFERIDA TÂMARA","Transferências Tâmara"],["PIX TRANSF TAMARA","Transferências Tâmara"]];
  const REGRAS_PADRAO = REGRAS_TRANSF.concat([
    // fora dos cálculos
    ["PAGTO CARTAO","Cartão de crédito"],["PAG FATURA","Cartão de crédito"],["FATURA CARTAO","Cartão de crédito"],
    ["CARTÃO CRÉDITO","Cartão de crédito"],["CARTAO CREDITO","Cartão de crédito"],["ITAU BLACK","Cartão de crédito"],
    ["REND PAGO","Rendimentos"],["RENDIMENTO","Rendimentos"],["DIVIDENDO","Rendimentos"],["JCP","Rendimentos"],
    ["APLIC AUT","Aplicação e resgate"],["APLICACAO","Aplicação e resgate"],["RESGATE","Aplicação e resgate"],
    ["BB RF","Aplicação e resgate"],["COFRINHO","Aplicação e resgate"],
    // receitas
    ["SALARIO","Salário"],["REMUNERACAO","Salário"],["RESTITUICAO","Restituição IR"],
    ["DEVOLVIDO","Reembolso e estorno"],["ESTORNO","Reembolso e estorno"],["CANCELAMENTO","Reembolso e estorno"],["DEV PIX","Reembolso e estorno"],
    // financiamento e dívidas
    ["FINANCIAMENTO","Financiamento casa"],["FINANC IMOB","Financiamento casa"],["CONSIGNADO","Consignado"],
    ["CONSORCIO","Consórcio"],["CONSÓRCIO","Consórcio"],["PREVIDENCIA","Previdência"],["PREVIDÊNCIA","Previdência"],
    ["IOF COMPRA INTERNAC","Solano – pessoal"],["IOF","IOF e taxas"],["TARIFA","IOF e taxas"],["ANUIDADE","IOF e taxas"],["JUROS","IOF e taxas"],
    // moradia
    ["CEMIG","Luz (Cemig)"],["COPASA","Água (Copasa)"],["TIM S A","Celular (TIM)"],["TIM ","Celular (TIM)"],
    ["CLARO","Internet"],["VIVO","Internet"],["SKY ","TV (Sky)"],["IPTU","IPTU"],
    ["NETFLIX","Assinaturas"],["SPOTIFY","Assinaturas"],["DISNEY","Assinaturas"],["AMAZON PRIME","Assinaturas"],
    ["AMAZONPRIME","Assinaturas"],["APPLE.COM","Assinaturas"],["GLOBOPLAY","Assinaturas"],
    ["DESENTUPIDORA","Manutenção da casa"],["LEROY","Manutenção da casa"],
    // serviço doméstico
    ["E SOCIAL","Doméstica – e-Social"],["ESOCIAL","Doméstica – e-Social"],
    // alimentação
    ["PING PAO","Padaria"],["PINGPAO","Padaria"],["PANIFICADORA","Padaria"],["PADARIA","Padaria"],
    ["DUROKE","Açougue"],["CASA DE CARNE","Açougue"],["ACOUGUE","Açougue"],
    ["SACOLAO","Sacolão / feira"],["HORTIFRUTI","Sacolão / feira"],
    ["SUPER NOSSO","Supermercado"],["SUPERMERCADO","Supermercado"],["DMA DISTRIB","Supermercado"],["EPA ","Supermercado"],
    ["VERDEMAR","Supermercado"],["HIPER ","Supermercado"],["APOIO VENDA","Supermercado"],["EMPORIO","Supermercado"],
    ["TORRE CAFE","Lanche"],["JARDIM 360","Lanche"],["LANCHES","Lanche"],["CAFE","Lanche"],
    ["RESTAURANTE MERIT","Almoço"],["IFOOD","Bar / restaurante"],["IFD*","Bar / restaurante"],["MEEP","Bar / restaurante"],
    ["BAR DO","Bar / restaurante"],["RESTAURANTE","Bar / restaurante"],["PIZZARIA","Bar / restaurante"],
    // saúde
    ["UNIMED","Unimed"],["DROGARIA","Farmácia"],["DROGA","Farmácia"],["FARMACIA","Farmácia"],["ARAUJO","Farmácia"],["ULTRA POPULAR","Farmácia"],
    // educação
    ["ESCOLA","Escola"],["COLEGIO","Escola"],
    // transporte
    ["UBER","Uber / Localiza"],["99POP","Uber / Localiza"],["LOCALIZA","Uber / Localiza"],
    ["IPVA","IPVA / multas"],["DETRAN","IPVA / multas"],
    ["AUTO POSTO","Gasolina"],["POSTO","Gasolina"],["IPIRANGA","Gasolina"],["SHELL","Gasolina"],["ESTACIONAMENTO","Gasolina"],
    ["LAVA RAPIDO","Manutenção do carro"],["PNEU","Manutenção do carro"],["OFICINA","Manutenção do carro"],
    // lazer e pessoal
    ["CLUBE JARAGUA","Clube"],["AQUABEAT","Passeios"],["AZUL LINHAS","Férias / viagem"],["LATAM","Férias / viagem"],
    ["GOL LINHAS","Férias / viagem"],["HOTEL","Férias / viagem"],
    ["PETZ","Pet"],["PET CENTER","Pet"],["COBASI","Pet"],["VETERIN","Pet"],
    ["ANTHROPIC","Solano – pessoal"],["CLAUDE.AI","Solano – pessoal"],["OPENAI","Solano – pessoal"],["REPLIT","Solano – pessoal"],
    ["FAL FEATURES","Solano – pessoal"],["KLINGAI","Solano – pessoal"],["LOCAWEB","Solano – pessoal"],["RENDER.COM","Solano – pessoal"],
    ["ELEVENLABS","Solano – pessoal"],["RAILWAY","Solano – pessoal"],["HEYGEN","Solano – pessoal"],["X CORP","Solano – pessoal"],
    ["X DEVELOPER","Solano – pessoal"],["GOOGLE ONE","Solano – pessoal"],["KIWIFY","Solano – pessoal"],["VIDEOHOBBY","Solano – pessoal"],
    ["YAPAY","Solano – pessoal"],["BASTTER","Solano – pessoal"],
    ["TAMARA","Tâmara – pessoal"]
  ]).map(r=>({termo:r[0],categoria:r[1],vinculo:"PF",padrao:true}));

  /* ================= estado ================= */
  let dados = {lancamentos:[],regras:REGRAS_PADRAO.slice(),saldos:{},orcamento:null,versao:3,
               orcamentoMes:{},contas:{},dividas:null,previsoes:{},fluxo:null};
  let ui = {mes:null,view:"mes",busca:"",cat:"",tipo:"",vinculo:"",sortCol:"data",sortDir:1,_contaAtual:"itau",conta:"dash"};

  /* O que NÃO é gasto nem receita:
     - "Cartão de crédito" = pagamento da fatura (os gastos reais são as compras do cartão, na data da compra)
     - "Aplicação e resgate" = dinheiro guardado/resgatado, não consumo */
  const CAT_FATURA = "Cartão de crédito";
  const CAT_ENTRE = "Transferência entre minhas contas";
  // não é gasto nem receita: fatura, aplicação e dinheiro passando de uma conta sua para outra (ex.: Itaú → BB)
  const CATS_FORA = new Set([CAT_FATURA,"Aplicação e resgate",CAT_ENTRE]);
  const ehMov = l => !CATS_FORA.has(l.categoria);
  const mesAtual = () => new Date().toISOString().slice(0,7);

  // ajustes em dados salvos (o app nasceu de um modelo com Pessoal × Negócio/MEI)
  const MAPA_ANTIGO = {"Mercado e padaria":"Supermercado","Alimentação fora":"Bar / restaurante",
    "Casa e manutenção":"Manutenção da casa","Transporte":"Uber / Localiza","Assinaturas digitais":"Assinaturas",
    "Telefone e internet":"Internet","Juros e IOF":"IOF e taxas","Lazer e entretenimento":"Passeios",
    "Vestuário e acessórios":"Vestuário","Rendimento":"Rendimentos","Transferência recebida":"Outras receitas",
    "Seguros":"Seguro auto","Estética e cuidados":"Tâmara – pessoal","Transferência família":"Tâmara – pessoal"};
  function migrar(){
    if((dados.versao||0)<2){
      // troca as regras-padrão do modelo antigo pelas desta planilha; as aprendidas continuam
      dados.regras=(dados.regras||[]).filter(r=>!r.padrao && CATEGORIAS.includes(r.categoria));
      const tem=new Set(dados.regras.map(r=>String(r.termo).toUpperCase()));
      REGRAS_PADRAO.forEach(r=>{ if(!tem.has(r.termo.toUpperCase())) dados.regras.push(Object.assign({},r)); });
      dados.versao=2;
    }
    if(dados.versao<3){
      const tem=new Set(dados.regras.map(r=>String(r.termo).toUpperCase()));
      REGRAS_TRANSF.slice().reverse().forEach(([t,c])=>{ if(!tem.has(t)) dados.regras.unshift({termo:t,categoria:c,vinculo:"PF",padrao:true}); });
      let n=0;
      dados.lancamentos.forEach(l=>{ if(ehTransfTamara(l.hist,l.valor) && l.categoria!=="Transferências Tâmara"){ l.categoria="Transferências Tâmara"; n++; } });
      dados.versao=3; dados._migrou=true;
      if(n) setTimeout(()=>avisar(n+" lançamento"+(n===1?"":"s")+" reclassificado"+(n===1?"":"s")+" como Transferências Tâmara."),800);
    }
    dados.regras.forEach(r=>{ r.vinculo="PF"; if(!CATEGORIAS.includes(r.categoria)) r.categoria="Sem categoria"; });
    dados.lancamentos.forEach(l=>{
      l.vinculo="PF";
      if(!CATEGORIAS.includes(l.categoria)) l.categoria=MAPA_ANTIGO[l.categoria]||"Sem categoria";
      if(l.origem==="pf"||l.origem==="pj") l.origem="bb";   // o modelo antigo só importava extrato do BB
    });
  }
  let salvando = null;

  function avisar(txt,erro){
    const el=$("#aviso"); el.textContent=txt;
    el.className="aviso on"+(erro?" erro":"");
    clearTimeout(avisar._t); avisar._t=setTimeout(()=>el.className="aviso",3400);
  }

  /* janela de confirmação própria do app — não depende de confirm()/prompt() do navegador,
     que podem ficar bloqueados dentro de painéis de artefato */
  function modal(html){
    return new Promise(resolve=>{
      const fundo=$("#modalFundo"), caixa=$("#modalCaixa");
      caixa.innerHTML=html; fundo.hidden=false;
      const campo=caixa.querySelector("input,button");
      if(campo) campo.focus();
      const onKey=e=>{ if(e.key==="Escape") fechar(null); };
      function fechar(v){
        fundo.hidden=true; caixa.innerHTML=""; caixa.onclick=null;
        document.removeEventListener("keydown",onKey); resolve(v);
      }
      caixa.onclick=e=>{
        const bt=e.target.closest("[data-modal]"); if(!bt) return;
        if(bt.dataset.modal==="cancelar") return fechar(null);
        if(bt.dataset.modal==="ok"){
          const form=caixa.querySelector("form");
          if(form){
            if(!form.checkValidity()){form.reportValidity&&form.reportValidity();return;}
            fechar(Object.fromEntries(new FormData(form).entries()));
          } else fechar(true);
        }
        // botões com valor direto (ex: "pf", "pj")

  function adicionarManual(presetOrigem){
    novoLancamentoModal(presetOrigem||"manual").then(f=>{
      if(!f) return;
      const iso=/^\d{4}-\d{2}-\d{2}$/.test(f.data)?f.data:dataISO(f.data||"");
      if(!iso){ avisar("Data inválida.",true); return; }
      const desc=(f.desc||"").trim();
      if(!desc){ avisar("Escreva uma descrição.",true); return; }
      let v=Math.abs(numero(String(f.valor||"").replace("−","-")));
      if(!v){ avisar("Valor inválido.",true); return; }
      const valor=f.tipo==="e"?v:-v;
      const origem=NOMES_ORIGEM[f.origem]?f.origem:"manual";
      const categoria=f.categoria||classificar(desc,valor).categoria;
      dados.lancamentos.push({id:iso+"|manual|"+Date.now()+"|"+desc.slice(0,42),data:iso,hist:desc,
        valor:valor,doc:"",categoria:categoria,vinculo:"PF",obs:(f.obs||"").trim(),origem:origem,manual:true});
      dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
      if(ui.conta!=="dash"){ ui.mes=iso.slice(0,7); ui.view="mes"; }
      salvar(); render();
      avisar("Lançamento adicionado em "+categoria+".");
    });

  /* ================= visão geral: previsto × realizado ================= */
  // Previsto mensal — aba MÊS CORRENTE da planilha (set/2026). Editável na visão geral;
  // importar a planilha de novo atualiza estes valores.
  const ORCAMENTO_PADRAO = {
    "Salário":31000,"Rendimentos":1300,
    "Financiamento casa":7284.21,"Consignado":2172,"Previdência":54,
    "Luz (Cemig)":500,"Água (Copasa)":170.19,"Internet":118.86,"IPTU":439.17,"TV (Sky)":232.23,
    "Celular (TIM)":69,"Assinaturas":100,"Manutenção da casa":695.84,
    "Doméstica – salário":2236.98,"Doméstica – e-Social":680.81,"Doméstica – transporte":638,"Doméstica – provisão":526.5,
    "Supermercado":3000,"Bar / restaurante":50.74,
    "Escola":4782.3,"Material / passeios escola":269.96,

    "Solano – pessoal":1608.2,"Tâmara – pessoal":1000,"Meninas":678.85,"Pet":180,"Vestuário":300
  };
  // previsto do mês: aba FLUXO ANUAL (um valor por mês); sem ela, o da MÊS CORRENTE
  // o fluxo anual (editável no app) manda; sem ele, valores antigos ou os da aba MÊS CORRENTE
  function orcDoFluxo(ym){
    const fx=dados.fluxo; if(!fx||!fx.meses.includes(ym)) return null;
    const o={};
    fx.linhas.forEach(l=>{
      if(l.tipo==="g"||!l.cat) return;
      const v=+l.v[ym]||0; if(!v) return;
      o[l.cat]=Math.round(((o[l.cat]||0)+(l.lado==="rec"?v:Math.abs(v)))*100)/100;
    });
    return o;
  }
  const orcamentoDe = ym => orcDoFluxo(ym) || (dados.orcamentoMes&&dados.orcamentoMes[ym]) || dados.orcamento || ORCAMENTO_PADRAO;
  const orcamento = () => orcamentoDe(ui.mes);
  // previsto de uma categoria no período: o mês, ou a soma dos meses informados
  function previstoCat(c, mes, meses){
    if(mes!=="tudo") return +(orcamentoDe(mes)[c]||0);
    return (meses||[]).reduce((s,m)=>s+(+(orcamentoDe(m)[c]||0)),0);
  }
  // "12 lançamentos · 87% do previsto"
  function infoCat(n, v, p, entrada){
    const pct = p ? Math.round(Math.abs(v)/Math.abs(p)*100) : null;
    return '<span>'+n+' lançamento'+(n===1?"":"s")+'</span>'+
      (pct==null ? '<span class="ic-p sem">sem previsto</span>'
        : '<span class="ic-p'+(!entrada&&pct>100?' acima':'')+'" title="Previsto: R$ '+brl(Math.abs(p))+'">'+pct+'% do previsto</span>');
  }
  function totaisPrevisto(ym){
    const o=orcamentoDe(ym); let rec=0, desp=0;
    Object.keys(o).forEach(c=>{
      if(!GRUPO_DE[c]||GRUPO_DE[c]==="Fora dos cálculos") return;
      if(GRUPO_DE[c]==="Receitas") rec+=o[c]; else desp+=Math.abs(o[c]);
    });
    return {rec:rec, desp:desp};
  }
  const ehReceita = c => GRUPO_DE[c]==="Receitas";

  // entradas e gastos por categoria, líquidos (estorno abate o gasto da própria categoria)
  function entSai(ls){
    const liq={};
    ls.forEach(l=>{ const k=l.categoria==="Sem categoria"?(l.valor>0?"+":"-"):l.categoria; liq[k]=(liq[k]||0)+l.valor; });
    const ent={}, sai={};
    Object.keys(liq).forEach(k=>{
      const v=liq[k]; if(Math.abs(v)<0.005) return;
      if(k==="+") ent["Sem categoria"]=v;
      else if(k==="-") sai["Sem categoria"]=-v;
      else if(ehReceita(k)) ent[k]=v;
      else sai[k]=-v;
    });
    const soma=o=>Object.keys(o).reduce((s,k)=>s+o[k],0);
    return {ent,sai,tE:soma(ent),tS:soma(sai)};
  }

  function renderDashboard(){

    if(!ui.mes||(ui.mes!=="tudo"&&!todosMeses.includes(ui.mes))) ui.mes=todosMeses.length?mesPadrao(todosMeses):"tudo";
    renderPeriodo(todosMeses,false);

    const noPeriodo=l=>ui.mes==="tudo"||l.data.slice(0,7)===ui.mes;
    // gasto real: compras do cartão entram; pagamento de fatura, aplicações e transferências entre contas ficam fora
    const valido=l=>!l.ignorado&&ehMov(l);
    const base=dados.lancamentos.filter(l=>noPeriodo(l)&&valido(l));
    const r=entSai(base), saldo=r.tE-r.tS;
    const semCat=base.filter(l=>l.categoria==="Sem categoria").length;
    const LIM=8;
    const nCat={};
    base.forEach(l=>{ const k=l.categoria==="Sem categoria"?(l.valor>0?"+":"-"):l.categoria; nCat[k]=(nCat[k]||0)+1; });
    const mesesLanc=[...new Set(base.map(l=>l.data.slice(0,7)))];
    const corDif=v=>v<-0.004?"#C0392B":v>0.004?"#1E8A5F":"var(--cinza)";

    function lista(obj,total,tipo){
      const tudo=Object.keys(obj).map(c=>[c,obj[c]]).sort((a,b)=>b[1]-a[1]);

      return it.map(([c,v])=>
        '<div class="dash-lin" data-dcat="'+esc(c)+'" data-dtipo="'+tipo+'" title="Ver lançamentos">'+

          '<span class="pc" title="Parte do total">'+(total?Math.round(v/total*100):0)+'%</span>'+
          '<span class="ic">'+infoCat(c==="Sem categoria"?(nCat[tipo==="e"?"+":"-"]||0):(nCat[c]||0), v,
            c==="Sem categoria"?0:previstoCat(c,ui.mes,mesesLanc), tipo==="e")+'</span>'+
          '<span class="br"><i style="width:'+Math.max(2,Math.abs(v)/max*100).toFixed(1)+'%;background:'+(tipo==="e"?"#1E8A5F":cor(c))+'"></i></span>'+
        '</div>').join("")+
        (tudo.length>LIM?'<button class="ver-mais" data-dver="'+chave+'">'+(aberto?"Mostrar menos":"Ver todas ("+tudo.length+")")+'</button>':"");
    }

    // tabela no formato da aba MÊS CORRENTE
    function previstoRealizado(){
      if(ui.mes==="tudo") return {alertas:[], html:'<div class="tit-secao" style="margin-top:36px"><h3>Previsto × realizado</h3></div>'+
        '<p class="sub">Escolha um mês no seletor acima para comparar com o previsto.</p>'};
      const o=orcamento(), real={};
      base.forEach(l=>{ real[l.categoria]=(real[l.categoria]||0)+l.valor; });
      const alertas=[]; let linhas="", pR=0,rR=0,pD=0,rD=0;
      const futuro=!base.length;   // mês só com previsão: sem realizado para comparar
      const doFluxo=!!orcDoFluxo(ui.mes);
      const tr='<td style="color:var(--linha)">—</td>';

      const rv=v=>futuro?tr:'<td>'+brl(v)+'</td>';
      GRUPOS.forEach(gr=>{
        if(!gr.g||gr.g==="Fora dos cálculos") return;

        const itens=gr.cats.map(c=>({c:c,p:+(o[c]||0),r:rec?(real[c]||0):-(real[c]||0)}))
          .filter(x=>ui.orcTodas||Math.abs(x.p)>0.004||Math.abs(x.r)>0.004);
        if(!itens.length) return;
        const gp=itens.reduce((s,x)=>s+x.p,0), gr_=itens.reduce((s,x)=>s+x.r,0);
        if(rec){ pR+=gp; rR+=gr_; } else { pD+=gp; rD+=gr_; }
        const dif=(p,v)=>rec?v-p:p-v;
        linhas+='<tr class="orc-g"><td>'+esc(gr.g)+'</td><td>'+brl(gp)+'</td>'+rv(gr_)+cel(dif(gp,gr_))+'</tr>';
        itens.forEach(x=>{
          if(!rec&&x.p>0&&x.r>x.p*1.1&&x.r-x.p>50) alertas.push(x);
          linhas+='<tr class="orc-c"><td><span class="orc-nome" data-dcat="'+esc(x.c)+'" title="Ver lançamentos">'+ponto(x.c)+esc(x.c)+'</span></td>'+
            (doFluxo?'<td>'+(x.p?brl(x.p):'<span style="color:var(--linha)">—</span>')+'</td>'
              :'<td><input class="orc-in" data-orc="'+esc(x.c)+'" value="'+(x.p?brl(x.p):"")+'" placeholder="—" inputmode="decimal" aria-label="Previsto de '+esc(x.c)+'"></td>')+
            rv(x.r)+cel(dif(x.p,x.r))+'</tr>';
        });
      });
      // o que ainda não tem categoria entra nos totais, para bater com o topo
      const scE=base.filter(l=>l.categoria==="Sem categoria"&&l.valor>0).reduce((s,l)=>s+l.valor,0);
      const scS=-base.filter(l=>l.categoria==="Sem categoria"&&l.valor<0).reduce((s,l)=>s+l.valor,0);
      if(scE||scS){
        rR+=scE; rD+=scS;
        linhas+='<tr class="orc-g"><td>A classificar</td><td></td><td>'+brl(scS-scE)+'</td><td></td></tr>'+

          (scS?brl(scS)+' de gasto':'')+(scS&&scE?' · ':'')+(scE?brl(scE)+' de entrada':'')+'</td><td></td></tr>';
      }
      linhas+='<tr class="orc-t"><td>Total de receitas</td><td>'+brl(pR)+'</td>'+rv(rR)+cel(rR-pR)+'</tr>'+
        '<tr class="orc-t"><td>Total de despesas</td><td>'+brl(pD)+'</td>'+rv(rD)+cel(pD-rD)+'</tr>'+
        '<tr class="orc-t forte"><td>Resultado</td><td style="color:'+corDif(pR-pD)+'">'+brl(pR-pD)+'</td>'+(futuro?tr:'<td style="color:'+corDif(rR-rD)+'">'+brl(rR-rD)+'</td>')+cel((rR-rD)-(pR-pD))+'</tr>';
      return {alertas:alertas, html:
        '<div class="tit-secao" style="margin-top:36px"><h3>Previsto × realizado · '+rotuloMes(ui.mes)+'</h3></div>'+
        '<p class="sub" style="margin:-8px 0 12px">'+(doFluxo?'O previsto vem do <b>Fluxo anual</b> — altere lá. ':'Clique no previsto para alterar. ')+'Na diferença, verde é sobra e vermelho é estouro.</p>'+
        '<div class="rolagem"><table class="dash-mes orc-tab"><thead><tr><th>Categoria</th><th>Previsto</th><th>Realizado</th><th>Diferença</th></tr></thead>'+
        '<tbody>'+linhas+'</tbody></table></div>'+
        '<button class="ver-mais" data-orctodas="1">'+(ui.orcTodas?"Mostrar só as categorias com valor":"Mostrar todas as categorias (para definir previsto)")+'</button>'};
    }

    const pr=previstoRealizado();
    const alertas=pr.alertas.sort((a,b)=>(b.r-b.p)-(a.r-a.p)).slice(0,5);
    const atencao=(alertas.length||semCat)?
      '<div class="tit-secao" style="margin:26px 0 10px"><h3>Pontos de atenção</h3></div><div class="dash-atencao">'+

          const ls=val.filter(l=>l.data.slice(0,7)===m), x=entSai(ls), p=totaisPrevisto(m);

      salvar(); renderDashboard();

  async function carregar(){
    try{
      // verificar sessão Supabase
      const { data:{ session } } = await sb.auth.getSession();
      sbUser = session?.user || null;
      atualizarBarraUsuario();

      let d = null;
      if(sbUser){
        // carregar do Supabase
        d = await sbCarregar();
      } else {
        // fallback: localStorage
        const raw = localStorage.getItem(CHAVE);
        if(raw) d = JSON.parse(raw);
      }

      if(d){
        dados.lancamentos = d.lancamentos||[];
        dados.saldos      = d.saldos||{};
        dados.regras      = (d.regras&&d.regras.length)?d.regras:REGRAS_PADRAO.slice();
        dados.prolabore   = d.prolabore||0;
        dados.faturaAberta = d.faturaAberta||null;
        dados.faturaFechada= d.faturaFechada||null;
        dados.orcamento   = d.orcamento||null;
        dados.orcamentoMes= d.orcamentoMes||{};
        dados.contas      = d.contas||{};
        dados.previsoes   = d.previsoes||{};
        dados.fluxo       = d.fluxo||null;
        dados.dividas     = d.dividas||null;
        dados.versao      = d.versao||0;
        migrar();
        if(dados._migrou){ delete dados._migrou; await salvarImediato(); }
        // migração: remover lançamentos do cartão com data > hoje+6 meses (bug antigo)
        const limiteMs = Date.now() + 180*24*60*60*1000;
        let corrigidos = 0;
        dados.lancamentos = dados.lancamentos.filter(l=>{
          if(l.origem==="cartao" && new Date(l.data+"T12:00:00").getTime() > limiteMs){
            corrigidos++; return false;
          }
          return true;
        });
        if(corrigidos > 0) await salvarImediato();
      }
    }catch(e){ console.error("Erro ao carregar:", e); }
  }

  function salvar(){

  /* ================= utilidades ================= */
  const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const brl = v => (v<0?"−":"")+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const rotuloMes = ym => { const [a,m]=ym.split("-"); return MESES[+m-1]+" de "+a; };
  const abrevMes = ym => { const [a,m]=ym.split("-"); return MESES[+m-1].slice(0,3)+" "+a.slice(2); };
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function numero(txt){
    let s = String(txt).trim().replace(/\s|R\$/g,"");
    // alguns extratos trazem o valor com C/D no fim: "15.887,04 C", "-240,00 D"
    let sinal = 0;
    const cd = s.match(/([CD])$/i);
    if(cd){ sinal = cd[1].toUpperCase()==="D" ? -1 : 1; s = s.slice(0,-1); }
    if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
    else s = s.replace(/,/g,"");
    let n = parseFloat(s);
    if(isNaN(n)) return 0;
    if(sinal) n = sinal*Math.abs(n);
    return n;
  }

  function dataISO(txt){
    const s = String(txt).replace(/\u00a0/g," ").trim();
    let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})\b/);
    if(!m){ m = s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/); if(m) m[3]="20"+m[3]; }
    if(m) return (m[1]==="00"||m[2]==="00") ? null : m[3]+"-"+m[2]+"-"+m[1];
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[1]+"-"+m[2]+"-"+m[3] : null;
  }

  function classificar(hist,valor){
    const u = hist.toUpperCase();
    for(const r of dados.regras){
      if(u.includes(r.termo.toUpperCase())) return {categoria:r.categoria,vinculo:r.vinculo};
    }
    return {categoria:"Sem categoria",vinculo:"PF"};
  }

  /* nome do estabelecimento, limpo dos prefixos do Itaú e do BB — vira o termo da regra aprendida */
  function mercado(hist){
    let s = String(hist).replace(/\u00a0/g," ").trim()
      // BB: "Pix - Enviado - FULANO", "Compra com Cartão - 22/05 18:54 LOJA"
      .replace(/^\s*Pix\s*-\s*(Enviado|Recebido)\s*-\s*/i,"")
      .replace(/^\s*Pix-Envio devolvido\s*-\s*/i,"")
      .replace(/^\s*Transferência Periódica\s*-\s*/i,"")
      .replace(/^\s*Compra\s+com\s+Cart[ãa]o\s*-\s*/i,"")
      .replace(/^\d{2}\/\d{2}\s+\d{2}:\d{2}\s*/,"")
      // Itaú: "PIX QRS LOJA29/08", "RSHOP SUPER NOSSO 2606", "PAY DL 06/08", "PIX TRANSF FULANO 10/07"
      .replace(/^(PIX\s+(QRS|TRANSF|WHATS\s+QRCODE|WHATS|AUT)|DEV\s+PIX|RSHOP|RSCCS\s+MP|RSCCS|RSCSS|PAY|ON|INT|SISPAG|TED|DOC)\s+/i,"")
      .replace(/\s*\d{2}\/\d{2}\s*$/,"")
      .replace(/(\D)\d{4}\s*$/,"$1")
      .replace(/\s+virtual$/i,"")
      .replace(/^\d{11,}\s*/,"")
      .trim();
    const corte = s.split(/\s+-\s+/)[0].trim();
    if(corte.length>3) s = corte;
    return (s||String(hist)).toUpperCase().replace(/\s+/g," ").slice(0,34).trim();
  }

  /* guarda o que você classificou à mão, para o próximo extrato entrar pronto */
  function aprender(l){
    const termo = mercado(l.hist);
    if(termo.length<4) return null;
    const i = dados.regras.findIndex(r=>r.termo.toUpperCase()===termo);
    if(i>=0){
      if(dados.regras[i].categoria===l.categoria && dados.regras[i].vinculo===l.vinculo) return null;
      dados.regras[i].categoria=l.categoria; dados.regras[i].vinculo=l.vinculo;
    }else{
      dados.regras.unshift({termo:termo,categoria:l.categoria,vinculo:l.vinculo,aprendida:true});
    }
    return termo;
  }

  /* desloca a data de parcelas futuras (PARC 02/12, PARC 03/05…) para o mês correto */
  function ajustarParc(iso, hist){
    const m = hist.match(/PARC\s+(\d{2})\/(\d{2})/i);
    if(!m) return iso;
    if(/ANUIDADE|TIT-PARC/i.test(hist)) return iso; // anuidade já vem na data da cobrança
    const atual = parseInt(m[1]);
    if(atual <= 1) return iso;           // parcela 1 fica na data original
    const [y,mo,d] = iso.split("-").map(Number);
    const meses = atual - 1;             // deslocar atual-1 meses à frente
    const mo2 = mo + meses;
    const y2  = y + Math.floor((mo2-1)/12);
    const mo3 = ((mo2-1)%12)+1;
    return `${y2}-${String(mo3).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  function lerCSV(texto){
    const prim = (texto.split(/\r?\n/).find(l=>l.trim())||"");
    const sep = (prim.split(";").length > prim.split(",").length) ? ";" : (prim.split("\t").length>2 ? "\t" : ",");
    const linhas=[]; let campo="",linha=[],aspas=false;
    for(let i=0;i<texto.length;i++){
      const c=texto[i];
      if(aspas){
        if(c==='"'){ if(texto[i+1]==='"'){campo+='"';i++;} else aspas=false; }
        else campo+=c;
      }else if(c==='"') aspas=true;
      else if(c===sep){ linha.push(campo); campo=""; }
      else if(c==="\n"){ linha.push(campo); linhas.push(linha); linha=[]; campo=""; }
      else if(c!=="\r") campo+=c;
    }
    if(campo||linha.length){ linha.push(campo); linhas.push(linha); }
    return linhas.filter(l=>l.some(c=>c.trim()!==""));
  }

  /* ---- leitura de células (CSV, Excel antigo .xls e .xlsx) ---- */
  const celTexto = v => String(v==null?"":v).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
  const celNum = v => typeof v==="number" ? v : numero(celTexto(v));
  function celData(v){
    if(typeof v==="number" && v>20000 && v<80000){           // data do Excel (número de série)
      const d=new Date(Math.round((v-25569)*864e5));
      return d.toISOString().slice(0,10);
    }
    if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);
    return dataISO(celTexto(v));
  }

  /* Acha as colunas de data, descrição e valor em qualquer extrato em tabela.
     Itaú: "data | lançamento | ag./origem | valor (R$) | saldo (R$)" (ou sem cabeçalho: data;descrição;valor)
     BB:   "Data | Lançamento/Histórico | Detalhes | Nº documento | Valor" */
  function linhasParaItens(linhas){
    let cab=-1;
    const ehHist = c => /hist[óo]rico|lan[çc]amento|descri[çc][ãa]o|estabelecimento/.test(c) && !/c[óo]d/.test(c);
    for(let i=0;i<Math.min(30,linhas.length);i++){
      const r=linhas[i].map(c=>celTexto(c).toLowerCase());
      if(r.some(c=>c==="data"||c.startsWith("data ")||c==="dt") && r.some(ehHist)){ cab=i; break; }
    }
    let iData,iHist,iVal,iDoc=-1,iDet=-1,iCred=-1,iDeb=-1,ini;
    if(cab>=0){
      const c=linhas[cab].map(x=>celTexto(x).toLowerCase());
      iData=c.findIndex(x=>x==="data"||x.startsWith("data ")||x==="dt");
      iHist=c.findIndex((x,i)=>i!==iData&&/^(hist[óo]rico|lan[çc]amento|descri[çc][ãa]o)$/.test(x));
      if(iHist<0) iHist=c.findIndex((x,i)=>i!==iData&&ehHist(x));
      iDet=c.findIndex(x=>/detalhe/.test(x));
      iDoc=c.findIndex(x=>/documento|docto|n[°º]/.test(x));
      iVal=c.findIndex(x=>/^valor/.test(x)); if(iVal<0) iVal=c.findIndex(x=>x.includes("valor"));
      iCred=c.findIndex(x=>/cr[ée]dito/.test(x)); iDeb=c.findIndex(x=>/d[ée]bito/.test(x));
      ini=cab+1;
    } else {
      // sem cabeçalho (CSV do Itaú): data ; descrição ; valor
      const ok=linhas.slice(0,5).filter(l=>celData(l[0])).length;
      if(!ok) return {erro:"Não reconheci as colunas. Use o extrato baixado do banco (OFX, CSV ou Excel), sem alterar o arquivo."};
      iData=0; iHist=1; iVal=2; ini=0;
    }
    if(iData<0||iHist<0||(iVal<0&&iCred<0&&iDeb<0))
      return {erro:"Não reconheci as colunas de data, descrição e valor desse arquivo."};

    const itens=[]; let saldoAnt=null;
    for(let i=ini;i<linhas.length;i++){
      const r=linhas[i];
      const iso=celData(r[iData]); if(!iso) continue;
      let hist=celTexto(r[iHist]);
      if(iDet>=0){ const d=celTexto(r[iDet]); if(d) hist=hist?hist+" - "+d:d; }
      if(!hist) continue;
      const v = iVal>=0 ? celNum(r[iVal]) : (Math.abs(celNum(r[iCred])||0) - Math.abs(celNum(r[iDeb])||0));
      const ch=hist.toUpperCase().replace(/\s+/g,"");
      if(/^S(AL)?DO/.test(ch)){ if(/^SALDOANTERIOR/.test(ch)) saldoAnt={iso:iso,valor:v}; continue; }
      if(!v) continue;
      itens.push({iso:iso,hist:hist,valor:v,doc:iDoc>=0?celTexto(r[iDoc]):""});
    }
    return {itens:itens,saldoAnt:saldoAnt};
  }

  /* OFX ("Money"), que o Itaú e o BB oferecem no download do extrato */
  function lerOFX(texto){
    const blocos=texto.split(/<STMTTRN>/i).slice(1);
    if(!blocos.length) return {erro:"Não encontrei lançamentos nesse arquivo OFX."};
    const tag=(b,t)=>{ const m=b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i")); return m?m[1].trim():""; };
    const itens=blocos.map(b=>{
      const d=tag(b,"DTPOSTED");
      return {iso:d.length>=8?d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8):null,
              hist:celTexto(tag(b,"MEMO")||tag(b,"NAME")), valor:numero(tag(b,"TRNAMT")), doc:tag(b,"CHECKNUM")};
    }).filter(x=>x.iso&&x.hist&&x.valor);
    return {itens:itens,saldoAnt:null};
  }

  /* Grava itens {iso,hist,valor,doc[,categoria]} de uma origem (itau, bb, cartao, manual).
     O que já existe (mesma data, valor e descrição, na mesma origem) não entra de novo;
     por isso dá para importar a planilha e depois os extratos dos mesmos meses. */
  function gravarLinhas(itens,origem){
    const norm=s=>String(s).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"").slice(0,20);
    const fp=(d,v,h)=>d+"|"+Number(v).toFixed(2)+"|"+norm(h);
    const livres=new Map(), porDoc=new Map();
    dados.lancamentos.forEach(l=>{
      if(l.origem!==origem) return;
      const k=fp(l.data,l.valor,l.hist); livres.set(k,(livres.get(k)||0)+1);
      if(l.doc&&!l.manual) porDoc.set(l.data+"|"+l.doc+"|"+String(l.hist).slice(0,42),l);
    });
    const ids=new Set(dados.lancamentos.map(l=>l.id));
    let novos=0,repetidos=0,prontos=0,corrigidos=0; const meses=new Set();
    itens.forEach(it=>{
      const hist=celTexto(it.hist), iso=it.iso, doc=celTexto(it.doc);
      const valor=Math.round(it.valor*100)/100;
      if(!iso||!hist||!valor) return;
      const k=fp(iso,valor,hist);
      if(livres.get(k)>0){ livres.set(k,livres.get(k)-1); repetidos++; return; }
      // mesmo documento com valor diferente: o banco corrigiu, atualiza sem perder categoria/observação
      if(doc && origem!=="cartao"){
        const velho=porDoc.get(iso+"|"+doc+"|"+hist.slice(0,42));
        if(velho){ velho.valor=valor; corrigidos++; meses.add(iso.slice(0,7)); return; }
      }
      const base=iso+"|"+origem+"|"+valor.toFixed(2)+"|"+hist.slice(0,42);
      let id=base, n=2; while(ids.has(id)) id=base+"#"+(n++);
      const categoria=it.categoria||classificar(hist,valor).categoria;
      if(categoria!=="Sem categoria") prontos++;
      dados.lancamentos.push({id:id,data:iso,hist:hist,valor:valor,doc:doc,categoria:categoria,
                              vinculo:"PF",obs:"",origem:origem});
      ids.add(id); novos++; meses.add(iso.slice(0,7));
    });
    return {novos:novos,repetidos:repetidos,prontos:prontos,corrigidos:corrigidos,meses:[...meses]};
  }
  function textoImport(r){
    return r.novos+" lançamento"+(r.novos===1?"":"s")+" importado"+(r.novos===1?"":"s")+
      (r.novos?" · "+r.prontos+" já classificado"+(r.prontos===1?"":"s"):"")+
      (r.corrigidos?" · "+r.corrigidos+" valor"+(r.corrigidos===1?"":"es")+" corrigido"+(r.corrigidos===1?"":"s"):"")+
      (r.repetidos?" · "+r.repetidos+" já estava"+(r.repetidos===1?"":"m")+" aqui":"");
  }

  function concluirImport(r,origem){
    if(!r||r.erro){ avisar((r&&r.erro)||"Não reconheci esse arquivo.",true); return; }
    let itens=r.itens;
    if(origem==="cartao"){
      // fatura: pagamento da fatura não é compra; compras vêm positivas no arquivo do banco
      itens=itens.filter(i=>!/^(PAGAMENTO|PGTO|PAGTO|PAG\s*FATURA|SALDO|TOTAL)/i.test(i.hist));
      const pos=itens.filter(i=>i.valor>0).length;
      if(pos>itens.length-pos) itens.forEach(i=>{ i.valor=-i.valor; });
      itens.forEach(i=>{ i.iso=ajustarParc(i.iso,i.hist); if(!i.doc) i.doc="Cartão Itaú"; });
    }
    if(!itens.length){ avisar("Não encontrei lançamentos nesse arquivo.",true); return; }
    if(r.saldoAnt && origem!=="cartao"){
      const d=new Date(r.saldoAnt.iso+"T12:00:00"); d.setDate(d.getDate()+1);
      dados.saldos[origem+":"+d.toISOString().slice(0,7)]=r.saldoAnt.valor;
    }
    const g=gravarLinhas(itens,origem);
    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(g.meses.length){ ui.mes=g.meses.sort().pop(); ui.view="mes"; }
    salvar(); render();
    avisar(NOMES_ORIGEM[origem]+": "+textoImport(g));
  }

  function lerArquivo(arq){
    const origem=ui._origemImport||"itau"; ui._origemImport=null;
    const nome=arq.name.toLowerCase();
    if(nome.endsWith(".pdf")){ importarFaturaPDF(arq); return; }
    const fr=new FileReader();
    fr.onload=()=>{
      const buf=fr.result;
      if(/\.xlsx?$/.test(nome)){ lerPlanilhaOuExtrato(buf,origem); return; }
      let texto;
      try{ texto=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
      catch(e){ texto=new TextDecoder("iso-8859-1").decode(buf); }
      if(origem==="planilha"){ avisar("A planilha de orçamento precisa ser o arquivo .xlsx.",true); return; }
      const r = /<OFX>|OFXHEADER/i.test(texto) ? lerOFX(texto) : linhasParaItens(lerCSV(texto));
      concluirImport(r,origem);
    };
    fr.onerror=()=>avisar("Não consegui abrir esse arquivo.",true);
    fr.readAsArrayBuffer(arq);
  }

  function lerPlanilhaOuExtrato(buf,origem){
    let wb;
    try{ wb = XLSX.read(buf,{type:"array"}); }
    catch(e){ avisar("Não consegui abrir a planilha.",true); return; }
    const aba = wb.SheetNames.find(n=>/^\s*LAN[ÇC]AMENTOS\s*$/i.test(n));
    if(aba && (origem==="planilha" || wb.SheetNames.some(n=>/M[ÊE]S CORRENTE/i.test(n)))){ importarPlanilhaOrcamento(wb,aba); return; }
    if(origem==="planilha"){ avisar("Não encontrei a aba LANÇAMENTOS nessa planilha.",true); return; }
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    concluirImport(linhasParaItens(linhas),origem);
  }

  /* ---- planilha "Orçamento Solano": aba LANÇAMENTOS (histórico) e MÊS CORRENTE (previsto) ---- */
  const MAPA_PLANILHA = {

    "serviço doméstico|provisão":"Doméstica – provisão","serviço doméstico|transporte":"Doméstica – transporte",
    "supermercado|":"Supermercado","supermercado|supermercado":"Supermercado","supermercado|açougue":"Açougue",
    "supermercado|padaria":"Padaria","supermercado|sacolão":"Sacolão / feira","supermercado|bar/restaurante":"Bar / restaurante",
    "transporte|consórcio":"Consórcio","transporte|gasolina":"Gasolina","transporte|ipva":"IPVA / multas",
    "transporte|manutenção":"Manutenção do carro","transporte|seguro":"Seguro auto","transporte|uber/localiza":"Uber / Localiza"
  };
  function catPlanilha(cat,sub){
    const k=celTexto(cat).toLowerCase()+"|"+celTexto(sub).toLowerCase();
    return MAPA_PLANILHA[k] || MAPA_PLANILHA[k.split("|")[0]+"|"] || null;
  }
  function origemPlanilha(b){
    const s=celTexto(b).toLowerCase();
    if(/infinite|cart[ãa]o/.test(s)) return "cartao";
    if(/ita[úu]/.test(s)) return "itau";
    if(/^bb\b/.test(s)) return "bb";
    return "manual";
  }
  function importarPlanilhaOrcamento(wb,aba){
    const linhas=XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,defval:""});
    let cab=-1;
    for(let i=0;i<Math.min(30,linhas.length);i++){
      const r=linhas[i].map(c=>celTexto(c).toUpperCase());
      if(r.includes("DATA") && r.some(c=>c.startsWith("VALOR")) && r.includes("CATEGORIA")){ cab=i; break; }
    }
    if(cab<0){ avisar("A aba LANÇAMENTOS não tem o cabeçalho esperado (DATA, HISTÓRICO, VALOR, BANCO, CATEGORIA).",true); return; }
    const c=linhas[cab].map(x=>celTexto(x).toUpperCase());
    const iD=c.indexOf("DATA"), iH=c.findIndex(x=>x.startsWith("HIST")), iV=c.findIndex(x=>x.startsWith("VALOR")),
          iB=c.findIndex(x=>x.startsWith("BANCO")), iC=c.indexOf("CATEGORIA"), iS=c.indexOf("SUBCATEGORIA");
    const porOrigem={};
    for(let i=cab+1;i<linhas.length;i++){
      const r=linhas[i];
      const iso=celData(r[iD]); if(!iso) continue;
      const valor=celNum(r[iV]); if(!valor) continue;
      const banco=iB>=0?celTexto(r[iB]):"", o=origemPlanilha(banco);
      let cat=catPlanilha(r[iC], iS>=0?r[iS]:"");
      const hist=(iH>=0?celTexto(r[iH]):"") || [celTexto(r[iC]),iS>=0?celTexto(r[iS]):""].filter(Boolean).join(" / ") || "Lançamento da planilha";
      if(ehTransfTamara(hist,valor)) cat="Transferências Tâmara";
      (porOrigem[o]=porOrigem[o]||[]).push({iso:iso,hist:hist,valor:valor,
        doc:(o==="cartao"||o==="manual")?banco:"", categoria:cat||undefined});
    }
    const tot={novos:0,repetidos:0,prontos:0,corrigidos:0};
    Object.keys(porOrigem).forEach(o=>{
      const g=gravarLinhas(porOrigem[o],o);
      ["novos","repetidos","prontos","corrigidos"].forEach(k=>tot[k]+=g[k]);
    });
    const nPrev=lerOrcamentoPlanilha(wb), ano=anoPlanilha(wb);
    const nFluxo=lerFluxoAnual(wb,ano), abasPrev=lerPrevisoes(wb,ano), temDiv=lerDividas(wb);
    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    ui.conta="dash"; ui.mes=null; ui.view="mes";
    salvar(); render();
    avisar("Planilha: "+textoImport(tot)+
      (nFluxo?" · fluxo anual ("+nFluxo+" linhas)":nPrev?" · previsto de "+nPrev+" itens":"")+
      (abasPrev.length?" · previsão de "+abasPrev.join(", "):"")+(temDiv?" · dívidas e parcelas":""));
  }
  /* ---- outras abas da planilha ---- */
  const MESES_ABREV=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  // mês de uma célula de cabeçalho: data do Excel, "2026-10", "01/10/2026", "Out", "Out-27"
  function celMes(v,ano){
    if(typeof v==="number" && v>20000 && v<80000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,7);
    if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()+12*36e5).toISOString().slice(0,7);
    const s=celTexto(v).toLowerCase();
    let m=s.match(/^(\d{4})-(\d{2})/); if(m) return m[1]+"-"+m[2];
    m=s.match(/^\d{2}\/(\d{2})\/(\d{4})/); if(m) return m[2]+"-"+m[1];
    m=s.match(/^(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:[\s\/-]*(\d{2,4}))?$/);
    if(m){
      const a=m[2]?(m[2].length===2?"20"+m[2]:m[2]):String(ano||new Date().getFullYear());
      return a+"-"+String(MESES_ABREV.indexOf(m[1])+1).padStart(2,"0");
    }
    return null;
  }
  const abaLinhas = (wb,nome) => XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:"",blankrows:true});
  function anoPlanilha(wb){
    for(const n of wb.SheetNames.filter(n=>/FLUXO|RESUMO|CONSOLIDA/i.test(n))){
      const m=abaLinhas(wb,n).slice(0,6).map(r=>r.join(" ")).join(" ").match(/20\d\d/);
      if(m) return m[0];
    }
    return String(new Date().getFullYear());
  }
  // nome da linha (aba FLUXO ANUAL) → categoria do app. A ordem importa: a primeira que bater vale.
  const ROTULOS=[
    [/pula parcela|caixinha|outras receitas/i,"Outras receitas"],[/13[ºo°]?\s*sal/i,"13º salário"],
    [/e-?\s?social/i,"Doméstica – e-Social"],[/vale.?transporte/i,"Doméstica – transporte"],
    [/provis[ãa]o dom[ée]stica/i,"Doméstica – provisão"],[/dom[ée]stica/i,"Doméstica – salário"],
    [/jardim|bab[áa]|diarista/i,"Diarista / jardim / extras"],
    [/sal[áa]rio/i,"Salário"],[/rendimento|\bfii\b/i,"Rendimentos"],[/restitui/i,"Restituição IR"],
    [/previd/i,"Previdência"],[/\biof\b/i,"IOF e taxas"],[/consignado/i,"Consignado"],
    [/financiamento/i,"Financiamento casa"],[/cons[óo]rcio/i,"Consórcio"],
    [/cemig|\bluz\b/i,"Luz (Cemig)"],[/[áa]gua|copasa/i,"Água (Copasa)"],[/internet/i,"Internet"],
    [/iptu/i,"IPTU"],[/\bsky\b/i,"TV (Sky)"],[/\btim\b|celular/i,"Celular (TIM)"],[/assinatura/i,"Assinaturas"],
    [/supermercado|feira|mercado/i,"Supermercado"],[/restaurante|lanche/i,"Bar / restaurante"],
    [/material|passeios? escola/i,"Material / passeios escola"],[/escola/i,"Escola"],
    [/unimed/i,"Unimed"],[/sa[úu]de/i,"Saúde fora do plano"],
    [/uber|localiza/i,"Uber / Localiza"],[/gasolina/i,"Gasolina"],[/ipva|multa/i,"IPVA / multas"],
    [/seguro/i,"Seguro auto"],[/carro/i,"Manutenção do carro"],
    [/clube/i,"Clube"],[/corrida/i,"Corrida"],[/f[ée]rias/i,"Férias / viagem"],[/passeio|viagem/i,"Passeios"],
    [/\bpet\b|veterin/i,"Pet"],[/vestu[áa]rio/i,"Vestuário"],[/reparo|casa/i,"Manutenção da casa"],
    [/t[âãa]mara/i,"Tâmara – pessoal"],[/solano/i,"Solano – pessoal"],[/meninas|cec[íi]lia/i,"Meninas"]
  ];
  const catRotulo = r => { const x=ROTULOS.find(p=>p[0].test(r)); return x?x[1]:null; };

  // FLUXO ANUAL: as linhas da aba, com os valores de cada mês (receitas +, despesas −)
  function lerFluxoAnual(wb,ano){
    const aba=wb.SheetNames.find(n=>/FLUXO ANUAL/i.test(n)); if(!aba) return 0;
    const L=abaLinhas(wb,aba);
    let cab=-1, ms=[];
    for(let i=0;i<Math.min(15,L.length);i++){
      const x=L[i].map(c=>celMes(c,ano));
      if(x.filter(Boolean).length>=6){ cab=i; ms=x; break; }
    }
    if(cab<0) return 0;
    let iRot=L[cab].findIndex(c=>/^item$/i.test(celTexto(c))); if(iRot<0) iRot=1;
    const limpa=t=>t.replace(/^[^\wÀ-ÿ(]+/,"").trim();
    const linhas=[]; let lado="desp", fim=false;
    for(let i=cab+1;i<L.length && !fim;i++){
      const r=L[i], bruto=celTexto(r[iRot]); if(!bruto) continue;
      if(/📥|📤/.test(bruto)){ lado=/📥|RECEITA/i.test(bruto)?"rec":"desp"; linhas.push({tipo:"g", rot:limpa(bruto), lado:lado}); continue; }
      if(/RESULTADO DO M/i.test(bruto)){ fim=true; continue; }
      if(/^▸|TOTAL|RESULTADO|EXCLUINDO|^\(-\)/i.test(bruto)) continue;
      const v={};
      ms.forEach((m,j)=>{ if(m && typeof r[j]==="number" && r[j]) v[m]=Math.round(r[j]*100)/100; });
      linhas.push({tipo:"i", rot:limpa(bruto), cat:catRotulo(bruto)||"", lado:lado, v:v});
    }
    if(!linhas.some(l=>l.tipo==="i")) return 0;
    dados.fluxo={ano:ano, meses:ms.filter(Boolean), linhas:linhas};
    return linhas.filter(l=>l.tipo==="i").length;
  }

  // abas de previsão do mês (Setembro, Outubro, Novembro…), no formato da planilha:
  // A data · B detalhes · C a pagar · D pago; linhas 3–9 = separado no início do mês (fora do "a pagar");
  // E/F = SALDO e FII · J/K = receitas esperadas · demais valores soltos = anotações
  function lerPrevisoes(wb,ano){
    const nomes=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
    const lidos=[];
    wb.SheetNames.forEach(nome=>{
      const k=nomes.findIndex(m=>nome.trim().toLowerCase().startsWith(m)); if(k<0) return;
      const ym=ano+"-"+String(k+1).padStart(2,"0");
      const p={aba:nome.trim(), saldo:0, fixos:[], itens:[], receitas:[], notas:[]};
      const num=x=>typeof x==="number";
      abaLinhas(wb,nome).forEach((r,i)=>{
        if(i<1) return;
        const d=celTexto(r[1]);
        if(i>=2 && d){
          const x={data:celData(r[0])||"", d:d, aPagar:num(r[2])?r[2]:null, pago:num(r[3])?Math.abs(r[3]):null};
          (i<9?p.fixos:p.itens).push(x);
        }
        const e=celTexto(r[4]), F=r[5], g=celTexto(r[6]);
        if(num(F)){
          if(/^saldo$/i.test(e)) p.saldo=F;
          else if(/^fii$/i.test(e)) p.receitas.push({d:"FII", v:F});
          else if(!/^(a pagar|a receber|deficit|d[ée]ficit)/i.test(e)) p.notas.push({d:e||g||"", v:F});
        }
        const j=celTexto(r[9]), K=r[10];
        if(j) p.receitas.push({d:j, v:num(K)?K:null});
        else if(num(K)) p.notas.push({d:"", v:K});
      });
      if(p.itens.length||p.fixos.length){ (dados.previsoes=dados.previsoes||{})[ym]=p; lidos.push(nome.trim()); }
    });
    return lidos;
  }

  // PARCELAMENTOS CARTÃO, CONSÓRCIO, CONSIGNADOS e CONSOLIDA
  function lerDividas(wb){
    const aba=re=>wb.SheetNames.find(n=>re.test(n));
    const dv={parcelas:[], consorcio:[], consignados:[], consolida:null, quitacao:[], faturaAvulsos:{}};
    const valsDe=(r,ms)=>{ const o={}; ms.forEach((m,j)=>{ if(m && typeof r[j]==="number" && r[j]) o[m]=Math.round(r[j]*100)/100; }); return o; };
    let a=aba(/PARCELAMENTO/i);
    if(a){
      const L=abaLinhas(wb,a), cab=L.findIndex(r=>r.some(c=>/^descri/i.test(celTexto(c))));
      if(cab>=0){
        const h=L[cab].map(celTexto), ms=L[cab].map(c=>celMes(c));
        const iCar=h.findIndex(x=>/^cart/i.test(x)), iDes=h.findIndex(x=>/^descri/i.test(x)),
              iCat=h.findIndex(x=>/^categoria/i.test(x)), iSub=h.findIndex(x=>/^subcat/i.test(x));
        for(let i=cab+1;i<L.length;i++){
          const r=L[i], car=celTexto(r[iCar]), d=celTexto(r[iDes]);
          if(/FATURA/i.test(car) && !/TOTAL/i.test(car)){ dv.faturaAvulsos=valsDe(r,ms); continue; }
          if(/TOTAL PARCEL/i.test(car)){
            // a fórmula do total (ex.: SUM(N7:N22)) diz quais linhas contam; as de fora vêm desmarcadas
            const j0=ms.findIndex(Boolean), cel=j0>=0?wb.Sheets[a][XLSX.utils.encode_cell({r:i,c:j0})]:null;
            const mf=cel&&cel.f?String(cel.f).match(/SUM\(\$?[A-Z]+\$?(\d+):\$?[A-Z]+\$?(\d+)\)/i):null;
            if(mf) dv.parcelas.forEach(p=>{ if(p._linha<+mf[1]||p._linha>+mf[2]) p.foraTotal=true; });
            continue;
          }
          if(/TOTAL|^\*/i.test(car)) continue;
          if(!d) continue;
          const vals=valsDe(r,ms);
          if(Object.keys(vals).length) dv.parcelas.push({cartao:car, desc:d, cat:catPlanilha(r[iCat],iSub>=0?r[iSub]:"")||"", vals:vals, _linha:i+1});
        }
      }
    }
    a=aba(/CONS[ÓO]RCIO/i);
    if(a){
      const L=abaLinhas(wb,a), cab=L.findIndex(r=>/ve[íi]culo/i.test(celTexto(r[0])));
      if(cab>=0){
        const ms=L[cab].map(c=>celMes(c));
        for(let i=cab+1;i<L.length;i++){
          const r=L[i], nome=celTexto(r[0]);
          if(!nome) continue; if(/TOTAL/i.test(nome)) break;
          dv.consorcio.push({nome:nome, situacao:celTexto(r[1]), parcelas:typeof r[2]==="number"?r[2]:null,
            quitacao:typeof r[3]==="number"?r[3]:null, vals:valsDe(r,ms)});
        }
      }
    }
    a=aba(/CONSIGNADO/i);
    if(a){
      const L=abaLinhas(wb,a), tot={};
      const hc=L.findIndex(r=>r.some(c=>/total parcelas/i.test(celTexto(c))));
      if(hc>=0){
        const iT=L[hc].map(celTexto).findIndex(x=>/total parcelas/i.test(x));
        for(let i=hc+1;i<L.length;i++){ const k=celTexto(L[i][0]); if(!k) break; tot[k]=L[i][iT]; }
      }
      const hs=L.findIndex(r=>r.some(c=>/parcela atual/i.test(celTexto(c))));
      if(hs>=0){
        const h=L[hs].map(celTexto), ix=re=>h.findIndex(x=>re.test(x));
        const iP=ix(/^pmt/i), iA=ix(/parcela atual/i), iR=ix(/restantes/i), iS=ix(/saldo devedor/i),
              iQ=ix(/para quitar/i), iV=ix(/vencimento/i), iPc=ix(/quitado/i);
        for(let i=hs+1;i<L.length;i++){
          const r=L[i], k=celTexto(r[0]);
          if(!k||/^TOTA/i.test(k)) break;
          dv.consignados.push({contrato:k, pmt:+r[iP]||0, atual:+r[iA]||0, total:+tot[k]||null, restantes:+r[iR]||0,
            saldo:+r[iS]||0, quitar:+r[iQ]||0, venc:celMes(r[iV]), pct:+r[iPc]||0});
        }
      }
    }
    a=aba(/CONSOLIDA/i);
    if(a){
      const L=abaLinhas(wb,a), hm=L.findIndex(r=>r.slice(1).filter(c=>celMes(c)).length>=6);
      if(hm>=0){
        const ms=L[hm].map(c=>celMes(c)), linhas=[];
        for(let i=hm+1;i<L.length;i++){
          const nome=celTexto(L[i][0]); if(!nome) continue;
          if(/QUITA/i.test(nome)){
            for(let j=i+1;j<L.length;j++){ const n2=celTexto(L[j][0]); if(n2 && typeof L[j][1]==="number") dv.quitacao.push({nome:n2, v:L[j][1]}); }
            break;
          }
          if(/^total$/i.test(nome)) continue;
          const vals=valsDe(L[i],ms); if(Object.keys(vals).length) linhas.push({nome:nome, vals:vals});
        }
        dv.consolida={meses:ms.filter(Boolean), linhas:linhas};
      }
    }
    dv.parcelas.forEach(p=>{ delete p._linha; });
    if(dv.parcelas.length||dv.consorcio.length||dv.consignados.length||dv.consolida){ dados.dividas=dv; return true; }
    return false;
  }

  // previsto da aba MÊS CORRENTE (colunas CATEGORIA / ITEM, PREVISTO, cat, subcat)
  function lerOrcamentoPlanilha(wb){
    const aba=wb.SheetNames.find(n=>/M[ÊE]S CORRENTE/i.test(n)); if(!aba) return 0;
    const linhas=XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,defval:""});
    let cab=-1;
    for(let i=0;i<Math.min(20,linhas.length);i++){
      if(linhas[i].some(x=>/CATEGORIA\s*\/\s*ITEM/i.test(celTexto(x)))){ cab=i; break; }
    }
    if(cab<0) return 0;
    const c=linhas[cab].map(x=>celTexto(x).toLowerCase());
    const iL=c.findIndex(x=>/categoria\s*\/\s*item/.test(x)), iP=c.indexOf("previsto"),
          iC=c.indexOf("cat"), iS=c.indexOf("subcat");
    if(iL<0||iP<0) return 0;
    const o={}; let n=0, secao="";
    for(let i=cab+1;i<linhas.length;i++){
      const r=linhas[i], rot=celTexto(r[iL]);
      if(!rot) continue;
      if(/📥|RECEITAS/.test(rot)&&!/TOTAL/i.test(rot)&&typeof r[iP]!=="number"){ secao="rec"; continue; }
      if(/📤/.test(rot)){ secao="desp"; continue; }
      if(/^▸|^TOTAL|^RESULTADO/i.test(rot)) continue;
      const p=r[iP]; if(typeof p!=="number"||!p) continue;
      let cat=iC>=0?catPlanilha(r[iC],iS>=0?r[iS]:""):null;
      if(!cat && secao==="rec"){
        cat=/13/.test(rot)?"13º salário":/sal[áa]rio/i.test(rot)?"Salário":/rendimento/i.test(rot)?"Rendimentos":
            /restitui/i.test(rot)?"Restituição IR":"Outras receitas";
      }
      if(!cat) continue;
      o[cat]=Math.round(((o[cat]||0)+(ehReceita(cat)?p:Math.abs(p)))*100)/100; n++;
    }
    if(n>=5){ dados.orcamento=o; return n; }
    return 0;
  }

  /* ================= importação PDF da fatura do cartão — sem API ================= */
  async function importarFaturaPDF(arq){
    avisar("Lendo a fatura…");

    // configurar worker do PDF.js
    if(typeof pdfjsLib==="undefined"){
      avisar("Biblioteca PDF não carregou. Verifique sua conexão e tente novamente.",true); return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

    const buf = await arq.arrayBuffer();
    let pdfDoc;
    // PDF com senha (fatura do BB): pede a senha só para abrir; ela não é guardada
    let senha, tentativas=0;
    while(true){
      try{ pdfDoc = await pdfjsLib.getDocument({data:buf.slice(0), password:senha}).promise; break; }
      catch(e){
        if(e && e.name==="PasswordException" && tentativas<3){
          senha = prompt(tentativas===0
            ? "Esta fatura tem senha. Digite a senha do PDF:"
            : "Senha incorreta. Tente de novo:");
          if(senha===null){ avisar("Importação cancelada.",true); return; }
          tentativas++; continue;
        }
        avisar(e && e.name==="PasswordException"
          ? "Senha incorreta. Importação cancelada."
          : "Não consegui abrir o PDF.",true);
        return;
      }
    }

    // ler os itens de texto de cada página, com a posição (x, y) de cada um
    const paginas = [], larguras = [];
    for(let p=1;p<=pdfDoc.numPages;p++){
      const page = await pdfDoc.getPage(p);
      const content = await page.getTextContent();
      paginas.push(content.items.filter(it=>it.str && it.str.trim()!==""));
      larguras.push(page.getViewport({scale:1}).width);
    }
    // agrupar itens da mesma linha visual pela posição Y (evita que uma linha "engula"
    // a data e o valor da linha seguinte)
    const agruparLinhas = itens=>{
      const ord = itens.slice().sort((a,b)=> b.transform[5]-a.transform[5] || a.transform[4]-b.transform[4]);
      const linhas=[]; let linha=null, ultY=null;
      ord.forEach(it=>{
        const y = it.transform[5];
        if(linha===null || Math.abs(y-ultY)>2){ linha={y:y,itens:[]}; linhas.push(linha); ultY=y; }
        linha.itens.push(it);
      });
      linhas.forEach(l=>{ l.itens.sort((a,b)=>a.transform[4]-b.transform[4]); l.txt=l.itens.map(i=>i.str).join(" "); });
      return linhas;
    };
    const textoTotal = paginas.map(it=>agruparLinhas(it).map(l=>l.txt).join("\n")).join("\n");
    const dataBR = s => s ? s.split("/").reverse().join("-") : "";
    const numBR  = s => parseFloat(String(s).replace(/\./g,"").replace(",","."));

    // detectar cartão e datas da fatura
    const mCartao = textoTotal.match(/Final\s+(\d{4})/i);
    const cartao  = mCartao ? "Final "+mCartao[1] : ((dados.faturaFechada&&dados.faturaFechada.cartao)||"Cartão");
    // data de referência da fatura: fechamento (BB) ou emissão/vencimento (Itaú)
    const mFecha = textoTotal.match(/Fatura fechada em\s+(\d{2})\/(\d{2})\/(\d{4})/i)
                || textoTotal.match(/Emiss[ãa]o:?\s*(\d{2})\/(\d{2})\/(\d{4})/i)
                || textoTotal.match(/Vencimento:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
    const hoje = new Date();
    const anoFatura    = mFecha ? parseInt(mFecha[3]) : hoje.getFullYear();
    const mesFechamento= mFecha ? parseInt(mFecha[2]) : hoje.getMonth()+1;
    // "Lançamentos Futuros" = fatura ainda em aberto (layout em duas colunas)
    const ehAberta = !mFecha && /Lan[çc]amentos Futuros/i.test(textoTotal);

    const brutos = []; // {dd,mm,desc,v} — v positivo = compra, negativo = crédito
    let pendentes=0, pendTotal=0;
    if(ehAberta){
      paginas.forEach(itens=>{
