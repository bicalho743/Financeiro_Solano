        // cada cabeçalho "Data" abre uma coluna
        const xs = itens.filter(i=>i.str.trim()==="Data").map(i=>i.transform[4]).sort((a,b)=>a-b);
        const cortes=[];
        xs.forEach(x=>{ if(!cortes.length || x-cortes[cortes.length-1]>40) cortes.push(x); });
        if(!cortes.length) cortes.push(0);
        const cols = cortes.map(()=>[]);
        itens.forEach(it=>{ let c=0; cortes.forEach((x,i)=>{ if(it.transform[4]>=x-6) c=i; }); cols[c].push(it); });
        cols.forEach(col=>{
          let emProc=false;
          agruparLinhas(col).forEach(l=>{
            if(/Lan[çc]amentos em processamento/i.test(l.txt)){ emProc=true; return; }
            const m = l.txt.match(/^\s*(\d{2})\/(\d{2})\s+(.+?)\s+(?:R\$\s*)?(-?[\d.]*\d,\d{2})\s*$/);
            if(!m) return; // cabeçalhos e a linha da cidade (continuação) ficam de fora
            const v = numBR(m[4]);
            if(emProc){ pendentes++; pendTotal+=v; return; }
            brutos.push({dd:m[1],mm:m[2],desc:m[3].trim().replace(/\s+R\$$/,""),v:v});
          });
        });
      });
    } else {
      // fatura fechada: "DD/MM DESCRIÇÃO [país] [R$] [-]N,NN". O Itaú imprime em duas colunas
      // por página: separa as colunas pela posição X das datas e lê cada uma de cima para baixo.
      // "Compras parceladas - próximas faturas" fica de fora (ainda não foi cobrado).
      const RE = /(\d{2})\/(\d{2})\s+(.+?)\s+(?:[A-Z]{2}\s+)?(?:R\$\s*)?(-\s?)?(\d{1,3}(?:\.\d{3})*,\d{2})(?=\s|$)/g;
      let futuras=false;
      paginas.forEach((itens,pi)=>{
        const larg=larguras[pi]||600;
        const datas=itens.filter(i=>/^\d{2}\/\d{2}\b/.test(i.str.trim()));
        const dir=datas.filter(i=>i.transform[4]>larg*0.45);
        const cols = (dir.length>=3 && datas.length-dir.length>=3)
          ? (x=>[itens.filter(i=>i.transform[4]<x), itens.filter(i=>i.transform[4]>=x)])(Math.min(...dir.map(i=>i.transform[4]))-4)
          : [itens];
        cols.forEach(col=>agruparLinhas(col).forEach(l=>{
          if(/pr[óo]ximas faturas/i.test(l.txt)){ futuras=true; return; }
          if(futuras) return;
          let m; RE.lastIndex=0;
          while((m=RE.exec(l.txt))){
            const desc=m[3].trim().replace(/\s+R\$$/,"");
            if(desc.length<2||/^(total|subtotal|lan[çc]amentos)/i.test(desc)) continue;
            brutos.push({dd:m[1],mm:m[2],desc:desc,v:(m[4]?-1:1)*numBR(m[5])});
          }
        }));
      });
    }

    const lancamentos = [];
    let somaAberta = 0;
    brutos.forEach(b=>{
      const desc2 = b.desc;
      if(/^(PGTO|PAGTO|PAGAMENTO|PAG\s|SALDO FATURA|TOTAL)/i.test(desc2)) return;
      // ANTEC = parcelas antecipadas cobradas pelo banco — são cobranças reais
      const ehAntec = /^ANTEC\s+\d{2}\/\d{2}-/i.test(desc2);
      const desc3 = ehAntec
        ? desc2.replace(/^ANTEC\s+(\d{2}\/\d{2})-\s*/i,"").trim() + ` (antecipada ${desc2.match(/^ANTEC\s+(\d{2}\/\d{2})/i)[1]})`
        : desc2;
      const v = b.v;
      if(isNaN(v)||v===0) return;
      somaAberta += v;
      const valorApp = v > 0 ? -v : Math.abs(v);
      const mesCompra = parseInt(b.mm);
      const ano = mesCompra > mesFechamento ? anoFatura - 1 : anoFatura;
      const iso = `${ano}-${b.mm}-${b.dd}`;
      // a fatura imprime a data ORIGINAL da compra, mesmo na parcela 02/04, 03/04...
      lancamentos.push({data:ajustarParc(iso, desc3), hist:desc3, valor:valorApp, doc:cartao});
    });

    if(!lancamentos.length){
      avisar("Não encontrei lançamentos no PDF. Use o PDF original da fatura baixado do app ou site do banco.",true); return;
    }

    // resumo da fatura para mostrar na visão geral
    if(ehAberta){
      dados.faturaAberta = {cartao:cartao, total:Math.round(somaAberta*100)/100,
        pendente:Math.round(pendTotal*100)/100, nPendentes:pendentes,
        atualizadoEm:hoje.toISOString().slice(0,10),
        fechamento:(dados.faturaFechada&&dados.faturaFechada.proxFechamento)||""};
    } else if(mFecha){
      const mTot  = textoTotal.match(/Total desta fatura\s*:?\s*(?:R\$)?\s*([\d.]+,\d{2})/i)
                 || textoTotal.match(/\bTotal\s+R\$\s*([\d.]+,\d{2})/);
      const mVenc = textoTotal.match(/Vencimento[\s\S]{0,120}?(\d{2}\/\d{2}\/\d{4})/);
      const mProx = textoTotal.match(/Fechamento da pr[óo]xima fatura\s+(\d{2}\/\d{2}\/\d{4})/i);
      const fechadaEm = `${mFecha[3]}-${mFecha[2]}-${mFecha[1]}`;
      if(!dados.faturaFechada || (dados.faturaFechada.fechadaEm||"") <= fechadaEm)
        dados.faturaFechada = {cartao:cartao, fechadaEm:fechadaEm,
          total: mTot ? numBR(mTot[1]) : null,
          vencimento: mVenc ? dataBR(mVenc[1]) : "",
          proxFechamento: mProx ? dataBR(mProx[1]) : ""};
    }

    // Evitar duplicar: a mesma compra pode vir escrita um pouco diferente na fatura
    // em aberto e na fechada ("DUROKE CASA DE CARNE BELO" × "...BELO HORIZONT").
    // Compara data + valor + começo da descrição; compras iguais no mesmo dia contam
    // uma a uma (duas de R$ 29,90 no mesmo dia são duas compras).
    const norm = s => String(s).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"");
    const parecido = (a,b)=>{ a=norm(a); b=norm(b); const n=Math.min(8,a.length,b.length); return n>0 && a.slice(0,n)===b.slice(0,n); };
    const livres = new Map();
    dados.lancamentos.forEach(l=>{
      if(l.origem!=="cartao") return;
      const k = l.data+"|"+Number(l.valor).toFixed(2);
      if(!livres.has(k)) livres.set(k,[]);
      livres.get(k).push(l);
    });
    const idsUsados = new Set(dados.lancamentos.map(l=>l.id));
    let novos=0, repetidos=0, prontos=0;
    const mesesTocados = new Set();

    lancamentos.forEach(l=>{
      const k = l.data+"|"+l.valor.toFixed(2);
      const cand = livres.get(k)||[];
      const i = cand.findIndex(x=>parecido(x.hist,l.hist));
      if(i>=0){ cand.splice(i,1); repetidos++; return; }
      const base = l.data+"|cartao|"+l.valor.toFixed(2)+"|"+l.hist.slice(0,42);
      let id = base, n = 2;
      while(idsUsados.has(id)) id = base+"#"+(n++);
      // valor positivo vindo do cartão = estorno/crédito de compra
      let c = classificar(l.hist, l.valor);
      if(l.valor > 0 && c.categoria==="Sem categoria") c = {categoria:"Reembolso e estorno"};
      if(c.categoria!=="Sem categoria") prontos++;
      dados.lancamentos.push({id, data:l.data, hist:l.hist, valor:l.valor,
        doc:l.doc, categoria:c.categoria, vinculo:"PF", obs:"", origem:"cartao"});
      idsUsados.add(id); novos++;
      mesesTocados.add(l.data.slice(0,7));
    });

    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(mesesTocados.size){ ui.mes=[...mesesTocados].sort().pop(); ui.view="mes"; }
    salvar(); render();
    avisar(novos+" lançamento"+(novos===1?"":"s")+" do cartão importado"+(novos===1?"":"s")+
           (novos?" · "+prontos+" já classificado"+(prontos===1?"":"s"):"")+
           (repetidos?" · "+repetidos+" já existia"+(repetidos===1?"":"m"):"")+
           (ehAberta?" · fatura em aberto: R$ "+brl(somaAberta)+(pendTotal?" (+ R$ "+brl(pendTotal)+" em processamento)":""):""));
  }
  function barraFatura(){
    const a=dados.faturaAberta, f=dados.faturaFechada;
    if(!a && !(f&&f.total!=null)) return "";
    const dm = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7) : "";
    const hoje = new Date().toISOString().slice(0,10);
    const dias = iso => Math.round((new Date(iso+"T12:00:00")-new Date(hoje+"T12:00:00"))/864e5);
    const bt = '<button class="bf-bt" onclick="document.getElementById(\'arqPdf\').click()">Atualizar fatura (PDF)</button>';
    const ult = (f&&f.total!=null) ? '<span class="bf-ult">Última fechada: R$ '+brl(f.total)+
        (f.vencimento?(f.vencimento<hoje?' · venceu em ':' · vence em ')+dm(f.vencimento):'')+'</span>' : "";
    if(a && (!f || (f.fechadaEm||"") < a.atualizadoEm)){
      const cart = a.cartao!=="Cartão" ? a.cartao : (f&&f.cartao);
      const fecha = a.fechamento || (f&&f.proxFechamento>=a.atualizadoEm ? f.proxFechamento : "");
      let txtFecha = "";
      if(fecha){ const d=dias(fecha);
        txtFecha = d>1 ? 'Fecha em <b>'+dm(fecha)+'</b> · faltam '+d+' dias'
                 : d===1 ? 'Fecha <b>amanhã</b> ('+dm(fecha)+')'
                 : d===0 ? 'Fecha <b>hoje</b>'
                 : 'Fechou em '+dm(fecha)+' — importe a fatura fechada'; }
      return '<section class="barra-fatura">'+
        '<div><div class="bf-rot">Fatura do cartão em aberto'+(cart?' · '+esc(cart):'')+'</div>'+
          '<div class="bf-valor">R$ '+brl(a.total)+'</div>'+
          '<div class="bf-sub">compras até '+dm(a.atualizadoEm)+
            (a.pendente?' · + R$ '+brl(a.pendente)+' em processamento':'')+'</div></div>'+
        '<div class="bf-lado">'+(txtFecha?'<span class="bf-fecha">'+txtFecha+'</span>':'')+ult+bt+'</div>'+
      '</section>';
    }
    // sem fatura em aberto importada: mostra a última fechada
    return '<section class="barra-fatura">'+
      '<div><div class="bf-rot">Última fatura do cartão'+(f.cartao?' · '+esc(f.cartao):'')+'</div>'+
        '<div class="bf-valor">R$ '+brl(f.total)+'</div>'+
        '<div class="bf-sub">'+(f.vencimento?(f.vencimento<hoje?'venceu em ':'vence em ')+dm(f.vencimento):'')+'</div></div>'+
      '<div class="bf-lado"><span class="bf-ult">Importe a fatura atual para ver o valor em aberto</span>'+bt+'</div>'+
    '</section>';
  }
  // "cpf" = todos os lançamentos (visão de gasto real); itau/bb/cartao = conferência com o extrato/fatura
  const visaoNatureza = () => ui.conta==="cpf";
  const NOMES_ORIGEM = {itau:"Itaú", bb:"BB", cartao:"Cartão Itaú", manual:"Dinheiro / outro"};
  const TAG_ORIGEM = {itau:"ITAÚ", bb:"BB", manual:"OUTRO"};
  function lancDaConta(){
    if(ui.conta==="itau"||ui.conta==="bb"||ui.conta==="cartao") return dados.lancamentos.filter(l=>l.origem===ui.conta);
    return dados.lancamentos;
  }
  const nomeOrigem = l => NOMES_ORIGEM[l.origem]||"Outro";
  const mesesComDados = () => [...new Set(lancDaConta().map(l=>l.data.slice(0,7)))].sort();

  function doMes(){
    const base = lancDaConta();
    return ui.mes==="tudo" ? base.slice()
         : base.filter(l=>l.data.slice(0,7)===ui.mes);
  }
  function filtrados(){
    const b=ui.busca.trim().toLowerCase();
    const base=doMes().filter(l=>{
      if(b && !(l.hist.toLowerCase().includes(b)||(l.obs||"").toLowerCase().includes(b))) return false;
      if(ui.cat && l.categoria!==ui.cat) return false;
      if(ui.origem && l.origem!==ui.origem) return false;
      if(ui.tipo==="e" && l.valor<=0) return false;
      if(ui.tipo==="s" && l.valor>=0) return false;
      return true;
    });
    const col=ui.sortCol||"data", dir=ui.sortDir||1;
    return base.slice().sort((a,b)=>{
      let va=a[col]||"", vb=b[col]||"";
      if(col==="valor"){ va=a.valor; vb=b.valor; }
      if(va<vb) return -dir; if(va>vb) return dir; return 0;
    });
  }
  function saldoDiario(lista,inicial){
    const porDia={};
    lista.forEach(l=>{porDia[l.data]=(porDia[l.data]||0)+l.valor;});
    let s=inicial;
    return Object.keys(porDia).sort().map(d=>{s+=porDia[d];return {data:d,mov:porDia[d],saldo:s};});
  }

  /* ================= gráfico de saldo ================= */
  function grafico(serie,inicial){
    if(serie.length<2) return '<p class="sub">O gráfico aparece quando o mês tiver movimento em pelo menos dois dias.</p>';
    const pts=[{data:"",saldo:inicial}].concat(serie);
    const vals=pts.map(p=>p.saldo);
    const max=Math.max(...vals,0), min=Math.min(...vals,0);
    const L=44,R=12,T=14,B=26,W=460,H=190;
    const iw=W-L-R, ih=H-T-B;
    const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1));
    const y=v=>T+ih-((v-min)/((max-min)||1))*ih;
    const y0=y(0);
    const linha=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.saldo).toFixed(1)).join(" ");
    const area=linha+" L"+x(pts.length-1).toFixed(1)+" "+y0.toFixed(1)+" L"+x(0).toFixed(1)+" "+y0.toFixed(1)+" Z";
    const neg=pts.filter(p=>p.saldo<0).length;
    const marcas=pts.map((p,i)=>p.saldo<0?'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.saldo).toFixed(1)+
        '" r="2.6" fill="var(--tijolo)"/>':"").join("");
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Saldo dia a dia">'+
      '<clipPath id="abaixo"><rect x="0" y="'+y0.toFixed(1)+'" width="'+W+'" height="'+(H-y0).toFixed(1)+'"/></clipPath>'+
      '<clipPath id="acima"><rect x="0" y="0" width="'+W+'" height="'+y0.toFixed(1)+'"/></clipPath>'+
      '<path d="'+area+'" fill="var(--verde-suave)" opacity=".16" clip-path="url(#acima)"/>'+
      '<path d="'+area+'" fill="var(--tijolo)" opacity=".14" clip-path="url(#abaixo)"/>'+
      '<line x1="'+L+'" y1="'+y0.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y0.toFixed(1)+'" stroke="var(--linha)" stroke-width="1"/>'+
      '<path d="'+linha+'" fill="none" stroke="var(--verde)" stroke-width="1.6" stroke-linejoin="round"/>'+
      marcas+
      '<text x="4" y="'+(y(max)+4).toFixed(1)+'" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+brl(max).split(",")[0]+'</text>'+
      '<text x="4" y="'+(y(min)+4).toFixed(1)+'" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+brl(min).split(",")[0]+'</text>'+
      '<text x="'+L+'" y="'+(H-6)+'" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+
        (serie[0]?serie[0].data.slice(8)+"/"+serie[0].data.slice(5,7):"")+'</text>'+
      '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+
        (serie[serie.length-1]?serie[serie.length-1].data.slice(8)+"/"+serie[serie.length-1].data.slice(5,7):"")+'</text>'+
      '</svg>'+(neg?'<p class="sub">'+neg+' dia'+(neg===1?"":"s")+' com saldo negativo, marcado'+(neg===1?"":"s")+' em vermelho.</p>':"");
  }

  /* ================= exportação ================= */
  function baixar(nome,conteudo,tipo){
    const b=new Blob([conteudo],{type:tipo});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=nome;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  }
  function exportarCSV(){
    const lista=filtrados();
    if(!lista.length){ avisar("Não há lançamentos para exportar com esses filtros.",true); return; }
    const cel=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const linhas=[["Data","Descrição","Grupo","Categoria","Origem","Entrada","Saída","Valor","Situação","Observação","Documento"].map(cel).join(";")];
    lista.forEach(l=>linhas.push([
      cel(l.data.split("-").reverse().join("/")),cel(l.hist),cel(GRUPO_DE[l.categoria]||""),cel(l.categoria),
      cel(nomeOrigem(l)),
      cel(l.valor>0&&!l.ignorado?l.valor.toFixed(2).replace(".",","):""),
      cel(l.valor<0&&!l.ignorado?Math.abs(l.valor).toFixed(2).replace(".",","):""),
      cel(l.valor.toFixed(2).replace(".",",")),
      cel(l.ignorado?"Riscado":""),
      cel(l.obs||""),cel(l.doc||"")
    ].join(";")));
    const nome="financeiro-"+(ui.mes==="tudo"?"completo":ui.mes)+".csv";
    baixar(nome,"\uFEFF"+linhas.join("\r\n"),"text/csv;charset=utf-8");
    avisar("Planilha exportada com "+lista.length+" lançamentos.");
  }
  function exportarBackup(){
    baixar("financeiro-backup-"+new Date().toISOString().slice(0,10)+".json",
           JSON.stringify(dados,null,1),"application/json");
    avisar("Backup salvo. Guarde o arquivo fora do computador.");
  }
  function restaurarBackup(arq){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.lancamentos)) throw 0;
        const vistos=new Set(dados.lancamentos.map(l=>l.id));
        let n=0;
        d.lancamentos.forEach(l=>{ if(l&&l.id&&!vistos.has(l.id)){dados.lancamentos.push(l);vistos.add(l.id);n++;} });
        Object.assign(dados.saldos,d.saldos||{});
        if(Array.isArray(d.regras)&&d.regras.length) dados.regras=d.regras;
        dados.lancamentos.sort((a,b)=>a.data<b.data?-1:1);
        salvar(); render();
        avisar(n?n+" lançamento"+(n===1?"":"s")+" recuperado"+(n===1?"":"s")+".":"O backup não trouxe nada novo.");
      }catch(e){ avisar("Esse arquivo não é um backup do Financeiro.",true); }
    };
    fr.readAsText(arq);
  }

  /* ================= desenho da tela ================= */
  /* ================= navegação ================= */
  const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
  function marcarConta(){
    document.querySelectorAll("#contaTabs .conta-tab").forEach(b=>b.classList.toggle("ativa",b.dataset.conta===ui.conta));
  }
  function mesPadrao(meses){
    const ok=meses.filter(m=>m<=mesAtual()), l=ok.length?ok:meses;
    return l[l.length-1];
  }
  function renderPeriodo(meses,comVistas){
    ui._meses=meses;
    const idx=meses.indexOf(ui.mes);
    let h="";
    if(!comVistas||ui.view==="mes"){
      h+='<div class="periodo">'+
        '<button data-passo="-1" title="Mês anterior"'+((ui.mes==="tudo"||idx<=0)?" disabled":"")+'>‹</button>'+
        '<select id="selMes" aria-label="Período">'+
          '<option value="tudo"'+(ui.mes==="tudo"?" selected":"")+'>Todos os meses</option>'+
          meses.slice().reverse().map(m=>'<option value="'+m+'"'+(ui.mes===m?" selected":"")+'>'+
            cap(rotuloMes(m))+(m>mesAtual()?" (previsto)":"")+'</option>').join("")+
        '</select>'+
        '<button data-passo="1" title="Próximo mês"'+((ui.mes==="tudo"||idx<0||idx>=meses.length-1)?" disabled":"")+'>›</button>'+
      '</div>';
    } else {
      h+='<div class="periodo"><span class="sub" style="margin:0">'+
        (ui.view==="regras"?"As regras valem para todas as contas":"Todos os meses com lançamentos")+'</span></div>';
    }
    if(comVistas){
      const vs=[["mes","Resumo do mês"]];
      if(meses.length>1) vs.push(["comparar","Comparar meses"]);
      vs.push(["regras","Regras"]);
      h+='<div class="vistas" role="tablist">'+vs.map(([v,t])=>
        '<button role="tab" data-view="'+v+'" class="'+(ui.view===v?"on":"")+'" aria-selected="'+(ui.view===v)+'">'+t+'</button>').join("")+'</div>';
    }
    $("#abas").innerHTML=h;
  }

  /* ================= previsão do mês ================= */
  const brlS = v => (v>0?"+":"")+brl(v);
  // após editar um campo, redesenha e devolve o foco ao campo seguinte (Tab continua funcionando)
  function manterFoco(fn){
    setTimeout(()=>{
      const a=document.activeElement, k=a&&a.dataset?a.dataset.foco:null;
      fn();
      if(k){ const b=document.querySelector('[data-foco="'+k+'"]'); if(b){ b.focus(); try{ b.select(); }catch(_){} } }
    },0);
  }
  function totaisPrev(p){
    const soma=(a,f)=>(a||[]).reduce((s,x)=>s+(+f(x)||0),0);
    const aPagar=soma(p.itens,x=>x.aPagar), pago=soma(p.itens,x=>x.pago), receber=soma(p.receitas,x=>x.v);
    return {aPagar:aPagar, pago:pago, receber:receber, resultado:(+p.saldo||0)+aPagar+receber};
  }
  const mesesPrev = () => Object.keys(dados.previsoes||{}).sort();
  function proxMes(ym){ const [a,m]=ym.split("-").map(Number); return m===12?(a+1)+"-01":a+"-"+String(m+1).padStart(2,"0"); }

  function novoMesPrev(){
    const ms=mesesPrev(), ult=ms[ms.length-1], base=ult?dados.previsoes[ult]:null;
    const ym=ult?proxMes(ult):mesAtual();
    const [a,m]=ym.split("-").map(Number), dias=new Date(a,m,0).getDate();
    const mover=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")?ym+"-"+String(Math.min(+d.slice(8),dias)).padStart(2,"0"):"";
    // copia as linhas do último mês: o que foi pago vira previsto; nada marcado como pago
    const copia=l=>(l||[]).map(x=>({data:mover(x.data), d:x.d, aPagar:x.aPagar!=null?x.aPagar:(x.pago?-x.pago:null), pago:null}));
    dados.previsoes[ym]={aba:"criado no app", saldo:0, fixos:copia(base&&base.fixos), itens:copia(base&&base.itens),
      receitas:(base?base.receitas:[]).map(r=>({d:r.d, v:r.v})), notas:[]};
    ui.prevMes=ym; salvar(); render();
    avisar(cap(rotuloMes(ym))+" criado"+(ult?" a partir de "+rotuloMes(ult):"")+".");
  }

  function renderPrevisao(){
    const corpo=$("#corpo"), ms=mesesPrev();
    if(!ms.includes(ui.prevMes))
      ui.prevMes = ms.includes(mesAtual()) ? mesAtual() : (ms.filter(m=>m>=mesAtual())[0] || ms[ms.length-1] || null);
    $("#abas").innerHTML='<div class="prev-meses" role="tablist">'+
      ms.map(m=>'<button role="tab" data-pmes="'+m+'" class="'+(m===ui.prevMes?"on":"")+'" aria-selected="'+(m===ui.prevMes)+'">'+cap(rotuloMes(m))+'</button>').join("")+
      '<button data-pnovo="1" class="novo">+ Novo mês</button></div>'+
      (ui.prevMes?'<button class="bt vazado" data-papagar="1" style="font-size:12px;padding:6px 12px">Apagar '+esc(rotuloMes(ui.prevMes))+'</button>':'');
    if(!ui.prevMes){
      corpo.innerHTML='<div class="vazio"><p class="num">Nenhuma previsão ainda</p><p>Clique em <b>+ Novo mês</b> ou importe a planilha de orçamento (abas Setembro, Outubro…).</p></div>';
      return;
    }
    const p=dados.previsoes[ui.prevMes];
    const val=(v,sinal)=>v==null?"":(sinal?brlS(v):brl(v));
    const linha=(lista,x,i)=>{
      const at=k=>' data-pv="'+lista+'" data-i="'+i+'" data-k="'+k+'" data-foco="'+lista+':'+i+':'+k+'"';
      return '<tr>'+
        '<td><input type="date" class="campo"'+at("data")+' value="'+esc(x.data||"")+'" aria-label="Data"></td>'+
        '<td><input class="campo"'+at("d")+' value="'+esc(x.d||"")+'" placeholder="Detalhes" aria-label="Detalhes"></td>'+
        '<td class="valor"><input class="campo'+(x.aPagar>0?' pos':'')+'"'+at("aPagar")+' value="'+val(x.aPagar,true)+'" placeholder="—" inputmode="decimal" aria-label="A pagar"></td>'+
        '<td class="valor"><input class="campo"'+at("pago")+' value="'+val(x.pago)+'" placeholder="—" inputmode="decimal" aria-label="Pago"></td>'+
        '<td class="acao">'+(x.aPagar!=null&&x.aPagar<0?'<button class="pv-pagar" data-ppagar="'+lista+':'+i+'" title="Marcar como pago">✓</button>':'')+
          '<button class="apagar" data-pdel="'+lista+':'+i+'" title="Apagar linha" aria-label="Apagar linha">×</button></td></tr>';
    };
    const tabela=(lista,titulo,nota)=>
      '<div class="tit-secao" style="margin:0 0 6px"><h3>'+titulo+'</h3></div>'+(nota?'<p class="sub" style="margin:0 0 10px">'+nota+'</p>':'')+
      '<div class="rolagem"><table class="pv-tab pv-contas"><colgroup><col class="c-data"><col><col class="c-val"><col class="c-val"><col class="c-acao"></colgroup>'+
      '<thead><tr><th>Data</th><th>Detalhes</th><th class="n">A pagar</th><th class="n">Pago</th><th></th></tr></thead><tbody>'+
      p[lista].map((x,i)=>linha(lista,x,i)).join("")+'</tbody></table></div>'+
      '<button class="ver-mais" data-padd="'+lista+'">+ Adicionar linha</button>';
    const lista2=(lista,titulo,rot)=>
      '<div class="tit-secao" style="margin:26px 0 6px"><h3>'+titulo+'</h3></div>'+
      '<table class="pv-tab"><colgroup><col><col class="c-val"><col style="width:34px"></colgroup><tbody>'+
      p[lista].map((x,i)=>{ const at=k=>' data-pv="'+lista+'" data-i="'+i+'" data-k="'+k+'" data-foco="'+lista+':'+i+':'+k+'"';
        return '<tr><td><input class="campo"'+at("d")+' value="'+esc(x.d||"")+'" placeholder="'+rot+'"></td>'+
          '<td class="valor"><input class="campo'+(lista==="receitas"?' pos':'')+'"'+at("v")+' value="'+val(x.v)+'" placeholder="—" inputmode="decimal"></td>'+
          '<td class="acao"><button class="apagar" data-pdel="'+lista+':'+i+'" aria-label="Apagar">×</button></td></tr>'; }).join("")+
      '</tbody></table><button class="ver-mais" data-padd="'+lista+'">+ Adicionar</button>';
    const t=totaisPrev(p);
    corpo.innerHTML=
      '<p class="nota-linha">'+esc(p.aba==="criado no app"?"Mês criado no app.":"Veio da aba "+p.aba+" da planilha.")+
        ' Tudo aqui é editável e fica salvo. <b>A pagar</b>: digite o valor normal (vira saída); para entrada use +. '+
        'O ✓ move o valor para <b>Pago</b>. Importar a planilha de novo substitui os meses que estiverem nela.</p>'+
      '<div class="pv-grid"><div>'+
        tabela("itens","Contas a pagar")+
        '<div style="height:30px"></div>'+
        tabela("fixos","Separado no início do mês","Transferências fixas — não entram no “a pagar” (como as linhas 3 a 9 da planilha).")+
      '</div><aside class="pv-lado">'+
        '<div class="pv-resumo">'+
          '<label class="pv-l">Saldo em conta<input class="campo" data-pv="saldo" data-foco="saldo" value="'+(p.saldo?brl(p.saldo):"")+'" placeholder="0,00" inputmode="decimal"></label>'+
          '<div class="pv-l"><span>A pagar</span><b id="pvAPagar">'+brl(t.aPagar)+'</b></div>'+
          '<div class="pv-l"><span>A receber</span><b id="pvReceber" style="color:#1E8A5F">'+brl(t.receber)+'</b></div>'+
          '<div class="pv-tot"><span id="pvRot">'+(t.resultado<0?"Déficit":"Superávit")+'</span>'+
            '<b id="pvRes" style="color:'+(t.resultado<0?"#C0392B":"#1E8A5F")+'">R$ '+brl(t.resultado)+'</b></div>'+
          '<p class="sub" id="pvPago" style="margin-top:8px">Já pago no mês: R$ '+brl(t.pago)+'</p>'+
        '</div>'+
        lista2("receitas","Receitas esperadas","Descrição")+
        lista2("notas","Anotações","Descrição")+
      '</aside></div>';

    const atualizar=()=>{
      const t=totaisPrev(p);
      $("#pvAPagar").textContent=brl(t.aPagar); $("#pvReceber").textContent=brl(t.receber);
      $("#pvRot").textContent=t.resultado<0?"Déficit":"Superávit";
      $("#pvRes").textContent="R$ "+brl(t.resultado); $("#pvRes").style.color=t.resultado<0?"#C0392B":"#1E8A5F";
      $("#pvPago").textContent="Já pago no mês: R$ "+brl(t.pago);
    };
    corpo.onchange=e=>{
      const el=e.target.closest("[data-pv]"); if(!el) return;
      const lista=el.dataset.pv, k=el.dataset.k, txt=String(el.value||"").trim();
      const n=txt===""?null:numero(txt.replace("−","-"));
      if(lista==="saldo"){ p.saldo=n||0; el.value=p.saldo?brl(p.saldo):""; }
      else{
        const x=p[lista][+el.dataset.i];
        if(k==="d"||k==="data") x[k]=el.value;
        else if(k==="aPagar"){ x.aPagar = n==null?null : (/^\+/.test(txt)?Math.abs(n):-Math.abs(n)); }
        else if(k==="pago"){ x.pago = n==null?null:Math.abs(n); el.value=val(x.pago); }
        else if(k==="v"){ x.v=n; el.value=val(x.v); }
      }
      salvar(); atualizar();
      if(k==="aPagar") manterFoco(renderPrevisao);
    };
    corpo.onclick=e=>{
      const ad=e.target.closest("[data-padd]");
      if(ad){
        const l=ad.dataset.padd;
        p[l].push(l==="receitas"||l==="notas"?{d:"",v:null}:{data:ui.prevMes+"-01",d:"",aPagar:null,pago:null});
        salvar(); renderPrevisao();
        const f=document.querySelector('[data-foco="'+l+':'+(p[l].length-1)+':d"]'); if(f) f.focus();
        return;
      }
      const del=e.target.closest("[data-pdel]");
      if(del){ const [l,i]=del.dataset.pdel.split(":"); p[l].splice(+i,1); salvar(); renderPrevisao(); return; }
      const pg=e.target.closest("[data-ppagar]");
      if(pg){
        const [l,i]=pg.dataset.ppagar.split(":"), x=p[l][+i];
        x.pago=Math.round(((x.pago||0)+Math.abs(x.aPagar))*100)/100; x.aPagar=null;
        salvar(); renderPrevisao(); avisar(x.d+" marcado como pago."); return;
      }
    };
  }

  /* ================= fluxo anual (aba FLUXO ANUAL) ================= */
  function fluxoDoZero(){
    const ano=String(new Date().getFullYear()), meses=[];
    for(let m=1;m<=12;m++) meses.push(ano+"-"+String(m).padStart(2,"0"));
    const linhas=[];
    GRUPOS.forEach(gr=>{
      if(!gr.g||gr.g==="Fora dos cálculos") return;
      const lado=gr.g==="Receitas"?"rec":"desp";
      linhas.push({tipo:"g", rot:gr.g.toUpperCase(), lado:lado});
      gr.cats.forEach(c=>{
        const base=orcamentoDe(mesAtual())[c]||0, v={};
        if(base) meses.forEach(m=>{ v[m]=lado==="rec"?base:-Math.abs(base); });
        linhas.push({tipo:"i", rot:c, cat:c, lado:lado, v:v});
      });
    });
    dados.fluxo={ano:ano, meses:meses, linhas:linhas}; salvar(); render();
  }

  function renderFluxo(){
    const corpo=$("#corpo"), fx=dados.fluxo;
    $("#abas").innerHTML='<div class="periodo"><span class="sub" style="margin:0">Expectativa de receitas e gastos, mês a mês. '+
      'Clique num valor para mudar; o previsto da Visão geral acompanha.</span></div>';
    if(!fx){
      corpo.innerHTML='<div class="vazio"><p class="num">Sem fluxo anual ainda</p><p>Importe a planilha de orçamento (aba FLUXO ANUAL) '+
        'ou <button class="ver-mais" data-fxzero="1" style="padding:0">comece um fluxo a partir das categorias</button>.</p></div>';
      corpo.onclick=e=>{ if(e.target.closest("[data-fxzero]")) fluxoDoZero(); };
      return;
    }
    const ms=fx.meses, nC=ms.length+3;
    const soma=(o,m)=>+o[m]||0;
    const tot={rec:{}, desp:{}};
    let h='', grupo=null;
    const fecha=()=>{
      if(!grupo) return;
      h+='<tr class="fx-sub"><td>▸ Subtotal '+esc(grupo.rot.toLowerCase())+
        ' <button class="ver-mais" data-fxadd="'+grupo.ult+'" style="padding:0 0 0 8px">+ linha</button></td><td></td>'+
        ms.map(m=>'<td>'+brl(grupo.s[m]||0)+'</td>').join("")+'<td>'+brl(ms.reduce((s,m)=>s+(grupo.s[m]||0),0))+'</td></tr>';
    };
    fx.linhas.forEach((l,i)=>{
      if(l.tipo==="g"){ fecha(); grupo={rot:l.rot, lado:l.lado, s:{}, ult:i};
        h+='<tr class="fx-g"><td colspan="'+nC+'">'+(l.lado==="rec"?"📥 ":"📤 ")+esc(l.rot)+'</td></tr>'; return; }
      if(!grupo) grupo={rot:"", lado:l.lado||"desp", s:{}, ult:i};
      grupo.ult=i;
      ms.forEach(m=>{ const v=soma(l.v,m); grupo.s[m]=(grupo.s[m]||0)+v; tot[l.lado==="rec"?"rec":"desp"][m]=(tot[l.lado==="rec"?"rec":"desp"][m]||0)+v; });
      h+='<tr><td><div class="fx-rot"><input class="campo" data-fx="rot" data-i="'+i+'" value="'+esc(l.rot)+'" aria-label="Item">'+
          '<button class="apagar" data-fxdel="'+i+'" title="Apagar linha" aria-label="Apagar linha">×</button></div></td>'+
        '<td class="fx-cat"><select class="campo" data-fx="cat" data-i="'+i+'" title="Categoria usada no previsto × realizado">'+opcoesCat(l.cat||"","—")+'</select></td>'+
        ms.map(m=>'<td class="valor"><input class="campo" data-fx="v" data-i="'+i+'" data-m="'+m+'" data-foco="fx:'+i+':'+m+'" value="'+(l.v[m]?brl(l.v[m]):"")+
          '" placeholder="·" inputmode="decimal" aria-label="'+esc(l.rot)+' em '+abrevMes(m)+'"></td>').join("")+
        '<td class="fx-tt">'+brl(ms.reduce((s,m)=>s+soma(l.v,m),0))+'</td></tr>';
    });
    fecha();
    const linhaT=(rot,f,cls,totAno)=>'<tr class="'+(cls||"fx-t")+'"><td>'+rot+'</td><td></td>'+ms.map(m=>{ const v=f(m);
      return '<td style="color:'+(cls==="fx-r"?"var(--cinza)":v<-0.004?"#C0392B":"inherit")+'">'+(v==null?"—":brl(v))+'</td>'; }).join("")+
      '<td>'+(totAno!=null?brl(totAno):ms.every(m=>f(m)==null)?"":brl(ms.reduce((s,m)=>s+(f(m)||0),0)))+'</td></tr>';
    let ac=0; const acum={}; ms.forEach(m=>{ ac+=(tot.rec[m]||0)+(tot.desp[m]||0); acum[m]=ac; });
    const val=dados.lancamentos.filter(l=>!l.ignorado&&ehMov(l));
    const real={}; ms.forEach(m=>{ const ls=val.filter(l=>l.data.slice(0,7)===m); if(ls.length){ const x=entSai(ls); real[m]=x.tE-x.tS; } });
    h+=linhaT("Total de receitas",m=>tot.rec[m]||0)+linhaT("Total de despesas",m=>tot.desp[m]||0)+
       linhaT("Resultado do mês",m=>(tot.rec[m]||0)+(tot.desp[m]||0))+linhaT("Resultado acumulado",m=>acum[m],"fx-t",ac)+
       linhaT("Realizado (lançamentos)",m=>real[m]!=null?real[m]:null,"fx-r");
    corpo.innerHTML='<div class="rolagem" style="margin-top:22px"><table class="fx-tab"><thead><tr><th>Item</th><th style="text-align:left">Categoria</th>'+
      ms.map(m=>'<th>'+abrevMes(m)+'</th>').join("")+'<th>Total ano</th></tr></thead><tbody>'+h+'</tbody></table></div>'+
      '<p class="nota-linha">Despesas: digite o valor normal (vira saída). Para lançar um valor positivo numa despesa, use +. '+
      'Importar a planilha de novo substitui o fluxo anual.</p>';

    corpo.onchange=e=>{
      const el=e.target.closest("[data-fx]"); if(!el) return;
      const l=fx.linhas[+el.dataset.i], k=el.dataset.fx;
      if(k==="rot"){ l.rot=el.value.trim(); if(!l.cat) l.cat=catRotulo(l.rot)||""; }
      else if(k==="cat") l.cat=el.value;
      else{
        const t=String(el.value||"").trim();
        if(!t) delete l.v[el.dataset.m];
        else{ let n=numero(t.replace("−","-")); if(l.lado!=="rec" && !/^\+/.test(t)) n=-Math.abs(n); l.v[el.dataset.m]=Math.round(n*100)/100; }
      }
      salvar(); manterFoco(renderFluxo);
    };
    corpo.onclick=e=>{
      const ad=e.target.closest("[data-fxadd]");
      if(ad){
        const i=+ad.dataset.fxadd, ref=fx.linhas[i];
        fx.linhas.splice(i+1,0,{tipo:"i", rot:"", cat:"", lado:ref.lado||"desp", v:{}});
        salvar(); renderFluxo();
        const f=document.querySelector('[data-fx="rot"][data-i="'+(i+1)+'"]'); if(f) f.focus();
        return;
      }
      const del=e.target.closest("[data-fxdel]");
      if(del){
        const l=fx.linhas[+del.dataset.fxdel];
        confirmar("Apagar a linha?", esc(l.rot||"(sem nome)")+" sai do fluxo anual.", "Apagar").then(ok=>{
          if(!ok) return; fx.linhas.splice(+del.dataset.fxdel,1); salvar(); renderFluxo(); });
      }
    };
  }

  /* ================= dívidas e parcelas (mês a mês, editável) ================= */
  function dividasVazias(){
    return {parcelas:[], consorcio:[], consignados:[], quitacao:[{nome:"Financ. casa", v:0}], faturaAvulsos:{},
      consolida:{meses:[], linhas:[{nome:"Consignado",vals:{}},{nome:"Consórcio",vals:{}},{nome:"Cartão",vals:{}},{nome:"Financ. casa",vals:{}}]}};
  }
  const somaMes = (lista,m) => lista.reduce((s,x)=>s+(+x.vals[m]||0),0);
  // meses a mostrar: do mês atual até o último com valor (mínimo e máximo de colunas)
  function janelaMeses(ini, listaVals, min, max){
    let ult=ini;
    listaVals.forEach(v=>Object.keys(v||{}).forEach(m=>{ if(m>ult && v[m]) ult=m; }));
    const ms=[]; let m=ini;
    while((ms.length<min||m<=ult) && ms.length<max){ ms.push(m); m=proxMes(m); }
    return ms;
  }
  function novaParcelada(){
    if(!dados.dividas) dados.dividas=dividasVazias();
    const prox=proxMes(mesAtual());
    modal('<h3 class="modal-tit">Nova compra parcelada</h3><form onsubmit="return false">'+
      '<label>Descrição<input name="desc" required placeholder="Ex: Geladeira"></label>'+
      '<div class="modal-duo"><label>Cartão<input name="cartao" value="infinite"></label>'+
        '<label>Categoria<select name="cat">'+opcoesCat("","—")+'</select></label></div>'+
      '<div class="modal-duo"><label>Valor da parcela (R$)<input name="valor" required inputmode="decimal" placeholder="199,90"></label>'+
        '<label>Nº de parcelas<input name="n" type="number" min="1" max="72" value="10" required></label></div>'+
      '<label>Primeira parcela<input name="ini" type="month" value="'+prox+'" required></label>'+
      '<div class="modal-acoes"><button type="button" class="bt vazado" data-modal="cancelar">Cancelar</button>'+
        '<button type="button" class="bt" data-modal="ok">Adicionar</button></div></form>'
    ).then(f=>{
      if(!f) return;
      const v=Math.abs(numero(String(f.valor||"0"))), n=Math.max(1,Math.min(72,parseInt(f.n,10)||1));
      if(!v){ avisar("Valor inválido.",true); return; }
      const vals={}; let m=/^\d{4}-\d{2}$/.test(f.ini||"")?f.ini:prox;
      for(let k=0;k<n;k++){ vals[m]=v; m=proxMes(m); }
      dados.dividas.parcelas.push({cartao:(f.cartao||"").trim(), desc:(f.desc||"").trim(), cat:f.cat||"", vals:vals});
      salvar(); ui.conta="dividas"; render();
      avisar("Compra parcelada adicionada: "+n+"× R$ "+brl(v)+".");
    });
  }

  function renderDividas(){
    const corpo=$("#corpo");
    $("#abas").innerHTML='<div class="periodo"><span class="sub" style="margin:0">Mês a mês e editável — clique num valor para mudar; fica salvo.</span></div>'+
      '<button class="bt" data-dvnova="1" style="font-size:12px;padding:6px 12px">+ Compra parcelada</button>';
    if(!dados.dividas){
      corpo.innerHTML='<div class="vazio"><p class="num">Nada por aqui ainda</p><p>Importe a planilha de orçamento ou '+
        '<button class="ver-mais" data-dvzero="1" style="padding:0">comece do zero</button>.</p></div>';
      corpo.onclick=e=>{ if(e.target.closest("[data-dvzero]")){ dados.dividas=dividasVazias(); salvar(); renderDividas(); } };
      return;
    }
    const dv=dados.dividas, hoje=mesAtual();
    dv.faturaAvulsos=dv.faturaAvulsos||{}; dv.quitacao=dv.quitacao||[];
    if(!dv.consolida) dv.consolida=dividasVazias().consolida;
    const inp=(at,foco,v,cls)=>'<td class="valor'+(cls?" "+cls:"")+'"><input class="campo" '+at+' data-foco="'+foco+'" value="'+(v?brl(v):"")+
      '" placeholder="·" inputmode="decimal"></td>';
    const txt=(at,foco,v,ph,cls)=>'<input class="campo'+(cls?" "+cls:"")+'" '+at+' data-foco="'+foco+'" value="'+esc(v==null?"":v)+'" placeholder="'+(ph||"")+'">';
    const falta=vals=>Object.keys(vals).filter(m=>m>=hoje).reduce((s,m)=>s+(+vals[m]||0),0);
    const ultimo=vals=>{ const k=Object.keys(vals).filter(m=>vals[m]).sort(); return k[k.length-1]; };
    const ms12=[]; for(let m=hoje; ms12.length<12; m=proxMes(m)) ms12.push(m);

    // linhas do consolidado: Cartão e Consórcio somam as tabelas abaixo; as outras são digitadas
    const auto=l=>/cart/i.test(l.nome)&&dv.parcelas.length?"cartao":/cons[óo]rcio/i.test(l.nome)&&dv.consorcio.length?"consorcio":null;
    const noTotal=dv.parcelas.filter(p=>!p.foraTotal);
    const valLinha=(l,m)=>{ const a=auto(l); return a==="cartao"?somaMes(noTotal,m):a==="consorcio"?somaMes(dv.consorcio,m):(+l.vals[m]||0); };
    const totM=m=>dv.consolida.linhas.reduce((s,l)=>s+valLinha(l,m),0);

    const qCartao=noTotal.reduce((s,p)=>s+falta(p.vals),0);
    const qConsorcio=dv.consorcio.reduce((s,c)=>s+(+c.quitacao||0),0);
    const qConsig=dv.consignados.reduce((s,c)=>s+(+c.saldo||0),0);
    const outras=dv.quitacao.map((q,i)=>({q:q,i:i})).filter(x=>!/cart|cons[óo]rcio|consig/i.test(x.q.nome));
    const qOutras=outras.reduce((s,x)=>s+(+x.q.v||0),0);

    let h='<section class="dash-geral">'+
      '<div class="g-num"><span class="rot">Compromissos em '+rotuloMes(hoje)+'</span><div class="v">R$ '+brl(totM(hoje))+'</div>'+
        '<span class="kpi-sub">'+esc(dv.consolida.linhas.map(l=>cap(l.nome.trim().toLowerCase())).join(" + "))+'</span></div>'+
      '<div class="g-num"><span class="rot">Em '+rotuloMes(ms12[11])+'</span><div class="v">R$ '+brl(totM(ms12[11]))+'</div>'+
        '<span class="kpi-sub">'+(totM(ms12[11])<totM(hoje)?'R$ '+brl(totM(hoje)-totM(ms12[11]))+' a menos por mês':'')+'</span></div>'+
      '<div class="g-num"><span class="rot">Para quitar tudo hoje</span><div class="v" style="color:#C0392B">R$ '+brl(qCartao+qConsorcio+qConsig+qOutras)+'</div>'+
        '<span class="kpi-sub">Cartão '+brl(qCartao)+' · Consórcio '+brl(qConsorcio)+' · Consignados '+brl(qConsig)+
        outras.map(x=>' · '+esc(x.q.nome)+' '+brl(+x.q.v||0)).join("")+'</span></div>'+
    '</section>';

    // 1) saída mensal consolidada
    h+='<div class="tit-secao" style="margin-top:34px"><h3>Saída mensal com dívidas — próximos 12 meses</h3></div>'+
      '<div class="rolagem"><table class="fx-tab dv-tab"><thead><tr><th>Compromisso</th>'+ms12.map(m=>'<th>'+abrevMes(m)+'</th>').join("")+'</tr></thead><tbody>'+
      dv.consolida.linhas.map((l,i)=>{ const a=auto(l);
        return '<tr><td>'+esc(cap(l.nome.trim().toLowerCase()))+
          (a?' <span class="sub" style="display:inline">(soma '+(a==="cartao"?"dos parcelamentos":"do consórcio")+')</span>':'')+'</td>'+
          ms12.map(m=>a?'<td class="fx-calc">'+brl(valLinha(l,m))+'</td>':inp('data-dv="l" data-i="'+i+'" data-m="'+m+'"',"l:"+i+":"+m,l.vals[m])).join("")+'</tr>';
      }).join("")+
      '<tr class="fx-t"><td>Total</td>'+ms12.map(m=>'<td>'+brl(totM(m))+'</td>').join("")+'</tr></tbody></table></div>';

    // 2) parcelamentos no cartão
    const ativos=[], quitados=[];
    dv.parcelas.forEach((p,i)=>{ const k=Object.keys(p.vals); (k.length===0||k.some(m=>m>=hoje&&p.vals[m])?ativos:quitados).push(i); });
    const msP=janelaMeses(hoje, ativos.map(i=>dv.parcelas[i].vals).concat([dv.faturaAvulsos]), 12, 36);
    const totP=m=>ativos.reduce((s,i)=>s+(dv.parcelas[i].foraTotal?0:(+dv.parcelas[i].vals[m]||0)),0);
    h+='<div class="tit-secao" style="margin-top:40px"><h3>Parcelamentos no cartão — mês a mês</h3></div>'+
      '<div class="rolagem"><table class="fx-tab dv-tab"><thead><tr><th>Descrição</th><th style="text-align:left">Cartão</th><th style="text-align:left">Categoria</th>'+
      msP.map(m=>'<th>'+abrevMes(m)+'</th>').join("")+'<th>Falta pagar</th></tr></thead><tbody>'+
      ativos.map(i=>{ const p=dv.parcelas[i], at=k=>'data-dv="pc" data-i="'+i+'" data-k="'+k+'"';
        return '<tr'+(p.foraTotal?' class="fora-total"':'')+'><td><div class="fx-rot">'+
            '<input type="checkbox" data-dv="pt" data-i="'+i+'"'+(p.foraTotal?'':' checked')+' title="Conta no total" aria-label="Conta no total">'+
            txt(at("desc"),"pc:"+i+":desc",p.desc,"Descrição")+
            '<button class="apagar" data-dvdel="p:'+i+'" title="Apagar" aria-label="Apagar">×</button></div></td>'+
          '<td>'+txt(at("cartao"),"pc:"+i+":cartao",p.cartao,"cartão","dv-car")+'</td>'+
          '<td class="fx-cat"><select class="campo" '+at("cat")+'>'+opcoesCat(p.cat||"","—")+'</select></td>'+
          msP.map(m=>inp('data-dv="p" data-i="'+i+'" data-m="'+m+'"',"p:"+i+":"+m,p.vals[m])).join("")+
          '<td class="fx-tt">'+brl(falta(p.vals))+'</td></tr>';
      }).join("")+
      '<tr class="fx-sub"><td colspan="3">▸ Total parcelamento cartão</td>'+msP.map(m=>'<td>'+brl(totP(m))+'</td>').join("")+
        '<td>'+brl(qCartao)+'</td></tr>'+
      '<tr><td colspan="3" style="font-size:12.5px;color:var(--cinza)">▸ Fatura do cartão (avulsos/mês)</td>'+
        msP.map(m=>inp('data-dv="f" data-m="'+m+'"',"f:"+m,dv.faturaAvulsos[m])).join("")+'<td></td></tr>'+
      '<tr class="fx-t"><td colspan="3">▸▸ Total cartão (parcela + fatura)</td>'+
        msP.map(m=>'<td>'+brl(totP(m)+(+dv.faturaAvulsos[m]||0))+'</td>').join("")+'<td></td></tr>'+
      '</tbody></table></div>'+
      '<button class="ver-mais" data-dvnova="1">+ Compra parcelada</button>'+
      (quitados.length?'<details class="contas-pagas"><summary>'+quitados.length+' parcelamento'+(quitados.length>1?"s":"")+' já quitado'+(quitados.length>1?"s":"")+'</summary>'+
        '<div class="rolagem"><table class="matriz div-tab"><tbody>'+quitados.map(i=>{ const p=dv.parcelas[i], k=Object.keys(p.vals);
          return '<tr><td>'+esc(p.desc)+'</td><td class="fraco">'+esc(p.cartao||"")+'</td><td class="n">'+k.length+'× · R$ '+
            brl(k.reduce((s,m)=>s+(+p.vals[m]||0),0))+'</td><td class="n div-fim">última '+(ultimo(p.vals)?cap(abrevMes(ultimo(p.vals))):"—")+'</td>'+
            '<td class="acao"><button class="apagar" data-dvdel="p:'+i+'" aria-label="Apagar">×</button></td></tr>'; }).join("")+
        '</tbody></table></div></details>':'');

    // 3) consórcio
    h+='<div class="tit-secao" style="margin-top:40px"><h3>Consórcio — mês a mês</h3></div>'+
      '<div class="rolagem"><table class="fx-tab dv-tab"><thead><tr><th>Veículo</th><th style="text-align:left">Situação</th><th>Quitação</th>'+
      ms12.map(m=>'<th>'+abrevMes(m)+'</th>').join("")+'<th>Falta pagar</th><th>Última</th></tr></thead><tbody>'+
      dv.consorcio.map((c,i)=>{ const at=k=>'data-dv="cc" data-i="'+i+'" data-k="'+k+'"';
        return '<tr><td><div class="fx-rot">'+txt(at("nome"),"cc:"+i+":nome",c.nome,"Veículo")+
            '<button class="apagar" data-dvdel="c:'+i+'" aria-label="Apagar">×</button></div></td>'+
          '<td>'+txt(at("situacao"),"cc:"+i+":situacao",c.situacao,"situação","dv-car")+'</td>'+
          inp(at("quitacao"),"cc:"+i+":quitacao",c.quitacao)+
          ms12.map(m=>inp('data-dv="c" data-i="'+i+'" data-m="'+m+'"',"c:"+i+":"+m,c.vals[m])).join("")+
          '<td class="fx-tt">'+brl(falta(c.vals))+'</td><td class="fx-tt div-fim">'+(ultimo(c.vals)?cap(abrevMes(ultimo(c.vals))):"—")+'</td></tr>';
      }).join("")+
      '</tbody></table></div><button class="ver-mais" data-dvadd="c">+ Consórcio</button>';

    // 4) consignados
    const tg=k=>dv.consignados.reduce((s,c)=>s+(+c[k]||0),0);
    h+='<div class="tit-secao" style="margin-top:40px"><h3>Consignados</h3></div>'+
      '<div class="rolagem"><table class="fx-tab dv-tab" style="min-width:820px"><thead><tr><th>Contrato</th><th>Parcela</th><th>Parcela atual</th>'+
      '<th>Total de parcelas</th><th>Restam</th><th>Saldo devedor</th><th>Termina</th></tr></thead><tbody>'+
      dv.consignados.map((c,i)=>{ const at=k=>'data-dv="g" data-i="'+i+'" data-k="'+k+'"';
        const restam=c.total?Math.max(0,c.total-c.atual+1):(c.restantes||0);
        return '<tr><td><div class="fx-rot">'+txt(at("contrato"),"g:"+i+":contrato",c.contrato,"Contrato")+
            '<button class="apagar" data-dvdel="g:'+i+'" aria-label="Apagar">×</button></div></td>'+
          inp(at("pmt"),"g:"+i+":pmt",c.pmt)+
          '<td class="valor dv-num">'+txt(at("atual"),"g:"+i+":atual",c.atual||"","")+'</td>'+
          '<td class="valor dv-num">'+txt(at("total"),"g:"+i+":total",c.total||"","")+'</td>'+
          '<td class="fx-calc">'+restam+'</td>'+
          inp(at("saldo"),"g:"+i+":saldo",c.saldo)+
          '<td class="valor"><input type="month" class="campo" '+at("venc")+' data-foco="g:'+i+':venc" value="'+esc(c.venc||"")+'"></td></tr>';
      }).join("")+
      '<tr class="fx-t"><td>Total</td><td>'+brl(tg("pmt"))+'</td><td></td><td></td><td></td><td>'+brl(tg("saldo"))+'</td><td></td></tr>'+
      '</tbody></table></div><button class="ver-mais" data-dvadd="g">+ Consignado</button>';

    // 5) outros valores para quitar (ex.: financiamento da casa)
    h+='<div class="tit-secao" style="margin-top:40px"><h3>Outros valores para quitar</h3></div>'+
      '<table class="pv-tab" style="max-width:520px"><colgroup><col><col class="c-val"><col style="width:34px"></colgroup><tbody>'+
      outras.map(x=>{ const at=k=>'data-dv="q" data-i="'+x.i+'" data-k="'+k+'"';
        return '<tr><td>'+txt(at("nome"),"q:"+x.i+":nome",x.q.nome,"Dívida")+'</td>'+inp(at("v"),"q:"+x.i+":v",x.q.v)+
          '<td class="acao"><button class="apagar" data-dvdel="q:'+x.i+'" aria-label="Apagar">×</button></td></tr>'; }).join("")+
      '</tbody></table><button class="ver-mais" data-dvadd="q">+ Adicionar</button>';

    corpo.innerHTML=h+'<div class="rodape"><span>Importar a planilha de novo substitui estes valores pelos dela.</span><span>Família Bicalho</span></div>';

    corpo.onchange=e=>{
      const el=e.target.closest("[data-dv]"); if(!el) return;
      const t=el.dataset.dv, i=+el.dataset.i, k=el.dataset.k, m=el.dataset.m, tx=String(el.value||"").trim();
      const n=tx===""?null:numero(tx.replace("−","-"));
      const setV=(o,abs)=>{ if(n==null||n===0) delete o[m]; else o[m]=Math.round((abs?Math.abs(n):n)*100)/100; };
      if(t==="p") setV(dv.parcelas[i].vals,true);
      else if(t==="pc") dv.parcelas[i][k]=k==="cat"?el.value:tx;
      else if(t==="pt"){ if(el.checked) delete dv.parcelas[i].foraTotal; else dv.parcelas[i].foraTotal=true; }
      else if(t==="f") setV(dv.faturaAvulsos,false);
      else if(t==="c") setV(dv.consorcio[i].vals,true);
      else if(t==="cc") dv.consorcio[i][k]=k==="quitacao"?(n==null?null:Math.abs(n)):tx;
      else if(t==="l") setV(dv.consolida.linhas[i].vals,true);
      else if(t==="g") dv.consignados[i][k]=k==="contrato"?tx:k==="venc"?(el.value||null):(n==null?0:Math.abs(n));
      else if(t==="q") dv.quitacao[i][k]=k==="nome"?tx:(n==null?0:Math.abs(n));
      salvar(); manterFoco(renderDividas);
    };
    corpo.onclick=e=>{
      if(e.target.closest("[data-dvnova]")){ novaParcelada(); return; }
      const d=e.target.closest("[data-dvdel]");
      if(d){
        const [t,i]=d.dataset.dvdel.split(":"), arr={p:dv.parcelas,c:dv.consorcio,g:dv.consignados,q:dv.quitacao}[t], x=arr[+i];
        confirmar("Apagar?", esc(x.desc||x.nome||x.contrato||"Esta linha")+" sai da lista.", "Apagar").then(ok=>{
          if(!ok) return; arr.splice(+i,1); salvar(); renderDividas(); });
        return;
      }
      const a=e.target.closest("[data-dvadd]");
      if(a){
        const t=a.dataset.dvadd;
        if(t==="c") dv.consorcio.push({nome:"", situacao:"", parcelas:null, quitacao:null, vals:{}});
        if(t==="g") dv.consignados.push({contrato:"", pmt:0, atual:1, total:null, restantes:0, saldo:0, quitar:0, venc:null, pct:0});
        if(t==="q") dv.quitacao.push({nome:"", v:0});
        salvar(); renderDividas();
      }
    };
  }

  /* ================= desenho da tela ================= */
  function render(){
    const corpo=$("#corpo"); corpo.onclick=null; corpo.onkeydown=null; corpo.onchange=null;
    marcarConta();
    if(ui.conta==="dash"){ renderDashboard(); return; }
    if(ui.conta==="dividas"){ renderDividas(); return; }
    if(ui.conta==="prev"){ renderPrevisao(); return; }
    if(ui.conta==="fluxo"){ renderFluxo(); return; }
    if(!ui.view) ui.view="mes";

    const meses=mesesComDados();
    if(ui.view==="comparar"&&meses.length<2) ui.view="mes";
    if(!meses.length) ui.mes=null;
    else if(!ui.mes||(ui.mes!=="tudo"&&!meses.includes(ui.mes))) ui.mes=mesPadrao(meses);
    renderPeriodo(meses,true);

    if(ui.view==="regras"){ renderRegras(); return; }
    if(!meses.length){
      corpo.innerHTML='<div class="vazio"><p class="num">Comece pelo extrato</p>'+
        '<p>Clique em <b>Importar</b> e traga o extrato do Itaú ou do BB (OFX, CSV ou Excel), a fatura do cartão ou a planilha de orçamento. '+
        'Os lançamentos entram já classificados e ficam guardados para os próximos meses.</p></div>';
      return;
    }
    if(ui.view==="comparar"){ comparar(meses); return; }

    const natureza=visaoNatureza();
    const lista=doMes().filter(l=>!l.ignorado);
    // Lançamentos: gasto real — compras do cartão entram na data da compra;
    //   pagamento de fatura e aplicações ficam fora (senão conta duas vezes).
    // Conferir extrato: igual ao banco — sem as compras do cartão, com o débito da fatura.
    const base = natureza ? lista.filter(ehMov) : ui.conta==="cartao" ? lista : lista.filter(l=>l.origem!=="cartao");
    const semSaldo = natureza || ui.conta==="cartao";
    const soma = a => a.reduce((s,l)=>s+l.valor,0);
    const baseGasto = base;
    const ent=soma(base.filter(l=>l.valor>0));
    const sai=soma(baseGasto.filter(l=>l.valor<0));
    const res=ent+sai;
    const inicial = semSaldo?0:(dados.saldos[ui.conta+":"+(ui.mes==="tudo"?meses[0]:ui.mes)]||0);
    const serie = semSaldo?[]:saldoDiario(base,inicial);
    const fim = serie.length?serie[serie.length-1].saldo:inicial;
    const diasNeg = serie.filter(d=>d.saldo<0);
    const fundo = diasNeg.length?Math.min(...diasNeg.map(d=>d.saldo)):0;

    const porCat={}, nPorCat={};
    baseGasto.forEach(l=>{ porCat[l.categoria]=(porCat[l.categoria]||0)+l.valor; nPorCat[l.categoria]=(nPorCat[l.categoria]||0)+1; });
    const info=(c,v,ent)=>natureza?infoCat(nPorCat[c]||0, v, c==="Sem categoria"?0:previstoCat(c,ui.mes,meses), ent)
                                  :'<span>'+(nPorCat[c]||0)+' lançamento'+(nPorCat[c]===1?"":"s")+'</span>';
    const saidas=Object.entries(porCat).filter(e=>e[1]<0).sort((a,b)=>a[1]-b[1]);
    const entradas=Object.entries(porCat).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
    const maiorSaida=saidas.length?Math.abs(saidas[0][1]):1;
    const maiorEnt=entradas.length?entradas[0][1]:1;
    const LIM=6;
    const vSai=ui.verTodasSai?saidas:saidas.slice(0,LIM);
    const vEnt=ui.verTodasEnt?entradas:entradas.slice(0,LIM);

    const fatura=Math.abs(soma(lista.filter(l=>l.categoria===CAT_FATURA&&l.valor<0)));
    const aplic=soma(lista.filter(l=>l.categoria==="Aplicação e resgate"));
    const nCartao=lista.filter(l=>l.origem==="cartao").length;
    const semCat=base.filter(l=>l.categoria==="Sem categoria").length;

    // nota explicativa (uma linha)
    let nota;
    if(natureza){
      const partes=["Compras do cartão contam na data da compra."];
      if(fatura) partes.push("Pagamento de fatura (R$ "+brl(fatura)+") não é gasto: as compras já estão contadas.");
      if(aplic) partes.push("Aplicações e resgates (R$ "+brl(Math.abs(aplic))+") ficam fora.");
      const entre=Math.abs(soma(lista.filter(l=>l.categoria===CAT_ENTRE)));
      if(entre) partes.push("Transferências entre suas contas (R$ "+brl(entre)+") ficam fora.");
      nota=partes.join(" ");

    } else nota = ui.conta==="cartao"
      ? "Como na fatura: compras e créditos do cartão, na data da compra."
      : "Como no banco: a fatura do cartão aparece como um débito único e as compras do cartão não entram.";

    const avisos=[];
    if(natureza&&ui.mes!=="tudo"&&fatura&&!nCartao)
      avisos.push('<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro)"><div>'+
        '<b>Nenhuma compra do cartão neste mês.</b> Importe a fatura para os gastos do cartão aparecerem aqui.</div></div>');
    if(semCat)
      avisos.push('<div class="alerta clic" data-filtrar="Sem categoria" role="button" tabindex="0" style="background:#F7F5EE;border-left-color:var(--ouro)"><div><b>'+
        semCat+' lançamento'+(semCat===1?"":"s")+' sem categoria.</b> Clique para ver e classificar.</div></div>');
    if(diasNeg.length)
      avisos.push('<div class="alerta"><div><b>'+diasNeg.length+' dia'+(diasNeg.length===1?"":"s")+
        ' no cheque especial.</b> O saldo chegou a R$ '+brl(fundo)+'.</div></div>');

    const cartoes = natureza
      ? cartao("Entrou",ent,"pos",base.filter(l=>l.valor>0).length+" lançamentos","#1E8A5F")+
        cartao("Gastou",Math.abs(sai),"",baseGasto.filter(l=>l.valor<0).length+" lançamentos","#E08E0B")+
        cartao(res<0?"Faltou":"Sobrou",res,res<0?"neg":"pos","entrou − gastou",res<0?"#C0392B":"#1E8A5F")
      : cartao("Entradas",ent,"pos",base.filter(l=>l.valor>0).length+" lançamentos","#1E8A5F")+
        cartao("Saídas",Math.abs(sai),"",base.filter(l=>l.valor<0).length+" lançamentos","#E08E0B")+
        (ui.conta==="cartao"
          ? cartao("Total do cartão",res,res<0?"neg":"pos","compras − créditos",res<0?"#C0392B":"#1E8A5F")
          : cartao("Saldo final",fim,fim<0?"neg":"",ui.mes==="tudo"?"acumulado":"em "+rotuloMes(ui.mes),fim<0?"#C0392B":"#2E86DE"));

    const verMais=(chave,tot,aberto)=>tot>LIM?'<button class="ver-mais" data-vermais="'+chave+'">'+
      (aberto?"Mostrar menos":"Ver todas as "+tot+" categorias")+'</button>':"";

    corpo.innerHTML =
      '<section class="totais">'+cartoes+'</section>'+
      '<p class="nota-linha">'+nota+'</p>'+
      (avisos.length?'<div class="avisos">'+avisos.join("")+'</div>':"")+

      '<div class="paineis">'+
        '<div>'+
          '<div class="tit-secao"><h3>'+(natureza?"Onde gastei":"Para onde foi")+'</h3></div>'+
          (vSai.length?vSai.map(([c,v])=>catLinha(c,v,Math.abs(v)/maiorSaida,false,info(c,v,false))).join(""):'<p class="sub">Sem gastos neste período.</p>')+
          verMais("sai",saidas.length,ui.verTodasSai)+
        '</div>'+
        '<div>'+
          (semSaldo?"":'<div class="tit-secao"><h3>Saldo dia a dia</h3></div>'+grafico(serie,inicial)+'<div style="height:26px"></div>')+
          '<div class="tit-secao"><h3>De onde veio</h3></div>'+
          (vEnt.length?vEnt.map(([c,v])=>catLinha(c,v,v/maiorEnt,true,info(c,v,true))).join(""):'<p class="sub">Sem entradas neste período.</p>')+
          verMais("ent",entradas.length,ui.verTodasEnt)+
        '</div>'+
      '</div>'+

      '<div class="tit-secao" style="margin-top:36px"><h3>Lançamentos</h3></div>'+
      '<div class="filtros" style="margin-top:0">'+
        '<input type="search" id="fBusca" placeholder="Buscar estabelecimento ou observação" value="'+esc(ui.busca)+'">'+
        '<select id="fCat">'+opcoesCat(ui.cat,"Todas as categorias")+'</select>'+
        selectFiltro("fTipo",ui.tipo,"Entradas e saídas",[["e","Só entradas"],["s","Só saídas"]])+
        (natureza?selectFiltro("fOrig",ui.origem||"","Todas as origens",Object.keys(NOMES_ORIGEM).map(k=>[k,NOMES_ORIGEM[k]])):'')+
        '<span class="conta" id="conta"></span>'+
      '</div>'+
      '<div class="chips" id="chips"></div>'+
      '<div class="rolagem"><table id="tabelaLanc"><thead><tr>'+
      ['data','hist','categoria','valor'].map((col,i)=>{
        const labs=['Data','Descrição','Categoria','Valor'];
        const st=ui.sortCol===col?(ui.sortDir>0?' ↑':' ↓'):'';
        const align=col==='valor'?'text-align:right;':'';
        const w=ui._colW&&ui._colW[col]?'width:'+ui._colW[col]+'px;':'';
        return '<th style="'+w+'cursor:pointer;'+align+'position:relative" data-sort="'+col+'">'+
          labs[i]+st+
          '<span class="col-drag" data-col="'+col+'" title="Arraste para redimensionar"></span>'+
          '</th>';
      }).join('')+
      '<th class="obs">Observação</th><th></th></tr></thead>'+
      '<tbody id="corpoTabela"></tbody></table></div>'+

      '<div class="rodape"><span>'+dados.lancamentos.length+' lançamentos guardados · '+meses.length+' '+
        (meses.length===1?"mês":"meses")+' de histórico</span><span>Família Bicalho</span></div>';

    tabela(); ligar();
  }

  /* ================= comparação entre meses ================= */
  function comparar(meses){
    const cols = meses;
    const nomes = cols.map(abrevMes);
    const ultimo = cols[cols.length-1], penultimo = cols[cols.length-2];

    // matriz categoria × mês
    const mat={}, totMes={}, entMes={};
    cols.forEach(m=>{totMes[m]=0;entMes[m]=0;});
    const doComparar=lancDaConta().filter(ehMov);
    doComparar.forEach(l=>{
      if(l.ignorado) return;
      const m=l.data.slice(0,7); if(cols.indexOf(m)<0) return;
      if(l.valor<0){
        mat[l.categoria]=mat[l.categoria]||{};
        mat[l.categoria][m]=(mat[l.categoria][m]||0)+Math.abs(l.valor);
        totMes[m]+=Math.abs(l.valor);
      }else entMes[m]+=l.valor;
    });
    const linhas=Object.keys(mat).map(c=>{
      const v=cols.map(m=>mat[c][m]||0);
      const meds=v.filter(x=>x>0);
      return {cat:c,v:v,total:v.reduce((a,b)=>a+b,0),
              media:meds.length?meds.reduce((a,b)=>a+b,0)/meds.length:0};
    }).sort((a,b)=>b.total-a.total);

    const varia=(a,b)=>{ // b = anterior
      if(!b) return a?'<span class="var novo">novo</span>':'<span class="var zero">—</span>';
      if(!a) return '<span class="var zero">não veio</span>';
      const p=(a-b)/b*100;
      if(Math.abs(p)<3) return '<span class="var zero">estável</span>';
      return '<span class="var '+(p>0?"sobe":"cai")+'">'+(p>0?"+":"−")+Math.abs(p).toFixed(0)+"%</span>";
    };

    // gastos que se repetem
    const porLoja={};
    doComparar.forEach(l=>{
      if(l.valor>=0||l.ignorado) return;
      const m=l.data.slice(0,7); if(cols.indexOf(m)<0) return;
      const k=mercado(l.hist);
      porLoja[k]=porLoja[k]||{meses:{},cat:l.categoria,vinc:l.vinculo};
      porLoja[k].meses[m]=(porLoja[k].meses[m]||0)+Math.abs(l.valor);
    });
    const fixos=Object.entries(porLoja)
      .map(([k,o])=>{
        const ms=Object.keys(o.meses);
        const vals=ms.map(m=>o.meses[m]);
        return {loja:k,cat:o.cat,vinc:o.vinc,n:ms.length,
                media:vals.reduce((a,b)=>a+b,0)/vals.length,
                temUltimo:!!o.meses[ultimo],meses:o.meses};
      })
      .filter(f=>f.n>=Math.max(2,Math.ceil(cols.length*0.6)))
      .sort((a,b)=>b.media*b.n-a.media*a.n).slice(0,14);
    const sumidos=fixos.filter(f=>!f.temUltimo);

    const maxTot=Math.max(...cols.map(m=>Math.max(totMes[m],entMes[m])),1);

    $("#corpo").innerHTML =
      '<div class="tit-secao" style="margin-top:30px"><h3>Entradas e gastos mês a mês</h3></div>'+
      '<p class="nota-linha" style="margin:-6px 0 14px">Pagamento de fatura e aplicações ficam fora; as compras do cartão contam no mês da compra.</p>'+
      '<div class="colunas">'+cols.map((m,i)=>
        '<div class="coluna">'+
          '<div class="par">'+
            '<span class="pilha" style="height:'+(entMes[m]/maxTot*100).toFixed(1)+'%">'+
              '<i style="height:100%;background:#1E8A5F" title="Entradas"></i></span>'+
            '<span class="pilha" style="height:'+(totMes[m]/maxTot*100).toFixed(1)+'%">'+
              linhas.filter(l=>l.v[i]>0).map(l=>
                '<i style="height:'+(l.v[i]/(totMes[m]||1)*100).toFixed(2)+'%;background:'+cor(l.cat)+'"'+
                ' title="'+esc(l.cat)+': '+brl(l.v[i])+'"></i>').join("")+
            '</span>'+
          '</div>'+
          '<div class="col-res '+((entMes[m]-totMes[m])<0?"neg":"pos")+'">'+brl(entMes[m]-totMes[m])+'</div>'+
          '<div class="col-mes">'+nomes[i]+'</div>'+
        '</div>').join("")+'</div>'+
      '<div class="legenda">'+linhas.slice(0,9).map(l=>
        '<span>'+ponto(l.cat)+esc(l.cat)+'</span>').join("")+
        (linhas.length>9?'<span class="fraco">e mais '+(linhas.length-9)+'</span>':"")+'</div>'+

      '<div class="tit-secao" style="margin-top:38px"><h3>Gastos por categoria</h3></div>'+
      '<div class="rolagem"><table class="matriz"><thead><tr><th>Categoria</th>'+
        nomes.map(n=>'<th class="n">'+n+'</th>').join("")+
        '<th class="n">Média</th><th class="n">Variação</th></tr></thead><tbody>'+
      linhas.map(l=>'<tr><td>'+ponto(l.cat)+esc(l.cat)+'</td>'+
        l.v.map((x,i)=>'<td class="n'+(i===l.v.length-1&&x?" forte":"")+'">'+(x?brl(x):'<span class="zero">·</span>')+'</td>').join("")+
        '<td class="n media">'+(l.media?brl(l.media):"—")+'</td>'+
        '<td class="n">'+varia(l.v[l.v.length-1],l.v[l.v.length-2])+'</td></tr>').join("")+
      '<tr class="somatoria"><td>Total de gastos</td>'+
        cols.map(m=>'<td class="n">'+brl(totMes[m])+'</td>').join("")+
        '<td class="n media">'+brl(cols.reduce((a,m)=>a+totMes[m],0)/cols.length)+'</td>'+
        '<td class="n">'+varia(totMes[ultimo],totMes[penultimo])+'</td></tr>'+
      '</tbody></table></div>'+

      '<div class="tit-secao" style="margin-top:40px"><h3>Compromissos que se repetem</h3></div>'+
      '<p class="sub" style="margin:-8px 0 16px">Estabelecimentos presentes na maioria dos meses. São eles que formam o seu custo fixo.</p>'+
      (fixos.length?
        '<div class="rolagem"><table class="matriz"><thead><tr><th>Estabelecimento</th><th>Categoria</th>'+
        '<th class="n">Valor típico</th><th class="n">Meses</th><th class="n">'+abrevMes(ultimo)+'</th></tr></thead><tbody>'+
        fixos.map(f=>'<tr><td>'+esc(f.loja)+'</td>'+
          '<td class="fraco">'+ponto(f.cat)+esc(f.cat)+'</td>'+
          '<td class="n">'+brl(f.media)+'</td>'+
          '<td class="n fraco">'+f.n+' de '+cols.length+'</td>'+
          '<td class="n">'+(f.temUltimo?brl(f.meses[ultimo]):'<span class="var zero">não veio</span>')+'</td></tr>').join("")+
        '</tbody></table></div>'
        :'<p class="sub">Ainda não há meses suficientes para identificar recorrência. A partir do segundo extrato isto se preenche.</p>')+

      (sumidos.length?'<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro);margin-top:22px"><div><b>'+
        sumidos.length+' compromisso'+(sumidos.length===1?"":"s")+' não apareceu em '+rotuloMes(ultimo)+'.</b> '+
        esc(sumidos.slice(0,4).map(f=>f.loja).join(", "))+(sumidos.length>4?" e outros":"")+
        '. Confira se está apenas atrasado ou se saiu por outra conta.</div></div>':"")+

      '<div class="rodape"><span>'+cols.length+' meses comparados · '+
        (function(n){return n+" regra"+(n===1?" aprendida":"s aprendidas")+" com as suas correções";})
        (dados.regras.filter(r=>r.aprendida).length)+'</span>'+
        '<span>Família Bicalho</span></div>';
  }

  /* ================= aba de regras ================= */
  function renderRegras(){
    const semCatCount=lancDaConta().filter(l=>!l.ignorado&&l.categoria==="Sem categoria").length;
    $("#corpo").innerHTML=
      '<div style="display:flex;align-items:center;gap:16px;margin:26px 0 18px;flex-wrap:wrap">'+
      '<div class="tit-secao" style="margin:0"><h3>Regras de classificação automática</h3></div>'+
      '<span class="sub">Quando a descrição contém o termo, o lançamento entra nessa categoria ao ser importado.</span></div>'+

      (semCatCount?'<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro);margin-bottom:18px"><div>'+
        '<b>'+semCatCount+' lançamento'+(semCatCount>1?"s":"")+' sem categoria</b> nesta conta. '+
        'Crie uma regra abaixo para classificá-los automaticamente.</div></div>':"")+

      '<div style="padding:18px;background:var(--marfim);border-radius:3px;border:1px solid var(--linha-clara);margin-bottom:24px">'+
        '<div class="tit-secao" style="margin:0 0 14px"><h3>Nova regra</h3></div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
        '<input id="rTermo" placeholder="Termo na descrição, ex: VERDEMAR" maxlength="40" style="font-family:var(--sans);font-size:13px;border:1px solid var(--linha);padding:7px 10px;border-radius:2px;min-width:200px">'+
        '<select id="rCat" style="font-family:var(--sans);font-size:13px;border:1px solid var(--linha);padding:7px 10px;border-radius:2px">'+
          opcoesCat("Supermercado")+'</select>'+
        '<button class="bt" id="btRegra">Criar e aplicar</button>'+
        '<button class="bt vazado" id="btReclassificar">Reaplicar ao histórico</button>'+
        '</div></div>'+

      '<div id="listaRegras"></div>'+

      '<div class="rodape" style="margin-top:32px">'+
        '<span>'+dados.regras.length+' regras · '+dados.regras.filter(r=>r.aprendida).length+' aprendidas automaticamente</span>'+
        '<span>Família Bicalho</span></div>';

    regras();
    // listeners
    document.getElementById("btRegra").onclick=()=>{
      const t=document.getElementById("rTermo").value.trim();
      if(!t){ avisar("Escreva o termo que aparece na descrição.",true); return; }
      const cat=document.getElementById("rCat").value, vinc="PF";
      dados.regras.unshift({termo:t,categoria:cat,vinculo:vinc});
      let n=0;
      dados.lancamentos.forEach(l=>{
        if(l.hist.toUpperCase().includes(t.toUpperCase())){l.categoria=cat;l.vinculo=vinc;n++;}
      });
      document.getElementById("rTermo").value=""; salvar(); renderRegras();
      avisar("Regra criada"+(n?" · "+n+" lançamento"+(n>1?"s":"")+" reclassificado"+(n>1?"s":""):"")+".");
    };
    document.getElementById("btReclassificar").onclick=()=>{
      confirmar("Reaplicar regras ao histórico?",
        "Todos os lançamentos serão reclassificados pelas regras atuais.",
        "Reaplicar"
      ).then(ok=>{
        if(!ok) return;
        dados.lancamentos.forEach(l=>{const c=classificar(l.hist,l.valor);l.categoria=c.categoria;l.vinculo=c.vinculo;});
        salvar(); renderRegras(); avisar("Histórico reclassificado.");
      });
    };
    document.getElementById("listaRegras").addEventListener("click",e=>{
      const bt=e.target.closest("[data-apagar-regra]"); if(!bt) return;
      dados.regras.splice(+bt.dataset.apagarRegra,1); salvar(); renderRegras();
    });
  }

  function cartao(rot,val,cls,sub,c){
    return '<div class="tot" style="--c:'+c+'"><span class="rot">'+rot+'</span>'+
      '<div class="num" style="color:'+c+'"><small>R$</small>'+brl(val)+'</div>'+
      '<p class="sub">'+sub+'</p></div>';
  }
  function catLinha(c,v,frac,entrada,info){
    return '<div class="cat-linha" role="button" tabindex="0" title="Ver lançamentos de '+esc(c)+'" data-filtrar="'+esc(c)+'">'+
      '<span class="cat-nome">'+ponto(c)+esc(c)+'</span>'+
      '<span class="cat-val'+(entrada?" pos":"")+'">'+brl(Math.abs(v))+'</span>'+
      (info?'<span class="cat-info">'+info+'</span>':'')+
      '<span class="cat-barra"><i style="width:'+(Math.max(frac,.02)*100).toFixed(1)+'%;background:'+cor(c)+'"></i></span></div>';
  }
  function selectFiltro(id,valor,vazio,ops){
    const itens=ops.map(o=>{
      const [v,t]=Array.isArray(o)?o:[o,o];
      return '<option value="'+esc(v)+'"'+(valor===v?" selected":"")+'>'+esc(t)+'</option>';
    }).join("");
    return '<select id="'+id+'"><option value="">'+vazio+'</option>'+itens+'</select>';
  }

  function tabela(){
    const lista=filtrados().slice().reverse();
    const tb=$("#corpoTabela");
    const riscados=doMes().filter(l=>l.ignorado).length;
    $("#conta").textContent = lista.length+" de "+doMes().length+" lançamentos"+
      (riscados?" · "+riscados+" riscado"+(riscados===1?"":"s"):"");
    document.querySelectorAll("#tabelaLanc th[data-sort]").forEach(th=>{
      const lab={data:"Data",hist:"Descrição",categoria:"Categoria",vinculo:"Vínculo",valor:"Valor"}[th.dataset.sort];
      th.firstChild.textContent=lab+(ui.sortCol===th.dataset.sort?(ui.sortDir>0?" ↑":" ↓"):"");
    });
    const chips=[];
    if(ui.busca) chips.push(["busca","“"+ui.busca+"”"]);
    if(ui.cat) chips.push(["cat",ui.cat]);
    if(ui.tipo) chips.push(["tipo",ui.tipo==="e"?"Só entradas":"Só saídas"]);
    if(ui.origem) chips.push(["origem",NOMES_ORIGEM[ui.origem]||ui.origem]);
    const ch=$("#chips");
    if(ch) ch.innerHTML = chips.length ? '<span class="sub" style="margin:0">Filtrando:</span>'+
      chips.map(([k,t])=>'<span class="chip">'+esc(t)+'<button data-chip="'+k+'" aria-label="Remover filtro">×</button></span>').join("")+
      (chips.length>1?'<button class="chip-limpar" data-chip="*">Limpar filtros</button>':"") : "";
    if(!lista.length){
      tb.innerHTML='<tr><td colspan="6" class="vazio" style="padding:38px"><p>Nenhum lançamento com esses filtros.</p></td></tr>';
      return;
    }
    tb.innerHTML = lista.map(l=>
      '<tr data-id="'+esc(l.id)+'" style="--c:'+cor(l.categoria)+'"'+(l.ignorado?' class="riscado"':(!ehMov(l)&&visaoNatureza()?' class="fora" title="Não conta como gasto"':""))+'>'+
        '<td class="data">'+l.data.slice(8)+"/"+l.data.slice(5,7)+'</td>'+
        '<td><input class="campo desc-campo" data-c="hist" value="'+esc(l.hist)+'" title="'+esc(l.hist)+'"></td>'+
        '<td><select class="campo etiqueta" data-c="categoria" style="color:'+cor(l.categoria)+
            ';background:'+rgba(cor(l.categoria),.13)+';box-shadow:inset 0 0 0 1px '+rgba(cor(l.categoria),.3)+'">'+
          opcoesCat(l.categoria)+
        '</select></td>'+
        '<td class="valor '+(l.valor<0?"neg":"pos")+'"><input class="campo" data-c="valor" value="'+brl(l.valor)+'"></td>'+
        '<td class="obs"><input class="campo" data-c="obs" placeholder="—" value="'+esc(l.obs||"")+'"></td>'+
        '<td class="acao">'+(l.origem==="cartao"?'<span class="tag-cartao" title="'+esc(l.doc||"Cartão")+'">💳</span>'
          :'<span class="tag-conta '+esc(l.origem||"manual")+'" title="'+esc(nomeOrigem(l)+(l.doc?" · "+l.doc:""))+'">'+esc(TAG_ORIGEM[l.origem]||"OUTRO")+'</span>')+
          (l.ignorado
          ? '<button class="voltar" data-c="riscar" title="Trazer de volta aos cálculos">↺</button>'+
            '<button class="sumir" data-c="apagar" title="Apagar de vez">apagar</button>'
          : '<button class="riscar" data-c="riscar" title="Riscar: fica no histórico, fora dos cálculos">×</button>')+
        '</td>'+
      '</tr>').join("");
  }

  function regras(){
    $("#listaRegras").innerHTML = dados.regras.map((r,i)=>
      '<div class="regra" data-ri="'+i+'">'+
      '<input class="campo regra-termo" data-ri="'+i+'" value="'+esc(r.termo)+'" title="Clique para editar o termo">'+
      '<span class="seta">→</span>'+
      '<select class="campo etiqueta regra-cat" data-ri="'+i+'" style="color:'+cor(r.categoria)+';background:'+rgba(cor(r.categoria),.13)+';box-shadow:inset 0 0 0 1px '+rgba(cor(r.categoria),.3)+'">'+
        opcoesCat(r.categoria)+
      '</select>'+
      (r.aprendida?'<span class="sub" style="font-size:11px;margin:0 4px">auto</span>':'')+
      '<button class="apagar" data-apagar-regra="'+i+'" style="margin-left:auto" aria-label="Apagar regra">×</button>'+
      '</div>'
    ).join("");

    // edição inline: termo
    $("#listaRegras").querySelectorAll(".regra-termo").forEach(inp=>{
      inp.onchange=()=>{
        const i=+inp.dataset.ri;
        dados.regras[i].termo=inp.value.trim();
        salvar(); avisar("Regra atualizada.");
      };
    });
    // edição inline: categoria
    $("#listaRegras").querySelectorAll(".regra-cat").forEach(sel=>{
      sel.onchange=()=>{
        const i=+sel.dataset.ri;
        dados.regras[i].categoria=sel.value;
        // atualizar cor
        sel.style.color=cor(sel.value);
        sel.style.background=rgba(cor(sel.value),.13);
        sel.style.boxShadow="inset 0 0 0 1px "+rgba(cor(sel.value),.3);
        salvar(); avisar("Regra atualizada.");
      };
    });
  }

  /* ================= interações ================= */
  function acharLanc(id){ return dados.lancamentos.find(l=>l.id===id); }

  function ligar(){
    $("#fBusca").oninput=e=>{ui.busca=e.target.value;tabela();};

    document.getElementById("corpo").onclick=e=>{
      const vm=e.target.closest("[data-vermais]");
      if(vm){ const k=vm.dataset.vermais==="sai"?"verTodasSai":"verTodasEnt"; ui[k]=!ui[k]; render(); return; }
      const chip=e.target.closest("[data-chip]");
      if(chip){ const k=chip.dataset.chip;
        if(k==="*"){ ui.busca="";ui.cat="";ui.tipo="";ui.vinculo="";ui.origem="";ui.fat="";ui.errada=""; } else ui[k]="";
        render(); try{document.getElementById("tabelaLanc").scrollIntoView({block:"start"});}catch(_){ } return; }
      const th=e.target.closest("th[data-sort]"); if(!th||e.target.closest(".col-drag")) return;
      const col=th.dataset.sort;
      if(ui.sortCol===col) ui.sortDir*=-1; else{ui.sortCol=col;ui.sortDir=1;}
      tabela();
    };
    $("#fCat").onchange=e=>{ui.cat=e.target.value;tabela();};
    $("#fTipo").onchange=e=>{ui.tipo=e.target.value;tabela();};
    const fo=$("#fOrig"); if(fo) fo.onchange=e=>{ui.origem=e.target.value;tabela();};


    $("#corpoTabela").addEventListener("change",e=>{
      const tr=e.target.closest("tr"); if(!tr) return;
      const l=acharLanc(tr.dataset.id); if(!l) return;
      const c=e.target.dataset.c;
      if(c==="categoria"){
        l.categoria=e.target.value;
        // oferecer criar regra para o estabelecimento
        const termo=mercado(l.hist);
        const regraExiste=dados.regras.some(r=>r.termo.toUpperCase()===termo.toUpperCase());
        if(!regraExiste && termo.length>=4){
          // contar quantos outros lançamentos têm o mesmo estabelecimento
          const similares=dados.lancamentos.filter(x=>x.id!==l.id&&x.hist.toUpperCase().includes(termo.toUpperCase()));
          if(similares.length>0){
            // mostrar opções: só este, ou criar regra para todos
            modal(
              '<h3 class="modal-tit">Aplicar a todos?</h3>'+
              '<p class="modal-corpo"><b>'+esc(termo)+'</b> aparece em mais '+similares.length+
              ' lançamento'+(similares.length>1?"s":"")+'. Quer criar uma regra para que todos '+
              '(inclusive os futuros) entrem como <b>'+esc(l.categoria)+'</b>?</p>'+
              '<div class="modal-acoes">'+
              '<button class="bt vazado" data-modal="so-este">Só este</button>'+
              '<button class="bt" data-modal="criar-regra">Criar regra para todos</button>'+
              '</div>'
            ).then(v=>{
              if(v==="criar-regra"){
                const t=aprender(l);
                // reclassificar os similares
                let n=0;
                dados.lancamentos.forEach(x=>{
                  if(x.id!==l.id&&x.hist.toUpperCase().includes(termo.toUpperCase())){
                    x.categoria=l.categoria; x.vinculo=l.vinculo; n++;
                  }
                });
                salvar(); render();
                avisar("Regra criada · "+n+" lançamento"+(n>1?"s":"")+" reclassificado"+(n>1?"s":"")+".");
              } else {
                salvar(); render();
              }
            });
          } else {
            const t=aprender(l); salvar(); render();
            if(t) avisar("Anotado: "+t+" entra como "+l.categoria+" nos próximos extratos.");
          }
        } else {
          aprender(l); salvar(); render();
        }
      }
      else if(c==="hist"){ l.hist=e.target.value; salvar(); }
      else if(c==="obs"){ l.obs=e.target.value; salvar(); }
      else if(c==="valor"){
        const novo=numero(e.target.value.replace("−","-"));
        if(novo!==l.valor){ l.valor=novo; salvar(); render(); }
      }
    });
    $("#corpoTabela").addEventListener("click",e=>{
      const bt=e.target.closest("button"); if(!bt) return;
      const tr=e.target.closest("tr"); const l=acharLanc(tr.dataset.id); if(!l) return;
      if(bt.dataset.c==="riscar"){
        l.ignorado = !l.ignorado; salvar(); render();
        avisar(l.ignorado?"Lançamento riscado. Está fora dos cálculos, mas continua no histórico."
                         :"Lançamento de volta aos cálculos.");
      }
      if(bt.dataset.c==="apagar"){
        confirmar("Apagar de vez?",
          esc(l.hist)+"<br>R$ "+brl(l.valor)+
          "<br><br>Para recuperar depois, será preciso importar o extrato do mês novamente.",
          "Apagar"
        ).then(ok=>{
          if(!ok) return;
          dados.lancamentos=dados.lancamentos.filter(x=>x.id!==l.id); salvar(); render();
        });
      }
    });
  }

  // redimensionamento de colunas — fora de ligar() para não duplicar
  document.getElementById("lc").addEventListener("mousedown",e=>{
    const drag=e.target.closest(".col-drag"); if(!drag) return;
    e.preventDefault(); e.stopPropagation();
    const col=drag.dataset.col;
    const th=drag.closest("th");
    const startX=e.clientX, startW=th.offsetWidth;
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;cursor:col-resize;z-index:9999";
    document.body.appendChild(overlay);
    const onMove=ev=>{ th.style.width=Math.max(60,startW+(ev.clientX-startX))+"px"; };
    const onUp=ev=>{
      if(!ui._colW) ui._colW={};
      ui._colW[col]=Math.max(60,startW+(ev.clientX-startX));
      overlay.remove();
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
    };
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });

  // listener de clique nas barras de categoria — fica no elemento raiz (não é recriado pelo render)
  $("#lc").addEventListener("click",e=>{
    const linha=e.target.closest("[data-filtrar]"); if(!linha) return;
    const cat=linha.dataset.filtrar;
    ui.cat = ui.cat===cat ? "" : cat;
    ui.busca=""; ui.tipo=""; ui.vinculo=""; ui.fat=""; ui.errada="";
    render();
    try{const tb=document.getElementById("corpoTabela");
      if(tb) tb.closest("table").scrollIntoView({behavior:"smooth",block:"start"});}catch(e){}
  });
  $("#lc").addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){
      const linha=e.target.closest("[data-filtrar]"); if(!linha) return;
      linha.click(); e.preventDefault();
    }
  });
  // seletor de conta
  document.getElementById("contaTabs").addEventListener("click",e=>{
    const bt=e.target.closest(".conta-tab"); if(!bt) return;
    if(ui.conta==="dash"||bt.dataset.conta==="dash") ui.mes=null; // dashboard abre em "todos os meses"; contas abrem no mês atual
    ui.conta=bt.dataset.conta; ui.view="mes";
    ui.busca=""; ui.cat=""; ui.tipo=""; ui.vinculo=""; ui.origem=""; ui.fat=""; ui.errada="";
    render();
  });

  // barra de período e vistas
  $("#abas").addEventListener("click",e=>{
    const pm=e.target.closest("[data-pmes]");
    if(pm){ ui.prevMes=pm.dataset.pmes; render(); return; }
    if(e.target.closest("[data-pnovo]")){ novoMesPrev(); return; }
    if(e.target.closest("[data-dvnova]")){ novaParcelada(); return; }
    if(e.target.closest("[data-papagar]")){
      const ym=ui.prevMes;
      confirmar("Apagar "+rotuloMes(ym)+"?","A previsão de "+rotuloMes(ym)+" sai do app. Os lançamentos do mês continuam.","Apagar").then(ok=>{
        if(!ok) return; delete dados.previsoes[ym]; ui.prevMes=null; salvar(); render(); avisar(cap(rotuloMes(ym))+" apagado.");
      });
