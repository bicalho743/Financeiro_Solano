  // "cpf" = todos os lançamentos (visão de gasto real); itau/bb/cartao = conferência com o extrato/fatura
  const visaoNatureza = () => ui.conta==="cpf";
  const NOMES_ORIGEM = {itau:"Itaú", bb:"BB", cartao:"Cartão Itaú", manual:"Dinheiro / outro"};
  const TAG_ORIGEM = {itau:"ITAÚ", bb:"BB", manual:"OUTRO"};
  function lancDaConta(){
    if(ui.conta==="itau"||ui.conta==="bb"||ui.conta==="cartao") return dados.lancamentos.filter(l=>l.origem===ui.conta);
    return dados.lancamentos;
  }
  const nomeOrigem = l => NOMES_ORIGEM[l.origem]||"Outro";
  const mesesComDados = () => [...new Set(lancDaConta().map(l=>l.data.slice(0,7)))].sort();

  function doMes(){
    const base = lancDaConta();
    return ui.mes==="tudo" ? base.slice()
         : base.filter(l=>l.data.slice(0,7)===ui.mes);
  }
  function filtrados(){
    const b=ui.busca.trim().toLowerCase();
    const base=doMes().filter(l=>{
      if(b && !(l.hist.toLowerCase().includes(b)||(l.obs||"").toLowerCase().includes(b))) return false;
      if(ui.cat && l.categoria!==ui.cat) return false;
      if(ui.origem && l.origem!==ui.origem) return false;
      if(ui.tipo==="e" && l.valor<=0) return false;
      if(ui.tipo==="s" && l.valor>=0) return false;
      if(ui.soMov && (l.ignorado || !ehMov(l))) return false;
      return true;
    });
    const col=ui.sortCol||"data", dir=ui.sortDir||1;
    return base.slice().sort((a,b)=>{
      let va=a[col]||"", vb=b[col]||"";
      if(col==="valor"){ va=a.valor; vb=b.valor; }
      if(va<vb) return -dir; if(va>vb) return dir; return 0;
    });
  }
  function saldoDiario(lista,inicial){
    const porDia={};
    lista.forEach(l=>{porDia[l.data]=(porDia[l.data]||0)+l.valor;});
    let s=inicial;
    return Object.keys(porDia).sort().map(d=>{s+=porDia[d];return {data:d,mov:porDia[d],saldo:s};});
  }

  /* ================= saldo inicial e conferência com o banco ================= */
  const cent = v => Math.round(v*100)/100;
  const hojeISO = () => new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const fimDoMes = ym => { const [a,m]=ym.split("-").map(Number); return ym+"-"+String(new Date(a,m,0).getDate()).padStart(2,"0"); };
  const diaMes = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
  const normH = h => String(h).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"");
  // veio do extrato do banco (e não digitado à mão / linha fixa da planilha)
  // confExtrato: o extrato importado trouxe este mesmo lançamento (mesma data e valor), mesmo com outra descrição
  const pareceExtrato = l => !!l.confExtrato || (l.tipo!=="FIXO" && pareceBanco(l.hist));
  /* Itaú: o que se gasta no sábado/domingo/feriado já sai do saldo na hora, mas o extrato data no próximo dia útil
     (compras de sáb 03/10 vêm com 05/10, antes de "lançamentos futuros"). Vieram do extrato (confExtrato), então já foram debitados:
     no saldo de hoje eles contam, mesmo com data de amanhã/depois. Agendamentos (sem confExtrato) não entram. */
  function jaDebitados(origem,D){
    const hj=hojeISO(); if(D<hj) return [];
    const lim=new Date(hj+"T12:00:00"); lim.setDate(lim.getDate()+4); const limISO=lim.toISOString().slice(0,10);
    return dados.lancamentos.filter(l=>l.origem===origem&&l.confExtrato&&!l.ignorado&&l.data>D&&l.data<=limISO);
  }
  function movConta(origem,de,ate){
    return cent(dados.lancamentos.reduce((s,l)=>l.origem===origem&&!l.ignorado&&l.data>=de&&l.data<ate?s+l.valor:s,0));
  }
  // saldo no 1º dia do mês: o informado (linha SALDO ANTERIOR do extrato ou digitado);
  // sem ele, o último mês informado + os lançamentos entre um e outro
  function saldoInicio(origem,ym){
    const k=origem+":"+ym;
    if(dados.saldos[k]!=null&&dados.saldos[k]!=="") return {v:+dados.saldos[k], fonte:"informado"};
    const ant=Object.keys(dados.saldos).filter(x=>x.startsWith(origem+":")&&x.slice(origem.length+1)<ym&&dados.saldos[x]!=null&&dados.saldos[x]!=="").sort().pop();
    if(ant){ const m=ant.slice(origem.length+1); return {v:cent(+dados.saldos[ant]+movConta(origem,m+"-01",ym+"-01")), fonte:"calculado", de:m}; }
    return {v:0, fonte:"nenhum"};
  }

  function blocoConferencia(origem,ym,base,ini){
    const cfs=dados.conferencia||{}, leg=cfs[origem];
    let conf=cfs[origem+":"+ym] || (leg&&leg.data&&leg.data.slice(0,7)===ym?leg:null);
    if(!conf){
      // sem conferência do mês: usa o saldo de fim de dia que o extrato deixou gravado (o mais recente do mês)
      const sd=(dados.saldosDia||{})[origem]||{};
      const alvo=ui.confData&&ui.confData.slice(0,7)===ym?ui.confData:null;
      const dia=alvo&&sd[alvo]!=null?alvo:Object.keys(sd).filter(d=>d.slice(0,7)===ym).sort().pop();
      if(dia) conf={data:dia, valor:sd[dia], fonte:"extrato"};
    }
    const temConf=conf&&conf.data&&conf.data.slice(0,7)===ym;
    const D=temConf?conf.data:(ui.confData&&ui.confData.slice(0,7)===ym)?ui.confData:(hojeISO()<fimDoMes(ym)?(hojeISO()>=ym+"-01"?hojeISO():fimDoMes(ym)):fimDoMes(ym));
    const jaDeb=jaDebitados(origem,D);
    const ate=base.filter(l=>l.data<=D).concat(jaDeb);
    const app=cent(ini.v+ate.reduce((s,l)=>s+l.valor,0));
    const real=temConf?+conf.valor:null;
    const dif=real==null?null:cent(real-app);
    const [a,m]=ym.split("-").map(Number), vesp=new Date(a,m-1,0), vespTxt=String(vesp.getDate()).padStart(2,"0")+"/"+String(vesp.getMonth()+1).padStart(2,"0");
    const fonteIni = ini.fonte==="informado"?"do extrato / digitado":ini.fonte==="calculado"?"calculado desde "+rotuloMes(ini.de):"não informado — começou do zero";
    const linhaL = l => '<div class="conf-lin" data-cbusca="'+esc(l.hist)+'" title="Ver na lista"><span>'+diaMes(l.data)+' · '+esc(l.hist)+
      (l.ignorado?' <i>(ignorado)</i>':'')+'</span><b>'+brl(l.valor)+'</b></div>';

    let pistas="";
    if(dif!=null && Math.abs(dif)>=0.01){
      const p=[];
      if(ini.fonte==="nenhum")
        p.push('<div class="conf-p"><b>Falta o saldo do início do mês.</b> Digite acima o saldo de '+vespTxt+
          ' (linha “SALDO ANTERIOR” do extrato). Sem ele o app parte de zero e nunca bate.</div>');
      // lançamentos que não vieram do extrato
      const manuais=ate.filter(l=>!pareceExtrato(l));
      // com o extrato do mês importado, o que foi digitado/veio da planilha e o extrato não confirmou não passou por esta conta
      // (são as estimativas — os fixos do dia 1º — que o extrato já trouxe com valor e data reais)
      // cada lançamento que veio do extrato (ou que o extrato confirmou) fica marcado; o resto, até o último dia
      // que o extrato cobriu, não passou por esta conta
      const conf=ate.filter(l=>l.confExtrato), ultConf=conf.reduce((m,l)=>l.data>m?l.data:m,"");
      const semPar=conf.length>=10?ate.filter(l=>!l.confExtrato&&l.data<=ultConf):[];
      ui._semPar=semPar.map(l=>l.id);
      if(semPar.length)
        p.push('<div class="conf-p"><button class="bt" data-criscar="1" style="font-size:12.5px;padding:7px 14px">Riscar os '+semPar.length+
          ' lançamento'+(semPar.length===1?"":"s")+' que não estão no extrato importado (R$ '+brl(cent(semPar.reduce((s,l)=>s+l.valor,0)))+')</button>'+
          '<span class="sub" style="display:block;margin-top:4px">Depois de importar o extrato do mês. Eles ficam no histórico; o ↺ na lista traz de volta.</span></div>');
      if(manuais.length)
        p.push('<details class="conf-p"><summary><b>'+manuais.length+' lançamento'+(manuais.length===1?"":"s")+' digitado'+(manuais.length===1?"":"s")+
          ' ou da planilha</b> (não vieram do extrato): R$ '+brl(cent(manuais.reduce((s,l)=>s+l.valor,0)))+
          '. Se algum não saiu desta conta, ainda não foi debitado ou foi debitado com outro nome, o saldo não bate.</summary>'+
          manuais.slice().sort((x,y)=>x.valor-y.valor).map(linhaL).join("")+'</details>');
      // possíveis duplicados: mesmo valor, até 10 dias, e descrição estendida ou um do extrato + um digitado
      const dups=[];
      for(let i=0;i<ate.length;i++) for(let j=i+1;j<ate.length;j++){
        const x=ate[i], y=ate[j];
        if(x.valor!==y.valor) continue;
        if(Math.abs(new Date(x.data)-new Date(y.data))>10*864e5) continue;
        const nx=normH(x.hist), ny=normH(y.hist);
        const estendida=nx!==ny&&(nx.startsWith(ny)||ny.startsWith(nx));
        if(estendida||pareceExtrato(x)!==pareceExtrato(y)) dups.push([x,y]);
      }
      if(dups.length)
        p.push('<details class="conf-p" open><summary><b>'+dups.length+' possíve'+(dups.length===1?"l":"is")+' duplicado'+(dups.length===1?"":"s")+
          '</b>: mesmo valor em até 10 dias (um veio do extrato e outro foi digitado, ou a descrição foi editada e o extrato entrou de novo).</summary>'+
          dups.map(([x,y])=>'<div class="conf-par">'+linhaL(x)+linhaL(y)+'</div>').join("")+'</details>');
      const ign=doMes().filter(l=>l.ignorado&&l.data<=D);
      if(ign.length)
        p.push('<details class="conf-p"><summary><b>'+ign.length+' lançamento'+(ign.length===1?"":"s")+' ignorado'+(ign.length===1?"":"s")+
          '</b> (R$ '+brl(cent(ign.reduce((s,l)=>s+l.valor,0)))+'): não entram na conta, mas passaram no banco.</summary>'+ign.map(linhaL).join("")+'</details>');
      // combinações que explicam a diferença exata
      const cand=[];
      manuais.forEach(l=>cand.push({l:l,ef:-l.valor,acao:"tirar"}));
      dups.forEach(([x,y])=>{ const z=pareceExtrato(x)?y:x; if(!cand.some(c=>c.l===z)) cand.push({l:z,ef:-z.valor,acao:"tirar"}); });
      ign.forEach(l=>cand.push({l:l,ef:l.valor,acao:"voltar"}));
      const achou=[], alvo=Math.round(dif*100), c2=cand.slice(0,80).map(c=>({...c,ec:Math.round(c.ef*100)}));
      for(let i=0;i<c2.length&&achou.length<3;i++){
        if(c2[i].ec===alvo){ achou.push([c2[i]]); continue; }
        for(let j=i+1;j<c2.length&&achou.length<3;j++){
          if(c2[i].ec+c2[j].ec===alvo){ achou.push([c2[i],c2[j]]); continue; }
          for(let k=j+1;k<c2.length&&achou.length<3;k++) if(c2[i].ec+c2[j].ec+c2[k].ec===alvo) achou.push([c2[i],c2[j],c2[k]]);
        }
      }
      if(achou.length)
        p.unshift('<div class="conf-p conf-achou"><b>Bate exatamente se:</b>'+achou.map(g=>'<div class="conf-comb">'+
          g.map(c=>(c.acao==="tirar"?"tirar ":"deixar de ignorar ")+'<span data-cbusca="'+esc(c.l.hist)+'">'+diaMes(c.l.data)+' '+esc(c.l.hist)+' ('+brl(c.l.valor)+')</span>').join(" + ")+
          '</div>').join("")+'</div>');
      const depois=base.filter(l=>l.data>D&&!jaDeb.includes(l));
      if(depois.length)
        p.push('<div class="conf-p sub" style="margin:0">'+depois.length+' lançamento'+(depois.length===1?"":"s")+' depois de '+diaMes(D)+
          ' (R$ '+brl(cent(depois.reduce((s,l)=>s+l.valor,0)))+') não entram nesta conferência.</div>');
      if(!p.length) p.push('<div class="conf-p">Não achei a causa automaticamente. Compare dia a dia o gráfico “Saldo dia a dia” com a coluna de saldo do extrato: o primeiro dia que diverge mostra onde está a diferença.</div>');
      if(ini.fonte!=="informado")
        p.push('<div class="conf-p sub" style="margin:0">Se já conferiu todos os lançamentos, dá para '+
          '<button class="ver-mais" data-cini="'+cent(ini.v+dif)+'" style="padding:0">usar R$ '+brl(cent(ini.v+dif))+' como saldo de '+vespTxt+'</button>.</div>');
      pistas='<div class="conf-pistas">'+p.join("")+'</div>';
    }
    const cor=dif==null?"var(--cinza)":Math.abs(dif)<0.01?"#1E8A5F":"#C0392B";
    return '<section class="conf" id="conf">'+
      '<div class="tit-secao" style="margin-bottom:10px"><h3>Conferir com o saldo do banco</h3></div>'+
      '<div class="conf-grid">'+
        '<label>Saldo em '+vespTxt+'<input data-conf="ini" value="'+(ini.fonte==="nenhum"?"":brl(ini.v))+'" placeholder="0,00" inputmode="decimal">'+
          '<span class="conf-f">'+fonteIni+'</span></label>'+
        '<label>Saldo no banco em<input type="date" data-conf="data" value="'+D+'" min="'+ym+'-01" max="'+fimDoMes(ym)+'">'+
          '<span class="conf-f">veja no app do banco</span></label>'+
        '<label>Valor<input data-conf="valor" value="'+(real==null?"":brl(real))+'" placeholder="digite o saldo" inputmode="decimal">'+
          '<span class="conf-f">'+(temConf&&conf.fonte==="extrato"?"lido do extrato importado":"digitado")+'</span></label>'+
        '<div><span class="rot">Pelo app até '+diaMes(D)+'</span><div class="conf-v">R$ '+brl(app)+'</div>'+
          (jaDeb.length?'<span class="conf-f">inclui '+jaDeb.length+' do fim de semana já debitado'+(jaDeb.length===1?"":"s")+' (R$ '+brl(cent(jaDeb.reduce((s,l)=>s+l.valor,0)))+'), com data de '+diaMes(jaDeb.map(l=>l.data).sort().pop())+' no extrato</span>':'')+
          '<span class="conf-f" style="color:'+cor+'">'+(dif==null?"digite o saldo do banco para comparar":Math.abs(dif)<0.01?"✓ bate com o banco":"diferença R$ "+brlS(dif))+'</span></div>'+
      '</div>'+pistas+'</section>';
  }
  function ligarConferencia(origem,ym){
    const el=$("#conf"); if(!el) return;
    el.addEventListener("change",e=>{
      const k=e.target.dataset.conf; if(!k) return;
      const txt=String(e.target.value||"").trim();
      dados.conferencia=dados.conferencia||{};
      const kc=origem+":"+ym, leg=dados.conferencia[origem];
      const c=dados.conferencia[kc]||(leg&&leg.data&&leg.data.slice(0,7)===ym?leg:null)||{data:e.target.closest(".conf").querySelector('[data-conf="data"]').value,valor:null};
      if(leg&&leg.data&&leg.data.slice(0,7)===ym) delete dados.conferencia[origem];
      if(k==="ini"){ if(txt==="") delete dados.saldos[origem+":"+ym]; else dados.saldos[origem+":"+ym]=numero(txt.replace("−","-")); }
      if(k==="data"){ if(!txt) return; c.data=txt; if(c.valor==null){ ui.confData=txt; render(); return; } dados.conferencia[kc]={...c,fonte:"digitado"}; }
      if(k==="valor"){ if(txt===""){ delete dados.conferencia[kc]; } else dados.conferencia[kc]={data:c.data,valor:numero(txt.replace("−","-")),fonte:"digitado"}; }
      salvar(); render();
    });
    el.addEventListener("click",e=>{
      const b=e.target.closest("[data-cbusca]");
      if(b){ ui.busca=b.dataset.cbusca; render(); try{document.getElementById("tabelaLanc").scrollIntoView({block:"start"});}catch(_){ } return; }
      if(e.target.closest("[data-criscar]")){
        const ls=(ui._semPar||[]).map(id=>dados.lancamentos.find(l=>l.id===id)).filter(Boolean);
        confirmar("Riscar "+ls.length+" lançamento"+(ls.length===1?"":"s")+"?",
          ls.map(l=>diaMes(l.data)+" · "+esc(l.hist)+" · R$ "+brl(l.valor)).join("<br>")+
          "<br><br>Saem do saldo e dos totais, mas continuam no histórico (dá para trazer de volta com ↺).","Riscar")
          .then(ok=>{ if(!ok) return; ls.forEach(l=>{ l.ignorado=true; }); salvar(); render(); avisar(ls.length+" lançamentos riscados."); });
        return;
      }
      const ci=e.target.closest("[data-cini]");
      if(ci){ dados.saldos[origem+":"+ym]=+ci.dataset.cini; salvar(); render(); avisar("Saldo inicial ajustado."); }
    });
  }

  /* ================= gráfico de saldo ================= */
  function grafico(serie,inicial,hoje){
    if(serie.length<2) return '<p class="sub">O gráfico aparece quando o mês tiver movimento em pelo menos dois dias.</p>';
    const pts=[{data:"",saldo:inicial}].concat(serie);
    const vals=pts.map(p=>p.saldo);
    const max=Math.max(...vals,0), min=Math.min(...vals,0);
    const L=44,R=12,T=14,B=26,W=460,H=190;
    const iw=W-L-R, ih=H-T-B;
    const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1));
    const y=v=>T+ih-((v-min)/((max-min)||1))*ih;
    const y0=y(0);
    const linha=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.saldo).toFixed(1)).join(" ");
    // depois de hoje é projeção: linha tracejada e marca de "hoje"
    let iHoje=-1; if(hoje) pts.forEach((p,i)=>{ if(i===0||p.data<=hoje) iHoje=i; });
    const proj = hoje&&iHoje<pts.length-1
      ? pts.slice(iHoje).map((p,k)=>(k?"L":"M")+x(iHoje+k).toFixed(1)+" "+y(p.saldo).toFixed(1)).join(" ") : "";
    const real = proj ? pts.slice(0,iHoje+1).map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.saldo).toFixed(1)).join(" ") : linha;
    const area=linha+" L"+x(pts.length-1).toFixed(1)+" "+y0.toFixed(1)+" L"+x(0).toFixed(1)+" "+y0.toFixed(1)+" Z";
    const neg=pts.filter(p=>p.saldo<0).length;
    const marcas=pts.map((p,i)=>p.saldo<0?'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.saldo).toFixed(1)+
        '" r="2.6" fill="var(--tijolo)"/>':"").join("");
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Saldo dia a dia">'+
      '<clipPath id="abaixo"><rect x="0" y="'+y0.toFixed(1)+'" width="'+W+'" height="'+(H-y0).toFixed(1)+'"/></clipPath>'+
      '<clipPath id="acima"><rect x="0" y="0" width="'+W+'" height="'+y0.toFixed(1)+'"/></clipPath>'+
      '<path d="'+area+'" fill="var(--verde-suave)" opacity=".16" clip-path="url(#acima)"/>'+
      '<path d="'+area+'" fill="var(--tijolo)" opacity=".14" clip-path="url(#abaixo)"/>'+
      '<line x1="'+L+'" y1="'+y0.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y0.toFixed(1)+'" stroke="var(--linha)" stroke-width="1"/>'+
      '<path d="'+real+'" fill="none" stroke="var(--verde)" stroke-width="1.6" stroke-linejoin="round"/>'+
      (proj?'<path d="'+proj+'" fill="none" stroke="var(--cinza)" stroke-width="1.4" stroke-dasharray="4 3" stroke-linejoin="round"/>'+
        '<line x1="'+x(iHoje).toFixed(1)+'" y1="'+T+'" x2="'+x(iHoje).toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--ouro)" stroke-width="1" stroke-dasharray="2 2"/>'+
        '<text x="'+x(iHoje).toFixed(1)+'" y="'+(T-3)+'" text-anchor="middle" font-size="9.5" fill="var(--ouro)" font-family="Inter,sans-serif">hoje</text>':'')+
      marcas+
      '<text x="4" y="'+(y(max)+4).toFixed(1)+'" font-size="9.5" fill="var(--cinza)" font-family="Inter,sans-serif">'+brl(max).split(",")[0]+'</text>'+
      '<text x="4" y="'+(y(min)+4).toFixed(1)+'" font-size="9.5" fill="var(--cinza)" font-family="Inter,sans-serif">'+brl(min).split(",")[0]+'</text>'+
      '<text x="'+L+'" y="'+(H-6)+'" font-size="9.5" fill="var(--cinza)" font-family="Inter,sans-serif">'+
        (serie[0]?serie[0].data.slice(8)+"/"+serie[0].data.slice(5,7):"")+'</text>'+
      '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="9.5" fill="var(--cinza)" font-family="Inter,sans-serif">'+
        (serie[serie.length-1]?serie[serie.length-1].data.slice(8)+"/"+serie[serie.length-1].data.slice(5,7):"")+'</text>'+
      '</svg>'+(proj?'<p class="sub">Linha cheia: o que já aconteceu. Tracejada: previsão com os agendamentos.</p>':'')+
      (neg?'<p class="sub">'+neg+' dia'+(neg===1?"":"s")+' com saldo negativo'+(proj?' (contando a previsão)':'')+', marcado'+(neg===1?"":"s")+' em vermelho.</p>':"");
  }

  /* ================= exportação ================= */
  function baixar(nome,conteudo,tipo){
    const b=new Blob([conteudo],{type:tipo});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=nome;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  }
  /* ---- exportação no formato da aba LANÇAMENTOS da planilha ----
     colunas (a partir da coluna B): DATA | HISTÓRICO | VALOR | BANCO | CATEGORIA | SUBCATEGORIA | FIXO/VARIÁVEL | MÊS */
  const MES_PL=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  const CAT_PARA_PL=(()=>{
    const m={};
    Object.entries(MAPA_PLANILHA).forEach(([k,c])=>{ const [g,sub]=k.split("|"); if(sub&&!m[c]) m[c]=[g,sub]; });
    Object.assign(m,{
      "Supermercado":["supermercado","supermercado"],"IPTU":["casa","IPTU"],"Água (Copasa)":["casa","Água"],
      "Transferências Tâmara":["diversos","tâmara"],
      "Salário":["receita","salário"],"13º salário":["receita","13º salário"],"Rendimentos":["receita","rendimentos"],
      "Restituição IR":["receita","restituição IR"],"Reembolso e estorno":["receita","reembolso"],"Outras receitas":["receita","outras"],
      "Aplicação e resgate":["investimento","aplicação/resgate"],"Transferência entre minhas contas":["transferência","entre contas"],
      "Cartão de crédito":["cartão","fatura"],"Sem categoria":["",""]
    });
    return m;
  })();
  const pareceBanco = h => /^(PIX|PAY|RSCSS|RSHOP|RSCCS|DEV PIX|REND|SISPAG|INT |DA |TED|DOC|COR |JUROS|DDA|SAQUE|FATURA|FINANC|CONTRB|TAR|ON |BOLETO|COMPRA|Pix -|Compra com)/i.test(h);
  function bancoPL(l){
    const d=celTexto(l.doc);
    if(l.origem==="itau") return "itaú";
    if(l.origem==="bb") return "BB";
    if(l.origem==="cartao") return /infinite|altus|bb/i.test(d)?d:"infinite";
    return d||"";
  }
  // FIXO/VARIÁVEL: o que veio da planilha guarda o valor; o resto: lançado à mão no dia 1º = FIXO, extrato = VARIÁVEL
  const tipoPL = l => l.tipo || (l.data.slice(8,10)==="01" && !pareceBanco(l.hist) ? "FIXO" : "VARIÁVEL");
  function linhasPlanilha(){
    return filtrados().filter(l=>!l.ignorado).slice().sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0).map(l=>{
      const [g,sub]=CAT_PARA_PL[l.categoria]||["",l.categoria.toLowerCase()];
      return {data:l.data, hist:l.hist, valor:l.valor, banco:bancoPL(l), cat:g, sub:sub, tipo:tipoPL(l), mes:MES_PL[+l.data.slice(5,7)-1]};
    });
  }
  async function copiarParaPlanilha(){
    const ls=linhasPlanilha();
    if(!ls.length){ avisar("Não há lançamentos para copiar com esses filtros.",true); return; }
    const limpa=t=>String(t).replace(/[\t\r\n]+/g," ");
    const tsv=ls.map(x=>[x.data.split("-").reverse().join("/"),limpa(x.hist),x.valor.toFixed(2).replace(".",","),
      x.banco,x.cat,x.sub,x.tipo,x.mes].join("\t")).join("\r\n");
    try{ await navigator.clipboard.writeText(tsv); avisar(ls.length+" lançamentos copiados. Na planilha, clique na coluna DATA (B) e cole."); }
    catch(e){ baixar("lancamentos-"+(ui.mes||"")+".txt",tsv,"text/plain;charset=utf-8"); avisar("Não consegui copiar; baixei um arquivo .txt para você abrir e colar.",true); }
  }
  function exportarPlanilha(){
    const ls=linhasPlanilha();
    if(!ls.length){ avisar("Não há lançamentos para exportar com esses filtros.",true); return; }
    const aoa=[["◀  VOLTAR AO ÍNDICE"],[],["","  LANÇAMENTOS  —  EXTRATO DETALHADO"]];
    ls.forEach(x=>{ const [a,m,d]=x.data.split("-").map(Number);

    ].join(";")));

  function restaurarBackup(arq){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.lancamentos)) throw 0;
        const vistos=new Set(dados.lancamentos.map(l=>l.id));
        let n=0;
        d.lancamentos.forEach(l=>{ if(l&&l.id&&!vistos.has(l.id)){dados.lancamentos.push(l);vistos.add(l.id);n++;} });
        Object.assign(dados.saldos,d.saldos||{});
        dados.conferencia=Object.assign(dados.conferencia||{},d.conferencia||{});
        dados.saldosDia=dados.saldosDia||{};
        Object.entries(d.saldosDia||{}).forEach(([o,m])=>{ dados.saldosDia[o]=Object.assign(dados.saldosDia[o]||{},m); });
        if(d.invest && !dados.invest) dados.invest=d.invest;
        if(Array.isArray(d.regras)&&d.regras.length) dados.regras=d.regras;
        dados.lancamentos.sort((a,b)=>a.data<b.data?-1:1);
        salvar(); render();
        avisar(n?n+" lançamento"+(n===1?"":"s")+" recuperado"+(n===1?"":"s")+".":"O backup não trouxe nada novo.");
      }catch(e){ avisar("Esse arquivo não é um backup do Financeiro.",true); }
    };
    fr.readAsText(arq);
  }

  /* ================= previsão do mês ================= */
  const brlS = v => (v>0?"+":"")+brl(v);
  // após editar um campo, redesenha e devolve o foco ao campo seguinte (Tab continua funcionando)
  function manterFoco(fn){
    setTimeout(()=>{
      const a=document.activeElement, k=a&&a.dataset?a.dataset.foco:null;
      fn();
      if(k){ const b=document.querySelector('[data-foco="'+k+'"]'); if(b){ b.focus(); try{ b.select(); }catch(_){} } }
    },0);
  }
  // receitas do mês segundo o Fluxo anual (linhas do lado "receitas"); null se o fluxo não cobre o mês
  function receitasFluxo(ym){
    const fx=dados.fluxo; if(!fx||!ym||!(fx.meses||[]).includes(ym)) return null;
    return fx.linhas.filter(l=>l.tipo==="i"&&l.lado==="rec"&&+(l.v||{})[ym]).map(l=>({d:l.rot||l.cat||"Receita", v:+l.v[ym]}));
  }
  const ymDaPrev = p => Object.keys(dados.previsoes||{}).find(k=>dados.previsoes[k]===p);
  // lista de receitas usada na previsão: a do Fluxo anual; sem ela, a digitada no mês
  const receitasPrev = (p,ym) => receitasFluxo(ym||ymDaPrev(p)) || p.receitas || [];
  // receita já recebida (marcada com ✓): sai da soma. As do Fluxo anual são marcadas pelo nome, guardado no mês.
  const recebida = (p,x,doFluxo) => doFluxo ? !!(p.recebidas||{})[x.d] : !!x.recebido;
  // saldo em conta segundo os lançamentos do Itaú: hoje (mês atual ou futuro) ou no fim do mês (mês passado)
  function saldoContaApp(ym){
    const hoje=hojeISO(), D = ym<hoje.slice(0,7) ? fimDoMes(ym) : hoje, ymD=D.slice(0,7);
    const ini=saldoInicio("itau",ymD);
    const dep=new Date(D+"T12:00:00"); dep.setDate(dep.getDate()+1);
    const extra=jaDebitados("itau",D).reduce((s,l)=>s+l.valor,0);
    return {v:cent(ini.v+movConta("itau",ymD+"-01",dep.toISOString().slice(0,10))+extra), data:D, fonte:ini.fonte};
  }
  // mês futuro: o saldo de partida é o déficit/superávit do mês anterior (se ele tem previsão)
  const mesAntPrev = ym => { const [a,m]=ym.split("-").map(Number); const k=m===1?(a-1)+"-12":a+"-"+String(m-1).padStart(2,"0");
    return ym>mesAtual() && dados.previsoes && dados.previsoes[k] ? k : null; };
  function saldoPrev(p,ym){
    ym=ym||ymDaPrev(p);
    if(p.saldoManual&&p.saldo!=null) return +p.saldo;
    const ant=ym&&mesAntPrev(ym);
    if(ant) return totaisPrev(dados.previsoes[ant],ant).resultado;
    return saldoContaApp(ym).v;
  }
  function totaisPrev(p,ym){
    ym=ym||ymDaPrev(p);
    const soma=(a,f)=>(a||[]).reduce((s,x)=>s+(+f(x)||0),0);
    const doFx=!!receitasFluxo(ym);
    const aPagar=soma(p.itens,x=>x.aPagar), pago=soma(p.itens,x=>x.pago);
    const receber=soma(receitasPrev(p,ym).filter(x=>!recebida(p,x,doFx)),x=>x.v);
    const outras=soma((p.notas||[]).filter(x=>!x.recebido),x=>x.v);
    const saldo=saldoPrev(p,ym);
    return {aPagar:aPagar, pago:pago, receber:receber, outras:outras, saldo:saldo, resultado:cent(saldo+receber+outras+aPagar)};
  }
  const mesesPrev = () => Object.keys(dados.previsoes||{}).sort();
  function proxMes(ym){ const [a,m]=ym.split("-").map(Number); return m===12?(a+1)+"-01":a+"-"+String(m+1).padStart(2,"0"); }

  // "Passar para o próximo mês": copia o mês aberto para o seguinte, mesmos dias de pagamento, só muda o mês
  function passarPrevProxMes(de){
    const base=dados.previsoes[de]; if(!base) return;
    const ym=proxMes(de);
    const fazer=()=>novoMesPrev(de,ym);
    if(dados.previsoes[ym])
      confirmar(cap(rotuloMes(ym))+" já existe",
        "Substituir a previsão de "+esc(rotuloMes(ym))+" por uma cópia de "+esc(rotuloMes(de))+"?<br><br>"+
        "As linhas de "+esc(rotuloMes(ym))+" que vieram de extrato importado são mantidas.","Substituir")
        .then(ok=>{ if(ok) fazer(); });
    else fazer();
  }

  function novoMesPrev(deYm,paraYm){
    const ms=mesesPrev(), ult=deYm||ms[ms.length-1], base=ult?dados.previsoes[ult]:null;
    const ym=paraYm||(ult?proxMes(ult):mesAtual());
    const velho=dados.previsoes[ym];
    const [a,m]=ym.split("-").map(Number), dias=new Date(a,m,0).getDate();
    const mover=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")?ym+"-"+String(Math.min(+d.slice(8),dias)).padStart(2,"0"):"";
    // copia as linhas do último mês: o que foi pago vira previsto; nada marcado como pago
    const copia=l=>(l||[]).map(x=>({data:mover(x.data), d:x.d, aPagar:x.aPagar!=null?x.aPagar:(x.pago?-x.pago:null), pago:null}));
    const novo={aba:"criado no app", saldo:0, fixos:copia(base&&base.fixos), itens:copia(base&&base.itens),
      receitas:(base?base.receitas:[]).map(r=>({d:r.d, v:r.v})), notas:[]};
    // agendamentos que o extrato já trouxe para o mês de destino continuam (ligam à linha de mesmo valor)
    if(velho) velho.itens.concat(velho.fixos).filter(x=>x.ext).forEach(x=>{
      const y=novo.itens.concat(novo.fixos).find(i=>!i.ext&&i.pago==null&&i.aPagar!=null&&Math.abs(Math.abs(i.aPagar)-Math.abs(x.aPagar||x.pago||0))<0.005);
      if(y){ y.data=x.data; y.ext=x.ext; y.origem=x.origem; if(x.pago!=null){ y.pago=x.pago; y.aPagar=null; } } else novo.itens.push(x);
    });
    ordenarPrev(novo);
    dados.previsoes[ym]=novo;
    ui.prevMes=ym; salvar(); render();
    avisar(cap(rotuloMes(ym))+" criado"+(ult?" a partir de "+rotuloMes(ult):"")+".");
  }

  function fluxoDoZero(){
    const ano=String(new Date().getFullYear()), meses=[];
    for(let m=1;m<=12;m++) meses.push(ano+"-"+String(m).padStart(2,"0"));
    const linhas=[];
    GRUPOS.forEach(gr=>{
      if(!gr.g||gr.g==="Fora dos cálculos") return;
      const lado=gr.g==="Receitas"?"rec":"desp";
      linhas.push({tipo:"g", rot:gr.g.toUpperCase(), lado:lado});
      gr.cats.forEach(c=>{
        const base=orcamentoDe(mesAtual())[c]||0, v={};
        if(base) meses.forEach(m=>{ v[m]=lado==="rec"?base:-Math.abs(base); });
        linhas.push({tipo:"i", rot:c, cat:c, lado:lado, v:v});
      });
    });
    dados.fluxo={ano:ano, meses:meses, linhas:linhas}; salvar(); render();
  }

  /* ================= dívidas e parcelas (mês a mês, editável) ================= */
  /* ================= financiamento imobiliário (demonstrativo do banco em PDF) =================
     Lê a tabela de evolução do saldo devedor (todas as parcelas: pagas, emitida e projetadas) e o cabeçalho do contrato.
     Atualiza: Dívidas (seção do financiamento, linha mensal e "para quitar"), Fluxo anual, previsto do mês,
     Previsão do mês (linha do financiamento) e a dívida no Patrimônio. Os dados ficam só na sua conta, não no código. */
  function importarFinanciamento(txt){
    const num=t=>parseFloat(String(t).replace(/\./g,"").replace(",","."));
    const pega=(re,f)=>{ const m=txt.match(re); return m?(f?f(m[1]):m[1]):null; };
    const parcelas={};
    txt.split("\n").forEach(ln=>{
      const m=ln.match(/^\s*(\d{1,3})\s+(\d{2})\/(\d{2})\/(\d{4})\s+(.*)$/); if(!m) return;
      const tk=m[5].split(/\s+/), ns=tk.filter(t=>/^-?[\d.]+,\d+$/.test(t)), sit=tk.find(t=>/^(Paga|Emitida|Projetada|Vencida|Atrasada)$/i.test(t))||"";
      if(ns.length<8) return;
      const ym=m[4]+"-"+m[3];
      parcelas[ym]={n:+m[1], venc:m[4]+"-"+m[3]+"-"+m[2], amort:num(ns[0]), juros:num(ns[1]), seguros:cent(num(ns[3])+num(ns[4])+num(ns[5])), taxa:num(ns[6]),
        total:num(ns[ns.length-2]), saldo:num(ns[ns.length-1]), sit:sit};
    });
    const ks=Object.keys(parcelas).sort();
    if(ks.length<12){ avisar("Não consegui ler a tabela de parcelas do demonstrativo.",true); return; }
    const op=txt.match(/Opera[çc][ãa]o:\s*Implanta[çc][ãa]o[^\n]*?Data:\s*(\d{2})\/(\d{2})\/(\d{4})[^\n]*?Valor da Opera[çc][ãa]o:\s*([\d.,]+)/i);
    const f={banco:/ita[uú]|Demonstrativo Descritivo de Cr[ée]dito/i.test(txt)?"Itaú":"Banco", contrato:pega(/N[úu]mero do contrato\s+(\d+)/i)||"",
      modalidade:pega(/Modalidade da Carteira\s+([A-ZÇÃÕÁÉÍÓÚ ]+?)\s*$/im)||"", sistema:pega(/Sistema de amortiza[çc][ãa]o\s+(\w+)/i)||"",
      taxaAno:pega(/Taxa de Juros \(anual\)\s+([\d.,]+)%/i,num), taxaEfet:pega(/Taxa efetiva \(anual\)\s+([\d.,]+)%/i,num),
      prazo:pega(/Prazo total opera[çc][ãa]o\s+(\d+)/i,Number), restantes:pega(/Prazo remanescente\s+(\d+)/i,Number),
      valorOrig:op?num(op[4]):null, dataOrig:op?op[3]+"-"+op[2]+"-"+op[1]:null,
      emitido:(t=>t?t.split(".").map(x=>x.padStart(2,"0")).reverse().join("-"):hojeISO())(pega(/Emitido em\s+(\d{1,2}\.\d{1,2}\.\d{4})/i)),
      parcelas:parcelas};
    aplicarFinanciamento(f);
    const sq=saldoQuitacao(f);
    salvar(); ui.conta="dividas"; render();
    avisar("Financiamento atualizado: "+ks.length+" parcelas · saldo devedor R$ "+brl(sq.v)+" · parcela de "+rotuloMes(mesAtual())+" R$ "+brl((parcelas[mesAtual()]||{}).total||0));
  }
  // saldo para quitar hoje: saldo depois da última paga, já corrigido (= saldo da parcela emitida + a amortização dela)
  function saldoQuitacao(f){
    const ks=Object.keys(f.parcelas).sort(), em=ks.find(k=>/emitida/i.test(f.parcelas[k].sit)), pg=ks.filter(k=>/paga/i.test(f.parcelas[k].sit)).pop();
    if(em){ const x=f.parcelas[em]; return {v:cent(x.saldo+x.amort), ref:"antes da parcela de "+diaMes(x.venc)}; }
    return pg?{v:f.parcelas[pg].saldo, ref:"após a parcela de "+diaMes(f.parcelas[pg].venc)}:{v:0,ref:""};
  }
  function aplicarFinanciamento(f){
    if(!dados.dividas) dados.dividas=dividasVazias();
    const dv=dados.dividas, P=f.parcelas, hj=mesAtual(), ehFin=t=>/financ|casa|imobili/i.test(String(t||""));
    dv.financ=f;
    // linha mensal do consolidado
    if(!dv.consolida) dv.consolida=dividasVazias().consolida;
    let l=dv.consolida.linhas.find(x=>ehFin(x.nome)); if(!l){ l={nome:"Financ. casa",vals:{}}; dv.consolida.linhas.push(l); }
    Object.keys(P).forEach(ym=>{ if(ym>=hj||l.vals[ym]!=null) l.vals[ym]=P[ym].total; });
    // para quitar hoje
    dv.quitacao=dv.quitacao||[]; let q=dv.quitacao.find(x=>ehFin(x.nome)); if(!q){ q={nome:"Financ. casa",v:0}; dv.quitacao.push(q); }
    q.v=saldoQuitacao(f).v;
    // Fluxo anual e previsto do mês (categoria Financiamento casa)
    if(dados.fluxo) (dados.fluxo.linhas||[]).filter(x=>x.cat==="Financiamento casa").forEach(x=>{ x.v=x.v||{};
      (dados.fluxo.meses||[]).forEach(ym=>{ if(P[ym]) x.v[ym]=-P[ym].total; }); });
    Object.keys(dados.orcamentoMes||{}).forEach(ym=>{ const o=dados.orcamentoMes[ym]; if(P[ym]&&o&&o["Financiamento casa"]!=null) o["Financiamento casa"]=P[ym].total; });
    // Previsão do mês: valor da parcela; mês futuro copiado como "pago" volta para "a pagar"
    Object.keys(dados.previsoes||{}).forEach(ym=>{ const p=dados.previsoes[ym]; if(!P[ym]) return;
      (p.itens||[]).concat(p.fixos||[]).filter(x=>/financ/i.test(x.d||"")).forEach(x=>{
        if(ym>hj&&!/paga/i.test(P[ym].sit)){ x.aPagar=-P[ym].total; x.pago=null; }
        else if(x.aPagar!=null) x.aPagar=-P[ym].total; else if(x.pago!=null) x.pago=P[ym].total;
      }); });
    // Patrimônio: dívida do financiamento (a com esse nome, ou a única dívida com valor próximo do saldo)
    const v=invOk(), sd=saldoQuitacao(f).v, divs=(v.manuais||[]).filter(x=>x.grupo==="divida");
    let d=divs.find(x=>ehFin(x.nome)) || (divs.length===1&&Math.abs(divs[0].valor-sd)/sd<0.1?divs[0]:null);
    if(!d){ d={nome:"",grupo:"divida",valor:0}; v.manuais.push(d); }
    d.nome="Financiamento casa ("+f.banco+")"; d.valor=sd; d.data=f.emitido||hojeISO();
  }

  function dividasVazias(){
    return {parcelas:[], consorcio:[], consignados:[], quitacao:[{nome:"Financ. casa", v:0}], faturaAvulsos:{},
      consolida:{meses:[], linhas:[{nome:"Consignado",vals:{}},{nome:"Consórcio",vals:{}},{nome:"Cartão",vals:{}},{nome:"Financ. casa",vals:{}}]}};
  }
  const somaMes = (lista,m) => lista.reduce((s,x)=>s+(+x.vals[m]||0),0);
  // meses a mostrar: do mês atual até o último com valor (mínimo e máximo de colunas)
  function janelaMeses(ini, listaVals, min, max){
    let ult=ini;
    listaVals.forEach(v=>Object.keys(v||{}).forEach(m=>{ if(m>ult && v[m]) ult=m; }));
    const ms=[]; let m=ini;
    while((ms.length<min||m<=ult) && ms.length<max){ ms.push(m); m=proxMes(m); }
    return ms;
  }
  function novaParcelada(){
    if(!dados.dividas) dados.dividas=dividasVazias();
    const prox=proxMes(mesAtual());
    modal('<h3 class="modal-tit">Nova compra parcelada</h3><form onsubmit="return false">'+
      '<label>Descrição<input name="desc" required placeholder="Ex: Geladeira"></label>'+
      '<div class="modal-duo"><label>Cartão<input name="cartao" value="infinite"></label>'+
        '<label>Categoria<select name="cat">'+opcoesCat("","—")+'</select></label></div>'+

      if(!v){ avisar("Valor inválido.",true); return; }

      salvar(); ui.conta="dividas"; render();

  }

      }).join("")+

      outras.map(x=>{ const at=k=>'data-dv="q" data-i="'+x.i+'" data-k="'+k+'"';

  /* ================= metas e caixinhas (gastos futuros desejados) ================= */
  const PRIO = {alta:"Alta", media:"Média", baixa:"Baixa"};
  const TIPOS_META = {necessario:"Necessário", desejo:"Desejo"};
  // meses de hoje até o prazo, contando o mês atual (setembro → novembro = 3)
  const mesesAte = ym => { const [a,m]=mesAtual().split("-").map(Number), [b,n]=ym.split("-").map(Number); return (b-a)*12+(n-m)+1; };
  const faltaMeta = x => Math.max(0, cent((+x.custo||0)-(+x.guardado||0)));
  // quanto guardar por mês para chegar no prazo; null sem prazo
  const porMesMeta = x => { if(!x.prazo) return null; const f=faltaMeta(x); if(!f) return 0; const n=mesesAte(x.prazo); return cent(n>=1?f/n:f); };
  // sobra prevista no Fluxo anual (receitas − despesas) de um mês; null se o fluxo não cobre o mês
  function sobraFluxo(ym){
    const fx=dados.fluxo; if(!fx||!(fx.meses||[]).includes(ym)) return null;
    return cent(fx.linhas.filter(l=>l.tipo==="i"&&!CATS_FORA.has(l.cat)).reduce((s,l)=>s+(+(l.v||{})[ym]||0),0));
  }
  function novaMeta(){
    dados.metas=dados.metas||[];
    dados.metas.push({id:"m"+Date.now(), nome:"", tipo:"necessario", prio:"media", custo:null, guardado:0, prazo:"", obs:"",
                      criado:hojeISO(), feito:null, aportes:[]});
    salvar(); renderMetas();
    const f=document.querySelector('[data-foco="mt:'+(dados.metas.length-1)+':nome"]'); if(f) f.focus();
  }

    const corpo=$("#corpo"); dados.metas=dados.metas||[];

    const todas=dados.metas.map((x,i)=>({x:x,i:i}));

    const S=(arr,f)=>cent(arr.reduce((s,o)=>s+(+f(o.x)||0),0));
    const totFalta=S(ativas,faltaMeta), totGuard=S(ativas,x=>x.guardado), totCusto=S(ativas,x=>x.custo);
    const comPrazo=ativas.filter(o=>o.x.prazo&&faltaMeta(o.x)>0), semPrazo=ativas.filter(o=>!o.x.prazo&&faltaMeta(o.x)>0);
    const totMes=S(comPrazo,porMesMeta);

    const at=(i,k)=>' data-mt="'+i+'" data-k="'+k+'" data-foco="mt:'+i+':'+k+'"';
    const sel=(i,k,op,v)=>'<select class="campo"'+at(i,k)+'>'+Object.keys(op).map(c=>'<option value="'+c+'"'+(c===v?" selected":"")+'>'+op[c]+'</option>').join("")+'</select>';

    const linha=({x,i})=>{

        '<td class="acao"><button class="pv-pagar" data-mtfeito="'+i+'" title="Já gastei / realizado">✓</button>'+

    };

    // plano dos próximos 12 meses
    const ms=[]; for(let m=mesAtual(); ms.length<12; m=proxMes(m)) ms.push(m);
    // prazo vencido: o que falta entra todo no mês atual
    const noMes=(x,m)=>x.prazo>=m||(m===mesAtual()&&mesesAte(x.prazo)<1);

      '</tbody></table></div>'+
      (temFluxo?'<p class="sub">Se a sobra depois das caixinhas fica negativa, o plano não cabe no mês: estique o prazo ou baixe a prioridade de algum desejo.</p>':
        '<p class="sub">Monte o Fluxo anual para ver se o que guardar cabe na sobra de cada mês.</p>');

    const feitasHTML=feitas.length?'<div class="tit-secao" style="margin-top:38px"><h3>Realizadas</h3></div>'+

    corpo.innerHTML=
      '<section class="dash-geral">'+
        '<div class="g-num clic-card"'+ir({alvo:"#mt-lista",dica:"Ver as metas"})+'><span class="rot">Falta juntar</span><div class="v">R$ '+brl(totFalta)+'</div>'+
          '<span class="kpi-sub">'+ativas.length+' meta'+(ativas.length===1?"":"s")+' · custo total R$ '+brl(totCusto)+'</span></div>'+
        '<div class="g-num clic-card"'+ir({alvo:"#mt-lista",dica:"Ver as caixinhas"})+'><span class="rot">Já guardado nas caixinhas</span><div class="v" style="color:#1E8A5F">R$ '+brl(totGuard)+'</div>'+
          '<span class="kpi-sub">'+(totCusto?Math.round(totGuard/totCusto*100)+"% do total":"")+'</span></div>'+
        '<div class="g-num clic-card"'+ir({alvo:"#mt-plano",dica:"Ver o plano mês a mês"})+'><span class="rot">Guardar por mês</span><div class="v">R$ '+brl(totMes)+'</div>'+
          '<span class="kpi-sub">para cumprir os prazos'+(semPrazo.length?' · '+semPrazo.length+' sem prazo (R$ '+brl(S(semPrazo,faltaMeta))+')':'')+'</span></div>'+
      '</section>'+
      (atrasadas.length?'<div class="alerta"><div><b>'+atrasadas.length+' meta'+(atrasadas.length===1?"":"s")+' com prazo vencido</b> e dinheiro faltando: '+
        esc(atrasadas.map(o=>o.x.nome||"(sem nome)").join(", "))+'. Ajuste o prazo.</div></div>':'')+
      '<div class="tit-secao" id="mt-lista" style="margin-top:30px"><h3>Metas</h3></div>'+
      '<div class="rolagem"><table class="pv-tab mt-tab"><colgroup><col><col style="width:118px"><col style="width:92px"><col class="c-val"><col class="c-val">'+
        '<col class="c-val"><col class="c-val"><col style="width:140px"><col class="c-val"><col class="c-acao"></colgroup>'+
      '<thead><tr><th>Meta</th><th>Tipo</th><th>Prioridade</th><th class="n">Custo</th><th class="n">Guardado</th><th class="n">Guardar agora</th>'+
        '<th class="n">Falta</th><th>Prazo</th><th class="n">Por mês</th><th></th></tr></thead><tbody>'+
      ativas.map(linha).join("")+'</tbody></table></div>'+
      '<button class="ver-mais" data-mtnova="1">+ Nova meta</button>'+
      plano+feitasHTML;

    corpo.onchange=e=>{
      const el=e.target.closest("[data-mt]"); if(!el) return;
      const x=dados.metas[+el.dataset.mt], k=el.dataset.k, txt=String(el.value||"").trim();
      if(!x) return;
      if(k==="nome"||k==="obs"||k==="tipo"||k==="prio"||k==="prazo"){ x[k]=el.value; salvar(); if(k!=="nome"&&k!=="obs") manterFoco(renderMetas); return; }
      const n=txt===""?null:numero(txt.replace("−","-"));
      if(k==="custo"){ x.custo=n==null?null:Math.abs(n); }
      if(k==="guardado"){ x.guardado=n==null?0:n; }
      if(k==="aporte"){
        if(!n) return;
        x.guardado=cent((+x.guardado||0)+n); (x.aportes=x.aportes||[]).push({data:hojeISO(), v:n});
        avisar("R$ "+brl(Math.abs(n))+(n>0?" guardado na caixinha ":" retirado da caixinha ")+(x.nome||"")+".");
      }
      salvar(); manterFoco(renderMetas);
    };
    corpo.onclick=e=>{
      if(e.target.closest("[data-mtnova]")){ novaMeta(); return; }
      const d=e.target.closest("[data-mtdel]");
      if(d){ const x=dados.metas[+d.dataset.mtdel];
        confirmar("Apagar meta?", esc(x.nome||"Esta meta")+" sai da lista"+(+x.guardado?" (o valor guardado continua na sua conta; só some daqui)":"")+".", "Apagar")
          .then(ok=>{ if(!ok) return; dados.metas.splice(+d.dataset.mtdel,1); salvar(); renderMetas(); });
        return; }
      const f=e.target.closest("[data-mtfeito]");
      if(f){ const x=dados.metas[+f.dataset.mtfeito];
        confirmar("Marcar como realizada?", esc(x.nome||"Esta meta")+" vai para “Realizadas”. Lance o gasto normalmente quando ele passar no banco.", "Realizada")
          .then(ok=>{ if(!ok) return; x.feito=hojeISO(); salvar(); renderMetas(); });
        return; }
      const r=e.target.closest("[data-mtreabrir]");
      if(r){ dados.metas[+r.dataset.mtreabrir].feito=null; salvar(); renderMetas(); }
    };

  /* ================= cartões clicáveis: cada número leva aos dados que o compõem ================= */
  // o: {conta, mes, tipo ("e"/"s"/""), mov (só o que conta no total), alvo (seletor para rolar), dica}
  function ir(o){
    let a=' data-ir="1" role="button" tabindex="0" title="'+esc(o.dica||"Ver detalhes")+'"';
    ["conta","mes","tipo","alvo"].forEach(k=>{ if(o[k]!=null) a+=' data-ir-'+k+'="'+esc(o[k])+'"'; });
    if(o.mov) a+=' data-ir-mov="1"';
    return a;
  }
  function irPara(el){
    const d=el.dataset, conta=d.irConta||ui.conta, lanc=["cpf","itau","bb","cartao"].includes(conta);
    if(conta!==ui.conta){ ui.conta=conta; ui.view="mes"; }
    if(d.irMes){ if(conta==="prev") ui.prevMes=d.irMes; else ui.mes=d.irMes; }
    if(lanc && d.irTipo!=null){
      ui.busca=""; ui.cat=""; ui.origem=""; ui.fat=""; ui.errada=""; ui.vinculo="";
      ui.tipo=d.irTipo; ui.soMov=d.irMov==="1";
    }
    render();
    const alvo=d.irAlvo||(lanc?"#tabelaLanc":null);
    setTimeout(()=>{
      const t=alvo&&document.querySelector(alvo);
      if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); else window.scrollTo({top:0,behavior:"smooth"});
    },40);
  }
  document.getElementById("corpo").addEventListener("click",e=>{
    if(e.target.closest("button,input,select,a")) return;
    const c=e.target.closest("[data-ir]"); if(c) irPara(c);
  });
  document.getElementById("corpo").addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const c=e.target.closest("[data-ir]"); if(c&&e.target===c){ e.preventDefault(); irPara(c); }
  });

  /* ================= desenho da tela ================= */
  /* ================= investimentos ================= */
  // dados.invest = { movs:[movimentação B3], posicoes:{ "2026-09":{data,itens:[{ativo,nome,classe,inst,qt,preco,valor}]} },
  //                  historico:[{mes,valor,rentab,fonte}], precos:{ativo:{preco,data}}, manuais:[{nome,grupo,valor,data}] }
  const CAPITAL_APTO = {data:"2026-02-09", valor:533949.56, nome:"Venda do apartamento"};
  const CLASSES_INV = ["Ações","FIIs","ETF exterior","Cripto","Tesouro Direto","Renda fixa","Outros"];
  const GRUPOS_MANUAIS = {previdencia:"Previdência",imovel:"Imóvel",veiculo:"Veículo",receber:"A receber",divida:"Dívida",outro:"Outro"};
  function invOk(){
    const v = dados.invest = dados.invest || {};
    v.movs=v.movs||[]; v.posicoes=v.posicoes||{};
    if(!v._cls){ v.movs.forEach(m=>{ m.classe=classeAtivo(m.prod,m.ativo); }); v._cls=true; }   // reclassifica uma vez por sessão
    v.historico=v.historico||[]; v.precos=v.precos||{}; v.manuais=v.manuais||[]; v.cotacoes=v.cotacoes||{};
    return v;
  }
  const normTxt = s => String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  // CDB/LCI/LCA/CRI/CRA/Debênture: o código do título; Tesouro: o nome; ações/FIIs/ETFs: o ticker
  function chaveAtivo(prod){
    const p = celTexto(prod), partes = p.split(" - ").map(x=>x.trim());
    if(/^Tesouro/i.test(p)) return p.replace(/\s+/g," ");
    if(/^(CDB|LCI|LCA|LC|CRI|CRA|DEB|LF|LIG|RDB)\b/i.test(partes[0]) && partes[1]) return partes[1].toUpperCase();
    return partes[0].toUpperCase();
  }
  function classeAtivo(prod, chave){
    const p = normTxt(prod), k = (chave||"").toUpperCase();
    if(/^TESOURO/.test(p)) return "Tesouro Direto";
    if(/^(CDB|LCI|LCA|LC|CRI|CRA|DEB|LF|LIG|RDB)\b/.test(p)) return "Renda fixa";
    if(/CRYPTO|CRIPTO|BITCOIN|ETHEREUM/.test(p)) return "Cripto";
    if(/S&P|NASDAQ|MSCI|WORLD|EUA|USA|GLOBAL|EUROPA|CHINA/.test(p) && /INDICE|ETF|ISHARE/.test(p)) return "ETF exterior";
    if(/INV\.? IMOB|INVEST\.? IMOB|\bFII\b|IMOBILI|REAL ESTATE|RECEBIVEIS IMOB/.test(p)) return "FIIs";
    if(/INDICE|ETF/.test(p)) return "ETF exterior";
    if(/^[A-Z]{4}\d{1,2}$/.test(k)) return "Ações";
    return "Outros";
  }
  function grupoInst(inst){
    const t = normTxt(inst);
    if(/ITAU CV|ITAU CORRETORA/.test(t)) return "itaucor";
    if(/ITAU UNIBANCO/.test(t)) return "itaucdb";
    if(/BANCO DO BRASIL|\bBB\b/.test(t)) return "bb";
    if(/BTG|XP INVEST/.test(t)) return "btgxp";
    return "outros";
  }
  const NOMES_GRUPO_INV = {itaucor:"Itaú Corretora (ações, FIIs, Tesouro)", itaucdb:"Itaú — CDB e Cofrinhos", bb:"BB — Rende Fácil e aplicações", btgxp:"BTG e XP", outros:"Outras instituições"};
  // o que cada linha da movimentação significa para a carteira
  function tipoMov(mov, es){
    const m = normTxt(mov), cred = /^CRED/.test(normTxt(es));
    if(/TRANSFERIDO/.test(m)) return "ignorar";                       // provento que só trocou de custódia
    if(/RENDIMENTO|DIVIDENDO|JUROS/.test(m)) return "provento";
    if(/RESGATE|VENCIMENTO|AMORTIZA/.test(m)) return "venda";
    if(m==="VENDA") return "venda";
    if(m==="COMPRA" || /^APLICA/.test(m)) return "compra";
    if(/LIQUIDACAO|COMPRA \/ VENDA|COMPRA\/VENDA/.test(m)) return cred ? "compra" : "venda";
    if(/BONIFICA/.test(m)) return cred ? "bonus" : "ignorar";
    if(/DESDOBRO|GRUPAMENTO|FRACAO/.test(m)) return "ignorar";        // ajuste de quantidade sem dinheiro (não aparece no período)
    return "ignorar";                                                  // transferências de custódia, atualização, direitos de subscrição
  }
  function tipoProvento(mov){
    const m = normTxt(mov);
    if(/CAPITAL PROPRIO/.test(m)) return "JCP";
    if(/DIVIDENDO/.test(m)) return "Dividendo";
    if(/RENDIMENTO/.test(m)) return "Rendimento";
    return "Juros";
  }

  /* ---- importar: movimentação da B3 (Área do Investidor › Extrato › Movimentação › Excel) ---- */
  function ehMovB3(linhas){
    return linhas.slice(0,5).some(r=>r.some(c=>/entrada\s*\/\s*sa[íi]da/i.test(celTexto(c))) && r.some(c=>/movimenta/i.test(celTexto(c))));
  }
  function importarMovB3(linhas){
    const iCab = linhas.findIndex(r=>r.some(c=>/entrada\s*\/\s*sa[íi]da/i.test(celTexto(c))));
    const cab = linhas[iCab].map(c=>normTxt(celTexto(c)));
    const col = re => cab.findIndex(c=>re.test(c));
    const iES=col(/ENTRADA/), iD=col(/^DATA/), iM=col(/MOVIMENTA/), iP=col(/PRODUTO/), iI=col(/INSTITUI/), iQ=col(/QUANTIDADE/), iPU=col(/PRECO/), iV=col(/VALOR/);
    const num = v => { if(typeof v==="number") return v; const t=celTexto(v); if(!t||t==="-") return null; const n=numero(t); return isNaN(n)?null:n; };
    const v = invOk();
    const base = m => [m.data,normTxt(m.mov),normTxt(m.prod),normTxt(m.inst),m.qt,m.valor,m.es].join("|");
    const jaTem = {}; v.movs.forEach(m=>{ const k=base(m); jaTem[k]=(jaTem[k]||0)+1; });
    const noArq = {}; let novos=0, repetidos=0, prov=0; const meses=new Set();
    for(let i=iCab+1;i<linhas.length;i++){
      const r=linhas[i]; const data=celData(r[iD]); if(!data) continue;
      const m = {data:data, es:celTexto(r[iES]), mov:celTexto(r[iM]), prod:celTexto(r[iP]), inst:celTexto(r[iI]),
                 qt:num(r[iQ]), pu:num(r[iPU]), valor:num(r[iV])};
      if(!m.mov||!m.prod) continue;
      const k=base(m); noArq[k]=(noArq[k]||0)+1;
      if(noArq[k] <= (jaTem[k]||0)){ repetidos++; continue; }
      m.id = k+"#"+noArq[k];
      m.ativo = chaveAtivo(m.prod); m.classe = classeAtivo(m.prod, m.ativo); m.tipo = tipoMov(m.mov, m.es);
      if(m.tipo==="provento"){ m.provTipo = tipoProvento(m.mov); prov++; }
      v.movs.push(m); novos++; meses.add(data.slice(0,7));
    }
    v.movs.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    v.ultMov = new Date().toISOString().slice(0,10);
    salvar(); ui.conta="invest"; render();
    avisar("B3: "+novos+" movimentaç"+(novos===1?"ão importada":"ões importadas")+(prov?" · "+prov+" proventos":"")+(repetidos?" · "+repetidos+" já estava"+(repetidos===1?"":"m")+" aqui":""));
  }

  /* ---- importar: posição da B3 (Extrato › Posição › Excel): valor atualizado de cada ativo ---- */
  function ehPosicaoB3(wb){
    return wb.SheetNames.some(n=>{ const l=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}).slice(0,6);
      return l.some(r=>r.some(c=>/^produto$/i.test(celTexto(c)))) && l.some(r=>r.some(c=>/valor atualizado|valor l[íi]quido|valor bruto/i.test(celTexto(c)))); });
  }
  function importarPosicaoB3(wb, nomeArq){
    const itens=[];
    const numCel = c => typeof c==="number" ? c : (()=>{ const t=celTexto(c); if(!t||t==="-") return null; const n=numero(t); return isNaN(n)?null:n; })();
    wb.SheetNames.forEach(nome=>{
      const L=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:""});
      const iCab=L.findIndex(r=>r.some(c=>/^produto$/i.test(celTexto(c)))); if(iCab<0) return;
      const cab=L[iCab].map(c=>normTxt(celTexto(c)));
      const col=(...res)=>{ for(const re of res){ const i=cab.findIndex(c=>re.test(c)); if(i>=0) return i; } return -1; };
      const iP=col(/^PRODUTO$/), iCod=col(/CODIGO DE NEGOCIACAO/,/^CODIGO$/), iI=col(/^INSTITUICAO/), iQ=col(/^QUANTIDADE$/),
            iPr=col(/PRECO DE FECHAMENTO/,/PRECO ATUALIZADO CURVA/,/PRECO ATUALIZADO MTM/), iApl=col(/VALOR APLICADO/),
            iIdx=col(/^INDEXADOR$/), iVenc=col(/^VENCIMENTO$/), iEm=col(/^EMISSOR$/), iTipo=col(/^TIPO$/), iEmis=col(/DATA DE EMISSAO/);
      // valor: na renda fixa a B3 preenche MTM, CURVA ou FECHAMENTO conforme o título — usa o primeiro que tiver número
      const iVs=[/^VALOR ATUALIZADO$/,/VALOR ATUALIZADO MTM/,/VALOR ATUALIZADO CURVA/,/VALOR ATUALIZADO FECHAMENTO/,/VALOR LIQUIDO/,/VALOR BRUTO/]
        .map(re=>cab.findIndex(c=>re.test(c))).filter(i=>i>=0);
      if(!iVs.length) return;
      for(let i=iCab+1;i<L.length;i++){
        const r=L[i], prod=celTexto(r[iP]); if(!prod || /^total/i.test(prod)) continue;
        let valor=null; for(const j of iVs){ const n=numCel(r[j]); if(n!=null){ valor=n; break; } }
        if(valor==null||!valor) continue;                      // direitos de subscrição sem valor (XPML12 etc.)
        const cod=iCod>=0?celTexto(r[iCod]):"";
        const ativo=/^Tesouro/i.test(prod) ? prod.replace(/\s+/g," ") : (cod || chaveAtivo(prod)).toUpperCase();
        let classe=/tesouro/i.test(nome)?"Tesouro Direto":/renda fixa/i.test(nome)?"Renda fixa":/fundo|imobili/i.test(nome)?"FIIs":/a[çc][õo]es|acoes/i.test(nome)?"Ações":classeAtivo(prod, ativo);
        if(/ETF/i.test(nome)) classe = (/cripto/i.test(iTipo>=0?celTexto(r[iTipo]):"")||classeAtivo(prod,ativo)==="Cripto") ? "Cripto" : "ETF exterior";
        if(classe==="FIIs" && classeAtivo(prod,ativo)!=="FIIs" && !/FII|IMOB/i.test(prod)) classe=classeAtivo(prod,ativo);
        const venc=iVenc>=0?celData(r[iVenc]):null;
        itens.push({ativo:ativo, nome:prod, classe:classe, inst:iI>=0?celTexto(r[iI]):"", qt:iQ>=0?numCel(r[iQ]):null,
          preco:iPr>=0?numCel(r[iPr]):null, valor:cent(valor), aplicado:iApl>=0?numCel(r[iApl]):null,
          indexador:iIdx>=0?celTexto(r[iIdx]):"", vencimento:venc||"", emissor:iEm>=0?celTexto(r[iEm]):"", emissao:iEmis>=0?(celData(r[iEmis])||""):""});
      }
    });
    if(!itens.length){ avisar("Não encontrei os ativos nesse relatório de posição da B3.",true); return; }
    // relatório baixado no começo do mês = fechamento do mês anterior
    const mData=String(nomeArq||"").match(/(\d{4})-(\d{2})-(\d{2})/);
    const dataArq=mData?mData[1]+"-"+mData[2]+"-"+mData[3]:new Date().toISOString().slice(0,10);
    const d=new Date(dataArq+"T12:00:00"); if(d.getDate()<=10) d.setDate(0);
    const mes=d.toISOString().slice(0,7);
    const v=invOk();
    v.posicoes[mes]={data:dataArq, itens:itens};
    salvar(); ui.conta="invest"; ui.invAba="resumo"; render();
    avisar("Posição da B3 de "+rotuloMes(mes)+": "+itens.length+" ativos · R$ "+brl(cent(itens.reduce((s,x)=>s+x.valor,0))));
  }

  /* ---- importar: planilha "Planejamento e controle de investimento" (histórico, cotações, previdência e patrimônio) ---- */
  function ehPlanilhaInvest(wb){ return wb.SheetNames.includes("META") && wb.SheetNames.includes("Consolidado"); }
  function importarPlanilhaInvest(wb){
    const v=invOk(), cel=(aba,ref)=>{ const c=wb.Sheets[aba]&&wb.Sheets[aba][ref]; return c?c.v:null; };
    // histórico mensal (aba META, colunas A = mês, L = valor real, N = % carteira no mês)
    const hist=[];
    for(let r=3;r<200;r++){
      const a=cel("META","A"+r); if(a==null) break;
      const mes=celData(a); if(!mes) continue;
      const val=cel("META","L"+r), rt=cel("META","N"+r);
      if(typeof val!=="number"||val<=0) continue;
      if(mes.slice(0,7)>new Date().toISOString().slice(0,7)) break;
      hist.push({mes:mes.slice(0,7), valor:cent(val), rentab:typeof rt==="number"?rt:null, fonte:"planilha"});
    }
    // o último mês da planilha só vale se mudou em relação ao anterior (a planilha repete o valor nos meses futuros)
    const h2=hist.filter((x,i)=>i===0||x.valor!==hist[i-1].valor||x.mes<=new Date(Date.now()-20*864e5).toISOString().slice(0,7));
    v.historico=h2;
    // plano da aba META: aporte (C), rentabilidade esperada do mês (E) e meta (H), mês a mês
    const plano={};
    for(let r=3;r<400;r++){
      const a=cel("META","A"+r); if(a==null) break;
      const mes=celData(a); if(!mes) continue;
      const ap=cel("META","C"+r), tx=cel("META","E"+r), mt=cel("META","H"+r);
      if(typeof mt!=="number") continue;
      plano[mes.slice(0,7)]={aporte:typeof ap==="number"?cent(ap):0, taxa:typeof tx==="number"?tx:null, meta:cent(mt)};
    }
    // meta refeita no app não é sobrescrita pela planilha
    if(Object.keys(plano).length && !(v.meta&&v.meta.origem==="app")){
      const ks=Object.keys(plano).sort(), fut=ks.filter(k=>k>mesAtual()), ult=plano[ks[ks.length-1]];
      v.meta=Object.assign(v.meta||{}, {plano:plano,
        taxa:(v.meta&&v.meta.taxaManual)?v.meta.taxa:(ult.taxa!=null?ult.taxa:0.009),
        aporte:(v.meta&&v.meta.aporteManual)?v.meta.aporte:((fut.filter(k=>plano[k].aporte>0).map(k=>plano[k].aporte).pop())||0)});
    }
    // cotações de fechamento (aba Consolidado, A = código, I = fechamento)
    const dataBase=celData(cel("Consolidado","B1"))||new Date().toISOString().slice(0,10);
    for(let r=16;r<120;r++){
      const k=celTexto(cel("Consolidado","A"+r)), p=cel("Consolidado","I"+r);
      if(!k){ continue; } if(typeof p==="number"&&p>0) v.precos[k.toUpperCase()]={preco:p,data:dataBase,fonte:"planilha"};
    }
    // previdência (aba Fundos de invest.) e patrimônio (aba Consolidado, colunas N:O)
    const manuais=[];
    for(let r=2;r<20;r++){
      const n=celTexto(cel("Fundos de invest.","A"+r)), s=cel("Fundos de invest.","F"+r);
      if(!n||/^total/i.test(n)) continue;
      if(typeof s==="number") manuais.push({nome:n, grupo:"previdencia", valor:cent(s), investido:cent(+cel("Fundos de invest.","D"+r)||0), data:dataBase});
    }
    const pular=/^(leil[ãa]o|renda fixa|renda vari[áa]vel|d[íi]vidas|l[íi]quido|proventos|valor proventos)$/i;
    for(let r=3;r<40;r++){
      const n=celTexto(cel("Consolidado","N"+r)), s=cel("Consolidado","O"+r);
      if(/^l[íi]quido$/i.test(n)) break;          // abaixo do LÍQUIDO vêm os blocos por corretora, que já estão na B3
      if(!n||typeof s!=="number"||pular.test(n)||!s) continue;
      const g=s<0?"divida":/casa|lote|apart|terreno|sala|im[óo]vel|cota/i.test(n)?"imovel":/kwid|carro|moto|mobi|ve[íi]culo/i.test(n)?"veiculo":"receber";
      manuais.push({nome:n, grupo:g, valor:cent(Math.abs(s)), data:dataBase});
    }
    const ja=new Set(v.manuais.map(x=>normTxt(x.nome)));
    // com o financiamento importado do demonstrativo, a dívida da planilha não entra (seria contada duas vezes)
    const temFin=!!(dados.dividas&&dados.dividas.financ);
    manuais.forEach(x=>{ if(!ja.has(normTxt(x.nome)) && !(temFin&&x.grupo==="divida")) v.manuais.push(x); });
    salvar(); ui.conta="invest"; render();
    avisar("Planilha de investimentos: "+h2.length+" meses de histórico · "+(v.meta&&v.meta.plano?Object.keys(v.meta.plano).length+" meses de meta · ":"")+Object.keys(v.precos).length+" cotações · "+manuais.length+" itens de previdência e patrimônio");
  }

  /* ---- cálculo da carteira a partir da movimentação ---- */
  function carteiraB3(ate){
    const v=invOk(), pos={};
    const ordem={compra:0,bonus:1,provento:2,venda:3,ignorar:4};
    const movs=v.movs.filter(m=>!ate||m.data<=ate).slice().sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(ordem[a.tipo]-ordem[b.tipo]));
    movs.forEach(m=>{
      const p = pos[m.ativo] = pos[m.ativo] || {ativo:m.ativo, nome:m.prod.split(" - ").slice(1).join(" - ")||m.prod, classe:m.classe, inst:"", qt:0, custo:0, realizado:0, proventos:0, aplicado:0};
      const q=+m.qt||0, val=+m.valor||0;
      if(m.tipo==="compra"){ p.qt+=q; p.custo+=val; p.aplicado+=val; p.inst=m.inst; }
      else if(m.tipo==="bonus"){ p.qt+=q; }
      else if(m.tipo==="venda"){
        // o que sai além da quantidade conhecida foi aplicado antes do começo do extrato (sem custo): não é lucro
        const cm=p.qt>0?p.custo/p.qt:0, sai=Math.min(q,p.qt), baixa=cm*sai, valSai=q>0?val*sai/q:0;
        p.custo-=baixa; p.qt-=sai; p.realizado+=valSai-baixa; p.semCusto=(p.semCusto||0)+(val-valSai);
        if(p.qt<1e-6){ p.qt=0; p.custo=0; }
      }
      else if(m.tipo==="provento"){ p.proventos+=val; }
      if(/TRANSFER/.test(normTxt(m.mov)) && /^CRED/.test(normTxt(m.es))) p.inst=m.inst;
    });
    return pos;
  }
  function ultimaPosicao(ate){
    const v=invOk(), ms=Object.keys(v.posicoes).filter(m=>!ate||m<=ate).sort();
    return ms.length?{mes:ms[ms.length-1],...v.posicoes[ms[ms.length-1]]}:null;
  }
  // valor de mercado de cada ativo: posição da B3; sem ela, cotação da planilha; sem nada, o custo
  // com Posição da B3: ela manda (o que não está nela não está mais em custódia); custo e proventos vêm da movimentação.
  // sem Posição: quantidade da movimentação × cotação da planilha (ou o custo, para CDB e Tesouro)
  // cotação do dia (brapi / Tesouro Direto): vale quando é do mesmo dia ou mais nova que a Posição da B3
  function aplicarCotacao(x, dataBase){
    const c=invOk().cotacoes[x.ativo];
    if(!c || !(+x.qt>0) || x.classe==="Renda fixa") return x;
    if(dataBase && c.hora.slice(0,10)<dataBase) return x;
    const valor=cent(x.qt*c.preco);
    const varR = c.fechAnt ? cent(x.qt*(c.preco-c.fechAnt)) : null;
    return {...x, preco:c.preco, valor:valor, varDia:c.varDia, varDiaR:varR, cotHora:c.hora,
      fonte:(c.fonte==="tesouro"?"Tesouro ":"cotação ")+diaMes(c.hora.slice(0,10))+(c.fonte==="tesouro"?"":" "+horaCot(c.hora))};
  }
  const horaCot = iso => { const d=new Date(iso); return isNaN(d)?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
  function carteiraAtual(){
    const up=ultimaPosicao();
    return carteiraBase().map(x=>aplicarCotacao(x, up&&up.data));
  }
  function carteiraBase(){
    const pos=carteiraB3(), up=ultimaPosicao(), v=invOk();
    if(up){
      const agr={};
      up.itens.forEach(x=>{ const a=agr[x.ativo]=agr[x.ativo]||{...x,valor:0,qt:0}; a.valor=cent(a.valor+x.valor); a.qt=(a.qt||0)+(+x.qt||0); });
      return Object.values(agr).map(x=>{
        const p=pos[x.ativo];
        const custo = p&&p.custo>0.01 ? cent(p.custo) : (x.aplicado!=null ? cent(x.aplicado) : x.valor);
        return {ativo:x.ativo, nome:(p&&p.nome)||x.nome.split(" - ").slice(1).join(" - ")||x.nome, classe:x.classe, inst:x.inst, qt:x.qt,
          preco:x.preco, custo:custo, valor:x.valor, realizado:p?p.realizado:0, proventos:p?p.proventos:0,
          indexador:x.indexador, vencimento:x.vencimento, emissor:x.emissor, emissao:x.emissao||"", fonte:"B3 "+diaMes(up.data), semCustoMov:!(p&&p.custo>0.01)};
      });
    }
    return Object.values(pos).filter(p=>p.qt>1e-6).map(p=>{
      let valor, fonte="custo";
      if(v.precos[p.ativo]){ valor=cent(p.qt*v.precos[p.ativo].preco); fonte="cotação "+diaMes(v.precos[p.ativo].data); }
      else valor=cent(p.custo);
      return {...p, custo:cent(p.custo), valor:valor, fonte:fonte};
    });
  }
  const mesDe = iso => iso.slice(0,7);
  function fluxosB3PorMes(){
    const r={};
    invOk().movs.forEach(m=>{
      const k=mesDe(m.data), o=r[k]=r[k]||{aplic:0,resg:0,prov:0};
      const val=+m.valor||0;
      if(m.tipo==="compra") o.aplic+=val; else if(m.tipo==="venda") o.resg+=val; else if(m.tipo==="provento") o.prov+=val;
    });
    return r;
  }
  // evolução: histórico da planilha + posições da B3; rentabilidade do mês pelo método de Dietz
  // r = (valor no fim − valor no início − aportes líquidos + proventos) ÷ (valor no início + aportes líquidos ÷ 2)
  function evolucaoInv(){
    const v=invOk(), fl=fluxosB3PorMes(), linhas={};
    // da planilha vem só o patrimônio: a rentabilidade dela não descontava resgates e aportes, então não é usada
    v.historico.forEach(h=>{ linhas[h.mes]={mes:h.mes, valor:h.valor, rentab:null, fonte:"planilha"}; });
    Object.keys(v.posicoes).forEach(m=>{ const p=v.posicoes[m]; linhas[m]={mes:m, valor:cent(p.itens.reduce((s,x)=>s+x.valor,0)), rentab:null, fonte:"B3"}; });
    const ms=Object.keys(linhas).sort();
    ms.forEach((m,i)=>{
      const l=linhas[m], f=fl[m]||{aplic:0,resg:0,prov:0};
      l.aporte=cent(f.aplic-f.resg); l.prov=cent(f.prov);
      if(l.fonte==="B3" && i>0){
        const ant=linhas[ms[i-1]];
        if(ant.fonte==="B3"){ const den=ant.valor+l.aporte/2; l.rentab=den>0?(l.valor-ant.valor-l.aporte+l.prov)/den:null; }
      }
    });
    return ms.map(m=>linhas[m]);
  }

  /* ---- rentabilidade mensal pelo método de cotas (como a aba Input_ADP da planilha), por carteira, classe e ativo ----
     Para cada ativo e mês: valor no início (fim do mês anterior), valor no fim, aportes/resgates do mês (da Movimentação da B3)
     e proventos. Rentabilidade do mês (Dietz modificado, aporte pesado pelos dias que ficou aplicado):
        r = (fim − início − aportes líquidos + proventos) ÷ (início + Σ aporte × dias aplicados ÷ dias do mês)
     A cota começa em 1 e anda r a cada mês; "no ano" e "desde o início" são a variação da cota.
     Valor no fim do mês: ações, FIIs, ETFs e Tesouro = quantidade × fechamento do último dia útil (Yahoo / Tesouro Transparente);
     mês corrente = cotação do dia. CDB = curva estimada (taxa implícita calibrada na Posição da B3 ou no resgate). */
  let histBuscando=null, histErro="";
  const mesAnt = ym => { let [a,m]=ym.split("-").map(Number); m--; if(m<1){m=12;a--;} return a+"-"+String(m).padStart(2,"0"); };
  function mesesEntre(a,b){ const r=[]; let x=a; while(x<=b){ r.push(x); let [y,m]=x.split("-").map(Number); m++; if(m>12){m=1;y++;} x=y+"-"+String(m).padStart(2,"0"); } return r; }
  const diasEntre=(a,b)=>Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5);

  function carregarHistorico(forcar){
    const v=invOk(); v.hist=v.hist||{precos:{},bench:{}};
    if(histBuscando || !v.movs.length || !sbUser) return histBuscando;
    const mesH=hojeISO().slice(0,7), ini=v.movs.map(m=>m.data).sort()[0].slice(0,7), ultFech=mesAnt(mesH);
    const mercado={}; v.movs.forEach(m=>{ if(m.classe!=="Renda fixa" && !/[A-Z]{4}1[2-5]$/.test(m.ativo)) mercado[m.ativo]=m.classe; });   // sem direitos de subscrição (…12 a …15)
    const faltaAtivo=Object.keys(mercado).some(a=>!v.hist.precos[a] && !(v.hist.semDados||[]).includes(a));
    const velho=!v.hist.em || Date.now()-new Date(v.hist.em).getTime()>6*3600e3;
    if(!forcar && !faltaAtivo && !velho && v.hist.ate===ultFech) return;
    const tickers=Object.keys(mercado).filter(a=>mercado[a]!=="Tesouro Direto" && /^[A-Z0-9]{4,12}$/.test(a));
    const tesouro=Object.keys(mercado).filter(a=>mercado[a]==="Tesouro Direto");
    const desde=mesAnt(ini)+"-01", dBR=desde.split("-").reverse().join("/");
    const bcb=(serie,qs)=>fetch("https://api.bcb.gov.br/dados/serie/bcdata.sgs."+serie+"/dados?formato=json&"+qs).then(r=>r.json());
    histBuscando=(async()=>{
      const erros=[];
      const pH=sb.functions.invoke("cotacoes",{body:{historico:{tickers:tickers.concat(["^BVSP"]),tesouro:tesouro,desde:desde}}}).then(async({data,error})=>{
        if(error){ let m=error.message; try{ const j=await error.context.json(); m=j.erro||m; }catch(e){} throw new Error(m); }
        Object.entries(data.hist||{}).forEach(([k,h])=>{ if(k==="^BVSP") v.hist.bench.ibov=h; else v.hist.precos[k]=h; });
        v.hist.semDados=Object.keys(data.erros||{}).filter(k=>k!=="^BVSP");
        if(v.hist.semDados.length) erros.push("sem histórico: "+v.hist.semDados.join(", "));
      }).catch(e=>erros.push("histórico: "+e.message));
      const ym=d=>d.slice(6,10)+"-"+d.slice(3,5);
      const pCDI=bcb(4391,"dataInicial="+dBR).then(a=>{ const o={}; a.forEach(x=>{ o[ym(x.data)]=+x.valor; }); v.hist.bench.cdi=o; })
        .then(()=>bcb(12,"dataInicial=01/"+mesH.slice(5,7)+"/"+mesH.slice(0,4))).then(a=>{    // mês corrente: acumula o CDI diário
          const f=a.filter(x=>ym(x.data)===mesH).reduce((p,x)=>p*(1+x.valor/100),1);
          if(a.length && !v.hist.bench.cdi[mesH]) v.hist.bench.cdiParcial={mes:mesH, valor:(f-1)*100};
        }).catch(e=>erros.push("CDI: "+e.message));
      const pIPCA=bcb(433,"dataInicial="+dBR).then(a=>{ const o={}; a.forEach(x=>{ o[ym(x.data)]=+x.valor; }); v.hist.bench.ipca=o; }).catch(e=>erros.push("IPCA: "+e.message));
      await Promise.all([pH,pCDI,pIPCA]);
      histErro=erros.join(" · ");
      if(!erros.some(e=>/^histórico:/.test(e))){ v.hist.em=new Date().toISOString(); v.hist.ate=ultFech; }
      salvar();
    })().finally(()=>{ histBuscando=null; if(ui.conta==="invest") render(); });
    return histBuscando;
  }

  function rentMensal(){
    const v=invOk(), H=(v.hist&&v.hist.precos)||{}, B=(v.hist&&v.hist.bench)||{};
    const ordem={compra:0,bonus:1,provento:2,venda:3};
    const movs=v.movs.filter(m=>ordem[m.tipo]!=null).slice().sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:ordem[a.tipo]-ordem[b.tipo]);
    if(!movs.length) return null;
    const hoje=hojeISO(), mesH=hoje.slice(0,7), meses=mesesEntre(movs[0].data.slice(0,7), mesH);
    // taxa diária padrão da renda fixa: média do CDI do período
    const cdis=Object.values(B.cdi||{}); const cdiM=cdis.length?cdis.reduce((a,x)=>a+x,0)/cdis.length/100:0.012;
    const r0=Math.pow(1+cdiM,1/30.4)-1;
    const posMes=m=>{ const p=v.posicoes[m]; if(!p) return null; const o={}; p.itens.forEach(x=>{ const a=o[x.ativo]=o[x.ativo]||{valor:0,qt:0}; a.valor+=x.valor; a.qt+=(+x.qt||0); }); return o; };
    const preco=(a,ms,cl)=>{                       // [preço, estimado?]
      if(ms===mesH){ const c=v.cotacoes[a]; if(c && c.hora.slice(0,7)===mesH) return [c.preco,false]; }
      const h=H[a]; if(h && h[ms]>0) return [h[ms],false];
      const p=posMes(ms); if(p&&p[a]&&p[a].qt) return [p[a].valor/p[a].qt,false];
      return [null,true];
    };
    function simular(taxa){                        // uma passada pelo tempo; taxa[ativo] = taxa diária da curva (renda fixa)
      const st={}, res={}, calib={};
      let i=0, ant={};
      meses.forEach(ms=>{
        const ini=ms+"-01", fim=ms===mesH?hoje:fimDoMes(ms), dm=diasEntre(ini,fim)+1, pm=posMes(ms);
        const rec=a=>{ const o=res[a]=res[a]||{}; return o[ms]=o[ms]||{vi:ant[a]||0, fl:0, fw:0, prov:0, vf:0, est:false}; };
        const acr=(s,d)=>{ if(s.classe==="Renda fixa"){ s.vrf*=Math.pow(1+(taxa[s.ativo]!=null?taxa[s.ativo]:r0), Math.max(0,diasEntre(s.d,d))); } s.d=d; };
        while(i<movs.length && movs[i].data<=fim){
          const m=movs[i++], s=st[m.ativo]=st[m.ativo]||{ativo:m.ativo, classe:m.classe, nome:(m.prod||"").split(" - ").slice(1).join(" - ")||m.prod, qt:0, vrf:0, d:m.data, dias:0, base:0, ult:null};
          const R=rec(m.ativo), w=(dm-diasEntre(ini,m.data))/dm, q=+m.qt||0, val=+m.valor||0;
          acr(s,m.data);
          if(m.tipo==="compra"){ s.qt+=q; s.vrf+=val; R.fl+=val; R.fw+=w*val; s.base+=val; s.dias+=0; }
          else if(m.tipo==="bonus"){ s.qt+=q; }
          else if(m.tipo==="provento"){ R.prov+=val; }
          else if(m.tipo==="venda"){
            const sai=Math.min(q,s.qt); if(sai<=1e-9) continue;          // resgate de aplicação anterior ao extrato: fica fora
            const valK=q>0?val*sai/q:0, frac=s.qt>0?sai/s.qt:1;
            if(s.classe==="Renda fixa" && calib[m.ativo]==null && s.vrf>0) calib[m.ativo]={sim:s.vrf, real:valK/frac, t:m.data};
            R.fl-=valK; R.fw-=w*valK; s.vrf*=(1-frac); s.qt-=sai; if(s.qt<1e-6){ s.qt=0; s.vrf=0; }
          }
        }
        Object.values(st).forEach(s=>{
          const R=rec(s.ativo);
          if(s.qt<=1e-9){ R.vf=0; }
          else if(s.classe==="Renda fixa"){
            acr(s,fim);
            if(pm && pm[s.ativo]){ if(calib[s.ativo]==null) calib[s.ativo]={sim:s.vrf, real:pm[s.ativo].valor, t:fim}; s.vrf=pm[s.ativo].valor; }
            else R.est=true;
            R.vf=s.vrf;
          } else {
            let [pr,est]=preco(s.ativo,ms);
            if(pr==null){ pr=s.ult; est=true; }
            if(pr==null){ pr=s.qt?(R.vi+R.fl)/s.qt:0; est=true; }
            s.ult=pr; R.vf=s.qt*pr; R.est=est;
          }
          s.vf=R.vf;
        });
        ant={}; Object.values(st).forEach(s=>{ ant[s.ativo]=s.vf||0; });
      });
      return {st,res,calib};
    }
    // 1ª passada com o CDI; a taxa de cada CDB é recalibrada pela Posição da B3 (ou pelo resgate) e roda de novo
    const p1=simular({}), taxa={};
    Object.entries(p1.calib).forEach(([a,c])=>{
      // dias médios aplicados (ponderados pelo valor) até o ponto de calibração
      let sv=0, sd=0; movs.forEach(m=>{ if(m.ativo===a && m.tipo==="compra" && m.data<=c.t){ sv+=+m.valor||0; sd+=(+m.valor||0)*diasEntre(m.data,c.t); } });
      const dmed=sv?sd/sv:0; if(dmed>5 && c.sim>0 && c.real>0) taxa[a]=(1+r0)*Math.pow(c.real/c.sim,1/dmed)-1;
    });
    const {st,res}=simular(taxa);
    const taxaR=(o)=>{ if(!o) return null; const den=o.vi+o.fw; if(den<1 || (o.vi<1 && o.fl<1 && o.vf<1)) return null; return (o.vf-o.vi-o.fl+o.prov)/den; };
    const soma=(lista,ms)=>{ const o={vi:0,fl:0,fw:0,prov:0,vf:0,est:false}; lista.forEach(a=>{ const x=res[a]&&res[a][ms]; if(x){ o.vi+=x.vi; o.fl+=x.fl; o.fw+=x.fw; o.prov+=x.prov; o.vf+=x.vf; o.est=o.est||x.est; } }); return o; };
    const serie=(lista)=>{ const out={}; meses.forEach(ms=>{ const o=soma(lista,ms); o.r=taxaR(o); out[ms]=o; }); return out; };
    const ativos=Object.keys(st);
    const linhas=[{id:"total", nome:"Carteira B3", tipo:"total", s:serie(ativos)}];
    CLASSES_INV.forEach(c=>{ const l=ativos.filter(a=>st[a].classe===c); if(l.length) linhas.push({id:c, nome:c, tipo:"classe", classe:c, s:serie(l)}); });
    const porAtivo=ativos.map(a=>({id:a, nome:a, desc:st[a].nome, tipo:"ativo", classe:st[a].classe, s:serie([a]), valor:st[a].vf||0}));
    // índices de referência
    const cdi={}, ipca={}, ibov={};
    meses.forEach(ms=>{
      const c=B.cdi&&B.cdi[ms]; cdi[ms]={r:c!=null?c/100:(B.cdiParcial&&B.cdiParcial.mes===ms?B.cdiParcial.valor/100:null)};
      const p=B.ipca&&B.ipca[ms]; ipca[ms]={r:p!=null?p/100:null};
      const ib=B.ibov||{}, a1=ib[ms], a0=ib[mesAnt(ms)]; ibov[ms]={r:a1&&a0?a1/a0-1:null};
    });
    const bench=[{id:"cdi",nome:"CDI",s:cdi},{id:"ipca",nome:"IPCA",s:ipca},{id:"ibov",nome:"Ibovespa",s:ibov}];
    return {meses, mesH, linhas, porAtivo, bench};
  }

  /* ---- conciliação: conta corrente × investimentos ---- */
  function grupoContaInv(l){
    const h=normTxt(l.hist);
    if(l.origem==="itau"){
      // "PIX TRANSF ITAU CO" e "TBI 2040.00073-5 TD" = dinheiro mandado para a conta da Itaú Corretora
      if(/COR ITAUCOR|COR OPERACOES|ITAUCOR|ITAU CORRETORA|PIX TRANSF ITAU CO|^TBI .*TD$|TBI 2040\.00073/.test(h)) return "itaucor";
      if(/CDB|COFRINHO|APLICACAO|APLIC AUT|REND PAGO APLIC|RESGATE/.test(h)) return "itaucdb";
    }
    if(l.origem==="bb" && /RENDE FACIL|CDB|APLICACAO|RESGATE|LCI|LCA|TESOURO|POUPANCA/.test(h)) return "bb";
    if((l.origem==="itau"||l.origem==="bb") && /\bXP\b|BTG|TED 102\b|TED 208\b/.test(h)) return "btgxp";
    return null;
  }
  function conciliacaoInv(){
    const r={};   // r[mes][grupo] = {saiu,voltou,aplic,resg,prov,n}
    const ac=(m,g)=>{ r[m]=r[m]||{}; return r[m][g]=r[m][g]||{saiu:0,voltou:0,aplic:0,resg:0,prov:0,lanc:[]}; };
    dados.lancamentos.forEach(l=>{
      if(l.ignorado) return; const g=grupoContaInv(l); if(!g) return;
      const o=ac(mesDe(l.data),g); if(l.valor<0) o.saiu-=l.valor; else o.voltou+=l.valor; o.lanc.push(l);
    });
    invOk().movs.forEach(m=>{
      const val=+m.valor||0; if(!val) return;
      if(!["compra","venda","provento"].includes(m.tipo)) return;
      const o=ac(mesDe(m.data),grupoInst(m.inst));

  }

  /* ---- tela ---- */
  /* ---- cotações automáticas: B3 pela brapi (via Supabase, o token fica no servidor) e Tesouro Direto pela API do Tesouro ---- */
  const COT_VALIDADE = 15*60*1000;   // 15 min
  let cotBuscando=null, cotErro="";
  function atualizarCotacoes(forcar){
    const v=invOk();
    if(cotBuscando) return cotBuscando;
    if(!forcar && v.cotEm && Date.now()-new Date(v.cotEm).getTime()<COT_VALIDADE) return;
    const base=carteiraBase().filter(x=>+x.qt>0);
    const rv=[...new Set(base.filter(x=>!RF_CLASSES.includes(x.classe)).map(x=>x.ativo).filter(a=>/^[A-Z0-9]{4,12}$/.test(a)))];
    const td=base.filter(x=>x.classe==="Tesouro Direto").map(x=>x.ativo);
    if(!rv.length && !td.length) return;
    cotBuscando=(async()=>{
      const erros=[]; let n=0;
      const pB3 = !rv.length ? Promise.resolve() : !sbUser ? Promise.resolve(erros.push("B3: faça login")) :
        sb.functions.invoke("cotacoes",{body:{tickers:rv}}).then(async({data,error})=>{
          if(error){ let m=error.message; try{ const j=await error.context.json(); m=j.erro||m; }catch(e){} throw new Error(m); }
          Object.entries(data.precos||{}).forEach(([k,c])=>{ v.cotacoes[k]={...c, fonte:"brapi"}; n++; });
          const fal=Object.keys(data.erros||{}); if(fal.length) erros.push("sem cotação: "+fal.join(", "));
        }).catch(e=>{ erros.push("B3: "+e.message); });
      const pTD = !td.length ? Promise.resolve() : fetch("https://www.tesourodireto.com.br/o/rentabilidade/investir").then(r=>r.json()).then(j=>{
        const tit=[].concat(j.TesouroLegado||[], j.Tesouro24x7||[]);
        const norm=t=>String(t).replace(/\s+/g," ").trim().toUpperCase();
        td.forEach(a=>{ const t=tit.find(b=>norm(b.treasuryBondName)===norm(a));
          if(t && +t.unitaryRedemptionValue>0){
            const pu=+t.unitaryRedemptionValue, ant=v.cotacoes[a], hora=String(t.lastMarketPricingDate||new Date().toISOString()).slice(0,19);
            // variação do dia: preço guardado de um dia anterior × preço de hoje
            const fechAnt = ant && ant.hora.slice(0,10)<hora.slice(0,10) ? ant.preco : (ant&&ant.fechAnt)||null;
            v.cotacoes[a]={preco:pu, fechAnt:fechAnt, varDia:fechAnt?(pu/fechAnt-1)*100:null, nome:t.treasuryBondName, hora:hora, fonte:"tesouro"}; n++;
          } else erros.push(a+": sem preço no Tesouro (vale a B3)"); });
      }).catch(e=>{ erros.push("Tesouro: "+e.message); });
      await Promise.all([pB3,pTD]);
      v.cotEm=new Date().toISOString(); cotErro=erros.join(" · ");
      if(n) salvar();
      if(forcar) avisar(n+" cotações atualizadas"+(cotErro?" · "+cotErro:""), !n);
    })().finally(()=>{ cotBuscando=null; if(ui.conta==="invest") render(); });
    return cotBuscando;
  }
