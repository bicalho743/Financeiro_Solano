  /* ================= utilidades ================= */
  const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const brl = v => (v<0?"−":"")+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const rotuloMes = ym => { const [a,m]=ym.split("-"); return MESES[+m-1]+" de "+a; };
  const abrevMes = ym => { const [a,m]=ym.split("-"); return MESES[+m-1].slice(0,3)+" "+a.slice(2); };
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function numero(txt){
    let s = String(txt).trim().replace(/\s|R\$/g,"");
    // alguns extratos trazem o valor com C/D no fim: "15.887,04 C", "-240,00 D"
    let sinal = 0;
    const cd = s.match(/([CD])$/i);
    if(cd){ sinal = cd[1].toUpperCase()==="D" ? -1 : 1; s = s.slice(0,-1); }
    if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
    else s = s.replace(/,/g,"");
    let n = parseFloat(s);
    if(isNaN(n)) return 0;
    if(sinal) n = sinal*Math.abs(n);
    return n;
  }

  function dataISO(txt){
    const s = String(txt).replace(/\u00a0/g," ").trim();
    let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})\b/);
    if(!m){ m = s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/); if(m) m[3]="20"+m[3]; }
    if(m) return (m[1]==="00"||m[2]==="00") ? null : m[3]+"-"+m[2]+"-"+m[1];
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[1]+"-"+m[2]+"-"+m[3] : null;
  }

  // débito de consignado no extrato = adiantamento de parcela ou quitação (a parcela mensal é descontada em folha)
  const ehQuitacaoConsignado = (hist,valor) => valor<0 && /CR[EÉ]D(ITO)?\.?\s*CONSIG/i.test(String(hist));
  // dinheiro que entra emprestado (crediário, consignado, empréstimo): não é receita
  const ehEmprestimoRecebido = (hist,valor) => valor>0 && /CREDIARIO|CR[EÉ]D(ITO)?\.?\s*CONSIG|EMPR[EÉ]STIMO|CR[EÉ]D(ITO)? PESSOAL/i.test(String(hist).normalize("NFD").replace(/[\u0300-\u036f]/g,""));
  const ehEncargoCheque = h => /JUROS|I\.?O\.?F/i.test(h) && /SALDO DEVEDOR|LIM(ITE)?[\s.-]*ESP|DIAS SEM JUROS/i.test(String(h).normalize("NFD").replace(/[\u0300-\u036f]/g,""));
  /* Cheque especial do BB: Pix do BB para você (Itaú) num dia em que o BB ficou negativo.
     As duas pontas (saída no BB, chegada no Itaú com o mesmo valor, até 3 dias) viram "Cheque especial BB". */
  function ligarChequeEspecial(){
    const sdBB=(dados.saldosDia||{}).bb||{}, solano=h=>/SOLANO/i.test(h);
    const trocavel=l=>!l.catManual||["Sem categoria",CAT_ENTRE,"Empréstimo recebido","Outras receitas"].includes(l.categoria);
    let n=0;
    dados.lancamentos.filter(l=>l.origem==="bb"&&!l.ignorado&&l.valor<0&&/PIX/i.test(l.hist)&&solano(l.hist)).forEach(b=>{
      const usa=b.categoria===CAT_CHEQUE||(sdBB[b.data]!=null&&sdBB[b.data]<0);
      if(!usa) return;
      if(b.categoria!==CAT_CHEQUE){ if(!trocavel(b)&&b.categoria!=="IOF e taxas") return; b.categoria=CAT_CHEQUE; n++; }
      const d0=new Date(b.data+"T12:00:00").getTime();
      const par=dados.lancamentos.find(l=>l.origem==="itau"&&!l.ignorado&&Math.abs(l.valor+b.valor)<0.005&&solano(l.hist)&&
        Math.abs(new Date(l.data+"T12:00:00").getTime()-d0)<=3*864e5);
      if(par&&par.categoria!==CAT_CHEQUE&&trocavel(par)){ par.categoria=CAT_CHEQUE; n++; }
    });
    dados.lancamentos.forEach(l=>{ if(l.origem==="bb"&&ehEncargoCheque(l.hist)&&l.categoria!=="IOF e taxas"&&!l.catManual){ l.categoria="IOF e taxas"; n++; } });
    return n;
  }
  // último saldo conhecido de uma conta (até hoje): Itaú/BB pelo extrato; Santander digitado na Visão geral
  function saldoBanco(o){
    const sd=(dados.saldosDia||{})[o]||{}, hj=hojeISO();
    const d=Object.keys(sd).filter(x=>x<=hj).sort().pop();
    return d?{v:cent(+sd[d]),data:d}:null;
  }
  function chequeBB(){ const s=saldoBanco("bb"); return s&&s.v<0?s:null; }
  /* Previsão do mês atual: a linha de cada cheque especial acompanha o saldo negativo da conta.
     Quando a conta volta ao positivo, a linha é marcada como paga. */
  const CHEQUES=[
    {o:"bb", auto:"chequeBB", nome:"Cheque especial BB", re:/\bBB\b/i},
    {o:"santander", auto:"chequeSantander", nome:"Cheque especial Santander", re:/santander/i}];
  const ehLinhaDe = (c,x) => x.auto===c.auto || (/ch\w*qu?e\s+especial/i.test(x.d||"") && c.re.test(x.d||""));
  const ehLinhaCheque = x => CHEQUES.some(c=>ehLinhaDe(c,x));
  function syncChequePrev(){
    const ym=mesAtual(), p=dados.previsoes&&dados.previsoes[ym]; if(!p) return false;
    let mudou=false;
    CHEQUES.forEach(cq=>{
      const sd=(dados.saldosDia||{})[cq.o]||{};
      // BB: só com extrato do mês importado; Santander: com qualquer saldo digitado
      if(cq.o==="bb"?!Object.keys(sd).some(d=>d.slice(0,7)===ym):!Object.keys(sd).length) return;
      const s=saldoBanco(cq.o), c=s&&s.v<0?s:null;
      let x=(p.itens||[]).find(y=>ehLinhaDe(cq,y));
      if(c){
        if(!x){ x={d:cq.nome,data:hojeISO(),aPagar:null,pago:null,auto:cq.auto}; p.itens.push(x); ordenarPrev(p); mudou=true; }
        // acompanha o saldo; se a linha foi paga (✓) e o saldo não mudou desde então, não reabre
        if(x.aPagar!=null||x.auto!==cq.auto||x.saldoData!==c.data){
          if(x.aPagar!==c.v||x.d!==cq.nome||x.auto!==cq.auto||x.saldoData!==c.data){ x.aPagar=c.v; x.d=cq.nome; x.auto=cq.auto; x.saldoData=c.data; mudou=true; }
        }
      } else if(x&&x.auto===cq.auto&&x.aPagar!=null){
        x.pago=cent((x.pago||0)+Math.abs(x.aPagar)); x.aPagar=null; x.saldoData=s?s.data:null; mudou=true;
      }
    });
    return mudou;
  }
  function classificar(hist,valor){
    const u = hist.toUpperCase();
    if(ehQuitacaoConsignado(hist,valor)) return {categoria:"Pagamento de dívidas",vinculo:"PF"};
    if(ehEmprestimoRecebido(hist,valor)) return {categoria:"Empréstimo recebido",vinculo:"PF"};
    // juros e IOF do cheque especial, e a devolução dos juros ("dias sem juros"): mesma categoria, para se anularem
    if(ehEncargoCheque(hist)) return {categoria:"IOF e taxas",vinculo:"PF"};
    for(const r of dados.regras){
      if(u.includes(r.termo.toUpperCase())){
        if(ehPixEntrada(hist,valor) && GRUPO_DE[r.categoria]!=="Receitas" && !ENTRA_FORA.has(r.categoria))
          return {categoria:"Outras receitas",vinculo:"PF"};
        return {categoria:r.categoria,vinculo:r.vinculo};
      }
    }
    if(ehPixEntrada(hist,valor)) return {categoria:"Outras receitas",vinculo:"PF"};
    return {categoria:"Sem categoria",vinculo:"PF"};
  }

  /* nome do estabelecimento, limpo dos prefixos do Itaú e do BB — vira o termo da regra aprendida */
  function mercado(hist){
    let s = String(hist).replace(/\u00a0/g," ").trim()
      // BB: "Pix - Enviado - FULANO", "Compra com Cartão - 22/05 18:54 LOJA"
      .replace(/^\s*Pix\s*-\s*(Enviado|Recebido)\s*-\s*/i,"")
      .replace(/^\s*Pix-Envio devolvido\s*-\s*/i,"")
      .replace(/^\s*Transferência Periódica\s*-\s*/i,"")
      .replace(/^\s*Compra\s+com\s+Cart[ãa]o\s*-\s*/i,"")
      .replace(/^\d{2}\/\d{2}\s+\d{2}:\d{2}\s*/,"")
      // Itaú: "PIX QRS LOJA29/08", "RSHOP SUPER NOSSO 2606", "PAY DL 06/08", "PIX TRANSF FULANO 10/07"
      .replace(/^(PIX\s+(QRS|TRANSF|WHATS\s+QRCODE|WHATS|AUT)|DEV\s+PIX|RSHOP|RSCCS\s+MP|RSCCS|RSCSS|PAY|ON|INT|SISPAG|TED|DOC)\s+/i,"")
      .replace(/\s*\d{2}\/\d{2}\s*$/,"")
      .replace(/(\D)\d{4}\s*$/,"$1")
      .replace(/\s+virtual$/i,"")
      .replace(/^\d{11,}\s*/,"")
      .trim();
    const corte = s.split(/\s+-\s+/)[0].trim();
    if(corte.length>3) s = corte;
    return (s||String(hist)).toUpperCase().replace(/\s+/g," ").slice(0,34).trim();
  }

  /* guarda o que você classificou à mão, para o próximo extrato entrar pronto */
  function aprender(l){
    const termo = mercado(l.hist);
    if(termo.length<4) return null;
    const i = dados.regras.findIndex(r=>r.termo.toUpperCase()===termo);
    if(i>=0){
      if(dados.regras[i].categoria===l.categoria && dados.regras[i].vinculo===l.vinculo) return null;
      dados.regras[i].categoria=l.categoria; dados.regras[i].vinculo=l.vinculo;
    }else{
      dados.regras.unshift({termo:termo,categoria:l.categoria,vinculo:l.vinculo,aprendida:true});
    }
    return termo;
  }

  /* desloca a data de parcelas futuras (PARC 02/12, PARC 03/05…) para o mês correto */
  function ajustarParc(iso, hist){
    const m = hist.match(/PARC\s+(\d{2})\/(\d{2})/i);
    if(!m) return iso;
    if(/ANUIDADE|TIT-PARC/i.test(hist)) return iso; // anuidade já vem na data da cobrança
    const atual = parseInt(m[1]);
    if(atual <= 1) return iso;           // parcela 1 fica na data original
    const [y,mo,d] = iso.split("-").map(Number);
    const meses = atual - 1;             // deslocar atual-1 meses à frente
    const mo2 = mo + meses;
    const y2  = y + Math.floor((mo2-1)/12);
    const mo3 = ((mo2-1)%12)+1;
    return `${y2}-${String(mo3).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  function lerCSV(texto){
    const prim = (texto.split(/\r?\n/).find(l=>l.trim())||"");
    const sep = (prim.split(";").length > prim.split(",").length) ? ";" : (prim.split("\t").length>2 ? "\t" : ",");
    const linhas=[]; let campo="",linha=[],aspas=false;
    for(let i=0;i<texto.length;i++){
      const c=texto[i];
      if(aspas){
        if(c==='"'){ if(texto[i+1]==='"'){campo+='"';i++;} else aspas=false; }
        else campo+=c;
      }else if(c==='"') aspas=true;
      else if(c===sep){ linha.push(campo); campo=""; }
      else if(c==="\n"){ linha.push(campo); linhas.push(linha); linha=[]; campo=""; }
      else if(c!=="\r") campo+=c;
    }
    if(campo||linha.length){ linha.push(campo); linhas.push(linha); }
    return linhas.filter(l=>l.some(c=>c.trim()!==""));
  }

  /* ---- leitura de células (CSV, Excel antigo .xls e .xlsx) ---- */
  const celTexto = v => String(v==null?"":v).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
  // texto UTF-8 lido como Latin-1 ("JosÃ©" -> "José", "JÃºlia" -> "Júlia")
  function consertaAcento(t){
    t=String(t==null?"":t);
    if(!/[ÃÂ][\u0080-\u00BF]/.test(t)) return t;
    try{ return decodeURIComponent(escape(t)); }catch(e){ return t; }
  }
  const celNum = v => typeof v==="number" ? v : numero(celTexto(v));
  function celData(v){
    if(typeof v==="number" && v>20000 && v<80000){           // data do Excel (número de série)
      const d=new Date(Math.round((v-25569)*864e5));
      return d.toISOString().slice(0,10);
    }
    if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);
    return dataISO(celTexto(v));
  }

  /* Acha as colunas de data, descrição e valor em qualquer extrato em tabela.
     Itaú: "data | lançamento | ag./origem | valor (R$) | saldo (R$)" (ou sem cabeçalho: data;descrição;valor)
     BB:   "Data | Lançamento/Histórico | Detalhes | Nº documento | Valor" */
  function linhasParaItens(linhas){
    let cab=-1;
    const ehHist = c => /hist[óo]rico|lan[çc]amento|descri[çc][ãa]o|estabelecimento/.test(c) && !/c[óo]d/.test(c);
    for(let i=0;i<Math.min(30,linhas.length);i++){
      const r=linhas[i].map(c=>celTexto(c).toLowerCase());
      if(r.some(c=>c==="data"||c.startsWith("data ")||c==="dt") && r.some(ehHist)){ cab=i; break; }
    }
    let iData,iHist,iVal,iDoc=-1,iDet=-1,iCred=-1,iDeb=-1,iSal=-1,ini;
    if(cab>=0){
      const c=linhas[cab].map(x=>celTexto(x).toLowerCase());
      iData=c.findIndex(x=>x==="data"||x.startsWith("data ")||x==="dt");
      iHist=c.findIndex((x,i)=>i!==iData&&/^(hist[óo]rico|lan[çc]amento|descri[çc][ãa]o)$/.test(x));
      if(iHist<0) iHist=c.findIndex((x,i)=>i!==iData&&ehHist(x));
      iDet=c.findIndex(x=>/detalhe/.test(x));
      iDoc=c.findIndex(x=>/documento|docto|n[°º]/.test(x));
      iVal=c.findIndex(x=>/^valor/.test(x)); if(iVal<0) iVal=c.findIndex(x=>x.includes("valor"));
      iCred=c.findIndex(x=>/cr[ée]dito/.test(x)); iDeb=c.findIndex(x=>/d[ée]bito/.test(x));
      iSal=c.findIndex((x,i)=>i!==iVal&&/^saldo/.test(x));
      ini=cab+1;
    } else {
      // sem cabeçalho (CSV do Itaú): data ; descrição ; valor
      const ok=linhas.slice(0,5).filter(l=>celData(l[0])).length;
      if(!ok) return {erro:"Não reconheci as colunas. Use o extrato baixado do banco (OFX, CSV ou Excel), sem alterar o arquivo."};
      iData=0; iHist=1; iVal=2; ini=0;
    }
    if(iData<0||iHist<0||(iVal<0&&iCred<0&&iDeb<0))
      return {erro:"Não reconheci as colunas de data, descrição e valor desse arquivo."};

    const itens=[], futuros=[]; let saldoAnt=null, saldoDia=null, saldoCol=null, futuro=false;
    const diaDia={}, diaCol={};   // todos os saldos de fim de dia que o extrato traz
    // Itaú: o último "SALDO TOTAL DISPONÍVEL DIA" não inclui o que foi lançado nos dias seguintes (ex.: compra de hoje).
    // Saldo real = último saldo do dia + lançamentos com data posterior a ele (os do mesmo dia, listados logo abaixo, já estão no saldo)
    let ultSaldoLinha=null; const depoisSaldo=[];
    // saldo do fim do extrato: linha "SALDO DO DIA"/"SALDO" mais recente; sem ela, a coluna de saldo da última data
    const guarda=(atual,iso,v)=>(v==null||isNaN(v))?atual:(!atual||iso>atual.iso?{iso:iso,valor:v}:atual);
    for(let i=ini;i<linhas.length;i++){
      const r=linhas[i];
      // Itaú: depois de "lançamentos futuros" vêm agendamentos que ainda não aconteceram — vão para a Previsão do mês
      if(/futur[oa]s/i.test(celTexto(r[0])+" "+celTexto(r[iData]))){ futuro=true; continue; }
      const iso=celData(r[iData]); if(!iso) continue;
      let hist=consertaAcento(celTexto(r[iHist]));
      if(iDet>=0){ const d=celTexto(r[iDet]); if(d) hist=hist?hist+" - "+d:d; }
      if(!hist) continue;
      const v = iVal>=0 ? celNum(r[iVal]) : (Math.abs(celNum(r[iCred])||0) - Math.abs(celNum(r[iDeb])||0));
      const ch=hist.toUpperCase().replace(/\s+/g,"");
      const sv = iSal>=0 && celTexto(r[iSal])!=="" ? celNum(r[iSal]) : null;
      if(futuro){
        const vf = iVal>=0 ? celNum(r[iVal]) : (Math.abs(celNum(r[iCred])||0) - Math.abs(celNum(r[iDeb])||0));
        if(vf && !/^S(AL)?DO/.test(ch)) futuros.push({iso:iso,hist:hist,valor:vf});
        continue;
      }
      if(/^S(AL)?DO/.test(ch)){
        // Itaú traz o saldo anterior na coluna de saldo, com o valor em branco
        if(/^SALDOANTERIOR/.test(ch)){ const va=sv!=null?sv:v; if(va!=null&&!isNaN(va)) saldoAnt={iso:iso,valor:va}; }
        else { const vd=sv!=null?sv:v; saldoDia=guarda(saldoDia,iso,vd);
          if(vd!=null&&!isNaN(vd)){ diaDia[iso]=vd; if(!ultSaldoLinha||iso>=ultSaldoLinha.iso){ ultSaldoLinha={iso:iso,valor:vd}; depoisSaldo.length=0; } } }
        continue;
      }
      if(sv!=null&&!isNaN(sv)){ saldoCol=guarda(saldoCol,iso,sv); diaCol[iso]=sv; }
      if(!v) continue;
      itens.push({iso:iso,hist:hist,valor:v,doc:iDoc>=0?celTexto(r[iDoc]):""});
      if(ultSaldoLinha&&iso>ultSaldoLinha.iso) depoisSaldo.push({iso:iso,valor:v});
    }
    if(ultSaldoLinha&&depoisSaldo.length){
      const isoR=depoisSaldo.reduce((m,x)=>x.iso>m?x.iso:m,ultSaldoLinha.iso);
      const vR=Math.round((ultSaldoLinha.valor+depoisSaldo.reduce((a,x)=>a+x.valor,0))*100)/100;
      diaDia[isoR]=vR; saldoDia={iso:isoR,valor:vR};
    }
    const dias=Object.keys(diaDia).length?diaDia:diaCol;
    return {itens:itens,futuros:futuros,saldoAnt:saldoAnt,saldoFim:saldoDia||saldoCol,
            saldosDia:Object.keys(dias).sort().map(d=>({iso:d,valor:dias[d]}))};
  }

  /* OFX ("Money"), que o Itaú e o BB oferecem no download do extrato */
  function lerOFX(texto){
    const blocos=texto.split(/<STMTTRN>/i).slice(1);
    if(!blocos.length) return {erro:"Não encontrei lançamentos nesse arquivo OFX."};
    const tag=(b,t)=>{ const m=b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i")); return m?m[1].trim():""; };
    const itens=blocos.map(b=>{
      const d=tag(b,"DTPOSTED");
      return {iso:d.length>=8?d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8):null,
              hist:consertaAcento(celTexto(tag(b,"MEMO")||tag(b,"NAME"))), valor:numero(tag(b,"TRNAMT")), doc:tag(b,"CHECKNUM")};
    }).filter(x=>x.iso&&x.hist&&x.valor);
    // saldo informado pelo banco no fim do arquivo (<LEDGERBAL>)
    const lb=texto.match(/<LEDGERBAL>([\s\S]*?)(<\/LEDGERBAL>|$)/i);
    let saldoFim=null;
    if(lb){ const v=tag(lb[1],"BALAMT"), d=tag(lb[1],"DTASOF");
      if(v&&d.length>=8) saldoFim={iso:d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8), valor:numero(v)}; }
    return {itens:itens,saldoAnt:null,saldoFim:saldoFim};
  }

  /* Grava itens {iso,hist,valor,doc[,categoria]} de uma origem (itau, bb, cartao, manual).
     O que já existe (mesma data, valor e descrição, na mesma origem) não entra de novo;
     por isso dá para importar a planilha e depois os extratos dos mesmos meses. */
  function gravarLinhas(itens,origem){
    const norm=s=>String(s).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"").slice(0,20);
    const fp=(d,v,h)=>d+"|"+Number(v).toFixed(2)+"|"+norm(h);
    const livres=new Map(), porDoc=new Map(), porDV=new Map(), usados=new Set();
    const nTot=s=>String(s).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"");
    dados.lancamentos.forEach(l=>{
      if(l.origem!==origem) return;
      const k=fp(l.data,l.valor,l.hist); if(!livres.has(k)) livres.set(k,[]); livres.get(k).push(l);
      const kd=l.data+"|"+Number(l.valor).toFixed(2); if(!porDV.has(kd)) porDV.set(kd,[]); porDV.get(kd).push(l);
      if(l.doc&&!l.manual) porDoc.set(l.data+"|"+l.doc+"|"+String(l.hist).slice(0,42),l);
    });
    const ids=new Set(dados.lancamentos.map(l=>l.id));
    let novos=0,repetidos=0,prontos=0,corrigidos=0; const meses=new Set();
    itens.forEach(it=>{
      const hist=celTexto(it.hist), iso=it.iso, doc=celTexto(it.doc);
      const valor=Math.round(it.valor*100)/100;
      if(!iso||!hist||!valor) return;
      const k=fp(iso,valor,hist);
      const ja=(livres.get(k)||[]).filter(l=>!usados.has(l)).sort((a,b)=>(a.ignorado?1:0)-(b.ignorado?1:0));
      if(ja.length){ const l=ja[0]; usados.add(l); if(it.tipo) l.tipo=it.tipo; if(origem!=="cartao"&&!it.categoria) l.confExtrato=true; repetidos++; return; }
      // mesma data e valor, e a descrição foi editada no app ("PAY Reale 26/09 - BAR") ou digitada à mão/na planilha
      // ("ester de lima" para "PAY CASA 05/09"): é o mesmo lançamento, não duplica
      if(origem!=="cartao"){
        const nh=nTot(hist);
        const par=(porDV.get(iso+"|"+valor.toFixed(2))||[]).find(l=>!usados.has(l)&&
          (nTot(l.hist).startsWith(nh)||nh.startsWith(nTot(l.hist))||!pareceBanco(l.hist)));
        if(par){ usados.add(par); if(!it.categoria) par.confExtrato=true; repetidos++; return; }
      }
      // mesmo documento com valor diferente: o banco corrigiu, atualiza sem perder categoria/observação
      if(doc && origem!=="cartao"){
        const velho=porDoc.get(iso+"|"+doc+"|"+hist.slice(0,42));
        if(velho){ velho.valor=valor; usados.add(velho); corrigidos++; meses.add(iso.slice(0,7)); return; }
      }
      const base=iso+"|"+origem+"|"+valor.toFixed(2)+"|"+hist.slice(0,42);
      let id=base, n=2; while(ids.has(id)) id=base+"#"+(n++);
      const categoria=it.categoria||classificar(hist,valor).categoria;
      if(categoria!=="Sem categoria") prontos++;
      const nl={id:id,data:iso,hist:hist,valor:valor,doc:doc,categoria:categoria,
                              vinculo:"PF",obs:"",origem:origem,...(it.tipo?{tipo:it.tipo}:{}),
                              ...(origem!=="cartao"&&!it.categoria?{confExtrato:true}:{})};
      dados.lancamentos.push(nl); usados.add(nl);
      ids.add(id); novos++; meses.add(iso.slice(0,7));
    });
    return {novos:novos,repetidos:repetidos,prontos:prontos,corrigidos:corrigidos,meses:[...meses],tocados:usados};
  }
  /* O extrato novo manda: no período que ele cobre (dia seguinte ao SALDO ANTERIOR até o último lançamento),
     o que veio de um extrato anterior e não está mais nele foi mudado pelo banco (outra data ou valor,
     ex.: rendimento da aplicação automática lançado em 01/10 e depois refeito em 05/10). Fica riscado — o ↺ traz de volta. */
  function riscarForaDoExtrato(r,itens,origem,g){
    if(!itens.length) return 0;
    let de=itens.reduce((m,x)=>x.iso<m?x.iso:m,itens[0].iso);
    const ate=itens.reduce((m,x)=>x.iso>m?x.iso:m,itens[0].iso);
    if(r.saldoAnt&&r.saldoAnt.iso){
      const d=new Date(r.saldoAnt.iso+"T12:00:00"); d.setDate(d.getDate()+1); const iso=d.toISOString().slice(0,10);
      if(iso<de) de=iso;
    }
    let n=0;
    dados.lancamentos.forEach(l=>{
      if(l.origem!==origem||l.ignorado||!l.confExtrato||g.tocados.has(l)) return;
      if(l.data<de||l.data>ate) return;
      l.ignorado=true; l.riscadoExtrato=true; n++;
    });
    return n;
  }
  function textoImport(r){
    return r.novos+" lançamento"+(r.novos===1?"":"s")+" importado"+(r.novos===1?"":"s")+
      (r.novos?" · "+r.prontos+" já classificado"+(r.prontos===1?"":"s"):"")+
      (r.corrigidos?" · "+r.corrigidos+" valor"+(r.corrigidos===1?"":"es")+" corrigido"+(r.corrigidos===1?"":"s"):"")+
      (r.repetidos?" · "+r.repetidos+" já estava"+(r.repetidos===1?"":"m")+" aqui":"");
  }

  /* De qual banco é o extrato? Olha o conteúdo do arquivo, não o botão escolhido.
     Evita gravar o extrato do Itaú como BB (e vice-versa), que duplica lançamentos e troca os saldos. */
  function bancoDoArquivo(txt){
    const t=String(txt||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/Ã./g," ");
    const bid=t.match(/<BANKID>\s*0*(\d+)/);
    if(bid) return bid[1]==="341"?"itau":bid[1]==="1"?"bb":null;
    const conta=(re)=>(t.match(re)||[]).length;
    const itau = 3*conta(/LOGOTIPO ITA|ITAU UNIBANCO|LANCAMENTOS FUTUROS|SAIDAS FUTURAS/g) + 2*conta(/SALDO TOTAL DISPON/g)
               + conta(/\bPAY [A-Z0-9]{2,5}\b|PIX (?:WHATS|TRANSF) |RSCSS |RSHOP |COR ITAUCOR/g);
    const bb   = 3*conta(/BANCO DO BRASIL S\.?A|BB RENDE FACIL|COBRANCA DE I\.O\.F/g)
               + 2*conta(/PIX - (?:ENVIADO|RECEBIDO)|PAGTO CARTAO CREDITO|BB CONSORCIO/g);
    if(itau>=3 && itau>=2*bb) return "itau";
    if(bb>=3 && bb>=2*itau) return "bb";
    return null;
  }
  // texto bruto de uma planilha/CSV para a detecção do banco
  const textoLinhas = ls => (ls||[]).slice(0,400).map(r=>(r||[]).map(c=>celTexto(c)).join(" ")).join("\n");

  /* Agendamentos ("lançamentos futuros" do extrato) vão para a Previsão do mês, na data em que vão cair.
     Se a previsão já tem a conta (mesmo valor), só acerta a data e liga ao extrato; senão cria a linha. */
  const chaveExt = (hist,valor) => String(hist).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"").slice(0,20)+"|"+Math.abs(valor).toFixed(2);
  function novaPrevVazia(ym){
    dados.previsoes=dados.previsoes||{};
    return dados.previsoes[ym]||(dados.previsoes[ym]={aba:"criado no app", saldo:0, fixos:[], itens:[], receitas:[], notas:[]});
  }
  function gravarFuturos(futuros,origem){
    let novos=0, ligados=0; const meses=new Set();
    const livre=i=>!i.ext && i.pago==null && i.aPagar!=null;
    const liga=(x,f,valor,k)=>{ x.data=f.iso; x.aPagar=valor; x.ext=k; x.origem=origem; ligados++; };
    const resto=[];
    // 1º: já ligado antes, ou a previsão tem exatamente esse valor
    (futuros||[]).forEach(f=>{
      const valor=Math.round(f.valor*100)/100, ym=f.iso.slice(0,7), k=chaveExt(f.hist,valor);
      const p=novaPrevVazia(ym), todas=p.itens.concat(p.fixos);
      meses.add(ym);
      let x=todas.find(i=>i.ext===k);
      if(x){ x.data=f.iso; if(x.pago==null) x.aPagar=valor; ligados++; return; }
      x=todas.find(i=>livre(i) && Math.abs(Math.abs(i.aPagar)-Math.abs(valor))<0.005);
      if(x){ liga(x,f,valor,k); return; }
      resto.push({f:f,valor:valor,k:k,p:p});
    });
    // 2º: mesma categoria com valor diferente (previsto 1.830, veio 1.799,30) — só se houver uma única conta dessa categoria
    resto.forEach(({f,valor,k,p})=>{
      const cat=classificar(f.hist,valor).categoria;
      const cands=cat==="Sem categoria"?[]:p.itens.concat(p.fixos).filter(i=>livre(i)&&catRotulo(i.d||"")===cat);
      if(cands.length===1){ liga(cands[0],f,valor,k); return; }
      p.itens.push({data:f.iso, d:f.hist+(cat!=="Sem categoria"?" ("+cat+")":""), aPagar:valor, pago:null, ext:k, origem:origem});
      novos++;
    });
    meses.forEach(ym=>ordenarPrev(dados.previsoes[ym]));
    return {novos:novos, ligados:ligados};
  }
  // o agendamento aconteceu (veio no extrato como lançamento): marca como pago na previsão
  // e, se o lançamento ainda não tem categoria própria, usa a da conta prevista ("clube" → Clube)
  function baixarPrevistos(origem){
    let n=0;
    Object.keys(dados.previsoes||{}).forEach(ym=>{
      const p=dados.previsoes[ym];
      p.itens.concat(p.fixos).forEach(x=>{
        if(!x.ext || x.pago!=null || x.aPagar==null) return;
        const l=dados.lancamentos.find(l=>l.origem===(x.origem||origem) && !l.ignorado && chaveExt(l.hist,l.valor)===x.ext &&
          Math.abs(new Date(l.data)-new Date(x.data||l.data))<=6*864e5 && l.data<=hojeISO());
        if(!l) return;
        x.pago=Math.abs(x.aPagar); x.aPagar=null; n++;
        const c=catRotulo(x.d); if(c && c!==l.categoria && !l.catManual) l.categoria=c;
      });
    });
    return n;
  }
  // linhas da previsão em ordem de data (sem data vão para o fim)
  function ordenarPrev(p){
    if(!p) return;
    const ord=(a,b)=>(a.data||"9999")<(b.data||"9999")?-1:(a.data||"9999")>(b.data||"9999")?1:0;
    p.itens.sort(ord); p.fixos.sort(ord);
  }
  // datas da previsão sempre dentro do próprio mês (a aba copiada do mês anterior vem com as datas antigas)
  function datasNoMes(ym,p){
    const [a,m]=ym.split("-").map(Number), dias=new Date(a,m,0).getDate();
    let n=0;
    p.itens.concat(p.fixos).forEach(x=>{
      if(/^\d{4}-\d{2}-\d{2}$/.test(x.data||"") && x.data.slice(0,7)!==ym && !x.ext){
        x.data=ym+"-"+String(Math.min(+x.data.slice(8),dias)).padStart(2,"0"); n++;
      }
    });
    return n;
  }

  function concluirImport(r,origem,txtBruto){
    if(!r||r.erro){ avisar((r&&r.erro)||"Não reconheci esse arquivo.",true); return; }
    let trocou="";
    if(origem==="itau"||origem==="bb"){
      const banco=bancoDoArquivo(txtBruto);
      if(banco && banco!==origem){ trocou=" (o arquivo é do "+NOMES_ORIGEM[banco]+", não do "+NOMES_ORIGEM[origem]+" — importado na conta certa)"; origem=banco; }
    }
    let itens=r.itens;
    if(origem==="cartao"){
      // fatura: pagamento da fatura não é compra; compras vêm positivas no arquivo do banco
      itens=itens.filter(i=>!/^(PAGAMENTO|PGTO|PAGTO|PAG\s*FATURA|SALDO|TOTAL)/i.test(i.hist));
      const pos=itens.filter(i=>i.valor>0).length;
      if(pos>itens.length-pos) itens.forEach(i=>{ i.valor=-i.valor; });
      itens.forEach(i=>{ i.iso=ajustarParc(i.iso,i.hist); if(!i.doc) i.doc="Cartão Itaú"; });
    }
    if(!itens.length && !(r.futuros||[]).length){ avisar("Não encontrei lançamentos nesse arquivo.",true); return; }
    if(origem!=="cartao") gravarSaldos(r,origem);
    const g=gravarLinhas(itens,origem);
    const riscados=origem!=="cartao"?riscarForaDoExtrato(r,itens,origem,g):0;
    const nCheque=origem!=="cartao"?ligarChequeEspecial():0;
    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    let fut=nCheque?" · "+nCheque+" ligado"+(nCheque===1?"":"s")+" ao cheque especial do BB":"";
    fut+=riscados?" · "+riscados+" lançamento"+(riscados===1?"":"s")+" de extrato anterior que o banco refez riscado"+(riscados===1?"":"s"):"";
    if(origem!=="cartao"){
      const f=gravarFuturos(r.futuros,origem), b=baixarPrevistos(origem);
      if(f.novos||f.ligados) fut+=" · "+(f.novos+f.ligados)+" agendamento"+(f.novos+f.ligados===1?"":"s")+" na Previsão do mês";
      if(b) fut+=" · "+b+" previsto"+(b===1?"":"s")+" marcado"+(b===1?"":"s")+" como pago"+(b===1?"":"s");
    }
    if(origem!=="cartao" && (ui.conta==="itau"||ui.conta==="bb")) ui.conta=origem;
    if(g.meses.length){ ui.mes=g.meses.sort().pop(); ui.view="mes"; }
    salvar(); render();
    avisar(NOMES_ORIGEM[origem]+": "+textoImport(g)+fut+trocou, !!trocou);
  }

  /* Saldos do banco: tudo o que o extrato informa fica gravado.
     - saldosDia[origem][dia] = saldo no fim de cada dia (linhas "SALDO TOTAL DISPONÍVEL DIA" / coluna de saldo / SALDO ANTERIOR)
     - saldos[origem:mês] = saldo do 1º dia do mês = saldo do último dia do mês anterior (só quando o extrato cobre a virada do mês)
     - conferencia[origem:mês] = saldo do banco no fim do mês (ou no último dia que o extrato traz, se o mês ainda não terminou) */
  function gravarSaldos(r,origem){
    const ok=x=>x&&x.iso&&x.valor!=null&&!isNaN(x.valor);
    const pts=[];
    if(ok(r.saldoAnt)) pts.push(r.saldoAnt);
    (r.saldosDia||[]).forEach(x=>{ if(ok(x)) pts.push(x); });
    if(ok(r.saldoFim)&&!pts.some(x=>x.iso===r.saldoFim.iso)) pts.push(r.saldoFim);
    if(!pts.length) return;
    pts.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0);
    const sd=(dados.saldosDia=dados.saldosDia||{}), mapa=(sd[origem]=sd[origem]||{});
    pts.forEach(x=>{ mapa[x.iso]=cent(x.valor); });
    // até onde o extrato vai: o período termina no último dia com saldo informado
    const ultimo=pts[pts.length-1].iso;
    // ponto de partida: a data do SALDO ANTERIOR (o extrato cobre do dia seguinte em diante)
    const inicio=ok(r.saldoAnt)?r.saldoAnt.iso:pts[0].iso;
    const meses=[...new Set(pts.map(x=>x.iso.slice(0,7)))].sort();
    const confs=(dados.conferencia=dados.conferencia||{});
    meses.forEach(ym=>{
      const doMes=pts.filter(x=>x.iso.slice(0,7)===ym), u=doMes[doMes.length-1];
      const fm=fimDoMes(ym);
      // o mês fechou dentro do extrato quando ele segue para o mês seguinte (ou o último saldo é o próprio último dia)
      const fechou=ultimo>fm || u.iso===fm;
      if(fechou){
        // saldo do fim do mês = saldo do 1º dia do mês seguinte (só se o extrato cobre a virada: começa até o fim deste mês)
        if(inicio<=fm){
          const [a,m]=ym.split("-").map(Number), prox=new Date(a,m,1);
          const kp=origem+":"+prox.getFullYear()+"-"+String(prox.getMonth()+1).padStart(2,"0");
          dados.saldos[kp]=cent(u.valor);
        }
        // conferência do mês no último dia (se o extrato só traz o SALDO ANTERIOR deste mês, ele já é o fechamento)
        if(u.iso>=inicio||u.iso===fm) confs[origem+":"+ym]={data:fm, valor:cent(u.valor), fonte:"extrato"};
      } else if(u.iso>inicio){
        // mês em andamento: confere no último dia que o extrato traz
        const c=confs[origem+":"+ym];
        if(!c||u.iso>=c.data) confs[origem+":"+ym]={data:u.iso, valor:cent(u.valor), fonte:"extrato"};
      }
    });
    // mês em que o extrato começa no meio: o SALDO ANTERIOR não é o saldo do dia 1º — não sobrescreve
  }

  function lerArquivo(arq){
    const origem=ui._origemImport||"itau"; ui._origemImport=null;
    const nome=arq.name.toLowerCase();
    if(nome.endsWith(".pdf")){ importarFaturaPDF(arq); return; }
    const fr=new FileReader();
    fr.onload=()=>{
      const buf=fr.result;
      if(/\.xls[xm]?$/.test(nome)){ lerPlanilhaOuExtrato(buf,origem,arq.name); return; }
      let texto;
      try{ texto=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
      catch(e){ texto=new TextDecoder("iso-8859-1").decode(buf); }
      if(origem==="planilha"){ avisar("A planilha de orçamento precisa ser o arquivo .xlsx.",true); return; }
      const r = /<OFX>|OFXHEADER/i.test(texto) ? lerOFX(texto) : linhasParaItens(lerCSV(texto));
      concluirImport(r,origem,texto);
    };
    fr.onerror=()=>avisar("Não consegui abrir esse arquivo.",true);
    fr.readAsArrayBuffer(arq);
  }

  function lerPlanilhaOuExtrato(buf,origem,nomeArq){
    let wb;
    try{ wb = XLSX.read(buf,{type:"array"}); }
    catch(e){ avisar("Não consegui abrir a planilha.",true); return; }
    // investimentos: movimentação ou posição da B3, ou a planilha de controle de investimentos
    const l0 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    if(ehMovB3(l0)){ importarMovB3(l0); return; }
    if(ehPlanilhaInvest(wb)){ importarPlanilhaInvest(wb); return; }
    if(ehPosicaoB3(wb)){ importarPosicaoB3(wb,nomeArq); return; }
    if(origem==="b3"){ avisar("Esse arquivo não parece ser da B3. Use Extrato › Movimentação ou Extrato › Posição, em Excel.",true); return; }
    const aba = wb.SheetNames.find(n=>/^\s*LAN[ÇC]AMENTOS\s*$/i.test(n));
    if(aba && (origem==="planilha" || wb.SheetNames.some(n=>/M[ÊE]S CORRENTE/i.test(n)))){ importarPlanilhaOrcamento(wb,aba); return; }
    if(origem==="planilha"){ avisar("Não encontrei a aba LANÇAMENTOS nessa planilha.",true); return; }
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    concluirImport(linhasParaItens(linhas),origem,textoLinhas(linhas));
  }

  /* ---- planilha "Orçamento Solano": aba LANÇAMENTOS (histórico) e MÊS CORRENTE (previsto) ---- */
  const MAPA_PLANILHA = {

  };
  function catPlanilha(cat,sub){
    const k=celTexto(cat).toLowerCase()+"|"+celTexto(sub).toLowerCase();
    return MAPA_PLANILHA[k] || MAPA_PLANILHA[k.split("|")[0]+"|"] || null;
  }
  function origemPlanilha(b){
    const s=celTexto(b).toLowerCase();
    if(/infinite|cart[ãa]o/.test(s)) return "cartao";
    if(/ita[úu]/.test(s)) return "itau";
    if(/^bb\b/.test(s)) return "bb";
    return "manual";
  }
  function importarPlanilhaOrcamento(wb,aba){
    const linhas=XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,defval:""});
    let cab=-1;
    for(let i=0;i<Math.min(30,linhas.length);i++){
      const r=linhas[i].map(c=>celTexto(c).toUpperCase());
      if(r.includes("DATA") && r.some(c=>c.startsWith("VALOR")) && r.includes("CATEGORIA")){ cab=i; break; }
    }
    if(cab<0){ avisar("A aba LANÇAMENTOS não tem o cabeçalho esperado (DATA, HISTÓRICO, VALOR, BANCO, CATEGORIA).",true); return; }
    const c=linhas[cab].map(x=>celTexto(x).toUpperCase());
    const iD=c.indexOf("DATA"), iH=c.findIndex(x=>x.startsWith("HIST")), iV=c.findIndex(x=>x.startsWith("VALOR")),
          iB=c.findIndex(x=>x.startsWith("BANCO")), iC=c.indexOf("CATEGORIA"), iS=c.indexOf("SUBCATEGORIA");
    // coluna FIXO / VARIÁVEL: pelo cabeçalho ou, se não tiver nome, pela coluna cujos valores são FIXO/VARIÁVEL
    const ehTipo=v=>/^(FIXO|VARI[ÁA]VEL)$/i.test(celTexto(v));
    let iT=c.findIndex(x=>/^TIPO|FIXO|VARI[ÁA]VEL/.test(x));
    if(iT<0){ const larg=Math.max(...linhas.slice(cab+1,cab+80).map(r=>r.length),0);
      for(let j=0;j<larg&&iT<0;j++) if(linhas.slice(cab+1,cab+80).some(r=>ehTipo(r[j]))) iT=j; }
    const porOrigem={};
    for(let i=cab+1;i<linhas.length;i++){
      const r=linhas[i];
      const iso=celData(r[iD]); if(!iso) continue;
      const valor=celNum(r[iV]); if(!valor) continue;
      const banco=iB>=0?celTexto(r[iB]):"", o=origemPlanilha(banco);
      let cat=catPlanilha(r[iC], iS>=0?r[iS]:"");
      const hist=(iH>=0?celTexto(r[iH]):"") || [celTexto(r[iC]),iS>=0?celTexto(r[iS]):""].filter(Boolean).join(" / ") || "Lançamento da planilha";
      if(ehTransfTamara(hist,valor)) cat="Transferências Tâmara";
      const tipo=iT>=0&&ehTipo(r[iT])?(/^FIXO$/i.test(celTexto(r[iT]))?"FIXO":"VARIÁVEL"):undefined;
      (porOrigem[o]=porOrigem[o]||[]).push({iso:iso,hist:hist,valor:valor,
        doc:(o==="cartao"||o==="manual")?banco:"", categoria:cat||undefined, tipo:tipo});
    }
    const tot={novos:0,repetidos:0,prontos:0,corrigidos:0};
    Object.keys(porOrigem).forEach(o=>{
      const g=gravarLinhas(porOrigem[o],o);
      ["novos","repetidos","prontos","corrigidos"].forEach(k=>tot[k]+=g[k]);
    });
    const nPrev=lerOrcamentoPlanilha(wb), ano=anoPlanilha(wb);
    const nFluxo=lerFluxoAnual(wb,ano), abasPrev=lerPrevisoes(wb,ano), temDiv=lerDividas(wb);
    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    ui.conta="dash"; ui.mes=null; ui.view="mes";
    salvar(); render();
    avisar("Planilha: "+textoImport(tot)+
      (nFluxo?" · fluxo anual ("+nFluxo+" linhas)":nPrev?" · previsto de "+nPrev+" itens":"")+
      (abasPrev.length?" · previsão de "+abasPrev.join(", "):"")+(temDiv?" · dívidas e parcelas":""));
  }
  /* ---- outras abas da planilha ---- */
  const MESES_ABREV=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  // mês de uma célula de cabeçalho: data do Excel, "2026-10", "01/10/2026", "Out", "Out-27"
  function celMes(v,ano){
    if(typeof v==="number" && v>20000 && v<80000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,7);
    if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()+12*36e5).toISOString().slice(0,7);
    const s=celTexto(v).toLowerCase();
    let m=s.match(/^(\d{4})-(\d{2})/); if(m) return m[1]+"-"+m[2];
    m=s.match(/^\d{2}\/(\d{2})\/(\d{4})/); if(m) return m[2]+"-"+m[1];
    m=s.match(/^(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:[\s\/-]*(\d{2,4}))?$/);
    if(m){
      const a=m[2]?(m[2].length===2?"20"+m[2]:m[2]):String(ano||new Date().getFullYear());
      return a+"-"+String(MESES_ABREV.indexOf(m[1])+1).padStart(2,"0");
    }
    return null;
  }
  const abaLinhas = (wb,nome) => XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:"",blankrows:true});
  function anoPlanilha(wb){
    for(const n of wb.SheetNames.filter(n=>/FLUXO|RESUMO|CONSOLIDA/i.test(n))){
      const m=abaLinhas(wb,n).slice(0,6).map(r=>r.join(" ")).join(" ").match(/20\d\d/);
      if(m) return m[0];
    }
    return String(new Date().getFullYear());
  }
  // nome da linha (aba FLUXO ANUAL) → categoria do app. A ordem importa: a primeira que bater vale.
  const ROTULOS=[
    [/pula parcela|caixinha|outras receitas/i,"Outras receitas"],[/13[ºo°]?\s*sal/i,"13º salário"],
    [/e-?\s?social/i,"Doméstica – e-Social"],[/vale.?transporte/i,"Doméstica – transporte"],
    [/provis[ãa]o dom[ée]stica/i,"Doméstica – provisão"],[/dom[ée]stica/i,"Doméstica – salário"],
    [/jardim|bab[áa]|diarista/i,"Diarista / jardim / extras"],
    [/sal[áa]rio/i,"Salário"],[/rendimento|\bfii\b/i,"Rendimentos"],[/restitui/i,"Restituição IR"],
    [/previd/i,"Previdência"],[/\biof\b/i,"IOF e taxas"],[/consignado/i,"Consignado"],
    [/financiamento/i,"Financiamento casa"],[/cons[óo]rcio/i,"Consórcio"],
    [/cemig|\bluz\b/i,"Luz (Cemig)"],[/[áa]gua|copasa/i,"Água (Copasa)"],[/internet/i,"Internet"],
    [/iptu/i,"IPTU"],[/\bsky\b/i,"TV (Sky)"],[/\btim\b|celular/i,"Celular (TIM)"],[/assinatura/i,"Assinaturas"],
    [/supermercado|feira|mercado/i,"Supermercado"],[/restaurante|lanche/i,"Bar / restaurante"],
    [/material|passeios? escola/i,"Material / passeios escola"],[/escola/i,"Escola / educação"],
    [/unimed/i,"Unimed"],[/sa[úu]de/i,"Saúde fora do plano"],
    [/uber|localiza/i,"Uber / Localiza"],[/gasolina/i,"Gasolina"],[/ipva|multa/i,"IPVA / multas"],
    [/seguro/i,"Seguro auto"],[/carro/i,"Manutenção do carro"],
    [/clube/i,"Clube"],[/corrida/i,"Corrida"],[/f[ée]rias/i,"Férias / viagem"],[/passeio|viagem/i,"Passeios"],
    [/\bpet\b|veterin/i,"Pet"],[/vestu[áa]rio/i,"Vestuário"],[/reparo|casa/i,"Manutenção da casa"],
    [/t[âãa]mara/i,"Tâmara – pessoal"],[/solano/i,"Solano – pessoal"],[/meninas|cec[íi]lia/i,"Meninas"]
  ];
  const catRotulo = r => { const x=ROTULOS.find(p=>p[0].test(r)); return x?x[1]:null; };

  // FLUXO ANUAL: as linhas da aba, com os valores de cada mês (receitas +, despesas −)
  function lerFluxoAnual(wb,ano){
    const aba=wb.SheetNames.find(n=>/FLUXO ANUAL/i.test(n)); if(!aba) return 0;
    const L=abaLinhas(wb,aba);
    let cab=-1, ms=[];
    for(let i=0;i<Math.min(15,L.length);i++){
      const x=L[i].map(c=>celMes(c,ano));
      if(x.filter(Boolean).length>=6){ cab=i; ms=x; break; }
    }
    if(cab<0) return 0;
    let iRot=L[cab].findIndex(c=>/^item$/i.test(celTexto(c))); if(iRot<0) iRot=1;
    const limpa=t=>t.replace(/^[^\wÀ-ÿ(]+/,"").trim();
    const linhas=[]; let lado="desp", fim=false;
    for(let i=cab+1;i<L.length && !fim;i++){
      const r=L[i], bruto=celTexto(r[iRot]); if(!bruto) continue;
      if(/📥|📤/.test(bruto)){ lado=/📥|RECEITA/i.test(bruto)?"rec":"desp"; linhas.push({tipo:"g", rot:limpa(bruto), lado:lado}); continue; }
      if(/RESULTADO DO M/i.test(bruto)){ fim=true; continue; }
      if(/^▸|TOTAL|RESULTADO|EXCLUINDO|^\(-\)/i.test(bruto)) continue;
      const v={};
      ms.forEach((m,j)=>{ if(m && typeof r[j]==="number" && r[j]) v[m]=Math.round(r[j]*100)/100; });
      linhas.push({tipo:"i", rot:limpa(bruto), cat:catRotulo(bruto)||"", lado:lado, v:v});
    }
    if(!linhas.some(l=>l.tipo==="i")) return 0;
    dados.fluxo={ano:ano, meses:ms.filter(Boolean), linhas:linhas};
    return linhas.filter(l=>l.tipo==="i").length;
  }

  // abas de previsão do mês (Setembro, Outubro, Novembro…), no formato da planilha:
  // A data · B detalhes · C a pagar · D pago; linhas 3–9 = separado no início do mês (fora do "a pagar");
  // E/F = SALDO e FII · J/K = receitas esperadas · demais valores soltos = anotações
  function lerPrevisoes(wb,ano){
    const nomes=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
    const lidos=[];
    wb.SheetNames.forEach(nome=>{
      const k=nomes.findIndex(m=>nome.trim().toLowerCase().startsWith(m)); if(k<0) return;
      const ym=ano+"-"+String(k+1).padStart(2,"0");
      const p={aba:nome.trim(), saldo:0, fixos:[], itens:[], receitas:[], notas:[]};
      const num=x=>typeof x==="number";
      abaLinhas(wb,nome).forEach((r,i)=>{
        if(i<1) return;
        const d=celTexto(r[1]);
        if(i>=2 && d){
          const x={data:celData(r[0])||"", d:d, aPagar:num(r[2])?r[2]:null, pago:num(r[3])?Math.abs(r[3]):null};
          (i<9?p.fixos:p.itens).push(x);
        }
        const e=celTexto(r[4]), F=r[5], g=celTexto(r[6]);
        if(num(F)){
          if(/^saldo$/i.test(e)) p.saldo=F;
          else if(/^fii$/i.test(e)) p.receitas.push({d:"FII", v:F});
          else if(!/^(a pagar|a receber|deficit|d[ée]ficit)/i.test(e)) p.notas.push({d:e||g||"", v:F});
        }
        const j=celTexto(r[9]), K=r[10];
        if(j) p.receitas.push({d:j, v:num(K)?K:null});
        else if(num(K)) p.notas.push({d:"", v:K});
      });
      if(p.itens.length||p.fixos.length){
        // a aba é copiada do mês anterior: as datas passam para este mês; agendamentos já importados continuam ligados
        datasNoMes(ym,p);
        const velho=(dados.previsoes||{})[ym];
        if(velho) velho.itens.concat(velho.fixos).filter(x=>x.ext).forEach(x=>{
          const y=p.itens.concat(p.fixos).find(i=>!i.ext&&i.pago==null&&i.aPagar!=null&&Math.abs(Math.abs(i.aPagar)-Math.abs(x.aPagar||x.pago||0))<0.005);
          if(y){ y.data=x.data; y.ext=x.ext; y.origem=x.origem; } else p.itens.push(x);
        });
        ordenarPrev(p);
        (dados.previsoes=dados.previsoes||{})[ym]=p; lidos.push(nome.trim());
      }
    });
    return lidos;
  }

  // PARCELAMENTOS CARTÃO, CONSÓRCIO, CONSIGNADOS e CONSOLIDA
  function lerDividas(wb){
    const aba=re=>wb.SheetNames.find(n=>re.test(n));
    const dv={parcelas:[], consorcio:[], consignados:[], consolida:null, quitacao:[], faturaAvulsos:{}};
    const valsDe=(r,ms)=>{ const o={}; ms.forEach((m,j)=>{ if(m && typeof r[j]==="number" && r[j]) o[m]=Math.round(r[j]*100)/100; }); return o; };
    let a=aba(/PARCELAMENTO/i);
    if(a){
      const L=abaLinhas(wb,a), cab=L.findIndex(r=>r.some(c=>/^descri/i.test(celTexto(c))));
      if(cab>=0){
        const h=L[cab].map(celTexto), ms=L[cab].map(c=>celMes(c));
        const iCar=h.findIndex(x=>/^cart/i.test(x)), iDes=h.findIndex(x=>/^descri/i.test(x)),
              iCat=h.findIndex(x=>/^categoria/i.test(x)), iSub=h.findIndex(x=>/^subcat/i.test(x));
        for(let i=cab+1;i<L.length;i++){
          const r=L[i], car=celTexto(r[iCar]), d=celTexto(r[iDes]);
          if(/FATURA/i.test(car) && !/TOTAL/i.test(car)){ dv.faturaAvulsos=valsDe(r,ms); continue; }
          if(/TOTAL PARCEL/i.test(car)){
            // a fórmula do total (ex.: SUM(N7:N22)) diz quais linhas contam; as de fora vêm desmarcadas
            const j0=ms.findIndex(Boolean), cel=j0>=0?wb.Sheets[a][XLSX.utils.encode_cell({r:i,c:j0})]:null;
            const mf=cel&&cel.f?String(cel.f).match(/SUM\(\$?[A-Z]+\$?(\d+):\$?[A-Z]+\$?(\d+)\)/i):null;
            if(mf) dv.parcelas.forEach(p=>{ if(p._linha<+mf[1]||p._linha>+mf[2]) p.foraTotal=true; });
            continue;
          }
          if(/TOTAL|^\*/i.test(car)) continue;
          if(!d) continue;
          const vals=valsDe(r,ms);
          if(Object.keys(vals).length) dv.parcelas.push({cartao:car, desc:d, cat:catPlanilha(r[iCat],iSub>=0?r[iSub]:"")||"", vals:vals, _linha:i+1});
        }
      }
    }
    a=aba(/CONS[ÓO]RCIO/i);
    if(a){
      const L=abaLinhas(wb,a), cab=L.findIndex(r=>/ve[íi]culo/i.test(celTexto(r[0])));
      if(cab>=0){
        const ms=L[cab].map(c=>celMes(c));
        for(let i=cab+1;i<L.length;i++){
          const r=L[i], nome=celTexto(r[0]);
          if(!nome) continue; if(/TOTAL/i.test(nome)) break;
          dv.consorcio.push({nome:nome, situacao:celTexto(r[1]), parcelas:typeof r[2]==="number"?r[2]:null,
            quitacao:typeof r[3]==="number"?r[3]:null, vals:valsDe(r,ms)});
        }
      }
    }
    a=aba(/CONSIGNADO/i);
    if(a){
      const L=abaLinhas(wb,a), tot={};
      const hc=L.findIndex(r=>r.some(c=>/total parcelas/i.test(celTexto(c))));
      if(hc>=0){
        const iT=L[hc].map(celTexto).findIndex(x=>/total parcelas/i.test(x));
        for(let i=hc+1;i<L.length;i++){ const k=celTexto(L[i][0]); if(!k) break; tot[k]=L[i][iT]; }
      }
      const hs=L.findIndex(r=>r.some(c=>/parcela atual/i.test(celTexto(c))));
      if(hs>=0){
        const h=L[hs].map(celTexto), ix=re=>h.findIndex(x=>re.test(x));
        const iP=ix(/^pmt/i), iA=ix(/parcela atual/i), iR=ix(/restantes/i), iS=ix(/saldo devedor/i),
              iQ=ix(/para quitar/i), iV=ix(/vencimento/i), iPc=ix(/quitado/i);
        for(let i=hs+1;i<L.length;i++){
          const r=L[i], k=celTexto(r[0]);
          if(!k||/^TOTA/i.test(k)) break;
          dv.consignados.push({contrato:k, pmt:+r[iP]||0, atual:+r[iA]||0, total:+tot[k]||null, restantes:+r[iR]||0,
            saldo:+r[iS]||0, quitar:+r[iQ]||0, venc:celMes(r[iV]), pct:+r[iPc]||0});
        }
      }
    }
    a=aba(/CONSOLIDA/i);
    if(a){
      const L=abaLinhas(wb,a), hm=L.findIndex(r=>r.slice(1).filter(c=>celMes(c)).length>=6);
      if(hm>=0){
        const ms=L[hm].map(c=>celMes(c)), linhas=[];
        for(let i=hm+1;i<L.length;i++){
          const nome=celTexto(L[i][0]); if(!nome) continue;
          if(/QUITA/i.test(nome)){
            for(let j=i+1;j<L.length;j++){ const n2=celTexto(L[j][0]); if(n2 && typeof L[j][1]==="number") dv.quitacao.push({nome:n2, v:L[j][1]}); }
            break;
          }
          if(/^total$/i.test(nome)) continue;
          const vals=valsDe(L[i],ms); if(Object.keys(vals).length) linhas.push({nome:nome, vals:vals});
        }
        dv.consolida={meses:ms.filter(Boolean), linhas:linhas};
      }
    }
    dv.parcelas.forEach(p=>{ delete p._linha; });
    if(dv.parcelas.length||dv.consorcio.length||dv.consignados.length||dv.consolida){ dados.dividas=dv; return true; }
    return false;
  }

  // previsto da aba MÊS CORRENTE (colunas CATEGORIA / ITEM, PREVISTO, cat, subcat)
  function lerOrcamentoPlanilha(wb){
    const aba=wb.SheetNames.find(n=>/M[ÊE]S CORRENTE/i.test(n)); if(!aba) return 0;
    const linhas=XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,defval:""});
    let cab=-1;
    for(let i=0;i<Math.min(20,linhas.length);i++){
      if(linhas[i].some(x=>/CATEGORIA\s*\/\s*ITEM/i.test(celTexto(x)))){ cab=i; break; }
    }
    if(cab<0) return 0;
    const c=linhas[cab].map(x=>celTexto(x).toLowerCase());
    const iL=c.findIndex(x=>/categoria\s*\/\s*item/.test(x)), iP=c.indexOf("previsto"),
          iC=c.indexOf("cat"), iS=c.indexOf("subcat");
    if(iL<0||iP<0) return 0;
    const o={}; let n=0, secao="";
    for(let i=cab+1;i<linhas.length;i++){
      const r=linhas[i], rot=celTexto(r[iL]);
      if(!rot) continue;
      if(/📥|RECEITAS/.test(rot)&&!/TOTAL/i.test(rot)&&typeof r[iP]!=="number"){ secao="rec"; continue; }
      if(/📤/.test(rot)){ secao="desp"; continue; }
      if(/^▸|^TOTAL|^RESULTADO/i.test(rot)) continue;
      const p=r[iP]; if(typeof p!=="number"||!p) continue;
      let cat=iC>=0?catPlanilha(r[iC],iS>=0?r[iS]:""):null;
      if(!cat && secao==="rec"){
        cat=/13/.test(rot)?"13º salário":/sal[áa]rio/i.test(rot)?"Salário":/rendimento/i.test(rot)?"Rendimentos":
            /restitui/i.test(rot)?"Restituição IR":"Outras receitas";
      }
      if(!cat) continue;
      o[cat]=Math.round(((o[cat]||0)+(ehReceita(cat)?p:Math.abs(p)))*100)/100; n++;
    }
    if(n>=5){ dados.orcamento=o; return n; }
    return 0;
  }

  /* ================= importação PDF da fatura do cartão — sem API ================= */
  async function importarFaturaPDF(arq){
    avisar("Lendo a fatura…");

    // configurar worker do PDF.js
    if(typeof pdfjsLib==="undefined"){
      avisar("Biblioteca PDF não carregou. Verifique sua conexão e tente novamente.",true); return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

    const buf = await arq.arrayBuffer();
    let pdfDoc;
    // PDF com senha (fatura do BB): pede a senha só para abrir; ela não é guardada
    let senha, tentativas=0;
    while(true){
      try{ pdfDoc = await pdfjsLib.getDocument({data:buf.slice(0), password:senha}).promise; break; }
      catch(e){
        if(e && e.name==="PasswordException" && tentativas<3){
          senha = prompt(tentativas===0
            ? "Esta fatura tem senha. Digite a senha do PDF:"
            : "Senha incorreta. Tente de novo:");
          if(senha===null){ avisar("Importação cancelada.",true); return; }
          tentativas++; continue;
        }
        avisar(e && e.name==="PasswordException"
          ? "Senha incorreta. Importação cancelada."
          : "Não consegui abrir o PDF.",true);
        return;
      }
    }

    // ler os itens de texto de cada página, com a posição (x, y) de cada um
    const paginas = [], larguras = [];
    for(let p=1;p<=pdfDoc.numPages;p++){
      const page = await pdfDoc.getPage(p);
      const content = await page.getTextContent();
      paginas.push(content.items.filter(it=>it.str && it.str.trim()!==""));
      larguras.push(page.getViewport({scale:1}).width);
    }
    // agrupar itens da mesma linha visual pela posição Y (evita que uma linha "engula"
    // a data e o valor da linha seguinte)
    const agruparLinhas = itens=>{
      const ord = itens.slice().sort((a,b)=> b.transform[5]-a.transform[5] || a.transform[4]-b.transform[4]);
      const linhas=[]; let linha=null, ultY=null;
      ord.forEach(it=>{
        const y = it.transform[5];
        if(linha===null || Math.abs(y-ultY)>2){ linha={y:y,itens:[]}; linhas.push(linha); ultY=y; }
        linha.itens.push(it);
      });
      linhas.forEach(l=>{ l.itens.sort((a,b)=>a.transform[4]-b.transform[4]); l.txt=l.itens.map(i=>i.str).join(" "); });
      return linhas;
    };
    const textoTotal = paginas.map(it=>agruparLinhas(it).map(l=>l.txt).join("\n")).join("\n");
    // demonstrativo do financiamento imobiliário (Itaú: "Demonstrativo Descritivo de Crédito")
    if(/Demonstrativo Descritivo de Cr[ée]dito|Evolu[çc][ãa]o de Saldo Devedor/i.test(textoTotal)){ importarFinanciamento(textoTotal); return; }
    const dataBR = s => s ? s.split("/").reverse().join("-") : "";
    const numBR  = s => parseFloat(String(s).replace(/\./g,"").replace(",","."));

    // detectar cartão e datas da fatura
    const mCartao = textoTotal.match(/Final\s+(\d{4})/i);
    const cartao  = mCartao ? "Final "+mCartao[1] : ((dados.faturaFechada&&dados.faturaFechada.cartao)||"Cartão");
    // data de referência da fatura: fechamento (BB) ou emissão/vencimento (Itaú)
    const mFecha = textoTotal.match(/Fatura fechada em\s+(\d{2})\/(\d{2})\/(\d{4})/i)
                || textoTotal.match(/Emiss[ãa]o:?\s*(\d{2})\/(\d{2})\/(\d{4})/i)
                || textoTotal.match(/Vencimento:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
    const hoje = new Date();
    const anoFatura    = mFecha ? parseInt(mFecha[3]) : hoje.getFullYear();
    const mesFechamento= mFecha ? parseInt(mFecha[2]) : hoje.getMonth()+1;
    // "Lançamentos Futuros" = fatura ainda em aberto (layout em duas colunas)
    const ehAberta = !mFecha && /Lan[çc]amentos Futuros/i.test(textoTotal);

    const brutos = []; // {dd,mm,desc,v} — v positivo = compra, negativo = crédito
    let pendentes=0, pendTotal=0;
    if(ehAberta){
      paginas.forEach(itens=>{
        // cada cabeçalho "Data" abre uma coluna
        const xs = itens.filter(i=>i.str.trim()==="Data").map(i=>i.transform[4]).sort((a,b)=>a-b);
        const cortes=[];
        xs.forEach(x=>{ if(!cortes.length || x-cortes[cortes.length-1]>40) cortes.push(x); });
        if(!cortes.length) cortes.push(0);
        const cols = cortes.map(()=>[]);
        itens.forEach(it=>{ let c=0; cortes.forEach((x,i)=>{ if(it.transform[4]>=x-6) c=i; }); cols[c].push(it); });
        cols.forEach(col=>{
          let emProc=false;
          agruparLinhas(col).forEach(l=>{
            if(/Lan[çc]amentos em processamento/i.test(l.txt)){ emProc=true; return; }
            const m = l.txt.match(/^\s*(\d{2})\/(\d{2})\s+(.+?)\s+(?:R\$\s*)?(-?[\d.]*\d,\d{2})\s*$/);
            if(!m) return; // cabeçalhos e a linha da cidade (continuação) ficam de fora
            const v = numBR(m[4]);
            if(emProc){ pendentes++; pendTotal+=v; return; }
            brutos.push({dd:m[1],mm:m[2],desc:m[3].trim().replace(/\s+R\$$/,""),v:v});
          });
        });
      });
    } else {
      // fatura fechada: "DD/MM DESCRIÇÃO [país] [R$] [-]N,NN". O Itaú imprime em duas colunas
      // por página: separa as colunas pela posição X das datas e lê cada uma de cima para baixo.
      // "Compras parceladas - próximas faturas" fica de fora (ainda não foi cobrado).
      const RE = /(\d{2})\/(\d{2})\s+(.+?)\s+(?:[A-Z]{2}\s+)?(?:R\$\s*)?(-\s?)?(\d{1,3}(?:\.\d{3})*,\d{2})(?=\s|$)/g;
      let futuras=false;
      paginas.forEach((itens,pi)=>{
        const larg=larguras[pi]||600;
        const datas=itens.filter(i=>/^\d{2}\/\d{2}\b/.test(i.str.trim()));
        const dir=datas.filter(i=>i.transform[4]>larg*0.45);
        const cols = (dir.length>=3 && datas.length-dir.length>=3)
          ? (x=>[itens.filter(i=>i.transform[4]<x), itens.filter(i=>i.transform[4]>=x)])(Math.min(...dir.map(i=>i.transform[4]))-4)
          : [itens];
        cols.forEach(col=>agruparLinhas(col).forEach(l=>{
          // só o título da seção (Itaú: "Compras parceladas - próximas faturas"); o BB cita "próximas faturas" no meio de um texto da 1ª página
          if(/compras parceladas\s*[-–]\s*pr[óo]ximas faturas/i.test(l.txt) || (l.txt.length<45 && /pr[óo]ximas faturas/i.test(l.txt))){ futuras=true; return; }
          if(futuras) return;
          let m; RE.lastIndex=0;
          while((m=RE.exec(l.txt))){
            const desc=m[3].trim().replace(/\s+R\$$/,"");
            if(desc.length<2||/^(total|subtotal|lan[çc]amentos)/i.test(desc)) continue;
            brutos.push({dd:m[1],mm:m[2],desc:desc,v:(m[4]?-1:1)*numBR(m[5])});
          }
        }));
      });
    }

    const lancamentos = [];
    let somaAberta = 0;
    brutos.forEach(b=>{
      const desc2 = b.desc;
      // pagamentos da fatura e o estorno de pagamento em duplicidade (BB: "ESTORNO C/ CRED.CONTA") não são compras
      if(/^(PGTO|PAGTO|PAGAMENTO|PAG\s|SALDO FATURA|TOTAL|ESTORNO C\/?\s*CRED)/i.test(desc2)) return;
      // ANTEC = parcelas antecipadas cobradas pelo banco — são cobranças reais
      const ehAntec = /^ANTEC\s+\d{2}\/\d{2}-/i.test(desc2);
      const desc3 = ehAntec
        ? desc2.replace(/^ANTEC\s+(\d{2}\/\d{2})-\s*/i,"").trim() + ` (antecipada ${desc2.match(/^ANTEC\s+(\d{2}\/\d{2})/i)[1]})`
        : desc2;
      const v = b.v;
      if(isNaN(v)||v===0) return;
      somaAberta += v;
      const valorApp = v > 0 ? -v : Math.abs(v);
      const mesCompra = parseInt(b.mm);
      const ano = mesCompra > mesFechamento ? anoFatura - 1 : anoFatura;
      const iso = `${ano}-${b.mm}-${b.dd}`;
      // a fatura imprime a data ORIGINAL da compra, mesmo na parcela 02/04, 03/04...
      lancamentos.push({data:ajustarParc(iso, desc3), hist:desc3, valor:valorApp, doc:cartao});
    });

    if(!lancamentos.length){
      avisar("Não encontrei lançamentos no PDF. Use o PDF original da fatura baixado do app ou site do banco.",true); return;
    }

    // resumo da fatura para mostrar na visão geral
    if(ehAberta){
      dados.faturaAberta = {cartao:cartao, total:Math.round(somaAberta*100)/100,
        pendente:Math.round(pendTotal*100)/100, nPendentes:pendentes,
        atualizadoEm:hoje.toISOString().slice(0,10),
        fechamento:(dados.faturaFechada&&dados.faturaFechada.proxFechamento)||""};
    } else if(mFecha){
      const mTot  = textoTotal.match(/Total desta fatura\s*:?\s*(?:R\$)?\s*([\d.]+,\d{2})/i)
                 || textoTotal.match(/\bTotal\s+R\$\s*([\d.]+,\d{2})/);
      const mVenc = textoTotal.match(/Vencimento[\s\S]{0,120}?(\d{2}\/\d{2}\/\d{4})/);
      const mProx = textoTotal.match(/Fechamento da pr[óo]xima fatura\s+(\d{2}\/\d{2}\/\d{4})/i);
      const fechadaEm = `${mFecha[3]}-${mFecha[2]}-${mFecha[1]}`;
      if(!dados.faturaFechada || (dados.faturaFechada.fechadaEm||"") <= fechadaEm)
        dados.faturaFechada = {cartao:cartao, fechadaEm:fechadaEm,
          total: mTot ? numBR(mTot[1]) : null,
          vencimento: mVenc ? dataBR(mVenc[1]) : "",
          proxFechamento: mProx ? dataBR(mProx[1]) : ""};
    }

    // Evitar duplicar: a mesma compra pode vir escrita um pouco diferente na fatura
    // em aberto e na fechada ("DUROKE CASA DE CARNE BELO" × "...BELO HORIZONT").
    // Compara data + valor + começo da descrição; compras iguais no mesmo dia contam
    // uma a uma (duas de R$ 29,90 no mesmo dia são duas compras).
    const norm = s => String(s).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"");
    const parecido = (a,b)=>{ a=norm(a); b=norm(b); const n=Math.min(8,a.length,b.length); return n>0 && a.slice(0,n)===b.slice(0,n); };
    const livres = new Map();
    dados.lancamentos.forEach(l=>{
      if(l.origem!=="cartao") return;
      const k = l.data+"|"+Number(l.valor).toFixed(2);
      if(!livres.has(k)) livres.set(k,[]);
      livres.get(k).push(l);
    });
    const idsUsados = new Set(dados.lancamentos.map(l=>l.id));
    let novos=0, repetidos=0, prontos=0, conferidos=0;
    const mesesTocados = new Set();
    // lançamentos do cartão que vieram da planilha ou foram digitados (descrição própria, data aproximada):
    // a fatura confirma pelo valor e data (até 4 dias), mantém a categoria e passa a usar a descrição do banco
    const familia = t => /infinite|ita[uú]/i.test(t) ? "itau" : /\bbb\b|altus|ourocard|banco do brasil/i.test(t) ? "bb" : "";
    const famFatura = /ourocard|bb\.com\.br|altus/i.test(textoTotal) ? "bb" : /ita[uú]/i.test(textoTotal) ? "itau" : "";
    const digitados = dados.lancamentos.filter(x=>!x.confFatura && !x.ignorado &&
      (x.origem==="cartao" || (x.origem==="manual" && famFatura && familia(x.doc||"")===famFatura)) &&
      (!famFatura || !familia(x.doc||"") || familia(x.doc||"")===famFatura));
    const dDias = (a,b) => Math.abs(new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5;

    lancamentos.forEach(l=>{
      const k = l.data+"|"+l.valor.toFixed(2);
      const cand = livres.get(k)||[];
      const i = cand.findIndex(x=>parecido(x.hist,l.hist));
      if(i>=0){ const x=cand.splice(i,1)[0]; x.confFatura=true; repetidos++; return; }
      const j = digitados.findIndex(x=>Math.abs(x.valor-l.valor)<0.005 && dDias(x.data,l.data)<=4);
      if(j>=0){
        const x = digitados.splice(j,1)[0];
        if(x.hist!==l.hist && !x.obs) x.obs = x.hist;
        x.hist = l.hist; x.data = l.data; x.doc = l.doc; x.origem = "cartao"; x.confFatura = true;
        if(x.categoria==="Sem categoria"){ const c=classificar(l.hist,l.valor); x.categoria=c.categoria; }
        conferidos++; mesesTocados.add(l.data.slice(0,7)); return;
      }
      const base = l.data+"|cartao|"+l.valor.toFixed(2)+"|"+l.hist.slice(0,42);
      let id = base, n = 2;
      while(idsUsados.has(id)) id = base+"#"+(n++);
      // valor positivo vindo do cartão = estorno/crédito de compra
      let c = classificar(l.hist, l.valor);
      if(l.valor > 0 && c.categoria==="Sem categoria") c = {categoria:"Reembolso e estorno"};
      if(c.categoria!=="Sem categoria") prontos++;
      dados.lancamentos.push({id, data:l.data, hist:l.hist, valor:l.valor,
        doc:l.doc, categoria:c.categoria, vinculo:"PF", obs:"", origem:"cartao", confFatura:true});
      idsUsados.add(id); novos++;
      mesesTocados.add(l.data.slice(0,7));
    });

    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(mesesTocados.size){ ui.mes=[...mesesTocados].sort().pop(); ui.view="mes"; }
    salvar(); render();
    avisar(novos+" lançamento"+(novos===1?"":"s")+" do cartão importado"+(novos===1?"":"s")+
           (novos?" · "+prontos+" já classificado"+(prontos===1?"":"s"):"")+
           (repetidos?" · "+repetidos+" já existia"+(repetidos===1?"":"m"):"")+
           (conferidos?" · "+conferidos+" da planilha conferido"+(conferidos===1?"":"s")+" com a fatura":"")+
           (ehAberta?" · fatura em aberto: R$ "+brl(somaAberta)+(pendTotal?" (+ R$ "+brl(pendTotal)+" em processamento)":""):""));
  }
  function barraFatura(){

      '<div class="bf-lado"><span class="bf-ult">Importe a fatura atual para ver o valor em aberto</span>'+bt+'</div>'+
    '</section>';
