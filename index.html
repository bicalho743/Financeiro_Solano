      return;
    }
    const v=e.target.closest("[data-view]");
    if(v){ ui.view=v.dataset.view; render(); return; }
    const p=e.target.closest("[data-passo]");
    if(p&&!p.disabled){
      const ms=ui._meses||[], i=ms.indexOf(ui.mes), n=i+(+p.dataset.passo);
      if(n>=0&&n<ms.length){ ui.mes=ms[n]; render(); }
    }
  });
  $("#abas").addEventListener("change",e=>{
    if(e.target.id==="selMes"){ ui.mes=e.target.value; render(); }
  });

  // menus do cabeçalho
  function fecharMenus(){ document.querySelectorAll(".menu").forEach(m=>m.hidden=true);
    document.querySelectorAll("[aria-haspopup]").forEach(b=>b.setAttribute("aria-expanded","false")); }
  [["btImportarMenu","menuImportar"],["btMais","menuMais"]].forEach(([b,m])=>{
    document.getElementById(b).onclick=e=>{
      e.stopPropagation();
      const menu=document.getElementById(m), abrir=menu.hidden;
      fecharMenus(); menu.hidden=!abrir; e.currentTarget.setAttribute("aria-expanded",String(abrir));
    };
  });
  document.addEventListener("click",e=>{ if(!e.target.closest(".menu")) fecharMenus(); else if(e.target.closest(".menu button")) fecharMenus(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecharMenus(); });

  $("#arqPdf").onchange=e=>{ if(e.target.files[0]) importarFaturaPDF(e.target.files[0]); e.target.value=""; };
  const abrirImport = o => { ui._origemImport=o; $("#arqCsv").click(); };
  $("#btImpItau").onclick=()=>abrirImport("itau");
  $("#btImpBB").onclick=()=>abrirImport("bb");
  $("#btImpCartao").onclick=()=>abrirImport("cartao");
  $("#btImpPlanilha").onclick=()=>abrirImport("planilha");
  $("#arqCsv").onchange=e=>{ if(e.target.files[0]) lerArquivo(e.target.files[0]); e.target.value=""; };
  $("#btBackup").onclick=exportarBackup;
  $("#btExportar").onclick=exportarCSV;
  $("#btLimpar").onclick=()=>{
    modal(
      '<h3 class="modal-tit">Limpar todo o histórico?</h3>'+
      '<p class="modal-corpo">Os '+dados.lancamentos.length+' lançamentos, as regras aprendidas e os saldos serão apagados '+
      '<b>da nuvem também</b>. Faça um backup antes (menu ⋯ › Salvar backup).</p>'+
      '<form onsubmit="return false"><label>Para confirmar, digite APAGAR'+
      '<input name="conf" autocomplete="off" required pattern="APAGAR"></label>'+
      '<div class="modal-acoes"><button type="button" class="bt vazado" data-modal="cancelar">Cancelar</button>'+
      '<button type="button" class="bt" data-modal="ok" style="background:var(--tijolo);border-color:var(--tijolo)">Apagar tudo</button></div></form>'
    ).then(f=>{
      if(!f||f.conf!=="APAGAR") return;
      dados.lancamentos=[];
      dados.saldos={};
      dados.regras=REGRAS_PADRAO.slice();
      dados.prolabore=0; dados.orcamento=null; dados.versao=3;
      dados.orcamentoMes={}; dados.contas={}; dados.dividas=null; dados.previsoes={}; dados.fluxo=null;
      dados.faturaAberta=null; dados.faturaFechada=null;
      ui={mes:null,view:"mes",busca:"",cat:"",tipo:"",vinculo:"",sortCol:"data",sortDir:1,conta:ui.conta||"dash"};
      salvar(); render();
      avisar("Histórico apagado. Importe os extratos novamente.");
    });
  };
  $("#btRestaurar").onclick=()=>$("#arqJson").click();
  $("#arqJson").onchange=e=>{ if(e.target.files[0]) restaurarBackup(e.target.files[0]); e.target.value=""; };
  $("#btLancar").onclick=()=>adicionarManual(NOMES_ORIGEM[ui.conta]?ui.conta:"manual");

  // listener de sessão — dispara quando Google redireciona de volta
  sb.auth.onAuthStateChange(async(event, session)=>{
    const eraLogado = !!sbUser;
    sbUser = session?.user || null;
    atualizarBarraUsuario();

    if(event==="SIGNED_IN" && !eraLogado){
      // verificar se há dados no Supabase
      const remoto = await sbCarregar().catch(()=>null);
      if(!remoto && dados.lancamentos.length>0){
        // migrar dados locais para o Supabase
        await salvarImediato();
        avisar("Dados migrados para a nuvem. Agora sincronizados em qualquer dispositivo.");
      } else if(remoto){
        // carregar dados do Supabase (podem ser mais recentes)
        dados.lancamentos = remoto.lancamentos||[];
        dados.saldos      = remoto.saldos||{};
        dados.regras      = (remoto.regras&&remoto.regras.length)?remoto.regras:REGRAS_PADRAO.slice();
        dados.prolabore   = remoto.prolabore||0;
        dados.faturaAberta = remoto.faturaAberta||null;
        dados.faturaFechada= remoto.faturaFechada||null;
        dados.orcamento   = remoto.orcamento||null;
        dados.orcamentoMes= remoto.orcamentoMes||{};
        dados.contas      = remoto.contas||{};
        dados.previsoes   = remoto.previsoes||{};
        dados.fluxo       = remoto.fluxo||null;
        dados.dividas     = remoto.dividas||null;
        dados.versao      = remoto.versao||0;
        migrar();
        if(dados._migrou){ delete dados._migrou; salvar(); }
        render();
        avisar("Dados carregados da nuvem.");
      }
    }
  });

  carregar().then(render);
})();
</script>

</html>
