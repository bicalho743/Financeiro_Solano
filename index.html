<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro — Solano Bicalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --verde:#2F4A3C; --verde-suave:#6E8A78; --ouro:#785E28;
    --marfim:#F5F1E9; --tinta:#26251F; --cinza:#6B685F;
    --linha:#DEDBD3; --linha-clara:#EBE8E1;
    --tijolo:#C0392B; --papel:#FFFFFF;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Jost',Futura,'Century Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  #lc{font-family:var(--sans);color:var(--tinta);background:var(--papel);
      font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 60px}
  #lc h1,#lc h2,#lc h3{margin:0;font-weight:500}
  #lc button{font-family:var(--sans);cursor:pointer}
  #lc :focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){#lc *{transition:none!important;animation:none!important}}

  /* ---- seletor de conta ---- */
  .conta-tabs{display:flex;gap:0;border-bottom:2px solid var(--linha);background:#fff;padding:0 28px}
  .conta-tab{font-family:var(--sans);font-size:13px;letter-spacing:.06em;padding:11px 22px;
             border:none;background:transparent;color:var(--cinza);cursor:pointer;
             border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s}
  .conta-tab:hover{color:var(--tinta)}
  .conta-tab.ativa{color:var(--verde);border-bottom-color:var(--verde);font-weight:500}
  .conta-ativa-badge{font-size:12px;letter-spacing:.1em;color:var(--cinza);
                     padding:10px 0 0;font-weight:500}
  .conta-tab[data-conta=pj].ativa{color:#1E8A5F;border-bottom-color:#1E8A5F}
  .conta-tab[data-conta=cpf],.conta-tab[data-conta=pj]{font-size:15px;font-weight:500;padding:13px 26px}
  .conta-tab[data-conta=cpf].ativa{color:#2E86DE;border-bottom-color:#2E86DE}
  .conta-sep{margin-left:auto;align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);padding-right:4px}
  .conta-tab.banco{font-size:12px;padding:11px 14px}
  .conta-tab.banco.ativa{color:#5B4FCF;border-bottom-color:#5B4FCF}
  .limite-mei{border:1px solid var(--linha);border-radius:4px;padding:14px 16px;margin:16px 0 4px;background:#fff}
  .limite-mei .barra{position:relative;height:12px;background:var(--linha-clara);border-radius:6px;margin:10px 0 6px;overflow:visible}
  .limite-mei .barra i{display:block;height:100%;border-radius:6px}
  .limite-mei .marca{position:absolute;top:-4px;bottom:-4px;width:2px;background:#C0392B}
  .limite-mei .leg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza)}
  .sep-painel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 24px}
  .sep-card{border:1px solid var(--linha);border-radius:4px;padding:12px 14px;border-left:4px solid var(--sc)}
  .sep-card .t{font-size:12px;color:var(--cinza);line-height:1.35;min-height:32px}
  .sep-card .v{font-family:var(--serif);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
  .sep-card .s{font-size:11.5px;color:var(--cinza);margin-top:2px}
  .sep-card.clic{cursor:pointer}.sep-card.clic:hover{background:var(--marfim)}
  @media (max-width:900px){.sep-painel{grid-template-columns:1fr 1fr}}

  /* ---- tela de login ---- */
  #telaLogin{position:fixed;inset:0;background:var(--papel);display:flex;align-items:center;
             justify-content:center;z-index:100;flex-direction:column;gap:0}
  #telaLogin.oculta{display:none}
  .login-card{background:#fff;border:1px solid var(--linha);border-radius:4px;
              padding:52px 48px;max-width:420px;width:90%;text-align:center;
              box-shadow:0 8px 40px rgba(38,37,31,.10)}
  .login-logo{font-family:var(--serif);font-size:42px;font-weight:500;color:var(--tinta);
              letter-spacing:-.01em;line-height:1;margin-bottom:6px}
  .login-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);
             margin-bottom:40px}
  .login-titulo{font-size:15px;color:var(--cinza);margin-bottom:32px;line-height:1.55}
  .btn-google{display:inline-flex;align-items:center;gap:12px;background:#fff;
              border:1px solid var(--linha);border-radius:3px;padding:13px 28px;
              font-family:var(--sans);font-size:14px;font-weight:500;color:var(--tinta);
              cursor:pointer;transition:box-shadow .15s,border-color .15s;width:100%;
              justify-content:center}
  .btn-google:hover{border-color:var(--verde);box-shadow:0 2px 12px rgba(47,74,60,.12)}
  .btn-google svg{flex:none}
  .login-rodape{font-size:11.5px;color:var(--cinza);margin-top:28px;line-height:1.6}

  /* ---- dashboard CPF × CNPJ ---- */
  .bt-dash{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-family:var(--sans);
           font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2E86DE,#1E8A5F);
           border:none;border-radius:8px;padding:14px 26px;cursor:pointer;box-shadow:0 6px 18px rgba(30,138,95,.28);
           transition:transform .12s,box-shadow .12s}
  .bt-dash small{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .bt-dash:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,138,95,.35)}
  .bt-dash.ativo{outline:3px solid #F1C40F;outline-offset:2px}
  .conta-tab[data-conta=dash]{margin-left:auto}
  .conta-tab[data-conta=dash].ativa{color:#C0392B;border-bottom-color:#C0392B}
  .dash-topo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:24px 0 18px}
  .dash-modo{display:inline-flex;border:1px solid var(--linha);border-radius:3px;overflow:hidden}
  .dash-modo button{font-family:var(--sans);font-size:12.5px;border:none;background:#fff;padding:8px 14px;cursor:pointer;color:var(--cinza)}
  .dash-modo button.on{background:var(--verde);color:#fff}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .dash-col{border:1px solid var(--linha);border-radius:4px;padding:20px 22px;border-top:5px solid var(--dc)}
  .dash-col h2{font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dash-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
  .dash-kpi{background:var(--marfim);border-radius:3px;padding:12px 14px}
  .dash-kpi .rot{margin-bottom:2px}
  .dash-kpi .v{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
  .dash-bloco{margin-top:18px}
  .dash-bloco h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin:0 0 8px;
                 display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:2px solid currentColor}
  .dash-lin{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:7px 4px;
            border-bottom:1px solid var(--linha-clara);cursor:pointer;border-radius:3px}
  .dash-lin:hover{background:var(--marfim);box-shadow:inset 3px 0 0 var(--verde)}
  .dash-lin .nm{font-size:13.5px;display:flex;align-items:center}
  .dash-lin .vl{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
  .dash-lin .pc{font-size:11.5px;color:var(--cinza);min-width:38px;text-align:right}
  .dash-lin .br{grid-column:1/-1;height:6px;background:var(--linha-clara);border-radius:3px;overflow:hidden}
  .dash-lin .br i{display:block;height:100%;border-radius:3px}
  .dash-vazio{font-size:13px;color:var(--cinza);padding:10px 4px}
  .dash-nota{font-size:12px;color:var(--cinza);margin-top:14px;line-height:1.5}
  .dash-mes{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  .dash-mes th{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--cinza);font-weight:500;
               text-align:right;padding:6px 10px;border-bottom:1px solid var(--verde)}
  .dash-mes th:first-child,.dash-mes td:first-child{text-align:left}
  .dash-mes td{padding:7px 10px;border-bottom:1px solid var(--linha-clara);text-align:right;
               font-family:var(--serif);font-size:16px;font-variant-numeric:tabular-nums}
  .dash-mes td:first-child{font-family:var(--sans);font-size:13px}
  .dash-mes .grp{text-align:center!important;border-bottom:none;padding-bottom:0}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr}.dash-kpis{grid-template-columns:1fr 1fr 1fr}}
  .modal-caixa select{display:block;width:100%;margin-top:6px;font-family:var(--sans);font-size:14px;
      border:1px solid var(--linha);border-radius:2px;padding:9px 11px;background:#fff;color:var(--tinta)}
  .modal-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tipo-seg{display:flex;gap:8px;margin:6px 0 14px}
  .tipo-seg label{flex:1;margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;border:1px solid var(--linha);
      border-radius:3px;padding:9px;text-align:center;cursor:pointer;color:var(--tinta)}
  .tipo-seg input{display:none}
  .tipo-seg input:checked+span{font-weight:600}
  .tipo-seg label:has(input[value=s]:checked){background:#FDEDEB;border-color:#C0392B;color:#C0392B}
  .tipo-seg label:has(input[value=e]:checked){background:#E8F8F0;border-color:#1E8A5F;color:#1E8A5F}

  /* ---- cabeçalho ---- */
  .topo{border-bottom:1px solid var(--linha);padding:26px 28px 20px;
        display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .marca h1{font-family:var(--serif);font-size:34px;letter-spacing:.01em;line-height:1}
  .marca p{margin:6px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cinza)}
  .acoes{display:flex;flex-wrap:wrap;gap:8px}
  .bt{border:1px solid var(--verde);background:var(--verde);color:var(--marfim);
      padding:9px 16px;border-radius:2px;font-size:13px;letter-spacing:.04em;transition:background .15s}
  .bt:hover{background:#25392E}
  .bt.vazado{background:transparent;color:var(--verde);border-color:var(--linha)}
  .bt.vazado:hover{background:var(--marfim);border-color:var(--verde-suave)}
  .bt:disabled{opacity:.45;cursor:not-allowed}

  /* ---- abas de mês, tipo divisória de fichário ---- */
  .abas{display:flex;gap:3px;padding:16px 28px 0;overflow-x:auto;border-bottom:1px solid var(--linha)}
  .aba{border:1px solid var(--linha);border-bottom:none;background:var(--marfim);color:var(--cinza);
       padding:9px 17px 8px;border-radius:3px 3px 0 0;font-size:13px;white-space:nowrap;
       position:relative;top:1px;transition:color .15s}
  .aba:hover{color:var(--verde)}
  .aba[aria-selected="true"]{background:var(--papel);color:var(--verde);border-color:var(--linha);
       border-top:2px solid var(--ouro);font-weight:500;padding-top:8px}

  .corpo{padding:0 28px;max-width:1240px}

  /* ---- faixa de totais ---- */
  .totais{display:grid;grid-template-columns:repeat(4,1fr);gap:0;
          border-bottom:1px solid var(--linha);margin-top:26px}
  .tot{padding:14px 22px 22px;position:relative}
  .tot::before{content:"";position:absolute;top:0;left:0;right:22px;height:4px;border-radius:2px;background:var(--c,var(--linha))}
  .tot+.tot{border-left:1px solid var(--linha-clara)}
  .tot:first-child{padding-left:0}
  .tot:first-child::before{left:0}
  .rot{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);display:block;margin-bottom:6px}
  .num{font-family:var(--serif);font-size:34px;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .num small{font-size:17px;color:var(--cinza);margin-right:2px}
  .pos{color:var(--verde)} .neg{color:var(--tijolo)}
  .sub{font-size:12.5px;color:var(--cinza);margin-top:5px}

  .alerta{display:flex;gap:12px;align-items:flex-start;background:#FBF2EF;
          border-left:3px solid var(--tijolo);padding:13px 16px;margin:22px 0 0;border-radius:0 2px 2px 0;font-size:13.5px}
  .alerta b{font-weight:600;color:var(--tijolo)}

  /* ---- painéis ---- */
  .paineis{display:grid;grid-template-columns:1.15fr .85fr;gap:38px;margin:32px 0 8px}
  .tit-secao{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .tit-secao::before{content:"";width:18px;height:2px;background:var(--ouro);flex:none}
  .tit-secao h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);font-weight:500}

  .cat-linha{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:9px 0;
             border-bottom:1px solid var(--linha-clara);cursor:pointer;border-radius:3px;
             transition:background .12s;margin:0 -8px;padding-left:8px;padding-right:8px}
  .cat-linha:hover{background:var(--marfim)}
  .cat-linha:hover .cat-nome{text-decoration:underline;text-underline-offset:2px}
  .cat-nome{font-size:13.5px}
  .cat-val{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
  .cat-barra{grid-column:1/-1;height:8px;background:var(--linha-clara);border-radius:4px;overflow:hidden}
  .cat-barra i{display:block;height:100%;border-radius:4px}

  .divisao{display:flex;gap:0;border:1px solid var(--linha);border-radius:2px;margin-top:22px;overflow:hidden}
  .divisao div{flex:1;padding:14px 16px}
  .divisao div+div{border-left:1px solid var(--linha-clara)}
  .divisao .num{font-size:24px}

  /* ---- tabela ---- */
  .filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:34px 0 12px}
  .filtros input[type=search],.filtros select{font-family:var(--sans);font-size:13px;color:var(--tinta);
      border:1px solid var(--linha);background:#fff;padding:7px 10px;border-radius:2px}
  .filtros input[type=search]{min-width:210px}
  .conta{margin-left:auto;font-size:12.5px;color:var(--cinza)}

  table{width:100%;border-collapse:collapse}
  thead th{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza);
           font-weight:500;text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--verde)}
  tbody tr{border-bottom:1px solid var(--linha-clara)}
  tbody tr:hover{background:var(--marfim)}
  tbody td{padding:7px 10px;vertical-align:middle;font-size:13.5px}
  td.data{white-space:nowrap;color:var(--cinza);font-variant-numeric:tabular-nums;width:78px}
  td.valor{text-align:right;font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;width:120px}
  .campo{width:100%;border:none;background:transparent;font-family:var(--sans);font-size:13.5px;
         color:var(--tinta);padding:4px 5px;border-radius:2px;border:1px solid transparent}
  .campo:hover{border-color:var(--linha-clara)}
  .campo:focus{background:#fff;border-color:var(--linha);outline:none}
  td.valor .campo{text-align:right;font-family:var(--serif);font-size:17px}
  select.campo{cursor:pointer;-webkit-appearance:none;appearance:none}
  .selo{border:1px solid #E0B84D;background:#FDF6E3;border-radius:11px;padding:3px 11px;
        font-size:11px;letter-spacing:.08em;color:#9C7A0A;white-space:nowrap;font-weight:500}
  .selo.pj{border-color:#7FC8A9;color:#1E8A5F;background:#E8F8F0}
  .col-drag{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;
            background:transparent;z-index:2;display:flex;align-items:center;justify-content:center}
  .col-drag::after{content:"";width:2px;height:60%;background:var(--linha);border-radius:1px;opacity:0}
  .col-drag:hover::after{opacity:1}
  .col-drag:hover{background:rgba(0,0,0,.04)}
  #tabelaLanc{table-layout:fixed;width:100%;min-width:860px}
  #tabelaLanc th,#tabelaLanc td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tabelaLanc th[data-sort=data],#tabelaLanc td.data{width:64px}
  #tabelaLanc th[data-sort=hist]{width:320px}
  #tabelaLanc th[data-sort=categoria]{width:170px}
  #tabelaLanc th[data-sort=vinculo]{width:104px}
  #tabelaLanc th[data-sort=valor]{width:110px}
  .desc-campo{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .desc-campo:focus{white-space:normal}
  .etiqueta{border:none!important;border-radius:12px;padding:4px 12px;font-size:12.5px;
            letter-spacing:.02em;font-weight:500;width:auto;min-width:150px}
  .etiqueta:focus{outline-offset:1px}
  tbody tr td:first-child{box-shadow:inset 3px 0 0 var(--c)}
  .tag-cartao{font-size:13px;opacity:.7;margin-right:4px;vertical-align:middle}
  .tag-conta{font-size:9.5px;letter-spacing:.08em;padding:2px 5px;border-radius:3px;font-weight:600;margin-right:4px;vertical-align:middle}
  .tag-conta.pj{background:#E8F8F0;color:#1E8A5F}
  .tag-conta.pf{background:#F0F4FF;color:#4A6C7A}
  .riscar,.voltar{border:1px solid var(--linha);background:#fff;color:var(--cinza);font-size:15px;line-height:1;
                  width:26px;height:26px;border-radius:50%;transition:all .15s}
  .riscar:hover{color:#fff;background:var(--tijolo);border-color:var(--tijolo)}
  .voltar{color:#fff;background:#1E8A5F;border-color:#1E8A5F;font-size:14px}
  .voltar:hover{background:#166B48;border-color:#166B48}
  .sumir{border:none;background:transparent;color:var(--tijolo);font-size:11px;letter-spacing:.06em;
         padding:3px 6px;border-radius:2px;text-decoration:underline;text-underline-offset:2px;font-weight:500}
  .sumir:hover{background:#FDEDEB}
  tr.riscado td:not(.acao){opacity:.4}
  tr.riscado .campo,tr.riscado .selo{text-decoration:line-through;text-decoration-thickness:1px}
  tr.riscado:hover td:not(.acao){opacity:.6}
  .apagar{border:none;background:transparent;color:var(--linha);font-size:17px;line-height:1;padding:3px 6px;border-radius:2px}
  .apagar:hover{color:var(--tijolo);background:#FBF2EF}
  tr.dup td{opacity:.5}

  .vazio{text-align:center;padding:64px 20px;color:var(--cinza)}
  .vazio p{max-width:44ch;margin:10px auto 0;font-size:14px}
  .vazio .num{font-family:var(--serif);font-size:26px;color:var(--verde)}

  /* ---- regras ---- */
  .regras{margin-top:44px;border-top:1px solid var(--linha);padding-top:24px}
  .regra{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha-clara);font-size:13.5px}
  .regra-termo{font-family:var(--sans);background:var(--marfim);padding:3px 8px;border-radius:2px;
               letter-spacing:.03em;min-width:160px;border:1px solid var(--linha-clara);font-size:13px}
  .regra-termo:focus{background:#fff;border-color:var(--linha)}
  .regra-cat{min-width:160px}
  .regra-vinc{font-family:var(--sans);font-size:12px;border:1px solid var(--linha);padding:4px 8px;border-radius:2px}
  .regra .seta{color:var(--ouro)}
  .nova-regra{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .nova-regra input,.nova-regra select{font-family:var(--sans);font-size:13px;border:1px solid var(--linha);
              padding:7px 10px;border-radius:2px;background:#fff}

  .rodape{margin-top:52px;padding-top:18px;border-top:1px solid var(--linha);
          display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--cinza)}
  .aviso{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--verde);color:var(--marfim);
         padding:11px 22px;border-radius:2px;font-size:13.5px;box-shadow:0 6px 22px rgba(38,37,31,.18);
         opacity:0;pointer-events:none;transition:opacity .2s}
  .aviso.on{opacity:1}
  .aviso.erro{background:var(--tijolo)}

<script>
(function(){
  "use strict";
  const CHAVE = "financeiro-solano:v1";
  const $ = s => document.querySelector(s);

  // ── Supabase ──────────────────────────────────────────────
  const SB_URL  = "https://cxdbrmjrwusgzikfyugf.supabase.co";
  const SB_KEY  = "sb_publishable_f2PhMwV9xY_81eXtXOgnPg_zd2pil-u";
  // corrige retorno do Google com "##access_token" (URL que terminava em "#")
  if(location.hash.startsWith("##")) history.replaceState(null,"",location.pathname+location.hash.slice(1));
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let sbUser = null; // usuário autenticado

  async function sbCarregar(){
    const { data, error } = await sb
      .from("livro_caixa")
      .select("valor")
      .eq("user_id", sbUser.id)
      .eq("chave", CHAVE)
      .maybeSingle();
    if(error) throw error;
    return data ? data.valor : null;
  }

  async function sbSalvar(payload){
    const { error } = await sb
      .from("livro_caixa")
      .upsert({
        user_id: sbUser.id,
        chave: CHAVE,
        valor: payload,
        atualizado_em: new Date().toISOString()
      }, { onConflict: "user_id,chave" });
    if(error) throw error;
  }

  function nomeUsuario(){
    return sbUser?.user_metadata?.full_name
        || sbUser?.user_metadata?.name
        || sbUser?.email?.split("@")[0]
        || "Você";
  }

  function atualizarBarraUsuario(){
    const barra = document.getElementById("barraUsuario");
    const tela  = document.getElementById("telaLogin");
    if(!barra||!tela) return;
    if(sbUser){
      // esconder tela de login, mostrar app
      tela.classList.add("oculta");
      barra.innerHTML =
        '<span style="font-size:13px;color:var(--cinza);display:flex;align-items:center;gap:8px">'+
          (sbUser.user_metadata?.avatar_url
            ? '<img src="'+sbUser.user_metadata.avatar_url+'" style="width:28px;height:28px;border-radius:50%">'
            : '<span style="width:28px;height:28px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">'+nomeUsuario()[0].toUpperCase()+'</span>')

  /* janela de confirmação própria do app — não depende de confirm()/prompt() do navegador,

  function modal(html){
    return new Promise(resolve=>{
      const fundo=$("#modalFundo"), caixa=$("#modalCaixa");
      caixa.innerHTML=html; fundo.hidden=false;
      const campo=caixa.querySelector("input,button");
      if(campo) campo.focus();
      const onKey=e=>{ if(e.key==="Escape") fechar(null); };
      function fechar(v){
        fundo.hidden=true; caixa.innerHTML=""; caixa.onclick=null;
        document.removeEventListener("keydown",onKey); resolve(v);
      }
      caixa.onclick=e=>{
        const bt=e.target.closest("[data-modal]"); if(!bt) return;
        if(bt.dataset.modal==="cancelar") return fechar(null);
        if(bt.dataset.modal==="ok"){
          const form=caixa.querySelector("form");
          if(form){
            if(!form.checkValidity()){form.reportValidity&&form.reportValidity();return;}
            fechar(Object.fromEntries(new FormData(form).entries()));
          } else fechar(true);
        }
        // botões com valor direto (ex: "pf", "pj")
        if(!["cancelar","ok"].includes(bt.dataset.modal)) fechar(bt.dataset.modal);
      };
      document.addEventListener("keydown",onKey);
    });
  }

  function adicionarManual(presetConta){
    novoLancamentoModal(presetConta).then(f=>{
      if(!f) return;
      const iso=/^\d{4}-\d{2}-\d{2}$/.test(f.data)?f.data:dataISO(f.data||"");
      if(!iso){ avisar("Data inválida.",true); return; }
      const desc=(f.desc||"").trim();
      if(!desc){ avisar("Escreva uma descrição.",true); return; }
      let v=Math.abs(numero(String(f.valor||"").replace("−","-")));
      if(!v){ avisar("Valor inválido.",true); return; }
      const valor=f.tipo==="e"?v:-v;
      const conta=f.conta==="pj"?"pj":"pf";
      const vinc=conta==="pj"?"PJ":"PF";
      let categoria=f.categoria;
      if(!categoria){
        const c=classificar(desc,valor);
        categoria=catsParaVinculo(vinc).includes(c.categoria)?c.categoria:"Sem categoria";
      }
      dados.lancamentos.push({id:iso+"|manual|"+Date.now()+"|"+desc.slice(0,42),data:iso,hist:desc,
        valor:valor,doc:"",categoria:categoria,vinculo:vinc,obs:(f.obs||"").trim(),origem:conta,manual:true});
      dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
      if(ui.conta!=="dash"){ ui.mes=iso.slice(0,7); ui.view="mes"; }
      salvar(); render();
      avisar("Lançamento adicionado na conta "+(conta==="pj"?"CNPJ":"CPF")+".");
    });
  }

  function ehNegocio(l){ return l.vinculo==="PJ"||CATS_SO_NEGOCIO.has(l.categoria); }

  function renderDashboard(){
    ui.dashModo="cat";
    if(!ui.dashSep) ui.dashSep="nat";
    const todosMeses=[...new Set(dados.lancamentos.map(l=>l.data.slice(0,7)))].sort();
    if(!ui.mes||(ui.mes!=="tudo"&&!todosMeses.includes(ui.mes))) ui.mes="tudo";
    renderPeriodo(todosMeses,false);

    const noPeriodo=l=>ui.mes==="tudo"||l.data.slice(0,7)===ui.mes;
    // gasto real: compras do cartão entram; pagamento de fatura e aplicações ficam fora
    const valido=l=>!l.ignorado&&ehMov(l);
    const base=dados.lancamentos.filter(l=>noPeriodo(l)&&valido(l));
    const LIM=6;

    function resumo(conta){
      const ls=base.filter(l=>contaDe(l)===conta);
      const ent={}, sai={};
      const ret=conta==="pj"?ls.filter(ehRetirada).reduce((s,l)=>s-l.valor,0):0;
      ls.filter(l=>!(conta==="pj"&&ehRetirada(l))).forEach(l=>{
        const alvo=l.valor>0?ent:sai;
        alvo[l.categoria]=alvo[l.categoria]||{v:0,n:0};
        alvo[l.categoria].v+=Math.abs(l.valor); alvo[l.categoria].n++;
      });
      const tE=Object.values(ent).reduce((s,x)=>s+x.v,0);
      const tS=Object.values(sai).reduce((s,x)=>s+x.v,0);
      return {ls,ent,sai,tE,tS,ret,semCat:ls.filter(l=>l.categoria==="Sem categoria").length};
    }

    function lista(obj,total,conta,tipo){
      const tudo=Object.entries(obj).sort((a,b)=>b[1].v-a[1].v);
      if(!tudo.length) return '<div class="dash-vazio">Nada neste período.</div>';
      const chave="dv_"+conta+tipo, aberto=!!ui[chave];
      const it=aberto?tudo:tudo.slice(0,tipo==="e"?3:4);
      const max=tudo[0][1].v||1;
      return it.map(([c,x])=>
        '<div class="dash-lin" data-dcat="'+esc(c)+'" data-dconta="'+conta+'" data-dtipo="'+tipo+'" title="Ver lançamentos">'+

          '<span class="pc">'+(total?Math.round(x.v/total*100):0)+'%</span>'+
          '<span class="br"><i style="width:'+Math.max(2,x.v/max*100).toFixed(1)+'%;background:'+(tipo==="e"?"#1E8A5F":cor(c))+'"></i></span>'+
        '</div>').join("")+
        (tudo.length>it.length||aberto&&tudo.length>(tipo==="e"?3:4)
          ?'<button class="ver-mais" data-dver="'+chave+'">'+(aberto?"Mostrar menos":"Ver todas ("+tudo.length+")")+'</button>':"");
    }

    function atencao(){
      const per=dados.lancamentos.filter(l=>noPeriodo(l)&&!l.ignorado);
      const r=resumoSeparacao(per);
      const itens=[];
      const ano=ui.mes==="tudo"?mesPadrao(todosMeses).slice(0,4):ui.mes.slice(0,4);

        .reduce((s,l)=>s+l.valor,0);
      if(recAno>81000*0.8) itens.push(['<span>Faturamento MEI '+ano+' — '+Math.round(recAno/81000*100)+'% do limite de R$ 81 mil</span>',
        'R$ '+brl(recAno), recAno>81000?"#C0392B":"#E08E0B","fat:"+ano]);
      if(r.recFora.length) itens.push(['<span>Receita do negócio recebida fora da conta CNPJ · '+r.recFora.length+'×</span>','R$ '+brl(r.sum(r.recFora)),"#C0392B","pj"]);
      if(r.despFora.length) itens.push(['<span>Despesas do negócio pagas com dinheiro pessoal · '+r.despFora.length+'×</span>','R$ '+brl(r.sum(r.despFora)),"#E08E0B","pj"]);

      return '<div class="tit-secao" style="margin:26px 0 10px"><h3>Pontos de atenção</h3></div>'+
        '<div class="dash-atencao">'+itens.map(([t,v,c,ir])=>

    function coluna(conta){
      const r=resumo(conta);
      const saldo=r.tE-r.tS;

          '<div class="dash-kpi"><span class="rot">Gastou</span><div class="v">'+brl(r.tS)+'</div>'+

          '<div class="dash-kpi"><span class="rot">'+(conta==="pj"?(saldo<0?"Prejuízo":"Lucro"):(saldo<0?"Faltou":"Sobrou"))+'</span><div class="v" style="color:'+(saldo<0?"#C0392B":"#1E8A5F")+'">'+brl(saldo)+'</div>'+
            '<span class="kpi-sub">entrou − gastou</span></div>'+
        '</div>'+
        (conta==="pj"&&ui.dashSep!=="conta"?cascataHTML(fluxoNegocio(dados.lancamentos.filter(noPeriodo)),true):"")+
        '<div class="dash-bloco" style="color:var(--tinta)"><h4><span>Onde mais gastou</span><span>'+brl(r.tS)+'</span></h4></div>'+
        lista(r.sai,r.tS,conta,"s")+

  async function carregar(){
    try{
      // verificar sessão Supabase
      const { data:{ session } } = await sb.auth.getSession();
      sbUser = session?.user || null;
      atualizarBarraUsuario();

      let d = null;
      if(sbUser){
        // carregar do Supabase
        d = await sbCarregar();
      } else {
        // fallback: localStorage
        const raw = localStorage.getItem(CHAVE);
        if(raw) d = JSON.parse(raw);
      }

      if(d){
        dados.lancamentos = d.lancamentos||[];
        dados.saldos      = d.saldos||{};
        dados.regras      = (d.regras&&d.regras.length)?d.regras:REGRAS_PADRAO.slice();
        dados.prolabore   = d.prolabore||0;
        dados.faturaAberta = d.faturaAberta||null;
        dados.faturaFechada= d.faturaFechada||null;
        migrar();
        dados.lancamentos.forEach(l=>{ if(CATS_SO_NEGOCIO.has(l.categoria)) l.vinculo="PJ"; });
        // migração: remover lançamentos do cartão com data > hoje+6 meses (bug antigo)
        const limiteMs = Date.now() + 180*24*60*60*1000;
        let corrigidos = 0;
        dados.lancamentos = dados.lancamentos.filter(l=>{
          if(l.origem==="cartao" && new Date(l.data+"T12:00:00").getTime() > limiteMs){
            corrigidos++; return false;
          }
          return true;
        });
        if(corrigidos > 0) await salvarImediato();
      }
    }catch(e){ console.error("Erro ao carregar:", e); }
  }

  /* ================= utilidades ================= */
  const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const brl = v => (v<0?"−":"")+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const rotuloMes = ym => { const [a,m]=ym.split("-"); return MESES[+m-1]+" de "+a; };
  const abrevMes = ym => { const [a,m]=ym.split("-"); return MESES[+m-1].slice(0,3)+" "+a.slice(2); };
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function numero(txt){
    let s = String(txt).trim().replace(/\s|R\$/g,"");
    // extrato do BB (conta CNPJ) traz o valor com C/D no fim: "15.887,04 C", "-240,00 D"
    let sinal = 0;
    const cd = s.match(/([CD])$/i);
    if(cd){ sinal = cd[1].toUpperCase()==="D" ? -1 : 1; s = s.slice(0,-1); }
    if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
    else s = s.replace(/,/g,"");
    let n = parseFloat(s);
    if(isNaN(n)) return 0;
    if(sinal) n = sinal*Math.abs(n);
    return n;
  }

  /* Reimportar um extrato corrige valores de lançamentos que já existem
     (mesma data, documento e descrição), sem perder categoria e observações. */
  function chaveLanc(l){ return l.data+"|"+(l.doc||"")+"|"+String(l.hist).slice(0,42)+"|"+(l.origem||"pf"); }
  function mapaExistentes(){
    const m=new Map(); dados.lancamentos.forEach(l=>{ if(!l.manual&&l.origem!=="cartao") m.set(chaveLanc(l),l); }); return m;
  }
  function dataISO(txt){
    const m = String(txt).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? m[3]+"-"+m[2]+"-"+m[1] : null;
  }

  function classificar(hist,valor){
    const u = hist.toUpperCase();
    for(const r of dados.regras){
      if(u.includes(r.termo.toUpperCase())) return {categoria:r.categoria,vinculo:r.vinculo};
    }
    return valor>0 ? {categoria:"Receita de cliente",vinculo:"PJ"}
                   : {categoria:"Sem categoria",vinculo:"PF"};
  }

  /* nome do estabelecimento, limpo dos prefixos do BB */
  function mercado(hist){
    const bruto = String(hist).trim();
    // prefixos genéricos do BB que não identificam o estabelecimento sozinhos —
    // "Compra com Cartão - dd/mm hh:mm ESTABELECIMENTO" repete o mesmo prefixo em
    // toda compra no cartão, então não pode virar o termo da regra.
    const ehGenerico = /^\s*(Pix|Transferência|Compra\s+com\s+Cart[ãa]o)\b/i.test(bruto);
    if(!ehGenerico){
      const corte = bruto.split(/\s+-\s+/)[0].trim();
      if(corte.length>3) return corte.toUpperCase().slice(0,34).trim();
    }
    let s = bruto
      .replace(/^\s*Pix\s*-\s*(Enviado|Recebido)\s*-\s*/i,"")
      .replace(/^\s*Pix-Envio devolvido\s*-\s*/i,"")
      .replace(/^\s*Transferência Periódica\s*-\s*/i,"")
      .replace(/^\s*Compra\s+com\s+Cart[ãa]o\s*-\s*/i,"")
      .replace(/^\d{2}\/\d{2}\s+\d{2}:\d{2}\s*/,"")
      .replace(/^\d{11,}\s*/,"")
      .trim();
    return (s||bruto).toUpperCase().slice(0,34).trim();
  }

  /* guarda o que você classificou à mão, para o próximo extrato entrar pronto */
  function aprender(l){
    const termo = mercado(l.hist);
    if(termo.length<4) return null;
    const i = dados.regras.findIndex(r=>r.termo.toUpperCase()===termo);
    if(i>=0){
      if(dados.regras[i].categoria===l.categoria && dados.regras[i].vinculo===l.vinculo) return null;
      dados.regras[i].categoria=l.categoria; dados.regras[i].vinculo=l.vinculo;
    }else{
      dados.regras.unshift({termo:termo,categoria:l.categoria,vinculo:l.vinculo,aprendida:true});
    }
    return termo;
  }

  /* desloca a data de parcelas futuras (PARC 02/12, PARC 03/05…) para o mês correto */
  function ajustarParc(iso, hist){
    const m = hist.match(/PARC\s+(\d{2})\/(\d{2})/i);
    if(!m) return iso;
    if(/ANUIDADE|TIT-PARC/i.test(hist)) return iso; // anuidade já vem na data da cobrança
    const atual = parseInt(m[1]);
    if(atual <= 1) return iso;           // parcela 1 fica na data original
    const [y,mo,d] = iso.split("-").map(Number);
    const meses = atual - 1;             // deslocar atual-1 meses à frente
    const mo2 = mo + meses;
    const y2  = y + Math.floor((mo2-1)/12);
    const mo3 = ((mo2-1)%12)+1;
    return `${y2}-${String(mo3).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  function lerCSV(texto){
    const linhas=[]; let campo="",linha=[],aspas=false;
    for(let i=0;i<texto.length;i++){
      const c=texto[i];
      if(aspas){
        if(c==='"'){ if(texto[i+1]==='"'){campo+='"';i++;} else aspas=false; }
        else campo+=c;
      }else if(c==='"') aspas=true;
      else if(c===","){ linha.push(campo); campo=""; }
      else if(c==="\n"){ linha.push(campo); linhas.push(linha); linha=[]; campo=""; }
      else if(c!=="\r") campo+=c;
    }
    if(campo||linha.length){ linha.push(campo); linhas.push(linha); }
    return linhas.filter(l=>l.some(c=>c.trim()!==""));
  }

  function importarTexto(texto){
    const linhas = lerCSV(texto);
    if(!linhas.length) return {erro:"O arquivo está vazio."};
    const cab = linhas[0].map(c=>c.trim().toLowerCase());
    const acha = alts => cab.findIndex(c=>alts.some(a=>c.includes(a)));
    const iData=acha(["data"]), iHist=acha(["histórico","historico"]),
          iVal=acha(["valor"]), iDoc=acha(["documento"]);
    if(iData<0||iHist<0||iVal<0)
      return {erro:"Não reconheci as colunas. Baixe o extrato do BB em CSV, sem alterar o cabeçalho."};

    const existentes = new Set(dados.lancamentos.map(l=>l.id));
    const porChave = mapaExistentes();
    let novos=0, repetidos=0, prontos=0, corrigidos=0, saldoAnt=null, mesesTocados=new Set();

    for(let i=1;i<linhas.length;i++){
      const l=linhas[i];
      const hist=(l[iHist]||"").trim();
      const iso=dataISO(l[iData]||"");
      if(!iso||!hist) continue;
      const valor=numero(l[iVal]||"0");
      const chato=hist.toUpperCase().replace(/\s+/g,"");
      if(chato==="SALDOANTERIOR"){ saldoAnt={data:iso,valor:valor}; continue; }
      if(chato==="SALDO"||chato==="SALDOATUAL") continue;

      const doc=(l[iDoc]||"").trim();
      const id=iso+"|"+doc+"|"+valor.toFixed(2)+"|"+hist.slice(0,42);
      const velho=porChave.get(iso+"|"+doc+"|"+hist.slice(0,42)+"|"+(ui._contaAtual||"pf"));
      if(velho){
        if(Math.abs(velho.valor-valor)>0.004){ velho.valor=valor; velho.id=id; corrigidos++; mesesTocados.add(iso.slice(0,7)); }
        else repetidos++;
        existentes.add(id); continue;
      }
      if(existentes.has(id)){ repetidos++; continue; }
      const c=classificar(hist,valor);
      if(c.categoria!=="Sem categoria") prontos++;
      dados.lancamentos.push({id:id,data:iso,hist:hist,valor:valor,doc:doc,
                              categoria:c.categoria,vinculo:c.vinculo,obs:"",
                              origem:ui._contaAtual||"pf"});
      existentes.add(id); novos++;
      mesesTocados.add(iso.slice(0,7));
    }

    if(saldoAnt){
      const d=new Date(saldoAnt.data+"T12:00:00"); d.setDate(d.getDate()+1);
      const ym=d.toISOString().slice(0,7);
      dados.saldos[ym]=saldoAnt.valor;
    }
    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:a.id<b.id?-1:1);
    return {novos:novos,repetidos:repetidos,prontos:prontos,corrigidos:corrigidos,meses:[...mesesTocados]};
  }

  function lerArquivo(arq){
    if(arq.name.toLowerCase().endsWith('.xlsx')||arq.name.toLowerCase().endsWith('.xls')){
      perguntarConta(conta=>{ ui._contaAtual=conta; lerArquivoXLSX(arq); });
      return;
    }
    perguntarConta(conta=>{
      ui._contaAtual=conta;
      const fr=new FileReader();
      fr.onload=()=>{
        const buf=fr.result;
        let texto;
        try{ texto=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
        catch(e){ texto=new TextDecoder("iso-8859-1").decode(buf); }
        const r=importarTexto(texto);
        if(r.erro){ avisar(r.erro,true); return; }
        if(r.meses&&r.meses.length){ ui.mes=r.meses.sort().pop(); ui.view="mes"; }
        salvar(); render();
        avisar(r.novos+" lançamento"+(r.novos===1?"":"s")+" importado"+(r.novos===1?"":"s")+
               (r.novos?" · "+r.prontos+" já classificado"+(r.prontos===1?"":"s"):"")+
               (r.corrigidos?" · "+r.corrigidos+" valor"+(r.corrigidos===1?"":"es")+" corrigido"+(r.corrigidos===1?"":"s"):"")+
               (r.repetidos?" · "+r.repetidos+" já estava"+(r.repetidos===1?"":"m")+" aqui":""));
      };
      fr.onerror=()=>avisar("Não consegui abrir esse arquivo.",true);
      fr.readAsArrayBuffer(arq);
    });
  }

  async function lerArquivoXLSX(arq){
    const buf = await arq.arrayBuffer();
    let wb;
    try{
      wb = XLSX.read(buf, {type:"array"});
    }catch(e){
      avisar("Não consegui abrir a planilha. Verifique se é um arquivo .xlsx do BB.",true); return;
    }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
    if(!linhas.length){ avisar("Planilha vazia.",true); return; }

    // detectar formato: PJ tem "Inf." / "Extrato Conta Corrente" no topo
    // PJ: cabeçalho pode estar na linha 2 (índice 2), não na linha 0
    let cabIdx = 0;
    for(let i=0;i<Math.min(5,linhas.length);i++){
      const row = linhas[i].map(c=>String(c||"").trim().toLowerCase());
      if(row.includes("data") && (row.includes("historico")||row.includes("histórico")||row.includes("lançamento")||row.includes("lancamento"))){
        cabIdx = i; break;
      }
    }
    const cab = linhas[cabIdx].map(c=>String(c).trim().toLowerCase());

    const iData = cab.findIndex(c=>c==="data");
    // PJ: coluna "Historico" separada de "Cod. Historico"
    const iLanc = (() => {
      // preferir match exato "historico"/"histórico" sobre parcial
      let exact = cab.findIndex(c=>c==="historico"||c==="histórico");
      if(exact>=0) return exact;
      return cab.findIndex(c=>c.includes("lançamento")||c.includes("lancamento")||c.includes("histórico")||c.includes("historico"));
    })();
    const iDet  = cab.findIndex(c=>c.includes("detalhe")||c.includes("detalhamento"));
    const iDoc  = cab.findIndex(c=>c.includes("documento")||c.includes("n°")||c.includes("nº"));
    const iVal  = cab.findIndex(c=>c.includes("valor"));
    // PJ tem coluna "Inf." com C/D para indicar crédito/débito
    const iInf  = cab.findIndex(c=>c==="inf."||c==="inf");
    const formatoPJ = iInf >= 0;

    if(iData<0||iVal<0){ avisar("Não reconheci as colunas. Verifique se é o extrato padrão do BB.",true); return; }

    const existentes = new Set(dados.lancamentos.map(l=>l.id));
    const porChave = mapaExistentes();
    let novos=0, repetidos=0, prontos=0, corrigidos=0;
    const mesesTocados = new Set();

    for(let i=cabIdx+1;i<linhas.length;i++){
      const row = linhas[i];
      const dataStr = String(row[iData]||"").trim();
      if(!dataStr.match(/^\d{2}\/\d{2}\/\d{4}$/) || dataStr.startsWith("00/")) continue;

      let hist = iLanc>=0 ? String(row[iLanc]||"").trim() : "";
      if(iDet>=0){
        const det = String(row[iDet]||"").trim();
        if(det && det.trim()) hist = hist ? hist+" - "+det : det;
      }
      const histUpper = hist.toUpperCase().replace(/\s+/g,"");
      if(histUpper.startsWith("SALDO")){
        if(histUpper==="SALDOANTERIOR"){
          const vs=numero(String(row[iVal]||"0"));
          const iso2=dataISO(dataStr);
          if(iso2){ const d2=new Date(iso2+"T12:00:00"); d2.setDate(d2.getDate()+1); dados.saldos[d2.toISOString().slice(0,7)]=vs; }
        }
        continue;
      }
      if(!hist.trim()) continue;

      const iso = dataISO(dataStr); if(!iso) continue;
      let val = numero(String(row[iVal]||"0")); if(!val) continue;

      // PJ: usar coluna Inf. para determinar sinal (D=débito=negativo, C=crédito=positivo)
      if(formatoPJ){
        const inf = String(row[iInf]||"").trim().toUpperCase();
        val = inf==="D" ? -Math.abs(val) : Math.abs(val);
      }

      const doc = iDoc>=0?String(row[iDoc]||"").trim():"";
      const id  = iso+"|"+doc+"|"+val.toFixed(2)+"|"+hist.slice(0,42);
      const velho = porChave.get(iso+"|"+doc+"|"+hist.slice(0,42)+"|"+(ui._contaAtual||"pf"));
      if(velho){
        if(Math.abs(velho.valor-val)>0.004){ velho.valor=val; velho.id=id; corrigidos++; mesesTocados.add(iso.slice(0,7)); }
        else repetidos++;
        existentes.add(id); continue;
      }
      if(existentes.has(id)){repetidos++;continue;}
      const c = classificar(hist,val);
      if(c.categoria!=="Sem categoria") prontos++;
      dados.lancamentos.push({id,data:iso,hist,valor:val,doc,categoria:c.categoria,vinculo:c.vinculo,obs:"",origem:ui._contaAtual||"pf"});
      existentes.add(id); novos++;
      mesesTocados.add(iso.slice(0,7));
    }

    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(mesesTocados.size){ ui.mes=[...mesesTocados].sort().pop(); ui.view="mes"; }
    salvar(); render();
    avisar(novos+" lançamento"+(novos===1?"":"s")+" importado"+(novos===1?"":"s")+
           (novos?" · "+prontos+" já classificado"+(prontos===1?"":"s"):"")+
           (corrigidos?" · "+corrigidos+" valor"+(corrigidos===1?"":"es")+" corrigido"+(corrigidos===1?"":"s"):"")+
           (repetidos?" · "+repetidos+" já estava"+(repetidos===1?"":"m")+" aqui":"")+
           (formatoPJ?" (formato PJ detectado)":""));
  }

  /* ================= importação PDF da fatura do cartão — sem API ================= */
  async function importarFaturaPDF(arq){
    avisar("Lendo a fatura…");

    // configurar worker do PDF.js
    if(typeof pdfjsLib==="undefined"){
      avisar("Biblioteca PDF não carregou. Verifique sua conexão e tente novamente.",true); return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

    const buf = await arq.arrayBuffer();
    let pdfDoc;
    // PDF com senha (fatura do BB): pede a senha só para abrir; ela não é guardada
    let senha, tentativas=0;
    while(true){
      try{ pdfDoc = await pdfjsLib.getDocument({data:buf.slice(0), password:senha}).promise; break; }
      catch(e){
        if(e && e.name==="PasswordException" && tentativas<3){
          senha = prompt(tentativas===0
            ? "Esta fatura tem senha. Digite a senha do PDF:"
            : "Senha incorreta. Tente de novo:");
          if(senha===null){ avisar("Importação cancelada.",true); return; }
          tentativas++; continue;
        }
        avisar(e && e.name==="PasswordException"
          ? "Senha incorreta. Importação cancelada."
          : "Não consegui abrir o PDF.",true);
        return;
      }
    }

    // ler os itens de texto de cada página, com a posição (x, y) de cada um
    const paginas = [];
    for(let p=1;p<=pdfDoc.numPages;p++){
      const page = await pdfDoc.getPage(p);
      const content = await page.getTextContent();
      paginas.push(content.items.filter(it=>it.str && it.str.trim()!==""));
    }
    // agrupar itens da mesma linha visual pela posição Y (evita que uma linha "engula"
    // a data e o valor da linha seguinte)
    const agruparLinhas = itens=>{
      const ord = itens.slice().sort((a,b)=> b.transform[5]-a.transform[5] || a.transform[4]-b.transform[4]);
      const linhas=[]; let linha=null, ultY=null;
      ord.forEach(it=>{
        const y = it.transform[5];
        if(linha===null || Math.abs(y-ultY)>2){ linha={y:y,itens:[]}; linhas.push(linha); ultY=y; }
        linha.itens.push(it);
      });
      linhas.forEach(l=>{ l.itens.sort((a,b)=>a.transform[4]-b.transform[4]); l.txt=l.itens.map(i=>i.str).join(" "); });
      return linhas;
    };
    const textoTotal = paginas.map(it=>agruparLinhas(it).map(l=>l.txt).join("\n")).join("\n");
    const dataBR = s => s ? s.split("/").reverse().join("-") : "";
    const numBR  = s => parseFloat(String(s).replace(/\./g,"").replace(",","."));

    // detectar cartão e datas da fatura
    const mCartao = textoTotal.match(/Final\s+(\d{4})/i);
    const cartao  = mCartao ? "Final "+mCartao[1] : ((dados.faturaFechada&&dados.faturaFechada.cartao)||"Cartão");
    const mFecha = textoTotal.match(/Fatura fechada em\s+(\d{2})\/(\d{2})\/(\d{4})/i);
    const hoje = new Date();
    const anoFatura    = mFecha ? parseInt(mFecha[3]) : hoje.getFullYear();
    const mesFechamento= mFecha ? parseInt(mFecha[2]) : hoje.getMonth()+1;
    // "Lançamentos Futuros" = fatura ainda em aberto (layout em duas colunas)
    const ehAberta = !mFecha && /Lan[çc]amentos Futuros/i.test(textoTotal);

    const brutos = []; // {dd,mm,desc,v} — v positivo = compra, negativo = crédito
    let pendentes=0, pendTotal=0;
    if(ehAberta){
      paginas.forEach(itens=>{
        // cada cabeçalho "Data" abre uma coluna
        const xs = itens.filter(i=>i.str.trim()==="Data").map(i=>i.transform[4]).sort((a,b)=>a-b);
        const cortes=[];
        xs.forEach(x=>{ if(!cortes.length || x-cortes[cortes.length-1]>40) cortes.push(x); });
        if(!cortes.length) cortes.push(0);
        const cols = cortes.map(()=>[]);
        itens.forEach(it=>{ let c=0; cortes.forEach((x,i)=>{ if(it.transform[4]>=x-6) c=i; }); cols[c].push(it); });
        cols.forEach(col=>{
          let emProc=false;
          agruparLinhas(col).forEach(l=>{
            if(/Lan[çc]amentos em processamento/i.test(l.txt)){ emProc=true; return; }
            const m = l.txt.match(/^\s*(\d{2})\/(\d{2})\s+(.+?)\s+(?:R\$\s*)?(-?[\d.]*\d,\d{2})\s*$/);
            if(!m) return; // cabeçalhos e a linha da cidade (continuação) ficam de fora
            const v = numBR(m[4]);
            if(emProc){ pendentes++; pendTotal+=v; return; }
            brutos.push({dd:m[1],mm:m[2],desc:m[3].trim().replace(/\s+R\$$/,""),v:v});
          });
        });
      });
    } else {
      // fatura fechada: DD/MM DESCRIÇÃO [código do país] R$ [-]N,NN
      const RE = /^\s*(\d{2})\/(\d{2})\s+(.+?)\s+(?:[A-Z]{2}\s+)?R\$\s*([-\d.,]+)\s*$/;
      textoTotal.split("\n").forEach(linhaTxt=>{
        const m = linhaTxt.match(RE);
        if(m) brutos.push({dd:m[1],mm:m[2],desc:m[3].trim(),v:numBR(m[4])});
      });
    }

    const lancamentos = [];
    let somaAberta = 0;
    brutos.forEach(b=>{
      const desc2 = b.desc;
      if(/^(PGTO|PAGTO|PAGAMENTO|SALDO FATURA)/i.test(desc2)) return;
      // ANTEC = parcelas antecipadas cobradas pelo banco — são cobranças reais
      const ehAntec = /^ANTEC\s+\d{2}\/\d{2}-/i.test(desc2);
      const desc3 = ehAntec
        ? desc2.replace(/^ANTEC\s+(\d{2}\/\d{2})-\s*/i,"").trim() + ` (antecipada ${desc2.match(/^ANTEC\s+(\d{2}\/\d{2})/i)[1]})`
        : desc2;
      const v = b.v;
      if(isNaN(v)||v===0) return;
      somaAberta += v;
      const valorApp = v > 0 ? -v : Math.abs(v);
      const mesCompra = parseInt(b.mm);
      const ano = mesCompra > mesFechamento ? anoFatura - 1 : anoFatura;
      const iso = `${ano}-${b.mm}-${b.dd}`;
      // a fatura imprime a data ORIGINAL da compra, mesmo na parcela 02/04, 03/04...
      lancamentos.push({data:ajustarParc(iso, desc3), hist:desc3, valor:valorApp, doc:cartao});
    });

    if(!lancamentos.length){
      avisar("Não encontrei lançamentos no PDF. Verifique se é a fatura do BB Ourocard.",true); return;
    }

    // resumo da fatura para mostrar na visão geral
    if(ehAberta){
      dados.faturaAberta = {cartao:cartao, total:Math.round(somaAberta*100)/100,
        pendente:Math.round(pendTotal*100)/100, nPendentes:pendentes,
        atualizadoEm:hoje.toISOString().slice(0,10),
        fechamento:(dados.faturaFechada&&dados.faturaFechada.proxFechamento)||""};
    } else if(mFecha){
      const mTot  = textoTotal.match(/\bTotal\s+R\$\s*([\d.]+,\d{2})/);
      const mVenc = textoTotal.match(/Vencimento[\s\S]{0,120}?(\d{2}\/\d{2}\/\d{4})/);
      const mProx = textoTotal.match(/Fechamento da pr[óo]xima fatura\s+(\d{2}\/\d{2}\/\d{4})/i);
      const fechadaEm = `${mFecha[3]}-${mFecha[2]}-${mFecha[1]}`;
      if(!dados.faturaFechada || (dados.faturaFechada.fechadaEm||"") <= fechadaEm)
        dados.faturaFechada = {cartao:cartao, fechadaEm:fechadaEm,
          total: mTot ? numBR(mTot[1]) : null,
          vencimento: mVenc ? dataBR(mVenc[1]) : "",
          proxFechamento: mProx ? dataBR(mProx[1]) : ""};
    }

    // Evitar duplicar: a mesma compra pode vir escrita um pouco diferente na fatura
    // em aberto e na fechada ("DUROKE CASA DE CARNE BELO" × "...BELO HORIZONT").
    // Compara data + valor + começo da descrição; compras iguais no mesmo dia contam
    // uma a uma (duas de R$ 29,90 no mesmo dia são duas compras).
    const norm = s => String(s).toUpperCase().normalize("NFD").replace(/[^A-Z0-9]/g,"");
    const parecido = (a,b)=>{ a=norm(a); b=norm(b); const n=Math.min(8,a.length,b.length); return n>0 && a.slice(0,n)===b.slice(0,n); };
    const livres = new Map();
    dados.lancamentos.forEach(l=>{
      if(l.origem!=="cartao") return;
      const k = l.data+"|"+Number(l.valor).toFixed(2);
      if(!livres.has(k)) livres.set(k,[]);
      livres.get(k).push(l);
    });
    const idsUsados = new Set(dados.lancamentos.map(l=>l.id));
    let novos=0, repetidos=0, prontos=0;
    const mesesTocados = new Set();

    lancamentos.forEach(l=>{
      const k = l.data+"|"+l.valor.toFixed(2);
      const cand = livres.get(k)||[];
      const i = cand.findIndex(x=>parecido(x.hist,l.hist));
      if(i>=0){ cand.splice(i,1); repetidos++; return; }
      const base = l.data+"|cartao|"+l.valor.toFixed(2)+"|"+l.hist.slice(0,42);
      let id = base, n = 2;
      while(idsUsados.has(id)) id = base+"#"+(n++);
      // valor positivo vindo do cartão = estorno/crédito de compra
      let c = classificar(l.hist, l.valor);
      if(l.valor > 0 && c.categoria==="Receita de cliente"){
        c = {categoria:"Reembolso e estorno", vinculo:"PF"};
      }
      if(c.categoria!=="Sem categoria") prontos++;
      dados.lancamentos.push({id, data:l.data, hist:l.hist, valor:l.valor,
        doc:l.doc, categoria:c.categoria, vinculo:c.vinculo, obs:"", origem:"cartao"});
      idsUsados.add(id); novos++;
      mesesTocados.add(l.data.slice(0,7));
    });

    dados.lancamentos.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(mesesTocados.size){ ui.mes=[...mesesTocados].sort().pop(); ui.view="mes"; }
    salvar(); render();
    avisar(novos+" lançamento"+(novos===1?"":"s")+" do cartão importado"+(novos===1?"":"s")+
           (novos?" · "+prontos+" já classificado"+(prontos===1?"":"s"):"")+
           (repetidos?" · "+repetidos+" já existia"+(repetidos===1?"":"m"):"")+
           (ehAberta?" · fatura em aberto: R$ "+brl(somaAberta)+(pendTotal?" (+ R$ "+brl(pendTotal)+" em processamento)":""):""));
  }
  function barraFatura(){
    const a=dados.faturaAberta, f=dados.faturaFechada;
    if(!a && !(f&&f.total!=null)) return "";
    const dm = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7) : "";

        (f.vencimento?(f.vencimento<hoje?' · venceu em ':' · vence em ')+dm(f.vencimento):'')+'</span>' : "";
    if(a && (!f || (f.fechadaEm||"") < a.atualizadoEm)){
      const cart = a.cartao!=="Cartão" ? a.cartao : (f&&f.cartao);

      let txtFecha = "";

                 : d===1 ? 'Fecha <b>amanhã</b> ('+dm(fecha)+')'
                 : d===0 ? 'Fecha <b>hoje</b>'
                 : 'Fechou em '+dm(fecha)+' — importe a fatura fechada'; }
      return '<section class="barra-fatura">'+
        '<div><div class="bf-rot">Fatura do cartão em aberto'+(cart?' · '+esc(cart):'')+'</div>'+
          '<div class="bf-valor">R$ '+brl(a.total)+'</div>'+
          '<div class="bf-sub">compras até '+dm(a.atualizadoEm)+

        '<div class="bf-lado">'+(txtFecha?'<span class="bf-fecha">'+txtFecha+'</span>':'')+ult+bt+'</div>'+
      '</section>';

    // sem fatura em aberto importada: mostra a última fechada
    return '<section class="barra-fatura">'+
      '<div><div class="bf-rot">Última fatura do cartão'+(f.cartao?' · '+esc(f.cartao):'')+'</div>'+
        '<div class="bf-valor">R$ '+brl(f.total)+'</div>'+
        '<div class="bf-sub">'+(f.vencimento?(f.vencimento<hoje?'venceu em ':'vence em ')+dm(f.vencimento):'')+'</div></div>'+
      '<div class="bf-lado"><span class="bf-ult">Importe a fatura atual do BB para ver o valor em aberto</span>'+bt+'</div>'+
    '</section>';
  }
  const visaoNatureza = () => ui.conta==="cpf"||ui.conta==="pj";

  const nomeOrigem = l => l.origem==="cartao"?"Cartão de crédito":l.origem==="pj"?"Conta CNPJ":"Conta CPF";
  const RECEITA_CATS = new Set(["Receita de cliente","Produtos para venda"]);

  /* Do lucro do negócio até o que realmente ficou na conta CNPJ.
     ls = lançamentos do período (todas as contas). */
  function fluxoNegocio(ls){
    const v=ls.filter(l=>!l.ignorado&&ehMov(l));
    const neg=v.filter(ehNegocio), pes=v.filter(l=>!ehNegocio(l));
    const sum=a=>a.reduce((s,l)=>s+l.valor,0);
    const lucro=sum(neg.filter(l=>!ehRetirada(l)));
    const ret=-sum(neg.filter(ehRetirada));
    const informal=sum(neg.filter(l=>l.origem!=="pj"&&!ehRetirada(l)));   // + receita que caiu no CPF; − despesa do negócio paga por você
    const recCPF=sum(neg.filter(l=>l.origem!=="pj"&&l.valor>0));
    const despCPF=-sum(neg.filter(l=>l.origem!=="pj"&&l.valor<0&&!ehRetirada(l)));
    const pesPj=-sum(pes.filter(l=>l.origem==="pj"));                       // gastos pessoais pagos pela conta CNPJ
    const cnpj=lucro-ret-informal-pesPj;
    return {lucro,ret,informal,recCPF,despCPF,pesPj,cnpj,usado:ret+Math.max(informal,0)+Math.max(pesPj,0)};
  }
  function cascataHTML(f,compacto){
    const lin=(t,v,forte,cor)=>'<div class="cas-l'+(forte?' forte':'')+'"><span>'+t+'</span><span class="cas-v" style="'+(cor?'color:'+cor:'')+'">'+
      (v<0?'− ':'')+'R$ '+brl(Math.abs(v))+'</span></div>';
    let h=lin("Lucro do negócio",f.lucro,true,f.lucro<0?"#C0392B":"#1E8A5F");
    if(f.ret) h+=lin("Pró-labore transferido para você",-f.ret);
    if(f.informal>0) h+=lin("Receita que caiu no CPF e ficou com você"+(f.despCPF?' <span class="sub" style="display:inline">(R$ '+brl(f.recCPF)+' recebidos − R$ '+brl(f.despCPF)+' de despesas do negócio pagas pelo CPF)</span>':''),-f.informal);
    if(f.informal<0) h+=lin("Despesas do negócio que você pagou do bolso",-f.informal);
    if(f.pesPj>0) h+=lin("Gastos pessoais pagos pela conta CNPJ",-f.pesPj);
    h+=lin("Ficou na conta CNPJ",f.cnpj,true,f.cnpj<0?"#C0392B":"var(--tinta)");
    const usado=f.ret+Math.max(f.informal,0)+Math.max(f.pesPj,0);
    return '<div class="cascata'+(compacto?' compacto':'')+'">'+h+
      (usado>0?'<p class="cas-nota">Você usou <b>R$ '+brl(usado)+'</b> do dinheiro do negócio no pessoal'+
        (f.ret&&usado>f.ret?' — só R$ '+brl(f.ret)+' como pró-labore registrado':'')+'.</p>':'')+
      (f.cnpj<0?'<p class="cas-nota">Negativo: saiu mais da conta CNPJ do que entrou no período (usou saldo anterior ou aporte).</p>':'')+
    '</div>';
  }
  function doPeriodo(){ return dados.lancamentos.filter(l=>ui.mes==="tudo"||l.data.slice(0,7)===ui.mes); }

  function resumoSeparacao(ls){
    const neg=ls.filter(ehNegocio), pes=ls.filter(l=>!ehNegocio(l));
    const sum=a=>a.reduce((s,l)=>s+Math.abs(l.valor),0);
    const recFora=neg.filter(l=>l.valor>0&&l.origem!=="pj"&&RECEITA_CATS.has(l.categoria));
    const despFora=neg.filter(l=>l.valor<0&&l.origem!=="pj"&&l.categoria!==CAT_PL&&l.categoria!==CAT_ENTRE);
    const pesNoPj=pes.filter(l=>l.origem==="pj"&&l.categoria!==CAT_PL&&l.categoria!==CAT_ENTRE);
    const prolab=ls.filter(l=>l.categoria==="Pró-labore (retirada MEI)"&&l.valor<0);
    return {recFora,despFora,pesNoPj,prolab,sum};
  }
  // o lançamento passou pela conta errada? (mesma regra dos avisos acima)
  function contaErrada(l){
    const fora = l.categoria!==CAT_PL && l.categoria!==CAT_ENTRE;
    if(ui.conta==="pj")  return ehNegocio(l) && l.origem!=="pj" &&
      ((l.valor>0 && RECEITA_CATS.has(l.categoria)) || (l.valor<0 && fora));
    if(ui.conta==="cpf") return !ehNegocio(l) && l.origem==="pj" && fora;
    return false;
  }
  const mesesComDados = () => [...new Set(lancDaConta().map(l=>l.data.slice(0,7)))].sort();

  function doMes(){
    const base = lancDaConta();
    return ui.mes==="tudo" ? base.slice()
         : base.filter(l=>l.data.slice(0,7)===ui.mes);
  }
  function ehFaturamento(l,ano){
    return !l.ignorado&&l.valor>0&&ehNegocio(l)&&RECEITA_CATS.has(l.categoria)&&l.data.slice(0,4)===String(ano);
  }
  function abrirFaturamento(ano){
    ui.conta="pj"; ui.view="mes"; ui.mes="tudo";
    ui.busca=""; ui.cat=""; ui.tipo=""; ui.vinculo=""; ui.origem=""; ui.fat=String(ano);
    ui.sortCol="valor"; ui.sortDir=1; // tabela mostra invertido: maior primeiro
    render();
    try{ document.getElementById("tabelaLanc").scrollIntoView({behavior:"smooth",block:"start"}); }catch(_){}
  }
  function filtrados(){
    const b=ui.busca.trim().toLowerCase();
    const base=doMes().filter(l=>{
      if(ui.fat && !ehFaturamento(l,ui.fat)) return false;
      if(ui.errada && !contaErrada(l)) return false;
      if(b && !(l.hist.toLowerCase().includes(b)||(l.obs||"").toLowerCase().includes(b))) return false;
      if(ui.cat && l.categoria!==ui.cat) return false;
      if(ui.vinculo && l.vinculo!==ui.vinculo) return false;
      if(ui.origem){ const o=l.origem==="cartao"?"cartao":l.origem==="pj"?"pj":"pf"; if(o!==ui.origem) return false; }
      if(ui.tipo==="e" && l.valor<=0) return false;
      if(ui.tipo==="s" && l.valor>=0) return false;
      return true;
    });
    const col=ui.sortCol||"data", dir=ui.sortDir||1;
    return base.slice().sort((a,b)=>{
      let va=a[col]||"", vb=b[col]||"";
      if(col==="valor"){ va=a.valor; vb=b.valor; }
      if(va<vb) return -dir; if(va>vb) return dir; return 0;
    });
  }
  function saldoDiario(lista,inicial){
    const porDia={};
    lista.forEach(l=>{porDia[l.data]=(porDia[l.data]||0)+l.valor;});
    let s=inicial;
    return Object.keys(porDia).sort().map(d=>{s+=porDia[d];return {data:d,mov:porDia[d],saldo:s};});
  }

  /* ================= gráfico de saldo ================= */
  function grafico(serie,inicial){
    if(serie.length<2) return '<p class="sub">O gráfico aparece quando o mês tiver movimento em pelo menos dois dias.</p>';
    const pts=[{data:"",saldo:inicial}].concat(serie);
    const vals=pts.map(p=>p.saldo);
    const max=Math.max(...vals,0), min=Math.min(...vals,0);
    const L=44,R=12,T=14,B=26,W=460,H=190;
    const iw=W-L-R, ih=H-T-B;
    const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1));
    const y=v=>T+ih-((v-min)/((max-min)||1))*ih;
    const y0=y(0);
    const linha=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.saldo).toFixed(1)).join(" ");
    const area=linha+" L"+x(pts.length-1).toFixed(1)+" "+y0.toFixed(1)+" L"+x(0).toFixed(1)+" "+y0.toFixed(1)+" Z";
    const neg=pts.filter(p=>p.saldo<0).length;
    const marcas=pts.map((p,i)=>p.saldo<0?'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.saldo).toFixed(1)+
        '" r="2.6" fill="var(--tijolo)"/>':"").join("");
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Saldo dia a dia">'+
      '<clipPath id="abaixo"><rect x="0" y="'+y0.toFixed(1)+'" width="'+W+'" height="'+(H-y0).toFixed(1)+'"/></clipPath>'+
      '<clipPath id="acima"><rect x="0" y="0" width="'+W+'" height="'+y0.toFixed(1)+'"/></clipPath>'+
      '<path d="'+area+'" fill="var(--verde-suave)" opacity=".16" clip-path="url(#acima)"/>'+
      '<path d="'+area+'" fill="var(--tijolo)" opacity=".14" clip-path="url(#abaixo)"/>'+
      '<line x1="'+L+'" y1="'+y0.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y0.toFixed(1)+'" stroke="var(--linha)" stroke-width="1"/>'+
      '<path d="'+linha+'" fill="none" stroke="var(--verde)" stroke-width="1.6" stroke-linejoin="round"/>'+
      marcas+
      '<text x="4" y="'+(y(max)+4).toFixed(1)+'" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+brl(max).split(",")[0]+'</text>'+
      '<text x="4" y="'+(y(min)+4).toFixed(1)+'" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+brl(min).split(",")[0]+'</text>'+
      '<text x="'+L+'" y="'+(H-6)+'" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+
        (serie[0]?serie[0].data.slice(8)+"/"+serie[0].data.slice(5,7):"")+'</text>'+
      '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="9.5" fill="var(--cinza)" font-family="Jost,sans-serif">'+
        (serie[serie.length-1]?serie[serie.length-1].data.slice(8)+"/"+serie[serie.length-1].data.slice(5,7):"")+'</text>'+
      '</svg>'+(neg?'<p class="sub">'+neg+' dia'+(neg===1?"":"s")+' com saldo negativo, marcado'+(neg===1?"":"s")+' em vermelho.</p>':"");
  }

  /* ================= exportação ================= */
  function baixar(nome,conteudo,tipo){
    const b=new Blob([conteudo],{type:tipo});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=nome;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  }
  function exportarCSV(){
    const lista=filtrados();
    if(!lista.length){ avisar("Não há lançamentos para exportar com esses filtros.",true); return; }
    const cel=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const linhas=[["Data","Descrição","Categoria","Vínculo","Entrada","Saída","Valor","Situação","Observação","Documento"].map(cel).join(";")];
    lista.forEach(l=>linhas.push([
      cel(l.data.split("-").reverse().join("/")),cel(l.hist),cel(l.categoria),
      cel(l.vinculo==="PJ"?"Negócio":"Pessoal"),
      cel(l.valor>0&&!l.ignorado?l.valor.toFixed(2).replace(".",","):""),
      cel(l.valor<0&&!l.ignorado?Math.abs(l.valor).toFixed(2).replace(".",","):""),
      cel(l.valor.toFixed(2).replace(".",",")),
      cel(l.ignorado?"Riscado":""),
      cel(l.obs||""),cel(l.doc||"")
    ].join(";")));
    const nome="livro-caixa-"+(ui.mes==="tudo"?"completo":ui.mes)+".csv";
    baixar(nome,"\uFEFF"+linhas.join("\r\n"),"text/csv;charset=utf-8");
    avisar("Planilha exportada com "+lista.length+" lançamentos.");
  }
  function exportarBackup(){
    baixar("livro-caixa-backup-"+new Date().toISOString().slice(0,10)+".json",
           JSON.stringify(dados,null,1),"application/json");
    avisar("Backup salvo. Guarde o arquivo fora do computador.");
  }
  function restaurarBackup(arq){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.lancamentos)) throw 0;
        const vistos=new Set(dados.lancamentos.map(l=>l.id));
        let n=0;
        d.lancamentos.forEach(l=>{ if(l&&l.id&&!vistos.has(l.id)){dados.lancamentos.push(l);vistos.add(l.id);n++;} });
        Object.assign(dados.saldos,d.saldos||{});
        if(Array.isArray(d.regras)&&d.regras.length) dados.regras=d.regras;
        dados.lancamentos.sort((a,b)=>a.data<b.data?-1:1);
        salvar(); render();
        avisar(n?n+" lançamento"+(n===1?"":"s")+" recuperado"+(n===1?"":"s")+".":"O backup não trouxe nada novo.");
      }catch(e){ avisar("Esse arquivo não é um backup do livro-caixa.",true); }
    };
    fr.readAsText(arq);
  }

  /* ================= desenho da tela ================= */
  /* ================= navegação ================= */
  const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
  function marcarConta(){
    document.querySelectorAll("#contaTabs .conta-tab").forEach(b=>b.classList.toggle("ativa",b.dataset.conta===ui.conta));
  }
  function mesPadrao(meses){
    const ok=meses.filter(m=>m<=mesAtual()), l=ok.length?ok:meses;
    return l[l.length-1];
  }
  function renderPeriodo(meses,comVistas){
    ui._meses=meses;
    const idx=meses.indexOf(ui.mes);
    let h="";
    if(!comVistas||ui.view==="mes"){
      h+='<div class="periodo">'+
        '<button data-passo="-1" title="Mês anterior"'+((ui.mes==="tudo"||idx<=0)?" disabled":"")+'>‹</button>'+
        '<select id="selMes" aria-label="Período">'+
          '<option value="tudo"'+(ui.mes==="tudo"?" selected":"")+'>Todos os meses</option>'+
          meses.slice().reverse().map(m=>'<option value="'+m+'"'+(ui.mes===m?" selected":"")+'>'+
            cap(rotuloMes(m))+(m>mesAtual()?" (previsto)":"")+'</option>').join("")+
        '</select>'+
        '<button data-passo="1" title="Próximo mês"'+((ui.mes==="tudo"||idx<0||idx>=meses.length-1)?" disabled":"")+'>›</button>'+
      '</div>';
    } else {
      h+='<div class="periodo"><span class="sub" style="margin:0">'+
        (ui.view==="regras"?"As regras valem para todas as contas":"Todos os meses com lançamentos")+'</span></div>';
    }
    if(comVistas){
      const vs=[["mes","Resumo do mês"]];
      if(meses.length>1) vs.push(["comparar","Comparar meses"]);
      if(ui.conta==="pj") vs.push(["dre","DRE MEI"]);
      vs.push(["regras","Regras"]);
      h+='<div class="vistas" role="tablist">'+vs.map(([v,t])=>
        '<button role="tab" data-view="'+v+'" class="'+(ui.view===v?"on":"")+'" aria-selected="'+(ui.view===v)+'">'+t+'</button>').join("")+'</div>';
    }
    $("#abas").innerHTML=h;
  }

  /* ================= desenho da tela ================= */
  function render(){
    const corpo=$("#corpo"); corpo.onclick=null; corpo.onkeydown=null;
    marcarConta();
    if(ui.conta==="dash"){ renderDashboard(); return; }
    if(!ui.view) ui.view="mes";

    const meses=mesesComDados();
    if(ui.view==="dre"&&ui.conta!=="pj") ui.view="mes";
    if(ui.view==="comparar"&&meses.length<2) ui.view="mes";
    if(!meses.length) ui.mes=null;
    else if(!ui.mes||(ui.mes!=="tudo"&&!meses.includes(ui.mes))) ui.mes=mesPadrao(meses);
    renderPeriodo(meses,true);

    if(ui.view==="regras"){ renderRegras(); return; }
    if(!meses.length){
      corpo.innerHTML='<div class="vazio"><p class="num">Comece pelo extrato</p>'+
        '<p>Clique em <b>Importar</b> e traga o extrato do Banco do Brasil (CSV ou Excel) ou a fatura do cartão (PDF). '+
        'Os lançamentos entram já classificados e ficam guardados para os próximos meses.</p></div>';
      return;
    }
    if(ui.view==="comparar"){ comparar(meses); return; }
    if(ui.view==="dre"){ dre(meses); return; }

    const natureza=visaoNatureza();
    const lista=doMes().filter(l=>!l.ignorado);
    // Pessoal / Negócio: gasto real — compras do cartão entram na data da compra;
    //   pagamento de fatura e aplicações ficam fora (senão conta duas vezes).
    // Conferir extrato: igual ao banco — sem as compras do cartão, com o débito da fatura.
    const base = natureza ? lista.filter(ehMov) : lista.filter(l=>l.origem!=="cartao");
    const soma = a => a.reduce((s,l)=>s+l.valor,0);
    const ehPJ = natureza && ui.conta==="pj";
    const retiradas = ehPJ ? base.filter(ehRetirada) : [];
    const retirado = Math.abs(soma(retiradas));
    const baseGasto = ehPJ ? base.filter(l=>!ehRetirada(l)) : base;
    const ent=soma(base.filter(l=>l.valor>0));
    const sai=soma(baseGasto.filter(l=>l.valor<0));
    const res=ent+sai;
    const inicial = natureza?0:(ui.mes==="tudo" ? (dados.saldos[meses[0]]||0) : (dados.saldos[ui.mes]||0));
    const serie = natureza?[]:saldoDiario(base,inicial);
    const fim = serie.length?serie[serie.length-1].saldo:inicial;
    const diasNeg = serie.filter(d=>d.saldo<0);
    const fundo = diasNeg.length?Math.min(...diasNeg.map(d=>d.saldo)):0;

    const porCat={};
    baseGasto.forEach(l=>{ porCat[l.categoria]=(porCat[l.categoria]||0)+l.valor; });
    const saidas=Object.entries(porCat).filter(e=>e[1]<0).sort((a,b)=>a[1]-b[1]);
    const entradas=Object.entries(porCat).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
    const maiorSaida=saidas.length?Math.abs(saidas[0][1]):1;
    const maiorEnt=entradas.length?entradas[0][1]:1;
    const LIM=6;
    const vSai=ui.verTodasSai?saidas:saidas.slice(0,LIM);
    const vEnt=ui.verTodasEnt?entradas:entradas.slice(0,LIM);

    const fatura=Math.abs(soma(lista.filter(l=>l.categoria===CAT_FATURA&&l.valor<0)));
    const aplic=soma(lista.filter(l=>l.categoria==="Aplicação e resgate"));
    const nCartao=lista.filter(l=>l.origem==="cartao").length;
    const semCat=base.filter(l=>l.categoria==="Sem categoria").length;
    const sepR=resumoSeparacao(lista);
    const foraLugar = ui.conta==="pj" ? sepR.recFora.concat(sepR.despFora) : ui.conta==="cpf" ? sepR.pesNoPj : [];

    // nota explicativa (uma linha)
    let nota;
    if(natureza){
      const partes=["Compras do cartão contam na data da compra."];
      if(fatura) partes.push("Pagamento de fatura (R$ "+brl(fatura)+") não é gasto: as compras já estão contadas.");
      if(aplic) partes.push("Aplicações e resgates (R$ "+brl(Math.abs(aplic))+") ficam fora.");
      const entre=Math.abs(soma(lista.filter(l=>l.categoria===CAT_ENTRE)));
      if(entre) partes.push("Transferências entre suas contas (R$ "+brl(entre)+") ficam fora.");
      nota=partes.join(" ");

    } else nota="Como no banco: a fatura do cartão aparece como um débito único e as compras do cartão não entram.";

    const avisos=[];
    if(natureza&&ui.mes!=="tudo"&&fatura&&!nCartao)
      avisos.push('<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro)"><div>'+
        '<b>Nenhuma compra do cartão neste mês.</b> Importe a fatura para os gastos do cartão aparecerem aqui.</div></div>');
    if(semCat)
      avisos.push('<div class="alerta clic" data-filtrar="Sem categoria" role="button" tabindex="0" style="background:#F7F5EE;border-left-color:var(--ouro)"><div><b>'+
        semCat+' lançamento'+(semCat===1?"":"s")+' sem categoria.</b> Clique para ver e classificar.</div></div>');
    if(foraLugar.length)
      avisos.push('<div class="alerta clic" data-errada="1" role="button" tabindex="0" title="Ver quais são"><div><b>'+foraLugar.length+' lançamento'+(foraLugar.length>1?"s":"")+
        ' pela conta errada (R$ '+brl(foraLugar.reduce((s,l)=>s+Math.abs(l.valor),0))+').</b> '+
        (ui.conta==="pj"?"Movimentos do negócio passaram pela conta CPF ou cartão pessoal.":"Gastos pessoais passaram pela conta CNPJ.")+
        ' <u>Ver quais são</u></div></div>');
    if(diasNeg.length)
      avisos.push('<div class="alerta"><div><b>'+diasNeg.length+' dia'+(diasNeg.length===1?"":"s")+
        ' no cheque especial.</b> O saldo chegou a R$ '+brl(fundo)+'.</div></div>');

    const cartoes = natureza
      ? cartao("Entrou",ent,"pos",base.filter(l=>l.valor>0).length+" lançamentos","#1E8A5F")+
        cartao("Gastou",Math.abs(sai),"",baseGasto.filter(l=>l.valor<0).length+" lançamentos"+(ehPJ?" · sem pró-labore":""),"#E08E0B")+
        (ehPJ
          ? cartao(res<0?"Prejuízo":"Lucro",res,res<0?"neg":"pos","entrou − gastou, antes do pró-labore",res<0?"#C0392B":"#1E8A5F")
          : cartao(res<0?"Faltou":"Sobrou",res,res<0?"neg":"pos","entrou − gastou",res<0?"#C0392B":"#1E8A5F"))
      : cartao("Entradas",ent,"pos",base.filter(l=>l.valor>0).length+" lançamentos","#1E8A5F")+
        cartao("Saídas",Math.abs(sai),"",base.filter(l=>l.valor<0).length+" lançamentos","#E08E0B")+
        cartao("Saldo final",fim,fim<0?"neg":"",ui.mes==="tudo"?"acumulado":"em "+rotuloMes(ui.mes),fim<0?"#C0392B":"#2E86DE");

    const verMais=(chave,tot,aberto)=>tot>LIM?'<button class="ver-mais" data-vermais="'+chave+'">'+
      (aberto?"Mostrar menos":"Ver todas as "+tot+" categorias")+'</button>':"";

    corpo.innerHTML =
      '<section class="totais">'+cartoes+'</section>'+
      (ehPJ?'<div class="tit-secao" style="margin:22px 0 8px"><h3>Para onde foi o lucro</h3></div>'+cascataHTML(fluxoNegocio(doPeriodo())):"")+
      '<p class="nota-linha">'+nota+'</p>'+
      (ui.conta==="pj"?limiteMeiHTML(/^\d{4}/.test(ui.mes||"")?ui.mes.slice(0,4):mesPadrao(meses).slice(0,4)):"")+
      (avisos.length?'<div class="avisos">'+avisos.join("")+'</div>':"")+

      '<div class="paineis">'+
        '<div>'+
          '<div class="tit-secao"><h3>'+(natureza?"Onde gastei":"Para onde foi")+'</h3></div>'+
          (vSai.length?vSai.map(([c,v])=>catLinha(c,v,Math.abs(v)/maiorSaida,false)).join(""):'<p class="sub">Sem gastos neste período.</p>')+
          verMais("sai",saidas.length,ui.verTodasSai)+
        '</div>'+
        '<div>'+
          (natureza?"":'<div class="tit-secao"><h3>Saldo dia a dia</h3></div>'+grafico(serie,inicial)+'<div style="height:26px"></div>')+
          '<div class="tit-secao"><h3>De onde veio</h3></div>'+
          (vEnt.length?vEnt.map(([c,v])=>catLinha(c,v,v/maiorEnt,true)).join(""):'<p class="sub">Sem entradas neste período.</p>')+
          verMais("ent",entradas.length,ui.verTodasEnt)+
        '</div>'+
      '</div>'+

      '<div class="tit-secao" style="margin-top:36px"><h3>Lançamentos</h3></div>'+
      '<div class="filtros" style="margin-top:0">'+
        '<input type="search" id="fBusca" placeholder="Buscar estabelecimento ou observação" value="'+esc(ui.busca)+'">'+
        selectFiltro("fCat",ui.cat,"Todas as categorias",CATEGORIAS)+
        selectFiltro("fTipo",ui.tipo,"Entradas e saídas",[["e","Só entradas"],["s","Só saídas"]])+
        (natureza?'':selectFiltro("fVinc",ui.vinculo,"Negócio e pessoal",[["PJ","Só negócio"],["PF","Só pessoal"]]))+
        selectFiltro("fOrig",ui.origem||"","Todas as origens",[["pf","Conta CPF"],["pj","Conta CNPJ"],["cartao","Cartão de crédito"]])+
        '<span class="conta" id="conta"></span>'+
      '</div>'+
      '<div class="chips" id="chips"></div>'+
      '<div class="rolagem"><table id="tabelaLanc"><thead><tr>'+
      ['data','hist','categoria','vinculo','valor'].map((col,i)=>{
