  /* ================= valor líquido (se resgatar/vender hoje) =================
     Renda fixa (Tesouro, CDB): IR regressivo sobre o rendimento de cada compra (até 180 dias 22,5% · até 360 20% · até 720 17,5% · depois 15%),
       IOF regressivo nos primeiros 30 dias e, no Tesouro, taxa de custódia da B3 (0,20% a.a., estimada pro rata desde a compra).
       Conferido com o Tesouro Direto: IPCA+ 2040 comprado em 12/02/26 → líquido R$ 123.034,06 no site, R$ 123.025 aqui.
     Renda variável (se vender tudo hoje): ações 15% sobre o lucro, isentas se as vendas de ações no mês somarem até R$ 20 mil;
       FIIs 20% sobre o lucro; ETFs (inclusive cripto) 15%. Prejuízo não gera imposto. Proventos de FII são isentos e não entram aqui. */
  const IOF_TAB=[96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3,0];
  const aliqIR = dias => dias<=180?0.225:dias<=360?0.20:dias<=720?0.175:0.15;
  function lotesRF(){
    const L={}, ord={compra:0,bonus:1,provento:2,venda:3,ignorar:4};
    invOk().movs.slice().sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:ord[a.tipo]-ord[b.tipo]).forEach(m=>{
      const q=+m.qt||0, l=L[m.ativo]=L[m.ativo]||[];
      if(m.tipo==="compra"&&q>0) l.push({data:m.data,qt:q,custo:+m.valor||0});
      else if(m.tipo==="venda"){ let r=q; while(r>1e-9&&l.length){ const a=l[0], t=Math.min(a.qt,r); a.custo-=a.custo*t/a.qt; a.qt-=t; r-=t; if(a.qt<=1e-9) l.shift(); } }
    });
    return L;
  }
  function liquidoDe(x,lotes,isentoAcoes){
    const hj=new Date(hojeISO()+"T12:00:00"), dias=d=>Math.max(0,Math.round((hj-new Date(d+"T12:00:00"))/864e5));
    const bruto=+x.valor||0, custo=+x.custo||0;
    if(RF_CLASSES.includes(x.classe)){
      let ls=(lotes[x.ativo]||[]).filter(l=>l.qt>1e-9), qL=ls.reduce((s,l)=>s+l.qt,0);
      if(!ls.length||!(qL>0)){ ls=[{data:x.emissao||"2000-01-01",qt:1,custo:custo}]; qL=1; }
      // custo de cada compra proporcional ao custo do ativo (o custo do ativo é o que vale na tela)
      const cL=ls.reduce((s,l)=>s+l.custo,0)||1;
      let ir=0, iof=0, cust=0; const aliqs=new Set();
      ls.forEach(l=>{
        const fr=l.qt/qL, vb=bruto*fr, cb=custo*(l.custo/cL), d=dias(l.data), g=Math.max(0,vb-cb);
        const io= d<30 ? g*IOF_TAB[Math.max(0,d-1)]/100 : 0;
        const a=aliqIR(d); aliqs.add(a); ir+=(g-io)*a; iof+=io;
        if(x.classe==="Tesouro Direto") cust+=0.002*Math.min(d,3650)/365*(vb+cb)/2;
      });
      const imp=cent(ir+iof+cust);
      return {liq:cent(bruto-imp), ir:cent(ir), iof:cent(iof), cust:cent(cust),
        nota:"IR "+[...aliqs].map(a=>(a*100).toLocaleString("pt-BR")+"%").join("/")+(iof>0.005?" + IOF":"")+(cust>0.005?" + custódia":"")};
    }
    const g=bruto-custo, aliq=x.classe==="FIIs"?0.20:x.classe==="Ações"?(isentoAcoes?0:0.15):0.15;
    const ir=g>0?g*aliq:0;
    return {liq:cent(bruto-ir), ir:cent(ir), iof:0, cust:0, nota:g<=0?"sem lucro, sem IR":aliq===0?"isento (vendas até R$ 20 mil/mês)":"IR "+(aliq*100)+"% sobre o lucro"};
  }

  /* ---- bancos: saldo em conta + investimentos em cada instituição ---- */
  const BANCOS_INV=[["itau","Itaú","#EC7000"],["bb","BB","#F4C400"],["santander","Santander","#EC0000"],["btg","BTG","#0B2A4A"],["xp","XP","#111827"],["inter","Inter","#FF7A00"]];

  function bancoDe(inst){
    const t=normTxt(inst);
    if(!t) return "sem";
    if(/ITAU/.test(t)) return "itau";
    if(/BANCO DO BRASIL|\bBB\b|BB DTVM|BB GESTAO/.test(t)) return "bb";
    if(/SANTANDER/.test(t)) return "santander";
    if(/BTG/.test(t)) return "btg";
    if(/\bXP\b|XP INVEST/.test(t)) return "xp";
    if(/INTER\b|BANCO INTER|INTER DTVM|INTER DISTRIBUIDORA/.test(t)) return "inter";
    return "outros";
  }

  function render(){
    const corpo=$("#corpo"); corpo.onclick=null; corpo.onkeydown=null; corpo.onchange=null; $("#abas").onclick=null;

    if(ui.conta==="metas"){ renderMetas(); return; }
    if(ui.conta==="invest"){ renderInvest(); return; }

    const meses=mesesComDados();
    if(ui.view==="comparar"&&meses.length<2) ui.view="mes";

    else if(!ui.mes||(ui.mes!=="tudo"&&!meses.includes(ui.mes))) ui.mes=mesPadrao(meses);
    renderPeriodo(meses,true);

        'Os lançamentos entram já classificados e ficam guardados para os próximos meses.</p></div>';
      return;
    }
    if(ui.view==="comparar"){ comparar(meses); return; }

    const natureza=visaoNatureza();
    const lista=doMes().filter(l=>!l.ignorado);
    // Lançamentos: gasto real — compras do cartão entram na data da compra;
    //   pagamento de fatura e aplicações ficam fora (senão conta duas vezes).
    // Conferir extrato: igual ao banco — sem as compras do cartão, com o débito da fatura.
    const base = natureza ? lista.filter(ehMov) : ui.conta==="cartao" ? lista : lista.filter(l=>l.origem!=="cartao");
    const semSaldo = natureza || ui.conta==="cartao";
    const soma = a => a.reduce((s,l)=>s+l.valor,0);
    // totais: só o realizado; o agendado aparece à parte. Na visão por natureza, empréstimo recebido fica fora
    // e os totais são os mesmos da Visão geral (estorno abate o gasto da própria categoria).
    const baseReal = base.filter(realizado);
    const agend = base.filter(l=>!realizado(l)&&l.categoria!==CAT_EMPREST);
    const baseGasto = natureza ? baseReal.filter(l=>l.categoria!==CAT_EMPREST) : baseReal;
    const rNat = natureza ? entSai(baseReal) : null;
    const ent = natureza ? rNat.tE : soma(baseGasto.filter(l=>l.valor>0));
    const sai = natureza ? -rNat.tS : soma(baseGasto.filter(l=>l.valor<0));
    const res=ent+sai;
    const ini0 = semSaldo?null:saldoInicio(ui.conta, ui.mes==="tudo"?meses[0]:ui.mes);
    const inicial = ini0?ini0.v:0;
    const comConf = !semSaldo && ui.mes!=="tudo" && (ui.conta==="itau"||ui.conta==="bb");
    const serie = semSaldo?[]:saldoDiario(base,inicial);
    const fim = serie.length?serie[serie.length-1].saldo:inicial;
    // saldo hoje: último dia já realizado; o resto da série é projeção (agendados)
    const hj=hojeISO(), temFuturo=!semSaldo&&agend.length>0&&ui.mes!=="tudo";
    const ateHoje=serie.filter(d=>d.data<=hj), saldoHoje=ateHoje.length?ateHoje[ateHoje.length-1].saldo:inicial;
    const diasNeg = serie.filter(d=>d.saldo<0&&d.data<=hj);
    const negFut = serie.filter(d=>d.saldo<0&&d.data>hj);
    const fundo = diasNeg.length?Math.min(...diasNeg.map(d=>d.saldo)):0;

    const porCat={}, nPorCat={};
    baseGasto.forEach(l=>{ porCat[l.categoria]=(porCat[l.categoria]||0)+l.valor; nPorCat[l.categoria]=(nPorCat[l.categoria]||0)+1; });
    const info=(c,v,ent)=>natureza?infoCat(nPorCat[c]||0, v, c==="Sem categoria"?0:previstoCat(c,ui.mes,meses), ent)
                                  :'<span>'+(nPorCat[c]||0)+' lançamento'+(nPorCat[c]===1?"":"s")+'</span>';
    const saidas=Object.entries(porCat).filter(e=>e[1]<0).sort((a,b)=>a[1]-b[1]);
    const entradas=Object.entries(porCat).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
    const maiorSaida=saidas.length?Math.abs(saidas[0][1]):1;
    const maiorEnt=entradas.length?entradas[0][1]:1;
    const LIM=6;
    const vSai=ui.verTodasSai?saidas:saidas.slice(0,LIM);
    const vEnt=ui.verTodasEnt?entradas:entradas.slice(0,LIM);

    const fatura=Math.abs(soma(lista.filter(l=>l.categoria===CAT_FATURA&&l.valor<0)));
    const aplic=soma(lista.filter(l=>l.categoria==="Aplicação e resgate"&&l.valor<0));
    const nCartao=lista.filter(l=>l.origem==="cartao").length;
    const semCat=base.filter(l=>l.categoria==="Sem categoria").length;

    // nota explicativa (uma linha)
    let nota;
    if(natureza){
      const partes=["Compras do cartão contam na data da compra."];
      if(fatura) partes.push("Pagamento de fatura (R$ "+brl(fatura)+") não é gasto: as compras já estão contadas.");

      if(aplic||resg) partes.push("Aplicações (R$ "+brl(Math.abs(aplic))+") e resgates (R$ "+brl(resg)+") ficam fora: só trocam o dinheiro de bolso.");
      const entre=Math.abs(soma(lista.filter(l=>l.categoria===CAT_ENTRE&&l.valor<0)));
      const entreIn=soma(lista.filter(l=>l.categoria===CAT_ENTRE&&l.valor>0));
      if(entre||entreIn) partes.push("Transferências entre suas contas ficam fora (enviou R$ "+brl(entre)+", recebeu R$ "+brl(entreIn)+").");
      nota=partes.join(" ");

    } else nota = ui.conta==="cartao"

    const avisos=[];
    if(natureza&&ui.mes!=="tudo"&&fatura&&!nCartao)
      avisos.push('<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro)"><div>'+

      avisos.push('<div class="alerta"><div><b>'+diasNeg.length+' dia'+(diasNeg.length===1?"":"s")+

              {alvo:comConf?"#conf":"#saldoDia",dica:comConf?"Conferir com o saldo do banco":"Ver o saldo dia a dia"})
          : cartao("Saldo final",fim,fim<0?"neg":"",ui.mes==="tudo"?"acumulado":"em "+rotuloMes(ui.mes),fim<0?"#C0392B":"#2E86DE",

          verMais("sai",saidas.length,ui.verTodasSai)+

          verMais("ent",entradas.length,ui.verTodasEnt)+

  /* ================= comparação entre meses ================= */
  function comparar(meses){
    const cols = meses;
    const nomes = cols.map(abrevMes);
    const ultimo = cols[cols.length-1], penultimo = cols[cols.length-2];

    // matriz categoria × mês
    const mat={}, totMes={}, entMes={};
    cols.forEach(m=>{totMes[m]=0;entMes[m]=0;});
    const doComparar=lancDaConta().filter(ehMov);
    doComparar.forEach(l=>{
      if(l.ignorado) return;
      const m=l.data.slice(0,7); if(cols.indexOf(m)<0) return;
      if(l.valor<0){
        mat[l.categoria]=mat[l.categoria]||{};
        mat[l.categoria][m]=(mat[l.categoria][m]||0)+Math.abs(l.valor);
        totMes[m]+=Math.abs(l.valor);
      }else entMes[m]+=l.valor;
    });
    const linhas=Object.keys(mat).map(c=>{
      const v=cols.map(m=>mat[c][m]||0);
      const meds=v.filter(x=>x>0);
      return {cat:c,v:v,total:v.reduce((a,b)=>a+b,0),
              media:meds.length?meds.reduce((a,b)=>a+b,0)/meds.length:0};
    }).sort((a,b)=>b.total-a.total);

    const varia=(a,b)=>{ // b = anterior
      if(!b) return a?'<span class="var novo">novo</span>':'<span class="var zero">—</span>';
      if(!a) return '<span class="var zero">não veio</span>';
      const p=(a-b)/b*100;
      if(Math.abs(p)<3) return '<span class="var zero">estável</span>';
      return '<span class="var '+(p>0?"sobe":"cai")+'">'+(p>0?"+":"−")+Math.abs(p).toFixed(0)+"%</span>";
    };

    // gastos que se repetem
    const porLoja={};
    doComparar.forEach(l=>{
      if(l.valor>=0||l.ignorado) return;
      const m=l.data.slice(0,7); if(cols.indexOf(m)<0) return;
      const k=mercado(l.hist);
      porLoja[k]=porLoja[k]||{meses:{},cat:l.categoria,vinc:l.vinculo};
      porLoja[k].meses[m]=(porLoja[k].meses[m]||0)+Math.abs(l.valor);
    });
    const fixos=Object.entries(porLoja)
      .map(([k,o])=>{
        const ms=Object.keys(o.meses);
        const vals=ms.map(m=>o.meses[m]);
        return {loja:k,cat:o.cat,vinc:o.vinc,n:ms.length,
                media:vals.reduce((a,b)=>a+b,0)/vals.length,
                temUltimo:!!o.meses[ultimo],meses:o.meses};
      })
      .filter(f=>f.n>=Math.max(2,Math.ceil(cols.length*0.6)))
      .sort((a,b)=>b.media*b.n-a.media*a.n).slice(0,14);
    const sumidos=fixos.filter(f=>!f.temUltimo);

    const maxTot=Math.max(...cols.map(m=>Math.max(totMes[m],entMes[m])),1);

    $("#corpo").innerHTML =
      '<div class="tit-secao" style="margin-top:30px"><h3>Entradas e gastos mês a mês</h3></div>'+
      '<p class="nota-linha" style="margin:-6px 0 14px">Pagamento de fatura e aplicações ficam fora; as compras do cartão contam no mês da compra.</p>'+
      '<div class="colunas">'+cols.map((m,i)=>
        '<div class="coluna">'+
          '<div class="par">'+
            '<span class="pilha" style="height:'+(entMes[m]/maxTot*100).toFixed(1)+'%">'+
              '<i style="height:100%;background:#1E8A5F" title="Entradas"></i></span>'+
            '<span class="pilha" style="height:'+(totMes[m]/maxTot*100).toFixed(1)+'%">'+
              linhas.filter(l=>l.v[i]>0).map(l=>
                '<i style="height:'+(l.v[i]/(totMes[m]||1)*100).toFixed(2)+'%;background:'+cor(l.cat)+'"'+
                ' title="'+esc(l.cat)+': '+brl(l.v[i])+'"></i>').join("")+
            '</span>'+
          '</div>'+
          '<div class="col-res '+((entMes[m]-totMes[m])<0?"neg":"pos")+'">'+brl(entMes[m]-totMes[m])+'</div>'+
          '<div class="col-mes">'+nomes[i]+'</div>'+
        '</div>').join("")+'</div>'+
      '<div class="legenda">'+linhas.slice(0,9).map(l=>
        '<span>'+ponto(l.cat)+esc(l.cat)+'</span>').join("")+
        (linhas.length>9?'<span class="fraco">e mais '+(linhas.length-9)+'</span>':"")+'</div>'+

      '<div class="tit-secao" style="margin-top:38px"><h3>Gastos por categoria</h3></div>'+
      '<div class="rolagem"><table class="matriz"><thead><tr><th>Categoria</th>'+
        nomes.map(n=>'<th class="n">'+n+'</th>').join("")+
        '<th class="n">Média</th><th class="n">Variação</th></tr></thead><tbody>'+
      linhas.map(l=>'<tr><td>'+ponto(l.cat)+esc(l.cat)+'</td>'+
        l.v.map((x,i)=>'<td class="n'+(i===l.v.length-1&&x?" forte":"")+'">'+(x?brl(x):'<span class="zero">·</span>')+'</td>').join("")+
        '<td class="n media">'+(l.media?brl(l.media):"—")+'</td>'+
        '<td class="n">'+varia(l.v[l.v.length-1],l.v[l.v.length-2])+'</td></tr>').join("")+
      '<tr class="somatoria"><td>Total de gastos</td>'+
        cols.map(m=>'<td class="n">'+brl(totMes[m])+'</td>').join("")+
        '<td class="n media">'+brl(cols.reduce((a,m)=>a+totMes[m],0)/cols.length)+'</td>'+
        '<td class="n">'+varia(totMes[ultimo],totMes[penultimo])+'</td></tr>'+
      '</tbody></table></div>'+

      '<div class="tit-secao" style="margin-top:40px"><h3>Compromissos que se repetem</h3></div>'+
      '<p class="sub" style="margin:-8px 0 16px">Estabelecimentos presentes na maioria dos meses. São eles que formam o seu custo fixo.</p>'+
      (fixos.length?
        '<div class="rolagem"><table class="matriz"><thead><tr><th>Estabelecimento</th><th>Categoria</th>'+
        '<th class="n">Valor típico</th><th class="n">Meses</th><th class="n">'+abrevMes(ultimo)+'</th></tr></thead><tbody>'+
        fixos.map(f=>'<tr><td>'+esc(f.loja)+'</td>'+
          '<td class="fraco">'+ponto(f.cat)+esc(f.cat)+'</td>'+
          '<td class="n">'+brl(f.media)+'</td>'+
          '<td class="n fraco">'+f.n+' de '+cols.length+'</td>'+
          '<td class="n">'+(f.temUltimo?brl(f.meses[ultimo]):'<span class="var zero">não veio</span>')+'</td></tr>').join("")+
        '</tbody></table></div>'
        :'<p class="sub">Ainda não há meses suficientes para identificar recorrência. A partir do segundo extrato isto se preenche.</p>')+

      (sumidos.length?'<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro);margin-top:22px"><div><b>'+
        sumidos.length+' compromisso'+(sumidos.length===1?"":"s")+' não apareceu em '+rotuloMes(ultimo)+'.</b> '+
        esc(sumidos.slice(0,4).map(f=>f.loja).join(", "))+(sumidos.length>4?" e outros":"")+
        '. Confira se está apenas atrasado ou se saiu por outra conta.</div></div>':"")+

      '<div class="rodape"><span>'+cols.length+' meses comparados · '+
        (function(n){return n+" regra"+(n===1?" aprendida":"s aprendidas")+" com as suas correções";})
        (dados.regras.filter(r=>r.aprendida).length)+'</span>'+
        '<span>Família Bicalho</span></div>';
  }

  /* ================= aba de regras ================= */
  function renderRegras(){
    const semCatCount=lancDaConta().filter(l=>!l.ignorado&&l.categoria==="Sem categoria").length;
    $("#corpo").innerHTML=
      '<div style="display:flex;align-items:center;gap:16px;margin:26px 0 18px;flex-wrap:wrap">'+
      '<div class="tit-secao" style="margin:0"><h3>Regras de classificação automática</h3></div>'+
      '<span class="sub">Quando a descrição contém o termo, o lançamento entra nessa categoria ao ser importado.</span></div>'+

      (semCatCount?'<div class="alerta" style="background:#F7F5EE;border-left-color:var(--ouro);margin-bottom:18px"><div>'+
        '<b>'+semCatCount+' lançamento'+(semCatCount>1?"s":"")+' sem categoria</b> nesta conta. '+
        'Crie uma regra abaixo para classificá-los automaticamente.</div></div>':"")+

      '<div style="padding:18px;background:var(--marfim);border-radius:3px;border:1px solid var(--linha-clara);margin-bottom:24px">'+
        '<div class="tit-secao" style="margin:0 0 14px"><h3>Nova regra</h3></div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
        '<input id="rTermo" placeholder="Termo na descrição, ex: VERDEMAR" maxlength="40" style="font-family:var(--sans);font-size:13px;border:1px solid var(--linha);padding:7px 10px;border-radius:2px;min-width:200px">'+
        '<select id="rCat" style="font-family:var(--sans);font-size:13px;border:1px solid var(--linha);padding:7px 10px;border-radius:2px">'+
          opcoesCat("Supermercado")+'</select>'+
        '<button class="bt" id="btRegra">Criar e aplicar</button>'+
        '<button class="bt vazado" id="btReclassificar">Reaplicar ao histórico</button>'+
        '</div></div>'+

      '<div id="listaRegras"></div>'+

      '<div class="rodape" style="margin-top:32px">'+
        '<span>'+dados.regras.length+' regras · '+dados.regras.filter(r=>r.aprendida).length+' aprendidas automaticamente</span>'+
        '<span>Família Bicalho</span></div>';

    regras();
    // listeners
    document.getElementById("btRegra").onclick=()=>{
      const t=document.getElementById("rTermo").value.trim();
      if(!t){ avisar("Escreva o termo que aparece na descrição.",true); return; }
      const cat=document.getElementById("rCat").value, vinc="PF";
      dados.regras.unshift({termo:t,categoria:cat,vinculo:vinc});
      let n=0;
      dados.lancamentos.forEach(l=>{
        if(l.hist.toUpperCase().includes(t.toUpperCase())){l.categoria=cat;l.vinculo=vinc;n++;}
      });
      document.getElementById("rTermo").value=""; salvar(); renderRegras();
      avisar("Regra criada"+(n?" · "+n+" lançamento"+(n>1?"s":"")+" reclassificado"+(n>1?"s":""):"")+".");
    };
    document.getElementById("btReclassificar").onclick=()=>{
      confirmar("Reaplicar regras ao histórico?",
        "Todos os lançamentos serão reclassificados pelas regras atuais.",
        "Reaplicar"
      ).then(ok=>{
        if(!ok) return;
        dados.lancamentos.forEach(l=>{const c=classificar(l.hist,l.valor);l.categoria=c.categoria;l.vinculo=c.vinculo;});
        salvar(); renderRegras(); avisar("Histórico reclassificado.");
      });
    };
    document.getElementById("listaRegras").addEventListener("click",e=>{
      const bt=e.target.closest("[data-apagar-regra]"); if(!bt) return;
      dados.regras.splice(+bt.dataset.apagarRegra,1); salvar(); renderRegras();
    });
  }

  function cartao(rot,val,cls,sub,c,irO){
    return '<div class="tot'+(irO?' clic-card':'')+'" style="--c:'+c+'"'+(irO?ir(irO):'')+'><span class="rot">'+rot+'</span>'+
      '<div class="num" style="color:'+c+'"><small>R$</small>'+brl(val)+'</div>'+
      '<p class="sub">'+sub+'</p></div>';
  }
  function catLinha(c,v,frac,entrada,info){
    return '<div class="cat-linha" role="button" tabindex="0" title="Ver lançamentos de '+esc(c)+'" data-filtrar="'+esc(c)+'">'+
      '<span class="cat-nome">'+ponto(c)+esc(c)+'</span>'+
      '<span class="cat-val'+(entrada?" pos":"")+'">'+brl(Math.abs(v))+'</span>'+
      (info?'<span class="cat-info">'+info+'</span>':'')+
      '<span class="cat-barra"><i style="width:'+(Math.max(frac,.02)*100).toFixed(1)+'%;background:'+cor(c)+'"></i></span></div>';
  }
  function selectFiltro(id,valor,vazio,ops){
    const itens=ops.map(o=>{
      const [v,t]=Array.isArray(o)?o:[o,o];
      return '<option value="'+esc(v)+'"'+(valor===v?" selected":"")+'>'+esc(t)+'</option>';
    }).join("");
    return '<select id="'+id+'"><option value="">'+vazio+'</option>'+itens+'</select>';
  }

    document.querySelectorAll("#tabelaLanc th[data-sort]").forEach(th=>{
      const lab={data:"Data",hist:"Descrição",categoria:"Categoria",vinculo:"Vínculo",valor:"Valor"}[th.dataset.sort];
      th.firstChild.textContent=lab+(ui.sortCol===th.dataset.sort?(ui.sortDir>0?" ↑":" ↓"):"");

    if(ui.origem) chips.push(["origem",NOMES_ORIGEM[ui.origem]||ui.origem]);

      chips.map(([k,t])=>'<span class="chip">'+esc(t)+'<button data-chip="'+k+'" aria-label="Remover filtro">×</button></span>').join("")+
      (chips.length>1?'<button class="chip-limpar" data-chip="*">Limpar filtros</button>':"") : "";
    if(!lista.length){
      tb.innerHTML='<tr><td colspan="6" class="vazio" style="padding:38px"><p>Nenhum lançamento com esses filtros.</p></td></tr>';

    tb.innerHTML = lista.map(l=>
      '<tr data-id="'+esc(l.id)+'" style="--c:'+cor(l.categoria)+'"'+(l.ignorado?' class="riscado"':(!ehMov(l)&&visaoNatureza()?' class="fora" title="Não conta como gasto"':
          !realizado(l)?' class="futuro" title="Agendado: ainda não aconteceu, fora dos totais"':""))+'>'+
        '<td class="data">'+l.data.slice(8)+"/"+l.data.slice(5,7)+(!l.ignorado&&!realizado(l)?'<span class="selo-agend">agendado</span>':'')+'</td>'+
        '<td><input class="campo desc-campo" data-c="hist" value="'+esc(l.hist)+'" title="'+esc(l.hist)+'"></td>'+
        '<td><select class="campo etiqueta" data-c="categoria" style="color:'+cor(l.categoria)+
            ';background:'+rgba(cor(l.categoria),.13)+';box-shadow:inset 0 0 0 1px '+rgba(cor(l.categoria),.3)+'">'+
          opcoesCat(l.categoria)+
        '</select></td>'+
        '<td class="valor '+(l.valor<0?"neg":"pos")+'"><input class="campo" data-c="valor" value="'+brl(l.valor)+'"></td>'+
        '<td class="obs"><input class="campo" data-c="obs" placeholder="—" value="'+esc(l.obs||"")+'"></td>'+
        '<td class="acao">'+(l.origem==="cartao"?'<span class="tag-cartao" title="'+esc(l.doc||"Cartão")+'">💳</span>'
          :'<span class="tag-conta '+esc(l.origem||"manual")+'" title="'+esc(nomeOrigem(l)+(l.doc?" · "+l.doc:""))+'">'+esc(TAG_ORIGEM[l.origem]||"OUTRO")+'</span>')+
          (l.ignorado
          ? '<button class="voltar" data-c="riscar" title="Trazer de volta aos cálculos">↺</button>'+
            '<button class="sumir" data-c="apagar" title="Apagar de vez">apagar</button>'
          : '<button class="riscar" data-c="riscar" title="Riscar: fica no histórico, fora dos cálculos">×</button>')+
        '</td>'+
      '</tr>').join("");

  function regras(){
    $("#listaRegras").innerHTML = dados.regras.map((r,i)=>
      '<div class="regra" data-ri="'+i+'">'+
      '<input class="campo regra-termo" data-ri="'+i+'" value="'+esc(r.termo)+'" title="Clique para editar o termo">'+
      '<span class="seta">→</span>'+
      '<select class="campo etiqueta regra-cat" data-ri="'+i+'" style="color:'+cor(r.categoria)+';background:'+rgba(cor(r.categoria),.13)+';box-shadow:inset 0 0 0 1px '+rgba(cor(r.categoria),.3)+'">'+
        opcoesCat(r.categoria)+
      '</select>'+
      (r.aprendida?'<span class="sub" style="font-size:11px;margin:0 4px">auto</span>':'')+
      '<button class="apagar" data-apagar-regra="'+i+'" style="margin-left:auto" aria-label="Apagar regra">×</button>'+
      '</div>'
    ).join("");

    // edição inline: termo
    $("#listaRegras").querySelectorAll(".regra-termo").forEach(inp=>{
      inp.onchange=()=>{
        const i=+inp.dataset.ri;
        dados.regras[i].termo=inp.value.trim();
        salvar(); avisar("Regra atualizada.");
      };
    });
    // edição inline: categoria
    $("#listaRegras").querySelectorAll(".regra-cat").forEach(sel=>{
      sel.onchange=()=>{
        const i=+sel.dataset.ri;
        dados.regras[i].categoria=sel.value;
        // atualizar cor
        sel.style.color=cor(sel.value);
        sel.style.background=rgba(cor(sel.value),.13);
        sel.style.boxShadow="inset 0 0 0 1px "+rgba(cor(sel.value),.3);
        salvar(); avisar("Regra atualizada.");
      };
    });
  }

  /* ================= interações ================= */
  function acharLanc(id){ return dados.lancamentos.find(l=>l.id===id); }

  function ligar(){
    $("#fBusca").oninput=e=>{ui.busca=e.target.value;tabela();};

    document.getElementById("corpo").onclick=e=>{
      const vm=e.target.closest("[data-vermais]");
      if(vm){ const k=vm.dataset.vermais==="sai"?"verTodasSai":"verTodasEnt"; ui[k]=!ui[k]; render(); return; }
      const chip=e.target.closest("[data-chip]");
      if(chip){ const k=chip.dataset.chip;
        if(k==="*"){ ui.busca="";ui.cat="";ui.tipo="";ui.vinculo="";ui.origem="";ui.fat="";ui.errada="";ui.soMov=""; } else ui[k]="";
        render(); try{document.getElementById("tabelaLanc").scrollIntoView({block:"start"});}catch(_){ } return; }
      const th=e.target.closest("th[data-sort]"); if(!th||e.target.closest(".col-drag")) return;
      const col=th.dataset.sort;
      if(ui.sortCol===col) ui.sortDir*=-1; else{ui.sortCol=col;ui.sortDir=1;}
      tabela();
    };
    $("#fCat").onchange=e=>{ui.cat=e.target.value;tabela();};
    $("#fTipo").onchange=e=>{ui.tipo=e.target.value;tabela();};
    const fo=$("#fOrig"); if(fo) fo.onchange=e=>{ui.origem=e.target.value;tabela();};


    $("#corpoTabela").addEventListener("change",e=>{
      const tr=e.target.closest("tr"); if(!tr) return;
      const l=acharLanc(tr.dataset.id); if(!l) return;
      const c=e.target.dataset.c;
      if(c==="categoria"){
        l.categoria=e.target.value; l.catManual=true;
        // oferecer criar regra para o estabelecimento
        const termo=mercado(l.hist);
        const regraExiste=dados.regras.some(r=>r.termo.toUpperCase()===termo.toUpperCase());
        if(!regraExiste && termo.length>=4){
          // contar quantos outros lançamentos têm o mesmo estabelecimento
          const similares=dados.lancamentos.filter(x=>x.id!==l.id&&x.hist.toUpperCase().includes(termo.toUpperCase()));
          if(similares.length>0){
            // mostrar opções: só este, ou criar regra para todos
            modal(
              '<h3 class="modal-tit">Aplicar a todos?</h3>'+
              '<p class="modal-corpo"><b>'+esc(termo)+'</b> aparece em mais '+similares.length+
              ' lançamento'+(similares.length>1?"s":"")+'. Quer criar uma regra para que todos '+
              '(inclusive os futuros) entrem como <b>'+esc(l.categoria)+'</b>?</p>'+
              '<div class="modal-acoes">'+
              '<button class="bt vazado" data-modal="so-este">Só este</button>'+
              '<button class="bt" data-modal="criar-regra">Criar regra para todos</button>'+
              '</div>'
            ).then(v=>{
              if(v==="criar-regra"){
                const t=aprender(l);
                // reclassificar os similares
                let n=0;
                dados.lancamentos.forEach(x=>{
                  if(x.id!==l.id&&x.hist.toUpperCase().includes(termo.toUpperCase())){
                    x.categoria=l.categoria; x.vinculo=l.vinculo; n++;
                  }
                });
                salvar(); render();
                avisar("Regra criada · "+n+" lançamento"+(n>1?"s":"")+" reclassificado"+(n>1?"s":"")+".");
              } else {
                salvar(); render();
              }
            });
          } else {
            const t=aprender(l); salvar(); render();
            if(t) avisar("Anotado: "+t+" entra como "+l.categoria+" nos próximos extratos.");
          }
        } else {
          aprender(l); salvar(); render();
        }
      }
      else if(c==="hist"){ l.hist=e.target.value; salvar(); }
      else if(c==="obs"){ l.obs=e.target.value; salvar(); }
      else if(c==="valor"){
        const novo=numero(e.target.value.replace("−","-"));
        if(novo!==l.valor){ l.valor=novo; salvar(); render(); }
      }
    });
    $("#corpoTabela").addEventListener("click",e=>{
      const bt=e.target.closest("button"); if(!bt) return;
      const tr=e.target.closest("tr"); const l=acharLanc(tr.dataset.id); if(!l) return;
      if(bt.dataset.c==="riscar"){
        l.ignorado = !l.ignorado; salvar(); render();
        avisar(l.ignorado?"Lançamento riscado. Está fora dos cálculos, mas continua no histórico."
                         :"Lançamento de volta aos cálculos.");
      }
      if(bt.dataset.c==="apagar"){
        confirmar("Apagar de vez?",
          esc(l.hist)+"<br>R$ "+brl(l.valor)+
          "<br><br>Para recuperar depois, será preciso importar o extrato do mês novamente.",
          "Apagar"
        ).then(ok=>{
          if(!ok) return;
          dados.lancamentos=dados.lancamentos.filter(x=>x.id!==l.id); salvar(); render();
        });
      }
    });
  }

  // redimensionamento de colunas — fora de ligar() para não duplicar
  document.getElementById("lc").addEventListener("mousedown",e=>{
    const drag=e.target.closest(".col-drag"); if(!drag) return;
    e.preventDefault(); e.stopPropagation();
    const col=drag.dataset.col;
    const th=drag.closest("th");
    const startX=e.clientX, startW=th.offsetWidth;
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;cursor:col-resize;z-index:9999";
    document.body.appendChild(overlay);
    const onMove=ev=>{ th.style.width=Math.max(60,startW+(ev.clientX-startX))+"px"; };
    const onUp=ev=>{
      if(!ui._colW) ui._colW={};
      ui._colW[col]=Math.max(60,startW+(ev.clientX-startX));
      overlay.remove();
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
    };
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });

  // listener de clique nas barras de categoria — fica no elemento raiz (não é recriado pelo render)
  $("#lc").addEventListener("click",e=>{
    const linha=e.target.closest("[data-filtrar]"); if(!linha) return;
    const cat=linha.dataset.filtrar;
    ui.cat = ui.cat===cat ? "" : cat;
    ui.busca=""; ui.tipo=""; ui.vinculo=""; ui.fat=""; ui.errada="";
    render();
    try{const tb=document.getElementById("corpoTabela");
      if(tb) tb.closest("table").scrollIntoView({behavior:"smooth",block:"start"});}catch(e){}
  });
  $("#lc").addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){
      const linha=e.target.closest("[data-filtrar]"); if(!linha) return;
      linha.click(); e.preventDefault();
    }
  });
  // seletor de conta
  document.getElementById("contaTabs").addEventListener("click",e=>{
    const bt=e.target.closest(".conta-tab"); if(!bt) return;
    if(ui.conta==="dash"||bt.dataset.conta==="dash") ui.mes=null; // dashboard abre em "todos os meses"; contas abrem no mês atual
    ui.conta=bt.dataset.conta; ui.view="mes";
    ui.busca=""; ui.cat=""; ui.tipo=""; ui.vinculo=""; ui.origem=""; ui.fat=""; ui.errada=""; ui.soMov="";
    render();
  });

  // barra de período e vistas
  $("#abas").addEventListener("click",e=>{
    const pm=e.target.closest("[data-pmes]");
    if(pm){ ui.prevMes=pm.dataset.pmes; render(); return; }
    if(e.target.closest("[data-mtnova]")){ novaMeta(); return; }
    if(e.target.closest("[data-pnovo]")){ novoMesPrev(); return; }
    if(e.target.closest("[data-ppassar]")){ passarPrevProxMes(ui.prevMes); return; }
    if(e.target.closest("[data-dvnova]")){ novaParcelada(); return; }
    if(e.target.closest("[data-papagar]")){
      const ym=ui.prevMes;
      confirmar("Apagar "+rotuloMes(ym)+"?","A previsão de "+rotuloMes(ym)+" sai do app. Os lançamentos do mês continuam.","Apagar").then(ok=>{
        if(!ok) return; delete dados.previsoes[ym]; ui.prevMes=null; salvar(); render(); avisar(cap(rotuloMes(ym))+" apagado.");
      });
      return;
    }
    const v=e.target.closest("[data-view]");
    if(v){ ui.view=v.dataset.view; render(); return; }
    const p=e.target.closest("[data-passo]");
    if(p&&!p.disabled){
      const ms=ui._meses||[], i=ms.indexOf(ui.mes), n=i+(+p.dataset.passo);
      if(n>=0&&n<ms.length){ ui.mes=ms[n]; render(); }
    }
  });
  $("#abas").addEventListener("change",e=>{
    if(e.target.id==="selMes"){ ui.mes=e.target.value; render(); }
  });

  // menus do cabeçalho
  function fecharMenus(){ document.querySelectorAll(".menu").forEach(m=>m.hidden=true);
    document.querySelectorAll("[aria-haspopup]").forEach(b=>b.setAttribute("aria-expanded","false")); }
  [["btImportarMenu","menuImportar"],["btMais","menuMais"]].forEach(([b,m])=>{
    document.getElementById(b).onclick=e=>{
      e.stopPropagation();
      const menu=document.getElementById(m), abrir=menu.hidden;
      fecharMenus(); menu.hidden=!abrir; e.currentTarget.setAttribute("aria-expanded",String(abrir));
    };
  });
  document.addEventListener("click",e=>{ if(!e.target.closest(".menu")) fecharMenus(); else if(e.target.closest(".menu button")) fecharMenus(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecharMenus(); });

  document.addEventListener("click",e=>{
    if(!e.target.closest("[data-apagar-riscados]")) return;
    const ls=doMes().filter(l=>l.ignorado); if(!ls.length) return;
    confirmar("Apagar "+ls.length+" lançamento"+(ls.length===1?"":"s")+" riscado"+(ls.length===1?"":"s")+"?",
      "Só os riscados "+(ui.conta==="itau"||ui.conta==="bb"||ui.conta==="cartao"?"do "+NOMES_ORIGEM[ui.conta]+" ":"")+
      (ui.mes==="tudo"?"de todos os meses":"de "+esc(rotuloMes(ui.mes)))+
      ".<br><br>Saem do histórico. Para recuperar, será preciso importar o extrato de novo.","Apagar")
      .then(ok=>{ if(!ok) return; const ids=new Set(ls.map(l=>l.id));
        dados.lancamentos=dados.lancamentos.filter(l=>!ids.has(l.id)); salvar(); render(); avisar(ls.length+" lançamentos apagados."); });
  });
  $("#arqPdf").onchange=e=>{ if(e.target.files[0]) importarFaturaPDF(e.target.files[0]); e.target.value=""; };
  const abrirImport = o => { ui._origemImport=o; $("#arqCsv").click(); };
  $("#btImpItau").onclick=()=>abrirImport("itau");
  $("#btImpBB").onclick=()=>abrirImport("bb");
  $("#btImpCartao").onclick=()=>abrirImport("cartao");
  $("#btImpFin").onclick=()=>abrirImport("cartao");
  $("#btImpB3").onclick=()=>abrirImport("b3");
  $("#btImpPlanilha").onclick=()=>abrirImport("planilha");
  $("#arqCsv").onchange=e=>{ if(e.target.files[0]) lerArquivo(e.target.files[0]); e.target.value=""; };
  $("#btBackup").onclick=exportarBackup;
  /* Backups diários na nuvem: tabela livro_caixa_backup, preenchida todo dia pelo Supabase (supabase/backup-diario.sql).
     Guarda os últimos 30 dias e o dia 1º de cada mês. Aqui dá para baixar ou voltar o app para um dia. */
  async function backupsNuvem(){
    if(!sbUser){ avisar("Entre com a sua conta para ver os backups da nuvem.",true); return; }
    const {data,error}=await sb.from("livro_caixa_backup").select("dia,atualizado_em").eq("user_id",sbUser.id).eq("chave",CHAVE).order("dia",{ascending:false}).limit(60);
    if(error){ avisar(/does not exist|relation|schema cache/i.test(error.message)?"A tabela de backups ainda não existe no Supabase (rode supabase/backup-diario.sql).":"Não consegui ler os backups: "+error.message,true); return; }
    if(!data||!data.length){ avisar("Ainda não há backup na nuvem. O primeiro sai na próxima madrugada."); return; }
    const dm=iso=>iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4);
    const esc2=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const dia=await modal('<h3 class="modal-tit">Backups diários na nuvem</h3>'+
      '<p class="modal-corpo">O Supabase copia seus dados todo dia às 3h. Ficam os últimos 30 dias e o dia 1º de cada mês. Escolha um dia:</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto;margin:8px 0">'+
      data.map(x=>'<button type="button" class="bt vazado" data-modal="'+esc2(x.dia)+'" title="'+(x.atualizado_em?"dados de "+new Date(x.atualizado_em).toLocaleString("pt-BR"):"")+'">'+dm(x.dia)+'</button>').join("")+
      '</div><div class="modal-acoes"><button type="button" class="bt vazado" data-modal="cancelar">Fechar</button></div>');
    if(!dia||!/^\d{4}-\d{2}-\d{2}$/.test(dia)) return;
    const acao=await modal('<h3 class="modal-tit">Backup de '+dm(dia)+'</h3>'+
      '<p class="modal-corpo"><b>Baixar</b> salva o arquivo .json (dá para usar em “Restaurar backup”).<br>'+
      '<b>Voltar para este dia</b> substitui tudo o que está no app pelos dados de '+dm(dia)+'. Antes, o app baixa um arquivo com os dados de agora.</p>'+
      '<div class="modal-acoes"><button type="button" class="bt vazado" data-modal="cancelar">Cancelar</button>'+
      '<button type="button" class="bt vazado" data-modal="baixar">Baixar</button>'+
      '<button type="button" class="bt" data-modal="voltar" style="background:var(--tijolo);border-color:var(--tijolo)">Voltar para este dia</button></div>');
    if(acao!=="baixar"&&acao!=="voltar") return;
    const r=await sb.from("livro_caixa_backup").select("valor").eq("user_id",sbUser.id).eq("chave",CHAVE).eq("dia",dia).maybeSingle();
    if(r.error||!r.data){ avisar("Não consegui baixar o backup de "+dm(dia)+".",true); return; }
    const d=typeof r.data.valor==="string"?JSON.parse(r.data.valor):r.data.valor;
    if(acao==="baixar"){ baixar("financeiro-nuvem-"+dia+".json",JSON.stringify(d,null,1),"application/json"); avisar("Backup de "+dm(dia)+" baixado."); return; }
    if(!d||!Array.isArray(d.lancamentos)){ avisar("Esse backup está vazio ou inválido.",true); return; }
    exportarBackup();
    aplicarDados(d); migrar(); delete dados._migrou;
    try{ await salvarImediato(); }catch(e){ avisar("Voltei o app, mas não consegui gravar na nuvem.",true); }
    render();
    avisar("App voltou para "+dm(dia)+" ("+dados.lancamentos.length+" lançamentos). Os dados de antes foram baixados num arquivo.");
  }
  $("#btBackupNuvem").onclick=backupsNuvem;
  $("#btExportar").onclick=exportarPlanilha;
  $("#btExportarCsv").onclick=exportarCSV;
  $("#btCopiarPl").onclick=copiarParaPlanilha;
  $("#btLimpar").onclick=()=>{
    modal(
      '<h3 class="modal-tit">Limpar todo o histórico?</h3>'+
      '<p class="modal-corpo">Os '+dados.lancamentos.length+' lançamentos, as regras aprendidas e os saldos serão apagados '+
      '<b>da nuvem também</b>. Faça um backup antes (menu ⋯ › Salvar backup).</p>'+
      '<form onsubmit="return false"><label>Para confirmar, digite APAGAR'+
      '<input name="conf" autocomplete="off" required pattern="APAGAR"></label>'+
      '<div class="modal-acoes"><button type="button" class="bt vazado" data-modal="cancelar">Cancelar</button>'+
      '<button type="button" class="bt" data-modal="ok" style="background:var(--tijolo);border-color:var(--tijolo)">Apagar tudo</button></div></form>'
    ).then(f=>{
      if(!f||f.conf!=="APAGAR") return;
      dados.lancamentos=[];
      dados.saldos={};
      dados.regras=REGRAS_PADRAO.slice();
      dados.prolabore=0; dados.orcamento=null; dados.versao=3;
      dados.orcamentoMes={}; dados.contas={}; dados.dividas=null; dados.previsoes={}; dados.fluxo=null; dados.metas=[]; dados.conferencia={}; dados.saldosDia={}; dados.invest=null;
      dados.faturaAberta=null; dados.faturaFechada=null;
      ui={mes:null,view:"mes",busca:"",cat:"",tipo:"",vinculo:"",sortCol:"data",sortDir:1,conta:ui.conta||"dash"};
      salvar(); render();
      avisar("Histórico apagado. Importe os extratos novamente.");
    });
  };
  $("#btRestaurar").onclick=()=>$("#arqJson").click();
  $("#arqJson").onchange=e=>{ if(e.target.files[0]) restaurarBackup(e.target.files[0]); e.target.value=""; };
  $("#btLancar").onclick=()=>adicionarManual(NOMES_ORIGEM[ui.conta]?ui.conta:"manual");

  // listener de sessão — dispara quando Google redireciona de volta
  sb.auth.onAuthStateChange(async(event, session)=>{
    const eraLogado = !!sbUser;
    sbUser = session?.user || null;
    atualizarBarraUsuario();

    if(event==="SIGNED_IN" && !eraLogado){
      // verificar se há dados no Supabase
      const remoto = await sbCarregar().catch(()=>null);
      if(!remoto && dados.lancamentos.length>0){
        // migrar dados locais para o Supabase
        await salvarImediato();
        avisar("Dados migrados para a nuvem. Agora sincronizados em qualquer dispositivo.");
      } else if(remoto){
        // carregar dados do Supabase (podem ser mais recentes)
        dados.lancamentos = remoto.lancamentos||[];
        dados.saldos      = remoto.saldos||{};
        dados.regras      = (remoto.regras&&remoto.regras.length)?remoto.regras:REGRAS_PADRAO.slice();
        dados.prolabore   = remoto.prolabore||0;
        dados.faturaAberta = remoto.faturaAberta||null;
        dados.faturaFechada= remoto.faturaFechada||null;
        dados.orcamento   = remoto.orcamento||null;
        dados.orcamentoMes= remoto.orcamentoMes||{};
        dados.contas      = remoto.contas||{};
        dados.previsoes   = remoto.previsoes||{};
        dados.fluxo       = remoto.fluxo||null;
        dados.dividas     = remoto.dividas||null;
        dados.metas       = remoto.metas||[];
        dados.conferencia = remoto.conferencia||{};
        dados.saldosDia   = remoto.saldosDia||{};
        dados.invest      = remoto.invest||null;
        dados.versao      = remoto.versao||0;
        migrar();
        if(dados._migrou){ delete dados._migrou; salvar(); }
        render();
        avisar("Dados carregados da nuvem.");
      }
    }
  });

  carregar().then(render);
})();
</script>

</html>
